<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';
import GUI from 'lil-gui';

/* ================= 渲染器 / 场景 ================= */
const renderer = new THREE.WebGLRenderer({ antialias: true, powerPreference: 'high-performance' });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.05;
renderer.outputColorSpace = THREE.SRGBColorSpace;
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
document.body.appendChild(renderer.domElement);

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x1a1410);
scene.fog = new THREE.FogExp2(0x1a1410, 0.035);

const camera = new THREE.PerspectiveCamera(40, innerWidth / innerHeight, 0.1, 200);
camera.position.set(6.5, 4.2, 9.5);
const controls = new OrbitControls(camera, renderer.domElement);
controls.target.set(0, 2.6, 0);
controls.enableDamping = true;
controls.dampingFactor = 0.08;
controls.minDistance = 3; controls.maxDistance = 30;
controls.maxPolarAngle = Math.PI * 0.495;
controls.update();

// PMREM 程序化环境贴图：RoomEnvironment + 暖色调发光板
const pmrem = new THREE.PMREMGenerator(renderer);
const envScene = new RoomEnvironment(renderer);
envScene.traverse(o => { if (o.material && o.material.color && o.material.emissive) { o.material.emissive.multiply(new THREE.Color(1.0, 0.82, 0.6)); } });
const envRT = pmrem.fromScene(envScene, 0.04);
scene.environment = envRT.texture;
scene.environmentIntensity = 0.75;

/* ================= 灯光 ================= */
const hemi = new THREE.HemisphereLight(0xffd9a8, 0x2a1d14, 0.35); scene.add(hemi);
const key = new THREE.DirectionalLight(0xffe2b8, 3.2);
key.position.set(6, 11, 7); key.castShadow = true;
key.shadow.mapSize.set(2048, 2048); key.shadow.camera.left = -8; key.shadow.camera.right = 8;
key.shadow.camera.top = 9; key.shadow.camera.bottom = -4; key.shadow.camera.near = 1; key.shadow.camera.far = 30;
key.shadow.bias = -0.0004; key.shadow.normalBias = 0.03; key.shadow.radius = 5;
scene.add(key);
const fill = new THREE.DirectionalLight(0x8fb4ff, 0.9); fill.position.set(-8, 5, 4); scene.add(fill);
const rim = new THREE.DirectionalLight(0x6fe8ff, 2.6); rim.position.set(-3, 6, -9); scene.add(rim);
const rim2 = new THREE.SpotLight(0xff9a40, 40, 25, 0.5, 0.6, 1.5); rim2.position.set(5, 7, -7); rim2.target.position.set(0, 3, 0); scene.add(rim2, rim2.target);

/* ================= 程序化 canvas 纹理 ================= */
function rand(seed) { let s = seed >>> 0; return () => { s = (s * 1664525 + 1013904223) >>> 0; return s / 4294967296; }; }
function makeCanvas(n = 512) { const c = document.createElement('canvas'); c.width = c.height = n; return [c, c.getContext('2d')]; }
function noiseLayer(ctx, n, r, count, sizeMin, sizeMax, colorFn) {
  for (let i = 0; i < count; i++) {
    const x = r() * n, y = r() * n, s = sizeMin + r() * (sizeMax - sizeMin);
    const g = ctx.createRadialGradient(x, y, 0, x, y, s);
    const col = colorFn(r);
    g.addColorStop(0, col); g.addColorStop(1, 'rgba(0,0,0,0)');
    ctx.fillStyle = g; ctx.fillRect(x - s, y - s, s * 2, s * 2);
  }
}
function tex(c, srgb = true, rep = 1) {
  const t = new THREE.CanvasTexture(c);
  t.wrapS = t.wrapT = THREE.RepeatWrapping; t.repeat.set(rep, rep);
  t.anisotropy = renderer.capabilities.getMaxAnisotropy();
  if (srgb) t.colorSpace = THREE.SRGBColorSpace;
  return t;
}
// 生成 颜色/粗糙度/凹凸 三联贴图
function genMaterialMaps(kind, seed) {
  const n = 512, r = rand(seed);
  const [cc, c] = makeCanvas(n), [rc, rg] = makeCanvas(n), [bc, b] = makeCanvas(n);
  const P = {
    brass: { base: '#b08a3e', rough: 90, bump: 128 },
    copper: { base: '#9a5a33', rough: 110, bump: 128 },
    steel: { base: '#3c4a5c', rough: 80, bump: 128 },
    iron: { base: '#5a4636', rough: 200, bump: 128 },
    leather: { base: '#4a2c1a', rough: 190, bump: 128 },
    rock: { base: '#6f655a', rough: 230, bump: 128 },
    ground: { base: '#2c241d', rough: 235, bump: 128 }
  }[kind];
  c.fillStyle = P.base; c.fillRect(0, 0, n, n);
  rg.fillStyle = `rgb(${P.rough},${P.rough},${P.rough})`; rg.fillRect(0, 0, n, n);
  b.fillStyle = '#808080'; b.fillRect(0, 0, n, n);
  if (kind === 'brass' || kind === 'copper' || kind === 'steel') {
    // 拉丝划痕
    for (let i = 0; i < 1400; i++) {
      const y = r() * n, x = r() * n, l = 20 + r() * 160, a = r() * 0.12;
      c.strokeStyle = `rgba(255,240,200,${a * 0.5})`; c.lineWidth = r() * 1.2;
      c.beginPath(); c.moveTo(x, y); c.lineTo(x + l, y + (r() - 0.5) * 4); c.stroke();
      rg.strokeStyle = `rgba(${r() < 0.5 ? 40 : 230},0,0,${a})`.replace(/rgba\((\d+),0,0/, (m, v) => `rgba(${v},${v},${v}`);
      rg.beginPath(); rg.moveTo(x, y); rg.lineTo(x + l, y); rg.stroke();
    }
    // 磨损暗斑
    noiseLayer(c, n, r, 90, 10, 60, rr => `rgba(40,25,10,${0.15 + rr() * 0.25})`);
    if (kind === 'copper') { // 铜绿
      noiseLayer(c, n, r, 160, 6, 46, rr => `rgba(${60 + rr() * 30},${150 + rr() * 50},${120 + rr() * 30},${0.35 + rr() * 0.4})`);
      noiseLayer(rg, n, r, 160, 6, 46, rr => `rgba(240,240,240,0.5)`);
    }
    if (kind === 'brass') { noiseLayer(c, n, r, 50, 8, 30, rr => `rgba(70,140,110,${0.2 + rr() * 0.25})`); }
    if (kind === 'steel') { noiseLayer(c, n, r, 70, 20, 80, rr => `rgba(${70 + rr() * 50},${60 + rr() * 30},${120 + rr() * 60},0.2)`); }
    // 铆钉/凹痕
    for (let i = 0; i < 60; i++) { const x = r() * n, y = r() * n, s = 1 + r() * 4; b.fillStyle = `rgba(30,30,30,${0.4 + r() * 0.4})`; b.beginPath(); b.arc(x, y, s, 0, 7); b.fill(); }
  }
  if (kind === 'iron') { // 锈蚀
    noiseLayer(c, n, r, 400, 6, 50, rr => `rgba(${120 + rr() * 60},${50 + rr() * 30},${15 + rr() * 15},${0.3 + rr() * 0.5})`);
    noiseLayer(c, n, r, 120, 4, 20, rr => `rgba(30,22,18,${0.4 + rr() * 0.4})`);
    noiseLayer(b, n, r, 600, 2, 14, rr => rr() < 0.5 ? 'rgba(200,200,200,0.5)' : 'rgba(40,40,40,0.5)');
    noiseLayer(rg, n, r, 100, 10, 40, rr => 'rgba(140,140,140,0.5)');
    // 锈迹流淌
    for (let i = 0; i < 40; i++) { const x = r() * n, y = r() * n, g = c.createLinearGradient(x, y, x, y + 90); g.addColorStop(0, 'rgba(150,60,20,0.5)'); g.addColorStop(1, 'rgba(150,60,20,0)'); c.fillStyle = g; c.fillRect(x, y, 2 + r() * 4, 90); }
  }
  if (kind === 'leather') {
    noiseLayer(c, n, r, 300, 4, 30, rr => `rgba(${20 + rr() * 40},${10 + rr() * 20},5,${0.2 + rr() * 0.3})`);
    for (let i = 0; i < 6000; i++) { const x = r() * n, y = r() * n; b.fillStyle = `rgba(${r() < 0.5 ? 60 : 190},${0},0,0.25)`.replace(/rgba\((\d+),0,0/, (m, v) => `rgba(${v},${v},${v}`); b.fillRect(x, y, 2, 2); }
    // 裂纹
    for (let i = 0; i < 90; i++) {
      let x = r() * n, y = r() * n; c.strokeStyle = 'rgba(15,8,4,0.6)'; b.strokeStyle = 'rgba(20,20,20,0.8)'; c.lineWidth = b.lineWidth = 0.8 + r();
      c.beginPath(); b.beginPath(); c.moveTo(x, y); b.moveTo(x, y);
      for (let k = 0; k < 6; k++) { x += (r() - 0.5) * 20; y += (r() - 0.5) * 20; c.lineTo(x, y); b.lineTo(x, y); }
      c.stroke(); b.stroke();
    }
    // 缝线
    c.strokeStyle = 'rgba(200,170,120,0.7)'; c.lineWidth = 2; c.setLineDash([8, 6]);
    [30, n - 30].forEach(y => { c.beginPath(); c.moveTo(0, y); c.lineTo(n, y); c.stroke(); });
    c.setLineDash([]);
  }
  if (kind === 'rock' || kind === 'ground') {
    noiseLayer(c, n, r, 900, 4, 40, rr => { const v = 60 + rr() * 80; return `rgba(${v},${v * 0.92},${v * 0.8},${0.25 + rr() * 0.3})`; });
    noiseLayer(b, n, r, 1200, 3, 30, rr => { const v = rr() * 255; return `rgba(${v},${v},${v},0.35)`; });
    for (let i = 0; i < (kind === 'rock' ? 70 : 140); i++) {
      let x = r() * n, y = r() * n; c.strokeStyle = 'rgba(20,15,10,0.7)'; b.strokeStyle = 'rgba(0,0,0,0.9)'; c.lineWidth = b.lineWidth = 1 + r() * 1.5;
      c.beginPath(); b.beginPath(); c.moveTo(x, y); b.moveTo(x, y);
      for (let k = 0; k < 8; k++) { x += (r() - 0.5) * 30; y += (r() - 0.5) * 30; c.lineTo(x, y); b.lineTo(x, y); }
      c.stroke(); b.stroke();
    }
    if (kind === 'rock') noiseLayer(c, n, r, 60, 10, 40, rr => `rgba(80,110,60,${0.12 + rr() * 0.15})`); // 苔痕
  }
  return { map: tex(cc), roughnessMap: tex(rc, false), bumpMap: tex(bc, false) };
}

function makeMat(kind, opts = {}) {
  const maps = genMaterialMaps(kind, opts.seed || kind.length * 977);
  const cfg = {
    brass: { metalness: 1, roughness: 0.38, color: 0xffffff, bumpScale: 1.2 },
    copper: { metalness: 0.95, roughness: 0.45, color: 0xffffff, bumpScale: 1.2 },
    steel: { metalness: 1, roughness: 0.32, color: 0xffffff, bumpScale: 1 },
    iron: { metalness: 0.75, roughness: 0.85, color: 0xffffff, bumpScale: 3 },
    leather: { metalness: 0, roughness: 0.82, color: 0xffffff, bumpScale: 2.5 },
    rock: { metalness: 0, roughness: 0.95, color: 0xffffff, bumpScale: 4 },
    ground: { metalness: 0, roughness: 1, color: 0xffffff, bumpScale: 3 }
  }[kind];
  const m = new THREE.MeshStandardMaterial({ ...cfg, ...maps, ...opts.extra });
  if (opts.rep) [m.map, m.roughnessMap, m.bumpMap].forEach(t => t.repeat.set(opts.rep, opts.rep));
  return m;
}
const M = {
  brass: makeMat('brass'), copper: makeMat('copper'), steel: makeMat('steel'),
  iron: makeMat('iron'), leather: makeMat('leather'), rock: makeMat('rock', { rep: 2 }),
  darkSteel: new THREE.MeshStandardMaterial({ color: 0x1c2230, metalness: 1, roughness: 0.45 }),
};
M.glow = new THREE.MeshStandardMaterial({ color: 0xff8a20, emissive: 0xff7a10, emissiveIntensity: 4, roughness: 0.3 });
M.coreGlow = new THREE.MeshStandardMaterial({ color: 0x9ff, emissive: 0x30e0ff, emissiveIntensity: 5, roughness: 0.2 });
M.hamGlow = new THREE.MeshStandardMaterial({ color: 0xffb060, emissive: 0xff5a00, emissiveIntensity: 5, roughness: 0.2 });
M.glass = new THREE.MeshPhysicalMaterial({ color: 0xffffff, metalness: 0, roughness: 0.03, transparent: true, opacity: 0.35, clearcoat: 1 });
M.gauge = (() => { // 压力表表盘
  const [cv, c] = makeCanvas(256);
  c.fillStyle = '#efe2c0'; c.fillRect(0, 0, 256, 256);
  const g = c.createRadialGradient(128, 128, 60, 128, 128, 128); g.addColorStop(0, 'rgba(0,0,0,0)'); g.addColorStop(1, 'rgba(90,60,20,0.5)'); c.fillStyle = g; c.fillRect(0, 0, 256, 256);
  c.strokeStyle = '#2a1a0a'; c.lineWidth = 3; c.beginPath(); c.arc(128, 128, 110, 0, 7); c.stroke();
  for (let i = 0; i <= 20; i++) { const a = Math.PI * 0.75 + i / 20 * Math.PI * 1.5; const r1 = i % 5 ? 96 : 86; c.lineWidth = i % 5 ? 2 : 4; c.strokeStyle = i > 15 ? '#b01010' : '#2a1a0a'; c.beginPath(); c.moveTo(128 + Math.cos(a) * r1, 128 + Math.sin(a) * r1); c.lineTo(128 + Math.cos(a) * 106, 128 + Math.sin(a) * 106); c.stroke(); }
  c.fillStyle = '#2a1a0a'; c.font = 'bold 22px serif'; c.textAlign = 'center'; c.fillText('PSI', 128, 180);
  return new THREE.MeshStandardMaterial({ map: tex(cv), roughness: 0.6 });
})();
// 琥珀眼球（虹膜画布）
const eyeCanvas = (() => {
  const [cv, c] = makeCanvas(512); const r = rand(7);
  const g = c.createRadialGradient(256, 256, 10, 256, 256, 256);
  g.addColorStop(0, '#000'); g.addColorStop(0.16, '#050200'); g.addColorStop(0.19, '#ffd27a'); g.addColorStop(0.45, '#ff9a1a'); g.addColorStop(0.62, '#b4500a'); g.addColorStop(0.7, '#3a1a05'); g.addColorStop(0.74, '#f4e6c8'); g.addColorStop(1, '#d8b890');
  c.fillStyle = g; c.fillRect(0, 0, 512, 512);
  for (let i = 0; i < 260; i++) { const a = r() * Math.PI * 2, r0 = 50 + r() * 30, r1 = 120 + r() * 60; c.strokeStyle = `rgba(${255},${150 + r() * 100},${r() * 60},${0.2 + r() * 0.4})`; c.lineWidth = 1 + r() * 2; c.beginPath(); c.moveTo(256 + Math.cos(a) * r0, 256 + Math.sin(a) * r0); c.lineTo(256 + Math.cos(a + (r() - .5) * .2) * r1, 256 + Math.sin(a) * r1); c.stroke(); }
  for (let i = 0; i < 40; i++) { let a = r() * 7, d = 250; c.strokeStyle = 'rgba(160,30,20,0.5)'; c.lineWidth = 1; c.beginPath(); c.moveTo(256 + Math.cos(a) * d, 256 + Math.sin(a) * d); for (let k = 0; k < 5; k++) { a += (r() - .5) * .15; d -= 12 + r() * 8; c.lineTo(256 + Math.cos(a) * d, 256 + Math.sin(a) * d); } c.stroke(); }
  return cv;
})();
const eyeTex = tex(eyeCanvas); eyeTex.wrapS = eyeTex.wrapT = THREE.ClampToEdgeWrapping;
M.eye = new THREE.MeshPhysicalMaterial({ map: eyeTex, emissiveMap: eyeTex, emissive: 0xff8a20, emissiveIntensity: 1.2, roughness: 0.15, clearcoat: 1, clearcoatRoughness: 0.02 });

const allMats = new Set();
function mesh(geo, mat, parent, pos, rot, scl) {
  const m = new THREE.Mesh(geo, mat); allMats.add(mat);
  m.castShadow = true; m.receiveShadow = true;
  if (pos) m.position.set(...pos); if (rot) m.rotation.set(...rot); if (scl) m.scale.set(...scl);
  if (parent) parent.add(m); return m;
}

/* ================= 程序化几何零件 ================= */
const gears = [];
function gearGeo(R, teeth, thick, hole = 0.3) {
  const s = new THREE.Shape(); const r0 = R * 0.84;
  for (let i = 0; i < teeth; i++) {
    const a = i / teeth * Math.PI * 2, d = Math.PI * 2 / teeth;
    const pts = [[r0, a], [R, a + d * 0.18], [R, a + d * 0.42], [r0, a + d * 0.6]];
    pts.forEach(([rr, aa], k) => { const x = Math.cos(aa) * rr, y = Math.sin(aa) * rr; (i === 0 && k === 0) ? s.moveTo(x, y) : s.lineTo(x, y); });
  }
  s.closePath();
  const h = new THREE.Path(); h.absarc(0, 0, R * hole, 0, Math.PI * 2, true); s.holes.push(h);
  // 辐条孔
  if (R > 0.15) for (let i = 0; i < 5; i++) { const a = i / 5 * Math.PI * 2, p = new THREE.Path(); p.absarc(Math.cos(a) * R * 0.57, Math.sin(a) * R * 0.57, R * 0.14, 0, Math.PI * 2, true); s.holes.push(p); }
  const g = new THREE.ExtrudeGeometry(s, { depth: thick, bevelEnabled: true, bevelThickness: thick * 0.15, bevelSize: thick * 0.15, bevelSegments: 2, curveSegments: 6 });
  g.translate(0, 0, -thick / 2); return g;
}
function addGear(parent, R, teeth, pos, rot, speed, mat = M.brass) {
  const pivot = new THREE.Group(); pivot.position.set(...pos); if (rot) pivot.rotation.set(...rot); parent.add(pivot);
  const g = mesh(gearGeo(R, teeth, R * 0.22), mat, pivot);
  mesh(new THREE.CylinderGeometry(R * 0.3, R * 0.3, R * 0.34, 16), M.steel, pivot, [0, 0, 0], [Math.PI / 2, 0, 0]);
  gears.push({ m: g, speed }); return pivot;
}
function rivetRing(parent, r, n, y, size = 0.03, mat = M.brass, axis = 'y') {
  const geo = new THREE.SphereGeometry(size, 8, 6);
  for (let i = 0; i < n; i++) { const a = i / n * Math.PI * 2; const p = axis === 'y' ? [Math.cos(a) * r, y, Math.sin(a) * r] : [Math.cos(a) * r, Math.sin(a) * r, y]; mesh(geo, mat, parent, p); }
}
function pipe(parent, points, radius, mat = M.copper) {
  const curve = new THREE.CatmullRomCurve3(points.map(p => new THREE.Vector3(...p)));
  const m = mesh(new THREE.TubeGeometry(curve, 40, radius, 10, false), mat, parent);
  // 管箍
  for (let t = 0.15; t < 1; t += 0.3) { const p = curve.getPoint(t), tg = curve.getTangent(t); const c = mesh(new THREE.TorusGeometry(radius * 1.15, radius * 0.35, 6, 14), M.brass, parent); c.position.copy(p); c.lookAt(p.clone().add(tg)); }
  return m;
}
const pistons = [];
function piston(parent, a, b, r = 0.05) { // 液压活塞：外筒+内杆，每帧对准
  const grp = new THREE.Group(); parent.add(grp);
  const cyl = mesh(new THREE.CylinderGeometry(r, r, 1, 12), M.copper, grp);
  const rod = mesh(new THREE.CylinderGeometry(r * 0.55, r * 0.55, 1, 10), M.steel, grp);
  const c1 = mesh(new THREE.SphereGeometry(r * 1.3, 10, 8), M.darkSteel, grp), c2 = c1.clone(); grp.add(c2);
  pistons.push({ grp, cyl, rod, c1, c2, a, b }); return grp;
}
function plate(w, h, d, bevel = 0.04) { // 倒角板
  const s = new THREE.Shape(); const x = w / 2, y = h / 2, r = Math.min(w, h) * 0.15;
  s.moveTo(-x + r, -y); s.lineTo(x - r, -y); s.quadraticCurveTo(x, -y, x, -y + r); s.lineTo(x, y - r); s.quadraticCurveTo(x, y, x - r, y); s.lineTo(-x + r, y); s.quadraticCurveTo(-x, y, -x, y - r); s.lineTo(-x, -y + r); s.quadraticCurveTo(-x, -y, -x + r, -y);
  const g = new THREE.ExtrudeGeometry(s, { depth: d, bevelEnabled: true, bevelThickness: bevel, bevelSize: bevel, bevelSegments: 3 }); g.translate(0, 0, -d / 2); return g;
}
function rockGeo(r, detail, amp, seed, sx = 1, sy = 1, sz = 1) { // 位移的岩石体
  const g = new THREE.IcosahedronGeometry(r, detail); const p = g.attributes.position, v = new THREE.Vector3();
  for (let i = 0; i < p.count; i++) {
    v.fromBufferAttribute(p, i);
    const n = Math.sin(v.x * 7.1 + seed) * Math.cos(v.y * 6.3 + seed * 2) * Math.sin(v.z * 5.7 - seed) + 0.5 * Math.sin(v.x * 15 + v.y * 13 + seed);
    v.multiplyScalar(1 + n * amp); v.x *= sx; v.y *= sy; v.z *= sz; p.setXYZ(i, v.x, v.y, v.z);
  }
  g.computeVertexNormals(); return g;
}
function muscle(parent, len, r, pos, rot, seed = 1) { // 肌肉束：膨胀胶囊
  const g = new THREE.CapsuleGeometry(r, len, 6, 14); const p = g.attributes.position, v = new THREE.Vector3();
  for (let i = 0; i < p.count; i++) { v.fromBufferAttribute(p, i); const t = v.y / (len / 2 + r); const bulge = 1 + 0.25 * Math.cos(t * Math.PI * 0.5) + 0.05 * Math.sin(v.x * 20 + seed) * Math.cos(v.z * 18); p.setXYZ(i, v.x * bulge, v.y, v.z * bulge); }
  g.computeVertexNormals(); return mesh(g, M.rock, parent, pos, rot);
}

/* ================= 骨骼与角色 ================= */

function lerpPose(a, b, k) {

const sm = { cur: 'idle', time: 0, prev: null, prevTime: 0, blend: 1, blendDur: 0.3, frozen: null };
function setAction(name) {

  sm.cur = name; sm.time = 0; sm.blend = 0; sm.frozen = null;

function normT(a, t) { const A = ACTIONS[a]; return A.loop ? (t % A.dur) / A.dur : Math.min(t / A.dur, 1); }

/* ================= GUI ================= */
const params = { explode: 0, axis: '径向', action: 'idle', animSpeed: 1, gearSpeed: 1, wireframe: false, showBones: false, autoRotate: false };
const hudAct = document.getElementById('hudAct');
const gui = new GUI({ title: '⚙ 蒸汽独眼巨人 控制台' });
const fE = gui.addFolder('爆炸视图');
fE.add(params, 'explode', 0, 1, 0.001).name('爆炸程度');
fE.add(params, 'axis', ['径向', 'X 轴', 'Y 轴', 'Z 轴']).name('爆炸轴向');
const fA = gui.addFolder('动作状态机');
const actOpts = {}; Object.entries(ACTIONS).forEach(([k, v]) => { if (k !== 'land') actOpts[v.name] = k; });
fA.add(params, 'action', actOpts).name('当前动作').onChange(v => { if (v !== sm.cur) setAction(v); });
fA.add(params, 'animSpeed', 0.1, 5, 0.01).name('动画速度 ×');
const quick = {}; Object.entries(ACTIONS).forEach(([k, v]) => { if (k !== 'land') { quick[v.name] = () => setAction(k); } });
const fQ = fA.addFolder('快捷触发'); Object.keys(quick).forEach(n => fQ.add(quick, n)); fQ.close();
const fR = gui.addFolder('显示与渲染');
fR.add(params, 'gearSpeed', 0.1, 5, 0.01).name('齿轮转速 ×');
fR.add(params, 'wireframe').name('线框模式').onChange(v => allMats.forEach(m => m.wireframe = v));

fR.add(params, 'autoRotate').name('自动旋转').onChange(v => controls.autoRotate = v);
controls.autoRotateSpeed = 1.2;

/* ================= 主循环 ================= */
const clock = new THREE.Clock();
let elapsed = 0, gearAngle = 0, lastShock = -1;
const tmpV = new THREE.Vector3(), tmpV2 = new THREE.Vector3(), tmpQ = new THREE.Quaternion();
const charInv = new THREE.Matrix4();
const hamRest = { pos: hammer.position.clone(), rot: hammer.rotation.clone() };

function applyPose(p) {
  J.forEach(j => bones[j].rotation.set(p[j][0], p[j][1], p[j][2]));
  root.position.set(p.rootX, p.rootY, 0); root.rotation.set(0, 0, p.rootZ);
  bones.jaw.rotation.x = p.jaw * 0.5;
  for (const side of ['L', 'R']) {
    const g = side === 'L' ? p.gripL : p.gripR;
    bones['fingers' + side].forEach(f => { if (f.thumb) { f.base.rotation.set(0.6 + g * 0.5, 0, 0); f.segs.forEach((s, i) => i && (s.rotation.x = g * 0.6)); } else f.segs.forEach((s, i) => s.rotation.x = g * (0.9 + i * 0.25)); });

  if (p.hamThrow > 0.001) { hammer.position.set(hamRest.pos.x, hamRest.pos.y - p.hamThrow * 5.5, hamRest.pos.z + p.hamThrow * 1.5); hammer.rotation.set(hamRest.rot.x + p.hamThrow * 12, hamRest.rot.y, hamRest.rot.z); }
  else { hammer.rotation.copy(hamRest.rot); }
}

function animate() {
  const dt = Math.min(clock.getDelta(), 0.05); elapsed += dt;
  const adt = dt * params.animSpeed;
  // 状态机推进
  const A = ACTIONS[sm.cur];

    if (A.hold) { sm.time = A.dur; }

  applyPose(pose);

  gearAngle += dt * params.gearSpeed * 2;
  gears.forEach(g => g.m.rotation.z = gearAngle * g.speed);
  coreCage.rotation.z = gearAngle * 0.7; coreCage.rotation.y = gearAngle * 0.4;
  gauges.forEach(g => g.nd.rotation.z = -1.2 + sin(elapsed * 1.3 + g.ph) * 0.6 + sin(elapsed * 7 + g.ph) * 0.05 - (sm.cur === 'roar' || sm.cur === 'slam' ? 1.2 : 0));
  // 发光脉动
  const intense = ['slam', 'roar', 'cast'].includes(sm.cur) ? 1.8 : 1;
  const flick = 0.75 + 0.25 * sin(elapsed * 3) + 0.08 * sin(elapsed * 23) + (Math.random() - 0.5) * 0.06;
  M.coreGlow.emissiveIntensity = 4 * flick * intense; coreLight.intensity = 3 * flick * intense;
  const hf = 0.7 + 0.3 * sin(elapsed * 5.3) + 0.1 * sin(elapsed * 31);
  M.hamGlow.emissiveIntensity = 4.5 * hf * intense; hamLight.intensity = 3 * hf * intense;
  const dead = sm.cur === 'death' ? 1 - S(T, 0.5, 1) * 0.9 : 1;
  M.eye.emissiveIntensity = (1.0 + 0.4 * sin(elapsed * 2.2)) * dead * (sm.cur === 'roar' ? 1.8 : 1); eyeLight.intensity = 4 * (0.8 + 0.2 * sin(elapsed * 2.2)) * dead;
  // 眼球微动（扫视）
  const sacc = Math.floor(elapsed * 0.8);
  const rr = rand(sacc * 13 + 1); const tx = (rr() - 0.5) * 0.4, ty = (rr() - 0.5) * 0.25;
  eyePivot.rotation.y += (tx + sin(elapsed * 13) * 0.01 - eyePivot.rotation.y) * Math.min(1, dt * 12);
  eyePivot.rotation.x += (ty - eyePivot.rotation.x) * Math.min(1, dt * 12);
  if (sm.cur === 'stun') { eyePivot.rotation.y = sin(elapsed * 8) * 0.4; eyePivot.rotation.x = cos(elapsed * 8) * 0.3; }

    if (sLife[i] >= 1) { sLife[i] = 0; const o = emit[i % emit.length]; o.getWorldPosition(tmpV); pos.setXYZ(i, tmpV.x, tmpV.y, tmpV.z); sVel[i].set((Math.random() - 0.5) * 0.3, 0.8 + Math.random() * 0.6, -0.2 + (Math.random() - 0.5) * 0.3); }
    else { sVel[i].x += 0.2 * dt; pos.setXYZ(i, pos.getX(i) + sVel[i].x * dt, pos.getY(i) + sVel[i].y * dt, pos.getZ(i) + sVel[i].z * dt); }
  }

// 初始粒子散布
for (let i = 0; i < SMOKE_N; i++) { smokeOrigins[0].parent.updateMatrixWorld(true); sPos[i * 3 + 1] = -100; }
