                toeCap.position.set(0, -0.16, 0.58);
                toeCap.castShadow = true;
                ankle.add(toeCap);
            }

            /**
             * 记录所有关节初始基准姿态 (Rest Pose)
             */
            m_CaptureRestPoses() {
                Object.entries(this.publicJoints).forEach(([key, node]) => {
                    if (node && node.isObject3D) {
                        this.m_RestPose.set(key, {
                            pos: node.position.clone(),
                            rot: node.rotation.clone(),
                            scale: node.scale.clone()
                        });
                    }
                });
            }

            /**
             * 构建爆炸视图青色引导线 (Cyan Explode Guide Lines)
             */
            m_BuildExplodeGuideLines() {
                const count = this.publicExplodeItems.length;
                const positions = new Float32Array(count * 2 * 3);
                this.m_GuideLineGeometry = new THREE.BufferGeometry();
                this.m_GuideLineGeometry.setAttribute('position', new THREE.BufferAttribute(positions, 3));

                const lineMat = new THREE.LineBasicMaterial({
                    color: 0x00ffff,
                    transparent: true,
                    opacity: 0.88,
                    depthTest: true
                });

                this.m_GuideLineSegments = new THREE.LineSegments(this.m_GuideLineGeometry, lineMat);
                this.m_GuideLineSegments.visible = false;
                this.m_GuideLineSegments.frustumCulled = false;
                this.publicRoot.add(this.m_GuideLineSegments);
            }

            /**
             * 构建骨骼与关节辅助可视化器 (Show Skeleton Helper)
             */
            m_BuildSkeletonVisualizer() {
                const bonePairs = [
                    ['pelvis', 'spine'],
                    ['spine', 'chest'],
                    ['chest', 'neck'],
                    ['neck', 'head'],
                    ['head', 'eyeBall'],
                    ['head', 'jaw'],
                    ['chest', 'backpack'],
                    ['chest', 'leftShoulder'],
                    ['leftShoulder', 'leftElbow'],
                    ['leftElbow', 'leftHand'],
                    ['leftHand', 'hammer'],
                    ['chest', 'rightShoulder'],
                    ['rightShoulder', 'rightElbow'],
                    ['rightElbow', 'rightHand'],
                    ['rightHand', 'hammer'],
                    ['pelvis', 'leftHip'],
                    ['leftHip', 'leftKnee'],
                    ['leftKnee', 'leftAnkle'],
                    ['pelvis', 'rightHip'],
                    ['rightHip', 'rightKnee'],
                    ['rightKnee', 'rightAnkle']
                ];

                const positions = new Float32Array(bonePairs.length * 2 * 3);
                const geo = new THREE.BufferGeometry();
                geo.setAttribute('position', new THREE.BufferAttribute(positions, 3));

                const mat = new THREE.LineBasicMaterial({
                    color: 0x38bdf8,
                    depthTest: false,
                    transparent: true,
                    opacity: 0.95
                });

                this.publicSkeletonLines = new THREE.LineSegments(geo, mat);
                this.publicSkeletonLines.visible = false;
                this.publicSkeletonLines.renderOrder = 999;
                this.publicSkeletonLines.frustumCulled = false;
                this.publicSkeletonLines.userData.pairs = bonePairs;
                this.publicRoot.add(this.publicSkeletonLines);
            }

            /**
             * 实时更新液压活塞对准、爆炸视图分离与青色引导线
             */
            updateMechanicsAndExplode(dt, gearSpeed, explodeAmount, explodeAxis) {
                // 1. 先恢复所有爆炸部件到原始局部坐标，以便骨骼动画正确计算
                for (let i = 0; i < this.publicExplodeItems.length; i++) {
                    const item = this.publicExplodeItems[i];
                    item.object3d.position.copy(item.baseLocalPos);
                }

                // 2. 旋转全身啮合齿轮
                for (let i = 0; i < this.publicAnimatedGears.length; i++) {
                    const g = this.publicAnimatedGears[i];
                    g.mesh.rotation[g.axis] += dt * g.speedRatio * gearSpeed * 2.2;
                }

                this.publicRoot.updateMatrixWorld(true);

                // 3. 更新关节液压活塞伸缩对准
                const worldA = new THREE.Vector3();
                const worldB = new THREE.Vector3();
                for (let i = 0; i < this.publicPistons.length; i++) {
                    const p = this.publicPistons[i];
                    p.cylGroup.getWorldPosition(worldA);
                    p.rodGroup.getWorldPosition(worldB);
                    p.cylGroup.lookAt(worldB);
                    p.rodGroup.lookAt(worldA);
                }

                // 4. 计算爆炸视图位移与青色动态引导线
                if (explodeAmount > 0.001) {
                    this.m_GuideLineSegments.visible = true;
                    const posAttr = this.m_GuideLineGeometry.attributes.position;
                    const centerWorld = new THREE.Vector3(0, 2.5, 0);
                    const originWorld = new THREE.Vector3();
                    const targetWorld = new THREE.Vector3();
                    const dirVec = new THREE.Vector3();
                    const parentInv = new THREE.Matrix4();

                    for (let i = 0; i < this.publicExplodeItems.length; i++) {
                        const item = this.publicExplodeItems[i];
                        const obj = item.object3d;
                        obj.getWorldPosition(originWorld);

                        // 根据所选爆炸轴计算世界空间分离向量
                        if (explodeAxis === 'Radial') {
                            dirVec.subVectors(originWorld, centerWorld);
                            if (dirVec.lengthSq() < 0.001) {
                                dirVec.set(0, 1, 0);
                            } else {
                                dirVec.normalize();
                            }
                            if (item.customDir) {
                                dirVec.lerp(item.customDir, 0.55).normalize();
                            }
                        } else if (explodeAxis === 'X') {
                            const signX = Math.abs(originWorld.x) > 0.08
                                ? Math.sign(originWorld.x)
                                : (item.customDir && Math.abs(item.customDir.x) > 0.05 ? Math.sign(item.customDir.x) : (i % 2 === 0 ? 1 : -1));
                            dirVec.set(signX, (originWorld.y - 2.5) * 0.12, 0).normalize();
                        } else if (explodeAxis === 'Y') {
                            const signY = originWorld.y >= 2.35 ? 1 : -1;
                            dirVec.set((originWorld.x) * 0.15, signY, (originWorld.z) * 0.15).normalize();
                        } else if (explodeAxis === 'Z') {
                            const signZ = originWorld.z >= 0 ? 1 : -1;
                            dirVec.set(0, (originWorld.y - 2.5) * 0.12, signZ).normalize();
                        }

                        const dist = explodeAmount * item.distanceScale * 1.65;
                        targetWorld.copy(originWorld).addScaledVector(dirVec, dist);

                        // 转换回父节点局部空间
                        if (obj.parent) {
                            parentInv.copy(obj.parent.matrixWorld).invert();
                            const localTarget = targetWorld.clone().applyMatrix4(parentInv);
                            obj.position.copy(localTarget);
                            obj.updateMatrixWorld(true);
                        }

                        // 更新青色引导线两端坐标（转换到 publicRoot 局部空间）
                        const rootInv = new THREE.Matrix4().copy(this.publicRoot.matrixWorld).invert();
                        const p0 = originWorld.clone().applyMatrix4(rootInv);
                        const p1 = targetWorld.clone().applyMatrix4(rootInv);

                        posAttr.setXYZ(i * 2, p0.x, p0.y, p0.z);
                        posAttr.setXYZ(i * 2 + 1, p1.x, p1.y, p1.z);
                    }
                    posAttr.needsUpdate = true;
                } else {
                    this.m_GuideLineSegments.visible = false;
                }

                // 5. 更新骨骼可视化辅助线
                if (this.publicSkeletonLines.visible) {
                    const skelPos = this.publicSkeletonLines.geometry.attributes.position;
                    const pairs = this.publicSkeletonLines.userData.pairs;
                    const rootInv = new THREE.Matrix4().copy(this.publicRoot.matrixWorld).invert();
                    const pA = new THREE.Vector3();
                    const pB = new THREE.Vector3();

                    for (let i = 0; i < pairs.length; i++) {
                        const [kA, kB] = pairs[i];
                        const nA = this.publicJoints[kA];
                        const nB = this.publicJoints[kB];
                        if (nA && nB) {
                            nA.getWorldPosition(pA).applyMatrix4(rootInv);
                            nB.getWorldPosition(pB).applyMatrix4(rootInv);
                            skelPos.setXYZ(i * 2, pA.x, pA.y, pA.z);
                            skelPos.setXYZ(i * 2 + 1, pB.x, pB.y, pB.z);
                        }
                    }
                    skelPos.needsUpdate = true;
                }
            }

            getRestPose(jointName) {
                return this.m_RestPose.get(jointName);
            }
        }

        // ============================================================================
        // 3. 游戏动作状态机 (CyclopsAnimationController)
        //    支持 14 个动作状态、平滑插值过渡、循环/非循环自动回待机、独眼微动与核心闪烁
        // ============================================================================
        class CyclopsAnimationController {
            constructor(character, materials, onStateChangeCallback) {
                // 公共状态属性 (遵循小驼峰规范)
                this.publicCurrentState = 'Idle';
                this.publicAnimProgress = 0;
                this.publicStateCatalog = [
                    { id: 'Idle',        label: '待机呼吸 (Idle)',       loop: true,  duration: 3.2 },
                    { id: 'Walk',        label: '行走 (Walk)',           loop: true,  duration: 1.5 },
                    { id: 'Run',         label: '奔跑 (Run)',            loop: true,  duration: 0.85 },
                    { id: 'Jump',        label: '跳跃 (Jump)',           loop: false, duration: 1.15, nextState: 'Land' },
                    { id: 'Land',        label: '落地缓冲 (Land)',       loop: false, duration: 0.75, nextState: 'Idle' },
                    { id: 'HammerSmash', label: '重锤砸击 (HammerSmash)',loop: false, duration: 1.65, nextState: 'Idle' },
                    { id: 'Sweep',       label: '重锤横扫 (Sweep)',      loop: false, duration: 1.45, nextState: 'Idle' },
                    { id: 'Throw',       label: '投掷战锤 (Throw)',      loop: false, duration: 1.85, nextState: 'Idle' },
                    { id: 'Hit',         label: '受击硬直 (Hit)',        loop: false, duration: 0.85, nextState: 'Idle' },
                    { id: 'Stun',        label: '眩晕摇晃 (Stun)',       loop: true,  duration: 2.4 },
                    { id: 'Taunt',       label: '捶胸嘲讽 (Taunt)',      loop: false, duration: 2.1,  nextState: 'Idle' },
                    { id: 'Roar',        label: '狂暴咆哮 (Roar)',       loop: false, duration: 2.3,  nextState: 'Idle' },
                    { id: 'Cast',        label: '蒸汽施法 (Cast)',       loop: false, duration: 2.2,  nextState: 'Idle' },
                    { id: 'Death',       label: '力竭倒地 (Death)',      loop: false, duration: 2.7,  nextState: 'Idle' }
                ];

                // 私有成员 (遵循 m_ + 大驼峰规范)
                this.m_Character = character;
                this.m_Materials = materials;
                this.m_OnStateChange = onStateChangeCallback;
                this.m_StateTime = 0;
                this.m_TotalTime = 0;
                this.m_SaccadeTimer = 0;
                this.m_TargetEyeYaw = 0;
                this.m_TargetEyePitch = 0;
                this.m_CurrentEyeYaw = 0;
                this.m_CurrentEyePitch = 0;
            }

            /**
             * 切换动作状态
             */
            setAnimationState(stateId) {
                const found = this.publicStateCatalog.find((s) => s.id === stateId);
                if (!found) return;
                this.publicCurrentState = stateId;
                this.m_StateTime = 0;
                this.publicAnimProgress = 0;
                if (this.m_OnStateChange) {
                    this.m_OnStateChange(found);
                }
            }

            /**
             * 计算目标姿势字典
             */
            m_ComputeTargetPose(stateId, t, normP) {
                const pose = {
                    pelvisPos: new THREE.Vector3(0, 2.15, 0),
                    pelvisRot: new THREE.Euler(0, 0, 0),
                    spineRot: new THREE.Euler(0, 0, 0),
                    chestRot: new THREE.Euler(0, 0, 0),
                    neckRot: new THREE.Euler(0, 0, 0),
                    headRot: new THREE.Euler(0, 0, 0),
                    jawRotX: 0,
                    leftShoulderRot: new THREE.Euler(0, 0, 0.12),
                    leftElbowRot: new THREE.Euler(-0.35, 0, 0),
                    leftHandRot: new THREE.Euler(0, 0, 0),
                    leftFingerCurl: 0.35,
                    rightShoulderRot: new THREE.Euler(0.15, 0, -0.14),
                    rightElbowRot: new THREE.Euler(-0.65, 0, 0),
                    rightHandRot: new THREE.Euler(0, 0, 0),
                    rightFingerCurl: 0.92,
                    hammerPosOffset: new THREE.Vector3(0, 0, 0),
                    hammerRotOffset: new THREE.Euler(0, 0, 0),
                    leftHipRot: new THREE.Euler(0, 0, 0),
                    leftKneeRot: new THREE.Euler(0, 0, 0),
                    leftAnkleRot: new THREE.Euler(0, 0, 0),
                    rightHipRot: new THREE.Euler(0, 0, 0),
                    rightKneeRot: new THREE.Euler(0, 0, 0),
                    rightAnkleRot: new THREE.Euler(0, 0, 0),
                    coreBoost: 1.0
                };

                const tau = Math.PI * 2;

                switch (stateId) {
                    case 'Idle': {
                        const b = Math.sin(t * 2.1);
                        const b2 = Math.cos(t * 2.1);
                        pose.pelvisPos.y = 2.15 + b * 0.035;
                        pose.spineRot.x = 0.04 + b * 0.03;
                        pose.chestRot.x = 0.03 - b * 0.04;
                        pose.headRot.y = Math.sin(t * 0.9) * 0.12;
                        pose.headRot.x = b2 * 0.04;
                        pose.jawRotX = 0.05 + Math.max(0, b) * 0.06;
                        pose.leftShoulderRot.set(b * 0.05, 0, 0.14 + b * 0.03);
                        pose.rightShoulderRot.set(0.18 + b * 0.05, 0, -0.15 - b * 0.03);
                        break;
                    }

                    case 'Walk': {
                        const phase = normP * tau;
                        const s = Math.sin(phase);
                        const c = Math.cos(phase);
                        pose.pelvisPos.y = 2.12 + Math.abs(s) * 0.09;
                        pose.pelvisRot.z = c * 0.05;
                        pose.pelvisRot.y = -s * 0.08;
                        pose.spineRot.x = 0.08;
                        pose.chestRot.y = s * 0.14;
                        pose.headRot.y = -s * 0.08;

                        pose.leftHipRot.x = s * 0.58;
                        pose.leftKneeRot.x = Math.max(0, -s) * 0.82 + 0.08;
                        pose.leftAnkleRot.x = -pose.leftHipRot.x * 0.35;

                        pose.rightHipRot.x = -s * 0.58;
                        pose.rightKneeRot.x = Math.max(0, s) * 0.82 + 0.08;
                        pose.rightAnkleRot.x = -pose.rightHipRot.x * 0.35;

                        pose.leftShoulderRot.set(-s * 0.45, 0, 0.15);
                        pose.leftElbowRot.x = -0.45 - Math.max(0, s) * 0.3;
                        pose.rightShoulderRot.set(s * 0.35 + 0.15, 0, -0.18);
                        pose.rightElbowRot.x = -0.75;
                        break;
                    }

                    case 'Run': {
                        const phase = normP * tau;
                        const s = Math.sin(phase);
                        const c = Math.cos(phase);
                        pose.pelvisPos.y = 2.08 + Math.abs(c) * 0.19;
                        pose.pelvisRot.x = 0.18;
                        pose.pelvisRot.y = -s * 0.15;
                        pose.spineRot.x = 0.18 + Math.abs(s) * 0.06;
                        pose.chestRot.y = s * 0.24;
                        pose.headRot.x = -0.22;
                        pose.jawRotX = 0.18;

                        pose.leftHipRot.x = s * 0.95;
                        pose.leftKneeRot.x = Math.max(0, -s) * 1.35 + 0.15;
                        pose.rightHipRot.x = -s * 0.95;
                        pose.rightKneeRot.x = Math.max(0, s) * 1.35 + 0.15;

                        pose.leftShoulderRot.set(-s * 0.85, 0, 0.22);
                        pose.leftElbowRot.x = -1.05;
                        pose.rightShoulderRot.set(s * 0.68 + 0.2, 0, -0.24);
                        pose.rightElbowRot.x = -0.95;
                        pose.coreBoost = 1.45;
                        break;
                    }

                    case 'Jump': {
                        // 0.0 - 0.28 蓄力下蹲，0.28 - 1.0 腾空跃起
                        if (normP < 0.28) {
                            const k = normP / 0.28;
                            pose.pelvisPos.y = 2.15 - k * 0.58;
                            pose.spineRot.x = k * 0.38;
                            pose.leftHipRot.x = -k * 0.75;
                            pose.leftKneeRot.x = k * 1.25;
                            pose.rightHipRot.x = -k * 0.75;
                            pose.rightKneeRot.x = k * 1.25;
                            pose.leftShoulderRot.x = k * 0.65;
                            pose.rightShoulderRot.x = k * 0.65;
                        } else {
                            const airP = (normP - 0.28) / 0.72;
                            const arc = Math.sin(airP * Math.PI);
                            pose.pelvisPos.y = 1.57 + arc * 1.75;
                            pose.spineRot.x = -0.15 * arc;
                            pose.leftHipRot.x = -0.35 * arc;
                            pose.leftKneeRot.x = 0.65 * arc;
                            pose.rightHipRot.x = 0.22 * arc;
                            pose.rightKneeRot.x = 0.45 * arc;
                            pose.leftShoulderRot.set(-1.35 * arc, 0, 0.38);
                            pose.rightShoulderRot.set(-1.15 * arc, 0, -0.35);
                            pose.coreBoost = 1.6;
                        }
                        break;
                    }

                    case 'Land': {
                        const impact = Math.sin(normP * Math.PI);
                        pose.pelvisPos.y = 2.15 - impact * 0.68;
                        pose.spineRot.x = impact * 0.48;
                        pose.chestRot.x = impact * 0.25;
                        pose.headRot.x = impact * 0.35;
                        pose.leftHipRot.x = -impact * 0.85;
                        pose.leftKneeRot.x = impact * 1.38;
                        pose.rightHipRot.x = -impact * 0.85;
                        pose.rightKneeRot.x = impact * 1.38;
                        pose.leftShoulderRot.set(impact * 0.45, 0, 0.48);
                        pose.rightShoulderRot.set(impact * 0.55, 0, -0.45);
                        break;
                    }

                    case 'HammerSmash': {
                        // 高举巨锤 -> 毁灭性下砸 -> 拔锤回位
                        if (normP < 0.42) {
                            const w = THREE.MathUtils.smoothstep(normP, 0, 0.42);
                            pose.pelvisPos.y = 2.15 + w * 0.14;
                            pose.spineRot.x = -w * 0.32;
                            pose.chestRot.y = -w * 0.38;
                            pose.headRot.x = -w * 0.28;
                            pose.jawRotX = w * 0.38;
                            pose.rightShoulderRot.set(-w * 2.35, 0, -0.28);
                            pose.rightElbowRot.x = -0.35;
                            pose.leftShoulderRot.set(-w * 1.65, w * 0.45, 0.22);
                            pose.leftHipRot.x = -w * 0.38;
                            pose.rightHipRot.x = w * 0.28;
                            pose.coreBoost = 1.0 + w * 1.2;
                        } else if (normP < 0.62) {
                            const s = THREE.MathUtils.smoothstep(normP, 0.42, 0.62);
                            pose.pelvisPos.y = THREE.MathUtils.lerp(2.29, 1.65, s);
                            pose.spineRot.x = THREE.MathUtils.lerp(-0.32, 0.58, s);
                            pose.chestRot.y = THREE.MathUtils.lerp(-0.38, 0.35, s);
                            pose.rightShoulderRot.set(THREE.MathUtils.lerp(-2.35, 0.95, s), 0, -0.15);
                            pose.rightElbowRot.x = THREE.MathUtils.lerp(-0.35, -0.15, s);
                            pose.rightHandRot.x = s * 0.55;
                            pose.leftShoulderRot.set(THREE.MathUtils.lerp(-1.65, 0.65, s), 0, 0.35);
                            pose.leftHipRot.x = -0.68 * s;
                            pose.leftKneeRot.x = 1.15 * s;
                            pose.rightHipRot.x = 0.45 * s;
                            pose.rightKneeRot.x = 0.85 * s;
                            pose.coreBoost = 2.5;
                        } else {
                            const r = 1.0 - THREE.MathUtils.smoothstep(normP, 0.62, 1.0);
                            pose.pelvisPos.y = 2.15 - r * 0.50;
                            pose.spineRot.x = r * 0.58;
                            pose.chestRot.y = r * 0.35;
                            pose.rightShoulderRot.set(THREE.MathUtils.lerp(0.15, 0.95, r), 0, -0.15);
                            pose.rightHandRot.x = r * 0.55;
                            pose.leftHipRot.x = -0.68 * r;
                            pose.leftKneeRot.x = 1.15 * r;
                            pose.rightHipRot.x = 0.45 * r;
                            pose.rightKneeRot.x = 0.85 * r;
                        }
                        break;
                    }

                    case 'Sweep': {
                        // 大范围水平回旋横扫
                        if (normP < 0.35) {
                            const w = THREE.MathUtils.smoothstep(normP, 0, 0.35);
                            pose.pelvisRot.y = -w * 0.45;
                            pose.chestRot.y = -w * 0.65;
                            pose.rightShoulderRot.set(-0.35, -w * 0.85, -1.15 * w);
                            pose.rightElbowRot.x = -0.25;
                            pose.leftShoulderRot.set(-0.4, 0, 0.45);
                        } else if (normP < 0.72) {
                            const s = THREE.MathUtils.smoothstep(normP, 0.35, 0.72);
                            pose.pelvisPos.y = 2.02;
                            pose.pelvisRot.y = THREE.MathUtils.lerp(-0.45, 0.65, s);
                            pose.chestRot.y = THREE.MathUtils.lerp(-0.65, 0.85, s);
                            pose.rightShoulderRot.set(-0.65, THREE.MathUtils.lerp(-0.85, 1.25, s), -1.1);
                            pose.rightElbowRot.x = -0.15;
                            pose.leftHipRot.x = -0.35;
                            pose.leftKneeRot.x = 0.65;
                            pose.coreBoost = 2.0;
                        } else {
                            const r = 1.0 - THREE.MathUtils.smoothstep(normP, 0.72, 1.0);
                            pose.pelvisRot.y = r * 0.65;
                            pose.chestRot.y = r * 0.85;
                            pose.rightShoulderRot.set(-0.65 * r, r * 1.25, -1.1 * r);
                        }
                        break;
                    }

                    case 'Throw': {
                        // 战锤回旋投掷并飞回手掌
                        if (normP < 0.32) {
                            const w = THREE.MathUtils.smoothstep(normP, 0, 0.32);
                            pose.chestRot.y = -w * 0.75;
                            pose.rightShoulderRot.set(-w * 1.6, -w * 0.5, -0.35);
                            pose.rightElbowRot.x = -0.85;
                        } else if (normP < 0.82) {
                            const f = (normP - 0.32) / 0.50;
                            const throwArc = Math.sin(f * Math.PI);
                            pose.chestRot.y = 0.65 * (1 - f * 0.4);
                            pose.spineRot.x = 0.25 * throwArc;
                            pose.rightShoulderRot.set(-1.1, 0.45, -0.2);
                            pose.rightElbowRot.x = -0.15;
                            pose.rightFingerCurl = 0.1; // 张开五指释放战锤
                            // 战锤向前高速旋转飞出再回旋飞回
                            pose.hammerPosOffset.set(0, 0, throwArc * 6.2);
                            pose.hammerRotOffset.set(f * Math.PI * 6, 0, 0);
                            pose.coreBoost = 2.2;
                        } else {
                            const c = 1.0 - THREE.MathUtils.smoothstep(normP, 0.82, 1.0);
                            pose.chestRot.y = c * 0.35;
                            pose.rightShoulderRot.set(-1.1 * c, 0.45 * c, -0.2);
                        }
                        break;
                    }

                    case 'Hit': {
                        const h = Math.sin(normP * Math.PI);
                        pose.pelvisPos.z = -h * 0.32;
                        pose.spineRot.x = -h * 0.42;
                        pose.chestRot.x = -h * 0.32;
                        pose.chestRot.y = h * 0.28;
                        pose.headRot.x = -h * 0.55;
                        pose.jawRotX = h * 0.42;
                        pose.leftShoulderRot.set(h * 0.5, 0, 0.65 * h);
                        pose.rightShoulderRot.set(h * 0.5, 0, -0.65 * h);
                        break;
                    }

                    case 'Stun': {
                        const d = normP * tau;
                        pose.pelvisPos.y = 2.04;
                        pose.pelvisRot.z = Math.sin(d) * 0.12;
                        pose.spineRot.x = 0.22 + Math.cos(d) * 0.18;
                        pose.spineRot.z = Math.sin(d) * 0.22;
                        pose.headRot.z = Math.cos(d * 2) * 0.32;
                        pose.headRot.x = 0.25 + Math.sin(d * 2) * 0.22;
                        pose.jawRotX = 0.32;
                        pose.leftShoulderRot.set(0.25, 0, 0.28 + Math.sin(d) * 0.15);
                        pose.rightShoulderRot.set(0.32, 0, -0.28 + Math.cos(d) * 0.15);
                        pose.leftKneeRot.x = 0.35;
                        pose.rightKneeRot.x = 0.35;
                        pose.coreBoost = 0.45 + Math.abs(Math.sin(t * 8)) * 0.4;
                        break;
                    }

                    case 'Taunt': {
                        const pound = Math.sin(normP * Math.PI * 6);
                        const env = Math.sin(normP * Math.PI);
                        pose.spineRot.x = -0.15 * env;
                        pose.chestRot.y = pound * 0.12 * env;
                        pose.headRot.x = -0.18 * env;
                        pose.jawRotX = 0.28 * env;
                        // 左拳捶击胸前锅炉
                        pose.leftShoulderRot.set(-1.15 * env, 0.55 * env + pound * 0.22, 0.2);
                        pose.leftElbowRot.x = -1.45 * env - pound * 0.3;
                        pose.leftFingerCurl = 0.95;
                        // 右手高举战锤示威
                        pose.rightShoulderRot.set(-1.85 * env, 0, -0.35);
                        pose.rightElbowRot.x = -0.45 + pound * 0.25;
                        pose.coreBoost = 1.65;
                        break;
                    }

                    case 'Roar': {
                        const env = Math.sin(normP * Math.PI);
                        const vib = Math.sin(t * 32) * 0.035 * env;
                        pose.pelvisPos.y = 2.15 - env * 0.18;
                        pose.spineRot.x = -0.32 * env;
                        pose.chestRot.x = -0.28 * env + vib;
                        pose.headRot.x = -0.45 * env + vib;
                        pose.jawRotX = 0.68 * env; // 下颚大张咆哮
                        pose.leftShoulderRot.set(0.35 * env, 0, 0.85 * env);
                        pose.leftElbowRot.x = -0.65 * env;
                        pose.leftFingerCurl = 0.05;
                        pose.rightShoulderRot.set(0.35 * env, 0, -0.85 * env);
                        pose.rightElbowRot.x = -0.65 * env;
                        pose.leftHipRot.x = -0.28 * env;
                        pose.leftKneeRot.x = 0.52 * env;
                        pose.rightHipRot.x = -0.28 * env;
                        pose.rightKneeRot.x = 0.52 * env;
                        pose.coreBoost = 2.8;
                        break;
                    }

                    case 'Cast': {
                        const env = Math.sin(normP * Math.PI);
                        const hover = Math.sin(normP * Math.PI * 4) * 0.08;
                        pose.pelvisPos.y = 2.15 + env * 0.42 + hover;
                        pose.spineRot.x = -0.24 * env;
                        pose.headRot.x = -0.35 * env;
                        pose.jawRotX = 0.35 * env;
                        pose.leftShoulderRot.set(-2.15 * env, 0, 0.45 * env);
                        pose.leftElbowRot.x = -0.25;
                        pose.leftFingerCurl = 0.0;
                        pose.rightShoulderRot.set(-2.15 * env, 0, -0.45 * env);
                        pose.rightElbowRot.x = -0.25;
                        pose.leftHipRot.x = 0.25 * env;
                        pose.leftKneeRot.x = 0.45 * env;
                        pose.rightHipRot.x = 0.35 * env;
                        pose.rightKneeRot.x = 0.65 * env;
                        pose.coreBoost = 3.2;
                        break;
                    }

                    case 'Death': {
                        // 0-0.45 双膝跪地，0.45-0.85 向前扑倒，0.85-1.0 短暂静止后准备平滑恢复待机
                        const k = THREE.MathUtils.smoothstep(normP, 0, 0.42);
                        const fall = THREE.MathUtils.smoothstep(normP, 0.42, 0.82);

                        pose.pelvisPos.y = 2.15 - k * 0.95 - fall * 0.72;
                        pose.pelvisPos.z = fall * 0.65;
                        pose.pelvisRot.x = k * 0.25 + fall * 1.18;
                        pose.spineRot.x = k * 0.35 - fall * 0.25;
                        pose.headRot.x = k * 0.45 - fall * 0.55;
                        pose.jawRotX = 0.38 * (1 - fall * 0.5);

                        pose.leftHipRot.x = -k * 1.15 + fall * 0.85;
                        pose.leftKneeRot.x = k * 2.05 - fall * 1.65;
                        pose.rightHipRot.x = -k * 1.15 + fall * 0.85;
                        pose.rightKneeRot.x = k * 2.05 - fall * 1.65;

                        pose.leftShoulderRot.set(-fall * 1.15, 0, 0.55);
                        pose.rightShoulderRot.set(-fall * 1.15, 0, -0.55);
                        pose.coreBoost = Math.max(0.15, 1.0 - normP * 0.9);
                        break;
                    }
                }

                return pose;
            }

            /**
             * 每帧更新骨骼动画、独眼微动（Saccades）与能量核心闪烁
             */
            update(dt, animSpeed) {
                const scaledDt = dt * animSpeed;
                this.m_TotalTime += scaledDt;
                this.m_StateTime += scaledDt;

                const stateObj = this.publicStateCatalog.find((s) => s.id === this.publicCurrentState) || this.publicStateCatalog[0];
                let normP = this.m_StateTime / stateObj.duration;

                if (stateObj.loop) {
                    normP = normP % 1.0;
                } else if (normP >= 1.0) {
                    // 非循环动作结束后自动平滑切换到下一动作或待机 (Idle)
                    const nextState = stateObj.nextState || 'Idle';
                    this.setAnimationState(nextState);
                    normP = 0;
                }
                this.publicAnimProgress = Math.min(1.0, Math.max(0.0, normP));

                const target = this.m_ComputeTargetPose(this.publicCurrentState, this.m_TotalTime, this.publicAnimProgress);
                const joints = this.m_Character.publicJoints;
                const blend = Math.min(1.0, dt * 12.0 * Math.max(0.6, animSpeed));

                // 平滑插值骨骼关节
                joints.pelvis.position.lerp(target.pelvisPos, blend);
                this.m_LerpEuler(joints.pelvis.rotation, target.pelvisRot, blend);
                this.m_LerpEuler(joints.spine.rotation, target.spineRot, blend);
                this.m_LerpEuler(joints.chest.rotation, target.chestRot, blend);
                this.m_LerpEuler(joints.neck.rotation, target.neckRot, blend);
                this.m_LerpEuler(joints.head.rotation, target.headRot, blend);
                joints.jaw.rotation.x = THREE.MathUtils.lerp(joints.jaw.rotation.x, target.jawRotX, blend);

                this.m_LerpEuler(joints.leftShoulder.rotation, target.leftShoulderRot, blend);
                this.m_LerpEuler(joints.leftElbow.rotation, target.leftElbowRot, blend);
                this.m_LerpEuler(joints.leftHand.rotation, target.leftHandRot, blend);

                this.m_LerpEuler(joints.rightShoulder.rotation, target.rightShoulderRot, blend);
                this.m_LerpEuler(joints.rightElbow.rotation, target.rightElbowRot, blend);
                this.m_LerpEuler(joints.rightHand.rotation, target.rightHandRot, blend);

                this.m_LerpEuler(joints.leftHip.rotation, target.leftHipRot, blend);
                this.m_LerpEuler(joints.leftKnee.rotation, target.leftKneeRot, blend);
                this.m_LerpEuler(joints.leftAnkle.rotation, target.leftAnkleRot, blend);

                this.m_LerpEuler(joints.rightHip.rotation, target.rightHipRot, blend);
                this.m_LerpEuler(joints.rightKnee.rotation, target.rightKneeRot, blend);
                this.m_LerpEuler(joints.rightAnkle.rotation, target.rightAnkleRot, blend);

                // 五指分段弯曲控制
                this.m_ApplyFingerCurl(joints.leftFingers, target.leftFingerCurl, 1, blend);
                this.m_ApplyFingerCurl(joints.rightFingers, target.rightFingerCurl, -1, blend);

                // 战锤投掷位移与旋转
                const hammerRest = this.m_Character.getRestPose('hammer');
                if (hammerRest) {
                    const desiredHammerPos = hammerRest.pos.clone().add(target.hammerPosOffset);
                    joints.hammer.position.lerp(desiredHammerPos, blend);
                    joints.hammer.rotation.x = THREE.MathUtils.lerp(joints.hammer.rotation.x, target.hammerRotOffset.x, blend);
                }

                // 独眼眼球微动 (Eyeball Saccades)
                this.m_SaccadeTimer -= dt;
                if (this.m_SaccadeTimer <= 0) {
                    this.m_SaccadeTimer = 0.35 + Math.random() * 1.4;
                    this.m_TargetEyeYaw = (Math.random() - 0.5) * 0.42;
                    this.m_TargetEyePitch = (Math.random() - 0.5) * 0.28;
                }
                if (this.publicCurrentState === 'Stun') {
                    this.m_TargetEyeYaw = Math.cos(this.m_TotalTime * 7) * 0.45;
                    this.m_TargetEyePitch = Math.sin(this.m_TotalTime * 7) * 0.35;
                }
                this.m_CurrentEyeYaw = THREE.MathUtils.lerp(this.m_CurrentEyeYaw, this.m_TargetEyeYaw, Math.min(1, dt * 18));
                this.m_CurrentEyePitch = THREE.MathUtils.lerp(this.m_CurrentEyePitch, this.m_TargetEyePitch, Math.min(1, dt * 18));
                if (joints.eyeBall) {
                    joints.eyeBall.rotation.y = this.m_CurrentEyeYaw;
                    joints.eyeBall.rotation.x = this.m_CurrentEyePitch;
                }

                // 独眼脉动发光 + 胸口能量核心与锤头核心闪烁
                const flicker = 0.88 + 0.12 * Math.sin(this.m_TotalTime * 19.0) + 0.08 * Math.cos(this.m_TotalTime * 37.0);
                const eyePulse = (1.35 + 0.45 * Math.sin(this.m_TotalTime * 3.8)) * target.coreBoost;
                this.m_Materials.amberEye.emissiveIntensity = eyePulse;
                this.m_Materials.boilerCore.emissiveIntensity = 2.8 * flicker * target.coreBoost;
                this.m_Materials.hammerCore.emissiveIntensity = 3.1 * flicker * target.coreBoost;

                if (joints.boilerCore) {
                    joints.boilerCore.rotation.y += scaledDt * 1.8;
                    joints.boilerCore.rotation.z += scaledDt * 1.1;
                }

                return {
                    eyeIntensity: eyePulse,
                    coreIntensity: 2.8 * flicker * target.coreBoost
                };
            }

            m_LerpEuler(eulerA, eulerB, alpha) {
                eulerA.x = THREE.MathUtils.lerp(eulerA.x, eulerB.x, alpha);
                eulerA.y = THREE.MathUtils.lerp(eulerA.y, eulerB.y, alpha);
                eulerA.z = THREE.MathUtils.lerp(eulerA.z, eulerB.z, alpha);
            }

            m_ApplyFingerCurl(fingerList, curlAmount, dirSign, alpha) {
                if (!fingerList) return;
                for (let i = 0; i < fingerList.length; i++) {
                    const f = fingerList[i];
                    const targetAngle = dirSign * curlAmount * 1.25;
                    f.root.rotation.z = THREE.MathUtils.lerp(f.root.rotation.z, targetAngle, alpha);
                    f.distal.rotation.z = THREE.MathUtils.lerp(f.distal.rotation.z, targetAngle * 1.1, alpha);
                }
            }
        }

        // ============================================================================
        // 4. 主应用引擎 (SteampunkCyclopsApp)
        //    负责：WebGL 渲染器、PMREM 程序化环境贴图、工作室电影灯光、工业齿轮地面、
        //          双烟囱蒸汽粒子系统、lil-gui 面板与主循环
        // ============================================================================
        class SteampunkCyclopsApp {
            constructor() {
                // 公共配置参数 (遵循小驼峰命名规范)
                this.publicConfig = {
                    explodeAmount: 0.0,
                    explodeAxis: 'Radial',
                    animationState: 'Idle',
                    animationSpeed: 1.0,
                    gearSpeed: 1.0,
                    wireframe: false,
                    showSkeleton: false,
                    autoRotate: false
                };

                // 私有核心成员 (遵循 m_ + 大驼峰命名规范)
                this.m_Container = document.getElementById('canvasContainer');
                this.m_Scene = null;
                this.m_Cam = null;
                this.m_Renderer = null;
                this.m_Controls = null;
                this.m_Clock = new THREE.Clock();
                this.m_TextureFactory = null;
                this.m_Character = null;
                this.m_AnimController = null;
                this.m_Gui = null;
                this.m_EyePointLight = null;
                this.m_BoilerPointLight = null;
                this.m_HammerPointLight = null;
                this.m_SteamParticles = [];
                this.m_FloorGears = [];
                this.m_FrameCount = 0;
                this.m_FpsAccumulator = 0;

                this.m_InitEngine();
                this.m_SetupEnvironmentAndLights();
                this.m_BuildIndustrialStageFloor();
                this.m_InitCharacterAndAnimation();
                this.m_InitSteamParticleSystem();
                this.m_InitGuiAndHud();
                this.m_BindEvents();
                this.m_AnimateLoop();
            }

            /**
             * 初始化 WebGLRenderer、Scene、Camera 与 OrbitControls
             */
            m_InitEngine() {
                this.m_Scene = new THREE.Scene();
                this.m_Scene.background = new THREE.Color(0x0c0e13);
                this.m_Scene.fog = new THREE.FogExp2(0x0c0e13, 0.032);

                this.m_Cam = new THREE.PerspectiveCamera(
                    42,
                    window.innerWidth / window.innerHeight,
                    0.1,
                    120
                );
                this.m_Cam.position.set(0.4, 3.3, 8.2);

                this.m_Renderer = new THREE.WebGLRenderer({
                    antialias: true,
                    powerPreference: 'high-performance'
                });
                this.m_Renderer.setSize(window.innerWidth, window.innerHeight);
                this.m_Renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
                this.m_Renderer.toneMapping = THREE.ACESFilmicToneMapping;
                this.m_Renderer.toneMappingExposure = 1.18;
                this.m_Renderer.shadowMap.enabled = true;
                this.m_Renderer.shadowMap.type = THREE.PCFSoftShadowMap;
                this.m_Container.appendChild(this.m_Renderer.domElement);

                this.m_Controls = new OrbitControls(this.m_Cam, this.m_Renderer.domElement);
                this.m_Controls.target.set(0, 2.35, 0);
                this.m_Controls.enableDamping = true;
                this.m_Controls.dampingFactor = 0.06;
                this.m_Controls.minDistance = 2.6;
                this.m_Controls.maxDistance = 22.0;
                this.m_Controls.maxPolarAngle = Math.PI * 0.495;
            }

            /**
             * 生成 PMREM 程序化工作室环境贴图与电影级灯光系统
             */
            m_SetupEnvironmentAndLights() {
                const pmremGenerator = new THREE.PMREMGenerator(this.m_Renderer);
                pmremGenerator.compileEquirectangularShader();

                const envScene = new THREE.Scene();
                envScene.background = new THREE.Color(0x141820);

                // 顶部暖琥珀天光灯箱
                const topLightPanel = new THREE.Mesh(
                    new THREE.PlaneGeometry(18, 18),
                    new THREE.MeshBasicMaterial({ color: 0xffd296, side: THREE.DoubleSide })
                );
                topLightPanel.position.set(0, 12, 0);
                topLightPanel.rotation.x = Math.PI * 0.5;
                envScene.add(topLightPanel);

                // 侧面青蓝冷光反射板
                const sidePanel = new THREE.Mesh(
                    new THREE.PlaneGeometry(14, 10),
                    new THREE.MeshBasicMaterial({ color: 0x38bdf8, side: THREE.DoubleSide })
                );
                sidePanel.position.set(-12, 4, -4);
                sidePanel.lookAt(0, 2, 0);
                envScene.add(sidePanel);

                // 地面暖炉反光板
                const warmBounce = new THREE.Mesh(
                    new THREE.PlaneGeometry(16, 16),
                    new THREE.MeshBasicMaterial({ color: 0xb45309, side: THREE.DoubleSide })
                );
                warmBounce.position.set(8, -6, 6);
                warmBounce.lookAt(0, 2, 0);
                envScene.add(warmBounce);

                const envRT = pmremGenerator.fromScene(envScene, 0.04);
                this.m_Scene.environment = envRT.texture;
                pmremGenerator.dispose();

                // 1. 半球环境光
                const hemiLight = new THREE.HemisphereLight(0xffe4b5, 0x1e293b, 0.55);
                this.m_Scene.add(hemiLight);

                // 2. 电影级主光源 (Key Light - 暖金蒸汽工坊投光)
                const keyLight = new THREE.DirectionalLight(0xfff1d6, 3.2);
                keyLight.position.set(5.5, 9.5, 6.5);
                keyLight.castShadow = true;
                keyLight.shadow.mapSize.set(2048, 2048);
                keyLight.shadow.camera.near = 1.0;
                keyLight.shadow.camera.far = 25.0;
                const d = 5.5;
                keyLight.shadow.camera.left = -d;
                keyLight.shadow.camera.right = d;
                keyLight.shadow.camera.top = d;
                keyLight.shadow.camera.bottom = -d;
                keyLight.shadow.bias = -0.0005;
                this.m_Scene.add(keyLight);

                // 3. 补光 (Fill Light - 柔和钢蓝补光)
                const fillLight = new THREE.DirectionalLight(0x60a5fa, 1.25);
                fillLight.position.set(-6.5, 4.5, 3.5);
                this.m_Scene.add(fillLight);

                // 4. 轮廓光 (Rim Light - 背部强青色机械轮廓光)
                const rimLight = new THREE.SpotLight(0x38bdf8, 38.0, 22, Math.PI * 0.35, 0.6, 1.5);
                rimLight.position.set(-2.5, 7.2, -6.8);
                rimLight.target.position.set(0, 2.5, 0);
                this.m_Scene.add(rimLight);
                this.m_Scene.add(rimLight.target);
            }

            /**
             * 构建工业蒸汽朋克齿轮舞台地面
             */
            m_BuildIndustrialStageFloor() {
                this.m_TextureFactory = new ProceduralTextureFactory();
                const mat = this.m_TextureFactory.publicMaterials;

                const stageGroup = new THREE.Group();
                this.m_Scene.add(stageGroup);

                // 底层深色岩石地面
                const groundPlane = new THREE.Mesh(
                    new THREE.CircleGeometry(28, 64),
                    new THREE.MeshStandardMaterial({
                        color: 0x12151c,
                        roughness: 0.85,
                        metalness: 0.25
                    })
                );
                groundPlane.rotation.x = -Math.PI * 0.5;
                groundPlane.position.y = -0.02;
                groundPlane.receiveShadow = true;
                stageGroup.add(groundPlane);

                // 中央黄铜与锈蚀铁装甲圆台
                const platformRing = new THREE.Mesh(
                    new THREE.CylinderGeometry(3.8, 4.1, 0.14, 36),
                    mat.rustedIron
                );
                platformRing.position.y = -0.05;
                platformRing.receiveShadow = true;
                stageGroup.add(platformRing);

                const brassRim = new THREE.Mesh(
                    new THREE.TorusGeometry(3.82, 0.09, 12, 48),
                    mat.brass
                );
                brassRim.rotation.x = Math.PI * 0.5;
                brassRim.position.y = 0.01;
                brassRim.receiveShadow = true;
                stageGroup.add(brassRim);
            }

            /**
             * 初始化独眼巨人角色、绑定点光源与动作状态机
             */
            m_InitCharacterAndAnimation() {
                const mat = this.m_TextureFactory.publicMaterials;
                this.m_Character = new SteampunkCyclopsCharacter(mat);
                this.m_Scene.add(this.m_Character.publicRoot);

                // 在地面镶嵌几个缓慢转动的巨型工业齿轮
                const floorGearConfigs = [
                    { x: -1.8, z: -1.4, r: 1.35, t: 18, spd: 0.25, mat: mat.brass },
                    { x: 1.7,  z: -1.2, r: 1.15, t: 15, spd: -0.32, mat: mat.copper },
                    { x: 0.2,  z: 1.6,  r: 0.95, t: 12, spd: 0.4,  mat: mat.bluedSteel }
                ];
                floorGearConfigs.forEach((cfg) => {
                    const fg = this.m_Character.m_CreateGearMesh(cfg.r, cfg.r * 0.35, 0.08, cfg.t, cfg.mat);
                    fg.rotation.x = Math.PI * 0.5;
                    fg.position.set(cfg.x, 0.01, cfg.z);
                    fg.receiveShadow = true;
                    this.m_Scene.add(fg);
                    this.m_FloorGears.push({ mesh: fg, spd: cfg.spd });
                });

                // 眼部点光源、胸腔锅炉点光源与巨锤核心点光源
                this.m_EyePointLight = new THREE.PointLight(0xffaa00, 3.2, 4.5, 1.6);
                this.m_EyePointLight.position.set(0, 0, 0.32);
                this.m_Character.publicJoints.eyeBall.add(this.m_EyePointLight);

                this.m_BoilerPointLight = new THREE.PointLight(0xff6b00, 4.5, 5.5, 1.5);
                this.m_BoilerPointLight.position.set(0, 0, 0.38);
                this.m_Character.publicJoints.boilerCore.add(this.m_BoilerPointLight);

                this.m_HammerPointLight = new THREE.PointLight(0xff8800, 3.5, 4.2, 1.6);
                this.m_HammerPointLight.position.set(0, 0, 0);
                this.m_Character.publicJoints.hammerCore.add(this.m_HammerPointLight);

                // 初始化动作状态机
                this.m_AnimController = new CyclopsAnimationController(
                    this.m_Character,
                    mat,
                    (newStateObj) => {
                        this.publicConfig.animationState = newStateObj.id;
                        this.m_SyncHudStateUI(newStateObj);
                    }
                );
            }

            /**
             * 初始化背部双烟囱的程序化蒸汽粒子系统
             */
            m_InitSteamParticleSystem() {
                const puffGeo = new THREE.DodecahedronGeometry(0.11, 1);
                const puffCount = 32;

                for (let i = 0; i < puffCount; i++) {
                    const puffMat = new THREE.MeshStandardMaterial({
                        color: 0xd6d3d1,
                        roughness: 0.95,
                        metalness: 0.0,
                        transparent: true,
                        opacity: 0.0,
                        depthWrite: false
                    });
                    const mesh = new THREE.Mesh(puffGeo, puffMat);
                    this.m_Scene.add(mesh);

                    this.m_SteamParticles.push({
                        mesh,
                        age: Math.random() * 1.8,
                        maxAge: 1.4 + Math.random() * 0.8,
                        chimneyIndex: i % 2,
                        vel: new THREE.Vector3(
                            (Math.random() - 0.5) * 0.35,
                            0.95 + Math.random() * 0.55,
                            -0.25 + (Math.random() - 0.5) * 0.35
                        )
                    });
                }
            }

            /**
             * 更新双烟囱蒸汽粒子
             */
            m_UpdateSteamParticles(dt, gearSpeed) {
                const tips = this.m_Character.publicChimneyTips;
                if (!tips || tips.length < 2) return;

                const spawnWorld = new THREE.Vector3();
                for (let i = 0; i < this.m_SteamParticles.length; i++) {
                    const p = this.m_SteamParticles[i];
                    p.age += dt * (0.7 + gearSpeed * 0.35);

                    if (p.age >= p.maxAge) {
                        p.age = 0;
                        tips[p.chimneyIndex].getWorldPosition(spawnWorld);
                        p.mesh.position.copy(spawnWorld);
                        p.mesh.scale.setScalar(0.55);
                    } else {
                        const lifeRatio = p.age / p.maxAge;
                        p.mesh.position.addScaledVector(p.vel, dt);
                        p.mesh.scale.setScalar(0.55 + lifeRatio * 2.1);
                        p.mesh.rotation.x += dt * 1.2;
                        p.mesh.rotation.y += dt * 0.9;
                        const alpha = Math.sin(lifeRatio * Math.PI) * 0.36;
                        p.mesh.material.opacity = alpha;
                    }
                }
            }

            /**
             * 初始化 lil-gui 控制面板与底部快捷动作按钮
             */
            m_InitGuiAndHud() {
                this.m_Gui = new GUI({ title: '⚙️ 蒸汽独眼巨人控制台', width: 310 });

                // 1. 爆炸拆解视图分组
                const explodeFolder = this.m_Gui.addFolder('💥 爆炸拆解视图 (Exploded View)');
                explodeFolder
                    .add(this.publicConfig, 'explodeAmount', 0.0, 1.0, 0.005)
                    .name('爆炸分离度 (0–1)');
                explodeFolder
                    .add(this.publicConfig, 'explodeAxis', {
                        '径向分离 (Radial)': 'Radial',
                        'X 轴分离 (X-Axis)': 'X',
                        'Y 轴分离 (Y-Axis)': 'Y',
                        'Z 轴分离 (Z-Axis)': 'Z'
                    })
                    .name('爆炸轴向 (Axis)');

                // 2. 动作状态机与速率分组
                const animFolder = this.m_Gui.addFolder('🎬 游戏动作套件 (14 States)');
                const stateOptions = {};
                this.m_AnimController.publicStateCatalog.forEach((item) => {
                    stateOptions[item.label] = item.id;
                });

                this.m_GuiStateCtrl = animFolder
                    .add(this.publicConfig, 'animationState', stateOptions)
                    .name('动作状态 (State)')
                    .listen()
                    .onChange((val) => {
                        this.m_AnimController.setAnimationState(val);
                    });

                animFolder
                    .add(this.publicConfig, 'animationSpeed', 0.1, 5.0, 0.05)
                    .name('动画速度 (0.1×–5×)');

                animFolder
                    .add(this.publicConfig, 'gearSpeed', 0.1, 5.0, 0.05)
                    .name('齿轮转速 (0.1×–5×)');

                // 3. 渲染与调试视图分组
                const viewFolder = this.m_Gui.addFolder('🔍 渲染与骨骼调试 (Debug & View)');
                viewFolder
                    .add(this.publicConfig, 'wireframe')
                    .name('线框模式 (Wireframe)')
                    .onChange((val) => {
                        Object.values(this.m_TextureFactory.publicMaterials).forEach((mat) => {
                            if (mat && 'wireframe' in mat) {
                                mat.wireframe = val;
                            }
                        });
                    });

                viewFolder
                    .add(this.publicConfig, 'showSkeleton')
                    .name('显示骨骼 (Skeleton)')
                    .onChange((val) => {
                        this.m_Character.publicSkeletonLines.visible = val;
                    });

                viewFolder
                    .add(this.publicConfig, 'autoRotate')
                    .name('自动旋转 (Auto Rotate)')
                    .onChange((val) => {
                        this.m_Controls.autoRotate = val;
                        this.m_Controls.autoRotateSpeed = 1.6;
                    });

                // 构建底部 14 个快捷动作按钮
                const btnContainer = document.getElementById('actionButtonContainer');
                this.m_AnimController.publicStateCatalog.forEach((item) => {
                    const btn = document.createElement('button');
                    btn.dataset.stateId = item.id;
                    btn.className = `action-btn px-3 py-1.5 rounded-lg text-xs font-medium whitespace-nowrap shrink-0 ${
                        item.id === this.publicConfig.animationState ? 'active' : ''
                    }`;
                    btn.textContent = item.label.split(' ')[0];
                    btn.addEventListener('click', () => {
                        this.m_AnimController.setAnimationState(item.id);
                    });
                    btnContainer.appendChild(btn);
                });
            }

            /**
             * 同步 HUD 状态标签与按钮高亮
             */
            m_SyncHudStateUI(stateObj) {
                const labelEl = document.getElementById('hudStateLabel');
                if (labelEl && stateObj) {
                    labelEl.textContent = stateObj.label;
                }
                const buttons = document.querySelectorAll('#actionButtonContainer .action-btn');
                buttons.forEach((btn) => {
                    if (btn.dataset.stateId === stateObj.id) {
                        btn.classList.add('active');
                    } else {
                        btn.classList.remove('active');
                    }
                });
            }

            /**
             * 绑定窗口自适应尺寸变化
             */
            m_BindEvents() {
                window.addEventListener('resize', () => {
                    this.m_Cam.aspect = window.innerWidth / window.innerHeight;
                    this.m_Cam.updateProjectionMatrix();
                    this.m_Renderer.setSize(window.innerWidth, window.innerHeight);
                });
            }

            /**
             * 基于 delta-time 的平滑主渲染循环
             */
            m_AnimateLoop() {
                requestAnimationFrame(() => this.m_AnimateLoop());

                const rawDt = this.m_Clock.getDelta();
                const dt = Math.min(rawDt, 0.1);

                // FPS 统计更新
                this.m_FrameCount++;
                this.m_FpsAccumulator += rawDt;
                if (this.m_FpsAccumulator >= 0.4) {
                    const fps = Math.round(this.m_FrameCount / this.m_FpsAccumulator);
                    const fpsEl = document.getElementById('hudFps');
                    if (fpsEl) fpsEl.textContent = String(fps);
                    this.m_FrameCount = 0;
                    this.m_FpsAccumulator = 0;
                }

                // 1. 更新骨骼动作状态机与核心发光脉冲
                const lightPulse = this.m_AnimController.update(dt, this.publicConfig.animationSpeed);
                this.m_EyePointLight.intensity = lightPulse.eyeIntensity * 2.2;
                this.m_BoilerPointLight.intensity = lightPulse.coreIntensity * 1.6;
                this.m_HammerPointLight.intensity = lightPulse.coreIntensity * 1.4;

                // 更新 HUD 进度条
                const progressEl = document.getElementById('hudAnimProgress');
                if (progressEl) {
                    progressEl.style.width = `${(this.m_AnimController.publicAnimProgress * 100).toFixed(1)}%`;
                }

                // 2. 更新角色齿轮、液压活塞、骨骼线与爆炸视图
                this.m_Character.updateMechanicsAndExplode(
                    dt,
                    this.publicConfig.gearSpeed,
                    this.publicConfig.explodeAmount,
                    this.publicConfig.explodeAxis
                );

                // 3. 更新地面舞台齿轮与双烟囱蒸汽粒子
                for (let i = 0; i < this.m_FloorGears.length; i++) {
                    const fg = this.m_FloorGears[i];
                    fg.mesh.rotation.z += dt * fg.spd * this.publicConfig.gearSpeed;
                }
                this.m_UpdateSteamParticles(dt, this.publicConfig.gearSpeed);

                // 4. 更新轨道控制器与渲染场景
                this.m_Controls.update();
                this.m_Renderer.render(this.m_Scene, this.m_Cam);
            }
        }

        // 启动应用
        window.onload = function () {
            window.cyclopsApp = new SteampunkCyclopsApp();
        };
    </script>
</body>
