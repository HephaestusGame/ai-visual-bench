    <script type="module">
        import * as THREE from 'three';
        import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
        import GUI from 'lil-gui';

        // ============================================================================
        // 1. 程序化纹理与 PBR 材质工厂 (ProceduralTextureFactory)
        //    严格遵循：公共变量 publicVar（小驼峰），私有变量 m_Var（m_前缀+大驼峰）
        // ============================================================================
        class ProceduralTextureFactory {
            constructor() {
                // 公共材质字典
                this.publicMaterials = {};
                // 私有纹理缓存池
                this.m_TextureCache = new Map();
                this.m_InitAllMaterials();
            }

            /**
             * 生成伪随机哈希噪声 (2D Value Noise + FBM)
             */
            m_Hash2D(x, y, seed = 1337) {
                const n = Math.sin(x * 127.1 + y * 311.7 + seed * 74.7) * 43758.5453123;
                return n - Math.floor(n);
            }

            m_SmoothNoise(x, y, seed = 1337) {
                const ix = Math.floor(x);
                const iy = Math.floor(y);
                const fx = x - ix;
                const fy = y - iy;
                const ux = fx * fx * (3.0 - 2.0 * fx);
                const uy = fy * fy * (3.0 - 2.0 * fy);

                const a = this.m_Hash2D(ix, iy, seed);
                const b = this.m_Hash2D(ix + 1, iy, seed);
                const c = this.m_Hash2D(ix, iy + 1, seed);
                const d = this.m_Hash2D(ix + 1, iy + 1, seed);

                return a + (b - a) * ux + (c - a) * uy + (a - b - c + d) * ux * uy;
            }

            m_Fbm(x, y, octaves = 4, seed = 1337) {
                let value = 0.0;
                let amplitude = 0.5;
                let frequency = 1.0;
                for (let i = 0; i < octaves; i++) {
                    value += amplitude * this.m_SmoothNoise(x * frequency, y * frequency, seed + i * 19);
                    frequency *= 2.02;
                    amplitude *= 0.5;
                }
                return value;
            }

            /**
             * 1. 黄铜纹理（带划痕、金属磨损与铆钉凹凸）
             */
            m_CreateBrassTextures() {
                const size = 512;
                const colorCanvas = document.createElement('canvas');
                const roughCanvas = document.createElement('canvas');
                const bumpCanvas = document.createElement('canvas');
                colorCanvas.width = roughCanvas.width = bumpCanvas.width = size;
                colorCanvas.height = roughCanvas.height = bumpCanvas.height = size;

                const cCtx = colorCanvas.getContext('2d');
                const rCtx = roughCanvas.getContext('2d');
                const bCtx = bumpCanvas.getContext('2d');

                const cData = cCtx.createImageData(size, size);
                const rData = rCtx.createImageData(size, size);
                const bData = bCtx.createImageData(size, size);

                for (let y = 0; y < size; y++) {
                    for (let x = 0; x < size; x++) {
                        const idx = (y * size + x) * 4;
                        const n = this.m_Fbm(x / 48, y / 48, 4, 101);
                        const fine = this.m_Fbm(x / 8, y / 8, 2, 202);
                        // 拉丝与划痕
                        const scratch = Math.abs(Math.sin((x * 0.35 + y * 0.05) + fine * 6.0)) < 0.06 ? -28 : 0;
                        const tarnish = n > 0.62 ? (n - 0.62) * 140 : 0;

                        const r = Math.min(255, Math.max(0, 212 - tarnish * 1.1 + (n - 0.5) * 40 + scratch));
                        const g = Math.min(255, Math.max(0, 165 - tarnish * 0.9 + (n - 0.5) * 35 + scratch));
                        const b = Math.min(255, Math.max(0, 68 - tarnish * 0.5 + (n - 0.5) * 25 + scratch));

                        cData.data[idx] = r;
                        cData.data[idx + 1] = g;
                        cData.data[idx + 2] = b;
                        cData.data[idx + 3] = 255;

                        const roughVal = Math.min(255, Math.max(25, 65 + tarnish * 1.8 - scratch * 2.0 + fine * 35));
                        rData.data[idx] = rData.data[idx + 1] = rData.data[idx + 2] = roughVal;
                        rData.data[idx + 3] = 255;

                        const bumpVal = Math.min(255, Math.max(0, 128 + scratch * 2.5 + (fine - 0.5) * 40));
                        bData.data[idx] = bData.data[idx + 1] = bData.data[idx + 2] = bumpVal;
                        bData.data[idx + 3] = 255;
                    }
                }
                cCtx.putImageData(cData, 0, 0);
                rCtx.putImageData(rData, 0, 0);
                bCtx.putImageData(bData, 0, 0);

                return this.m_PackCanvasTextures(colorCanvas, roughCanvas, bumpCanvas, 3);
            }

            /**
             * 2. 氧化铜与铜绿 (Copper + Verdigris Patina)
             */
            m_CreateCopperTextures() {
                const size = 512;
                const colorCanvas = document.createElement('canvas');
                const roughCanvas = document.createElement('canvas');
                const bumpCanvas = document.createElement('canvas');
                colorCanvas.width = roughCanvas.width = bumpCanvas.width = size;
                colorCanvas.height = roughCanvas.height = bumpCanvas.height = size;

                const cCtx = colorCanvas.getContext('2d');
                const rCtx = roughCanvas.getContext('2d');
                const bCtx = bumpCanvas.getContext('2d');

                const cData = cCtx.createImageData(size, size);
                const rData = rCtx.createImageData(size, size);
                const bData = bCtx.createImageData(size, size);

                for (let y = 0; y < size; y++) {
                    for (let x = 0; x < size; x++) {
                        const idx = (y * size + x) * 4;
                        const n = this.m_Fbm(x / 40, y / 40, 5, 303);
                        const detail = this.m_Fbm(x / 10, y / 10, 3, 404);
                        // 铜绿掩膜
                        const patinaMask = Math.max(0, Math.min(1, (n - 0.52) * 3.8));

                        const baseR = 196 + (detail - 0.5) * 35;
                        const baseG = 104 + (detail - 0.5) * 28;
                        const baseB = 66 + (detail - 0.5) * 20;

                        const patR = 66;
                        const patG = 165;
                        const patB = 142;

                        cData.data[idx] = baseR * (1 - patinaMask) + patR * patinaMask;
                        cData.data[idx + 1] = baseG * (1 - patinaMask) + patG * patinaMask;
                        cData.data[idx + 2] = baseB * (1 - patinaMask) + patB * patinaMask;
                        cData.data[idx + 3] = 255;

                        const roughVal = 65 * (1 - patinaMask) + 215 * patinaMask;
                        rData.data[idx] = rData.data[idx + 1] = rData.data[idx + 2] = roughVal;
                        rData.data[idx + 3] = 255;

                        const bumpVal = 128 + (detail - 0.5) * 50 + patinaMask * 45;
                        bData.data[idx] = bData.data[idx + 1] = bData.data[idx + 2] = Math.min(255, Math.max(0, bumpVal));
                        bData.data[idx + 3] = 255;
                    }
                }
                cCtx.putImageData(cData, 0, 0);
                rCtx.putImageData(rData, 0, 0);
                bCtx.putImageData(bData, 0, 0);

                return this.m_PackCanvasTextures(colorCanvas, roughCanvas, bumpCanvas, 2);
            }

            /**
             * 3. 锈蚀铁甲 (Rusted Iron)
             */
            m_CreateRustedIronTextures() {
                const size = 512;
                const colorCanvas = document.createElement('canvas');
                const roughCanvas = document.createElement('canvas');
                const bumpCanvas = document.createElement('canvas');
                colorCanvas.width = roughCanvas.width = bumpCanvas.width = size;
                colorCanvas.height = roughCanvas.height = bumpCanvas.height = size;

                const cCtx = colorCanvas.getContext('2d');
                const rCtx = roughCanvas.getContext('2d');
                const bCtx = bumpCanvas.getContext('2d');

                const cData = cCtx.createImageData(size, size);
                const rData = rCtx.createImageData(size, size);
                const bData = bCtx.createImageData(size, size);

                for (let y = 0; y < size; y++) {
                    for (let x = 0; x < size; x++) {
                        const idx = (y * size + x) * 4;
                        const n = this.m_Fbm(x / 36, y / 36, 5, 505);
                        const grit = this.m_Fbm(x / 6, y / 6, 3, 606);
                        const rustFactor = Math.max(0, Math.min(1, (n - 0.44) * 3.2));

                        const ironR = 68 + grit * 24;
                        const ironG = 72 + grit * 24;
                        const ironB = 78 + grit * 26;

                        const rustR = 148 + (grit - 0.5) * 55;
                        const rustG = 62 + (grit - 0.5) * 30;
                        const rustB = 28 + (grit - 0.5) * 18;

                        cData.data[idx] = ironR * (1 - rustFactor) + rustR * rustFactor;
                        cData.data[idx + 1] = ironG * (1 - rustFactor) + rustG * rustFactor;
                        cData.data[idx + 2] = ironB * (1 - rustFactor) + rustB * rustFactor;
                        cData.data[idx + 3] = 255;

                        const roughVal = 115 * (1 - rustFactor) + 238 * rustFactor;
                        rData.data[idx] = rData.data[idx + 1] = rData.data[idx + 2] = roughVal;
                        rData.data[idx + 3] = 255;

                        const bumpVal = 128 - rustFactor * 60 + (grit - 0.5) * 80;
                        bData.data[idx] = bData.data[idx + 1] = bData.data[idx + 2] = Math.min(255, Math.max(0, bumpVal));
                        bData.data[idx + 3] = 255;
                    }
                }
                cCtx.putImageData(cData, 0, 0);
                rCtx.putImageData(rData, 0, 0);
                bCtx.putImageData(bData, 0, 0);

                return this.m_PackCanvasTextures(colorCanvas, roughCanvas, bumpCanvas, 2);
            }

            /**
             * 4. 发蓝精钢 (Blued Steel)
             */
            m_CreateBluedSteelTextures() {
                const size = 512;
                const colorCanvas = document.createElement('canvas');
                const roughCanvas = document.createElement('canvas');
                const bumpCanvas = document.createElement('canvas');
                colorCanvas.width = roughCanvas.width = bumpCanvas.width = size;
                colorCanvas.height = roughCanvas.height = bumpCanvas.height = size;

                const cCtx = colorCanvas.getContext('2d');
                const rCtx = roughCanvas.getContext('2d');
                const bCtx = bumpCanvas.getContext('2d');

                const cData = cCtx.createImageData(size, size);
                const rData = rCtx.createImageData(size, size);
                const bData = bCtx.createImageData(size, size);

                for (let y = 0; y < size; y++) {
                    for (let x = 0; x < size; x++) {
                        const idx = (y * size + x) * 4;
                        const brush = this.m_SmoothNoise(x / 3, y / 64, 707);
                        const wear = this.m_Fbm(x / 32, y / 32, 3, 808);

                        cData.data[idx] = 44 + brush * 22 + wear * 18;
                        cData.data[idx + 1] = 58 + brush * 26 + wear * 20;
                        cData.data[idx + 2] = 82 + brush * 32 + wear * 24;
                        cData.data[idx + 3] = 255;

                        const roughVal = 55 + brush * 45 + wear * 30;
                        rData.data[idx] = rData.data[idx + 1] = rData.data[idx + 2] = roughVal;
                        rData.data[idx + 3] = 255;

                        const bumpVal = 120 + brush * 30;
                        bData.data[idx] = bData.data[idx + 1] = bData.data[idx + 2] = bumpVal;
                        bData.data[idx + 3] = 255;
                    }
                }
                cCtx.putImageData(cData, 0, 0);
                rCtx.putImageData(rData, 0, 0);
                bCtx.putImageData(bData, 0, 0);

                return this.m_PackCanvasTextures(colorCanvas, roughCanvas, bumpCanvas, 2);
            }

            /**
             * 5. 裂纹皮革 (Cracked Leather)
             */
            m_CreateLeatherTextures() {
                const size = 512;
                const colorCanvas = document.createElement('canvas');
                const roughCanvas = document.createElement('canvas');
                const bumpCanvas = document.createElement('canvas');
                colorCanvas.width = roughCanvas.width = bumpCanvas.width = size;
                colorCanvas.height = roughCanvas.height = bumpCanvas.height = size;

                const cCtx = colorCanvas.getContext('2d');
                const rCtx = roughCanvas.getContext('2d');
                const bCtx = bumpCanvas.getContext('2d');

                const cData = cCtx.createImageData(size, size);
                const rData = rCtx.createImageData(size, size);
                const bData = bCtx.createImageData(size, size);

                for (let y = 0; y < size; y++) {
                    for (let x = 0; x < size; x++) {
                        const idx = (y * size + x) * 4;
                        const grain = this.m_Fbm(x / 12, y / 12, 4, 909);
                        const macro = this.m_Fbm(x / 48, y / 48, 3, 1010);
                        // 皮革裂纹网
                        const crackWave = Math.abs(Math.sin(x * 0.09 + grain * 5.5) * Math.cos(y * 0.09 + macro * 5.5));
                        const isCrack = crackWave < 0.065 ? 1.0 : 0.0;

                        const r = (92 + macro * 35 - grain * 18) * (1 - isCrack * 0.45);
                        const g = (52 + macro * 22 - grain * 12) * (1 - isCrack * 0.45);
                        const b = (28 + macro * 14 - grain * 8) * (1 - isCrack * 0.45);

                        cData.data[idx] = r;
                        cData.data[idx + 1] = g;
                        cData.data[idx + 2] = b;
                        cData.data[idx + 3] = 255;

                        const roughVal = 155 + grain * 55 + isCrack * 40;
                        rData.data[idx] = rData.data[idx + 1] = rData.data[idx + 2] = Math.min(255, roughVal);
                        rData.data[idx + 3] = 255;

                        const bumpVal = isCrack > 0 ? 45 : 135 + (grain - 0.5) * 65;
                        bData.data[idx] = bData.data[idx + 1] = bData.data[idx + 2] = bumpVal;
                        bData.data[idx + 3] = 255;
                    }
                }
                cCtx.putImageData(cData, 0, 0);
                rCtx.putImageData(rData, 0, 0);
                bCtx.putImageData(bData, 0, 0);

                return this.m_PackCanvasTextures(colorCanvas, roughCanvas, bumpCanvas, 3);
            }

            /**
             * 6. 岩石质巨人皮肤 (Rocky Skin)
             */
            m_CreateRockySkinTextures() {
                const size = 512;
                const colorCanvas = document.createElement('canvas');
                const roughCanvas = document.createElement('canvas');
                const bumpCanvas = document.createElement('canvas');
                colorCanvas.width = roughCanvas.width = bumpCanvas.width = size;
                colorCanvas.height = roughCanvas.height = bumpCanvas.height = size;

                const cCtx = colorCanvas.getContext('2d');
                const rCtx = roughCanvas.getContext('2d');
                const bCtx = bumpCanvas.getContext('2d');

                const cData = cCtx.createImageData(size, size);
                const rData = rCtx.createImageData(size, size);
                const bData = bCtx.createImageData(size, size);

                for (let y = 0; y < size; y++) {
                    for (let x = 0; x < size; x++) {
                        const idx = (y * size + x) * 4;
                        const crag = this.m_Fbm(x / 28, y / 28, 5, 1111);
                        const pore = this.m_Fbm(x / 6, y / 6, 3, 1212);
                        const fissure = Math.abs(crag - 0.5) < 0.028 ? 1.0 : 0.0;

                        const r = (94 + crag * 42 + pore * 16) * (1 - fissure * 0.55);
                        const g = (86 + crag * 38 + pore * 14) * (1 - fissure * 0.55);
                        const b = (78 + crag * 34 + pore * 12) * (1 - fissure * 0.55);

                        cData.data[idx] = r;
                        cData.data[idx + 1] = g;
                        cData.data[idx + 2] = b;
                        cData.data[idx + 3] = 255;

                        const roughVal = 185 + pore * 55;
                        rData.data[idx] = rData.data[idx + 1] = rData.data[idx + 2] = Math.min(255, roughVal);
                        rData.data[idx + 3] = 255;

                        const bumpVal = fissure > 0 ? 20 : 128 + (crag - 0.5) * 110 + (pore - 0.5) * 50;
                        bData.data[idx] = bData.data[idx + 1] = bData.data[idx + 2] = Math.min(255, Math.max(0, bumpVal));
                        bData.data[idx + 3] = 255;
                    }
                }
                cCtx.putImageData(cData, 0, 0);
                rCtx.putImageData(rData, 0, 0);
                bCtx.putImageData(bData, 0, 0);

                return this.m_PackCanvasTextures(colorCanvas, roughCanvas, bumpCanvas, 2);
            }

            /**
             * 7. 琥珀色玻璃独眼纹理 (Amber Glass Eyeball)
             */
            m_CreateAmberEyeTexture() {
                const size = 512;
                const canvas = document.createElement('canvas');
                canvas.width = canvas.height = size;
                const ctx = canvas.getContext('2d');
                const cx = size / 2;
                const cy = size / 2;

                // 巩膜与暗色机械基底
                ctx.fillStyle = '#1c1208';
                ctx.fillRect(0, 0, size, size);

                // 琥珀虹膜渐变
                const grad = ctx.createRadialGradient(cx, cy, size * 0.05, cx, cy, size * 0.46);
                grad.addColorStop(0.0, '#050302');
                grad.addColorStop(0.16, '#090502');
                grad.addColorStop(0.19, '#fef08a');
                grad.addColorStop(0.32, '#f59e0b');
                grad.addColorStop(0.58, '#b45309');
                grad.addColorStop(0.78, '#451a03');
                grad.addColorStop(1.0, '#120904');
                ctx.fillStyle = grad;
                ctx.beginPath();
                ctx.arc(cx, cy, size * 0.48, 0, Math.PI * 2);
                ctx.fill();

                // 虹膜放射状机械刻度与血丝纤维
                ctx.save();
                ctx.translate(cx, cy);
                for (let i = 0; i < 120; i++) {
                    const angle = (i / 120) * Math.PI * 2;
                    const innerR = size * (0.17 + (i % 3) * 0.015);
                    const outerR = size * (0.38 + (i % 5) * 0.018);
                    ctx.strokeStyle = i % 2 === 0 ? 'rgba(254, 240, 138, 0.42)' : 'rgba(120, 53, 15, 0.55)';
                    ctx.lineWidth = i % 6 === 0 ? 2.2 : 1.0;
                    ctx.beginPath();
                    ctx.moveTo(Math.cos(angle) * innerR, Math.sin(angle) * innerR);
                    ctx.lineTo(Math.cos(angle) * outerR, Math.sin(angle) * outerR);
                    ctx.stroke();
                }

                // 精密蒸汽朋克瞳孔光圈环
                ctx.strokeStyle = 'rgba(253, 224, 71, 0.75)';
                ctx.lineWidth = 3;
                ctx.beginPath();
                ctx.arc(0, 0, size * 0.21, 0, Math.PI * 2);
                ctx.stroke();

                ctx.restore();

                const tex = new THREE.CanvasTexture(canvas);
                tex.colorSpace = THREE.SRGBColorSpace;
                tex.needsUpdate = true;
                return tex;
            }

            /**
             * 8. 压力表盘纹理 (Pressure Gauge Dial)
             */
            m_CreateGaugeDialTexture() {
                const size = 256;
                const canvas = document.createElement('canvas');
                canvas.width = canvas.height = size;
                const ctx = canvas.getContext('2d');
                const cx = size / 2;
                const cy = size / 2;

                // 复古泛黄表盘底面
                const bgGrad = ctx.createRadialGradient(cx, cy, 10, cx, cy, size * 0.48);
                bgGrad.addColorStop(0, '#f5ebd6');
                bgGrad.addColorStop(0.8, '#d4be94');
                bgGrad.addColorStop(1, '#785c38');
                ctx.fillStyle = bgGrad;
                ctx.beginPath();
                ctx.arc(cx, cy, size * 0.48, 0, Math.PI * 2);
                ctx.fill();

                // 红色高压危险区弧线
                ctx.strokeStyle = '#dc2626';
                ctx.lineWidth = 10;
                ctx.beginPath();
                ctx.arc(cx, cy, size * 0.37, -Math.PI * 0.15, Math.PI * 0.35);
                ctx.stroke();

                // 刻度线
                ctx.save();
                ctx.translate(cx, cy);
                for (let i = 0; i <= 24; i++) {
                    const a = (-Math.PI * 0.75) + (i / 24) * (Math.PI * 1.5);
                    ctx.strokeStyle = i > 18 ? '#b91c1c' : '#1c1917';
                    ctx.lineWidth = i % 4 === 0 ? 3.5 : 1.5;
                    const r1 = i % 4 === 0 ? size * 0.30 : size * 0.34;
                    const r2 = size * 0.42;
                    ctx.beginPath();
                    ctx.moveTo(Math.cos(a) * r1, Math.sin(a) * r1);
                    ctx.lineTo(Math.cos(a) * r2, Math.sin(a) * r2);
                    ctx.stroke();
                }
                // 指针
                ctx.rotate(0.45);
                ctx.fillStyle = '#991b1b';
                ctx.beginPath();
                ctx.moveTo(-6, 18);
                ctx.lineTo(0, -size * 0.38);
                ctx.lineTo(6, 18);
                ctx.closePath();
                ctx.fill();

                ctx.fillStyle = '#292524';
                ctx.beginPath();
                ctx.arc(0, 0, 10, 0, Math.PI * 2);
                ctx.fill();
                ctx.restore();

                const tex = new THREE.CanvasTexture(canvas);
                tex.colorSpace = THREE.SRGBColorSpace;
                return tex;
            }

            /**
             * 打包 Canvas 为 Repeat Wrapping 的 Three.js 纹理组
             */
            m_PackCanvasTextures(colorCanvas, roughCanvas, bumpCanvas, repeatCount = 2) {
                const map = new THREE.CanvasTexture(colorCanvas);
                map.colorSpace = THREE.SRGBColorSpace;
                const roughnessMap = new THREE.CanvasTexture(roughCanvas);
                const bumpMap = new THREE.CanvasTexture(bumpCanvas);

                [map, roughnessMap, bumpMap].forEach((t) => {
                    t.wrapS = THREE.RepeatWrapping;
                    t.wrapT = THREE.RepeatWrapping;
                    t.repeat.set(repeatCount, repeatCount);
                    t.needsUpdate = true;
                });

                return { map, roughnessMap, bumpMap };
            }

        // ============================================================================
        // 2. 蒸汽朋克独眼巨人角色构建器 (SteampunkCyclopsCharacter)
        //    包含：骨骼层级、肌肉群、黄铜头骨与独眼、锅炉胸腔、双烟囱背包、
        //          全身齿轮/液压活塞、五指分段巨掌、巨型蒸汽战锤与爆炸视图组件注册
        // ============================================================================
        class SteampunkCyclopsCharacter {
            constructor(materials) {
                // 公共根容器与控制器引用
                this.publicRoot = new THREE.Group();
                this.publicJoints = {};
                this.publicAnimatedGears = [];
                this.publicPistons = [];
                this.publicExplodeItems = [];
                this.publicChimneyTips = [];
                this.publicSkeletonLines = null;

                // 私有成员
                this.m_Materials = materials;
                this.m_GuideLineSegments = null;
                this.m_GuideLineGeometry = null;
                this.m_RestPose = new Map();

                this.m_BuildCharacterHierarchy();
                this.m_CaptureRestPoses();
                this.m_BuildExplodeGuideLines();
                this.m_BuildSkeletonVisualizer();
            }

            /**
             * 创建程序化外露齿轮几何体
             */
            m_CreateGearMesh(outerRadius, innerRadius, thickness, teethCount, material) {
                const shape = new THREE.Shape();
                const step = (Math.PI * 2) / teethCount;
                const rootR = outerRadius * 0.82;

                for (let i = 0; i < teethCount; i++) {
                    const a0 = i * step;
                    const a1 = a0 + step * 0.22;
                    const a2 = a0 + step * 0.32;
                    const a3 = a0 + step * 0.68;
                    const a4 = a0 + step * 0.78;

                    if (i === 0) {
                        shape.moveTo(Math.cos(a0) * rootR, Math.sin(a0) * rootR);
                    } else {
                        shape.lineTo(Math.cos(a0) * rootR, Math.sin(a0) * rootR);
                    }
                    shape.lineTo(Math.cos(a1) * rootR, Math.sin(a1) * rootR);
                    shape.lineTo(Math.cos(a2) * outerRadius, Math.sin(a2) * outerRadius);
                    shape.lineTo(Math.cos(a3) * outerRadius, Math.sin(a3) * outerRadius);
                    shape.lineTo(Math.cos(a4) * rootR, Math.sin(a4) * rootR);
                }
                shape.closePath();

                if (innerRadius > 0.01) {
                    const hole = new THREE.Path();
                    hole.absarc(0, 0, innerRadius, 0, Math.PI * 2, true);
                    shape.holes.push(hole);
                }

                const extrudeSettings = {
                    depth: thickness,
                    bevelEnabled: true,
                    bevelSegments: 2,
                    steps: 1,
                    bevelSize: thickness * 0.12,
                    bevelThickness: thickness * 0.12
                };

                const geo = new THREE.ExtrudeGeometry(shape, extrudeSettings);
                geo.center();
                const mesh = new THREE.Mesh(geo, material);
                mesh.castShadow = true;
                mesh.receiveShadow = true;
                return mesh;
            }

            /**
             * 注册可旋转齿轮
             */
            m_RegisterGear(mesh, axis = 'z', speedRatio = 1.0) {
                this.publicAnimatedGears.push({
                    mesh,
                    axis,
                    speedRatio
                });
                return mesh;
            }

            /**
             * 注册可爆炸分离的部件
             */
            m_RegisterExplodePart(object3d, customDir = null, distanceScale = 1.6) {
                object3d.updateMatrixWorld(true);
                const baseLocalPos = object3d.position.clone();
                this.publicExplodeItems.push({
                    object3d,
                    baseLocalPos,
                    customDir: customDir ? customDir.clone().normalize() : null,
                    distanceScale
                });
            }

            /**
             * 创建关节液压活塞组件（气缸套筒 + 活塞杆）
             */
            m_CreateHydraulicPiston(parentA, offsetA, parentB, offsetB, radius = 0.055) {
                const cylGroup = new THREE.Group();
                cylGroup.position.copy(offsetA);
                parentA.add(cylGroup);

                const rodGroup = new THREE.Group();
                rodGroup.position.copy(offsetB);
                parentB.add(rodGroup);

                const barrelLen = 0.42;
                const barrelGeo = new THREE.CylinderGeometry(radius, radius * 1.08, barrelLen, 12);
                barrelGeo.translate(0, barrelLen * 0.5, 0);
                barrelGeo.rotateX(Math.PI * 0.5);
                const barrelMesh = new THREE.Mesh(barrelGeo, this.m_Materials.copper);
                barrelMesh.castShadow = true;
                cylGroup.add(barrelMesh);

                // 铜箍细节
                const collarGeo = new THREE.CylinderGeometry(radius * 1.28, radius * 1.28, 0.05, 12);
                collarGeo.rotateX(Math.PI * 0.5);
                const collarMesh = new THREE.Mesh(collarGeo, this.m_Materials.brass);
                collarMesh.position.z = barrelLen;
                cylGroup.add(collarMesh);

                const rodLen = 0.48;
                const rodGeo = new THREE.CylinderGeometry(radius * 0.58, radius * 0.58, rodLen, 10);
                rodGeo.translate(0, rodLen * 0.5, 0);
                rodGeo.rotateX(Math.PI * 0.5);
                const rodMesh = new THREE.Mesh(rodGeo, this.m_Materials.bluedSteel);
                rodMesh.castShadow = true;
                rodGroup.add(rodMesh);

                this.publicPistons.push({ cylGroup, rodGroup });
            }

            /**
             * 添加铆钉阵列装饰
             */
            m_AddRivetsRing(parent, radius, yPos, count = 8, size = 0.025) {
                const rivetGeo = new THREE.SphereGeometry(size, 8, 8);
                for (let i = 0; i < count; i++) {
                    const a = (i / count) * Math.PI * 2;
                    const rivet = new THREE.Mesh(rivetGeo, this.m_Materials.brass);
                    rivet.position.set(Math.cos(a) * radius, yPos, Math.sin(a) * radius);
                    parent.add(rivet);
                }
            }

            /**
             * 构建完整角色骨骼与装备网格
             */
            m_BuildCharacterHierarchy() {
                const mat = this.m_Materials;

                // 1. 骨盆根节点 (Pelvis) - 离地高度约 2.15m
                const pelvis = new THREE.Group();
                pelvis.name = 'Pelvis';
                pelvis.position.set(0, 2.15, 0);
                this.publicRoot.add(pelvis);
                this.publicJoints.pelvis = pelvis;

                // 骨盆岩石躯干基底 + 裂纹皮革重型腰带
                const pelvisCore = new THREE.Mesh(
                    new THREE.CylinderGeometry(0.68, 0.56, 0.55, 16),
                    mat.rockSkin
                );
                pelvisCore.scale.set(1.18, 1.0, 0.92);
                pelvisCore.castShadow = true;
                pelvisCore.receiveShadow = true;
                pelvis.add(pelvisCore);

                // 重型裂纹皮革腰带与黄铜扣件
                const beltGroup = new THREE.Group();
                pelvis.add(beltGroup);
                const beltMesh = new THREE.Mesh(
                    new THREE.CylinderGeometry(0.74, 0.68, 0.34, 20),
                    mat.leather
                );
                beltMesh.scale.set(1.16, 1.0, 0.94);
                beltMesh.castShadow = true;
                beltGroup.add(beltMesh);
                this.m_AddRivetsRing(beltGroup, 0.78, 0.08, 14, 0.032);
                this.m_AddRivetsRing(beltGroup, 0.75, -0.08, 14, 0.032);

                // 腰带中央蒸汽朋克齿轮徽章扣
                const buckle = new THREE.Mesh(
                    new THREE.BoxGeometry(0.46, 0.38, 0.16),
                    mat.brass
                );
                buckle.position.set(0, 0.0, 0.68);
                buckle.castShadow = true;
                beltGroup.add(buckle);
                const buckleGear = this.m_CreateGearMesh(0.15, 0.04, 0.06, 10, mat.copper);
                buckleGear.position.set(0, 0, 0.77);
                beltGroup.add(this.m_RegisterGear(buckleGear, 'z', 1.5));
                this.m_RegisterExplodePart(beltGroup, new THREE.Vector3(0, -0.2, 1), 1.4);

                // 2. 脊椎与胸腔 (Spine -> Chest)
                const spine = new THREE.Group();
                spine.name = 'Spine';
                spine.position.set(0, 0.28, 0);
                pelvis.add(spine);
                this.publicJoints.spine = spine;

                // 腹部厚重岩石肌肉束
                const absGroup = new THREE.Group();
                spine.add(absGroup);
                const abdomenRock = new THREE.Mesh(
                    new THREE.CylinderGeometry(0.82, 0.66, 0.65, 16),
                    mat.rockSkin
                );
                abdomenRock.position.y = 0.28;
                abdomenRock.scale.set(1.15, 1, 0.92);
                abdomenRock.castShadow = true;
                absGroup.add(abdomenRock);

                for (let row = 0; row < 2; row++) {
                    for (let side of [-1, 1]) {
                        const abMuscle = new THREE.Mesh(
                            new THREE.DodecahedronGeometry(0.24, 1),
                            mat.rockSkin
                        );
                        abMuscle.scale.set(1.2, 0.75, 0.8);
                        abMuscle.position.set(side * 0.24, 0.18 + row * 0.24, 0.56);
                        abMuscle.castShadow = true;
                        absGroup.add(abMuscle);
                    }
                }
                this.m_RegisterExplodePart(absGroup, new THREE.Vector3(0, 0, 0.8), 1.0);

                // 胸腔主节点 (Chest)
                const chest = new THREE.Group();
                chest.name = 'Chest';
                chest.position.set(0, 0.58, 0);
                spine.add(chest);
                this.publicJoints.chest = chest;

                this.m_BuildTorsoAndBoiler(chest);
                this.m_BuildBackpack(chest);
                this.m_BuildHeadAndCyclopsEye(chest);

                // 左右手臂与五指巨掌
                this.m_BuildArm(chest, 'Left', -1);
                this.m_BuildArm(chest, 'Right', 1);

                // 右手巨型蒸汽战锤
                this.m_BuildGiantSteamHammer(this.publicJoints.rightHand);

                // 左右柱状双腿
                this.m_BuildLeg(pelvis, 'Left', -1);
                this.m_BuildLeg(pelvis, 'Right', 1);
            }

            /**
             * 构建粗壮岩石躯干 + 外露胸腔锅炉结构（发光核心、啮合齿轮、压力表、铜制液压管）
             */
            m_BuildTorsoAndBoiler(chest) {
                const mat = this.m_Materials;

                // 粗壮岩石躯干主体
                const torsoRockGroup = new THREE.Group();
                chest.add(torsoRockGroup);

                const mainTorso = new THREE.Mesh(
                    new THREE.CylinderGeometry(1.12, 0.82, 1.25, 18),
                    mat.rockSkin
                );
                mainTorso.position.set(0, 0.56, -0.04);
                mainTorso.scale.set(1.22, 1.0, 0.92);
                mainTorso.castShadow = true;
                mainTorso.receiveShadow = true;
                torsoRockGroup.add(mainTorso);

                // 厚重的岩石胸大肌、斜方肌与背阔肌束
                for (let side of [-1, 1]) {
                    const pecMuscle = new THREE.Mesh(
                        new THREE.DodecahedronGeometry(0.48, 2),
                        mat.rockSkin
                    );
                    pecMuscle.scale.set(1.25, 0.85, 0.82);
                    pecMuscle.position.set(side * 0.58, 0.76, 0.45);
                    pecMuscle.castShadow = true;
                    torsoRockGroup.add(pecMuscle);

                    const trapMuscle = new THREE.Mesh(
                        new THREE.DodecahedronGeometry(0.44, 2),
                        mat.rockSkin
                    );
                    trapMuscle.scale.set(1.3, 0.85, 1.0);
                    trapMuscle.position.set(side * 0.56, 1.16, -0.08);
                    trapMuscle.castShadow = true;
                    torsoRockGroup.add(trapMuscle);

                    const latMuscle = new THREE.Mesh(
                        new THREE.DodecahedronGeometry(0.52, 1),
                        mat.rockSkin
                    );
                    latMuscle.scale.set(0.95, 1.25, 0.9);
                    latMuscle.position.set(side * 0.86, 0.55, -0.15);
                    latMuscle.castShadow = true;
                    torsoRockGroup.add(latMuscle);
                }

                // 胸腔外露锅炉总成 (Boiler Cavity Assembly)
                const boilerGroup = new THREE.Group();
                boilerGroup.position.set(0, 0.56, 0.58);
                chest.add(boilerGroup);

                // 锅炉内胆暗钢腔体
                const furnaceHousing = new THREE.Mesh(
                    new THREE.CylinderGeometry(0.52, 0.46, 0.82, 18),
                    mat.bluedSteel
                );
                furnaceHousing.rotation.x = Math.PI * 0.5;
                furnaceHousing.position.z = -0.12;
                boilerGroup.add(furnaceHousing);

                // 发光能量核心 (Glowing Energy Core)
                const coreMesh = new THREE.Mesh(
                    new THREE.OctahedronGeometry(0.34, 3),
                    mat.boilerCore
                );
                coreMesh.position.set(0, 0, 0.04);
                boilerGroup.add(coreMesh);
                this.publicJoints.boilerCore = coreMesh;

                // 环绕锅炉的黄铜法兰护圈与铁艺炉栅
                const flangeRing = new THREE.Mesh(
                    new THREE.TorusGeometry(0.50, 0.065, 14, 28),
                    mat.brass
                );
                flangeRing.position.z = 0.14;
                flangeRing.castShadow = true;
                boilerGroup.add(flangeRing);

                for (let i = -2; i <= 2; i++) {
                    const grateBar = new THREE.Mesh(
                        new THREE.CylinderGeometry(0.026, 0.026, 0.92, 8),
                        mat.rustedIron
                    );
                    grateBar.position.set(i * 0.16, 0, 0.22);
                    grateBar.castShadow = true;
                    boilerGroup.add(grateBar);
                }

                // 胸腔表面散布的啮合齿轮组 (Meshing Gears)
                const gearSpecs = [
                    { x: -0.46, y: 0.34, z: 0.20, r: 0.20, t: 12, spd: 1.4, mat: mat.brass },
                    { x: -0.22, y: 0.46, z: 0.22, r: 0.13, t: 8,  spd: -2.1, mat: mat.copper },
                    { x: 0.46,  y: -0.30, z: 0.20, r: 0.22, t: 14, spd: -1.2, mat: mat.brass },
                    { x: 0.22,  y: -0.44, z: 0.22, r: 0.14, t: 9,  spd: 1.9, mat: mat.bluedSteel },
                    { x: -0.48, y: -0.28, z: 0.18, r: 0.16, t: 10, spd: 1.6, mat: mat.copper }
                ];
                gearSpecs.forEach((g) => {
                    const gear = this.m_CreateGearMesh(g.r, g.r * 0.28, 0.06, g.t, g.mat);
                    gear.position.set(g.x, g.y, g.z);
                    boilerGroup.add(this.m_RegisterGear(gear, 'z', g.spd));
                });

                // 胸前双压力表 (Pressure Gauges)
                const gaugePositions = [
                    new THREE.Vector3(0.48, 0.36, 0.18),
                    new THREE.Vector3(-0.56, 0.04, 0.16)
                ];
                gaugePositions.forEach((pos) => {
                    const gaugeBezel = new THREE.Group();
                    gaugeBezel.position.copy(pos);
                    const caseMesh = new THREE.Mesh(
                        new THREE.CylinderGeometry(0.14, 0.14, 0.07, 16),

                    caseMesh.rotation.x = Math.PI * 0.5;
                    gaugeBezel.add(caseMesh);

                    const faceMesh = new THREE.Mesh(
                        new THREE.CircleGeometry(0.115, 16),
                        mat.gaugeFace

                    faceMesh.position.z = 0.038;
                    gaugeBezel.add(faceMesh);
                    boilerGroup.add(gaugeBezel);
                });

                // 铜制液压弯管 (Copper Hydraulic Pipes)
                for (let side of [-1, 1]) {
                    const pipeCurve = new THREE.CatmullRomCurve3([
                        new THREE.Vector3(side * 0.36, -0.35, 0.12),
                        new THREE.Vector3(side * 0.78, -0.15, 0.22),
                        new THREE.Vector3(side * 0.95, 0.35, 0.02),
                        new THREE.Vector3(side * 0.72, 0.62, -0.35)
                    ]);

                    const pipeMesh = new THREE.Mesh(pipeGeo, mat.copper);

                this.m_RegisterExplodePart(boilerGroup, new THREE.Vector3(0, 0.1, 1), 1.85);

            /**
             * 构建背部双烟囱锅炉背包（侧面挂铜罐与排气管）
             */
            m_BuildBackpack(chest) {
                const mat = this.m_Materials;
                const backpack = new THREE.Group();
                backpack.name = 'BoilerBackpack';
                backpack.position.set(0, 0.62, -0.78);
                chest.add(backpack);
                this.publicJoints.backpack = backpack;

                // 主高压蒸汽锅炉罐
                const mainBoiler = new THREE.Mesh(
                    new THREE.CylinderGeometry(0.56, 0.52, 1.18, 20),
                    mat.rustedIron
                );
                mainBoiler.castShadow = true;
                mainBoiler.receiveShadow = true;
                backpack.add(mainBoiler);

                // 上下黄铜封头与铆钉箍带
                const topDome = new THREE.Mesh(
                    new THREE.SphereGeometry(0.56, 20, 12, 0, Math.PI * 2, 0, Math.PI * 0.5),
                    mat.brass
                );
                topDome.position.y = 0.58;

                const bottomDome = new THREE.Mesh(
                    new THREE.SphereGeometry(0.52, 20, 12, 0, Math.PI * 2, Math.PI * 0.5, Math.PI * 0.5),
                    mat.brass
                );
                bottomDome.position.y = -0.58;
                backpack.add(bottomDome);

                [-0.35, 0, 0.35].forEach((yOff) => {
                    const band = new THREE.Mesh(
                        new THREE.CylinderGeometry(0.58, 0.58, 0.07, 20),
                        mat.brass
                    );
                    band.position.y = yOff;
                    backpack.add(band);
                    this.m_AddRivetsRing(backpack, 0.59, yOff, 12, 0.026);
                });

                // 背部外露大飞轮齿轮
                const backFlywheel = this.m_CreateGearMesh(0.38, 0.14, 0.08, 16, mat.brass);
                backFlywheel.position.set(0, 0.08, -0.58);
                backpack.add(this.m_RegisterGear(backFlywheel, 'z', 1.1));

                // 双烟囱 (Twin Smokestacks / Chimneys)
                for (let side of [-1, 1]) {
                    const stackGroup = new THREE.Group();
                    stackGroup.position.set(side * 0.34, 0.75, -0.08);
                    stackGroup.rotation.z = side * -0.14;
                    stackGroup.rotation.x = -0.12;
                    backpack.add(stackGroup);

                    const pipe = new THREE.Mesh(
                        new THREE.CylinderGeometry(0.15, 0.12, 1.05, 14),
                        mat.rustedIron
                    );
                    pipe.position.y = 0.52;
                    pipe.castShadow = true;
                    stackGroup.add(pipe);

                    const crown = new THREE.Mesh(
                        new THREE.CylinderGeometry(0.20, 0.15, 0.18, 14),
                        mat.brass
                    );
                    crown.position.y = 1.02;
                    stackGroup.add(crown);

                    // 记录烟囱排烟口位置用于蒸汽粒子发射
                    const tipNode = new THREE.Object3D();
                    tipNode.position.set(0, 1.14, 0);
                    stackGroup.add(tipNode);
                    this.publicChimneyTips.push(tipNode);

                    // 侧面挂载的氧化铜储气罐 (Side Copper Canisters)
                    const canister = new THREE.Group();
                    canister.position.set(side * 0.68, -0.05, 0.06);
                    backpack.add(canister);

                    const tankBody = new THREE.Mesh(
                        new THREE.CapsuleGeometry(0.18, 0.52, 8, 14),
                        mat.copper
                    );
                    tankBody.castShadow = true;
                    canister.add(tankBody);

                    const strap = new THREE.Mesh(
                        new THREE.CylinderGeometry(0.195, 0.195, 0.12, 14),
                        mat.leather
                    );
                    canister.add(strap);

                    // 侧面排气管路 (Exhaust Manifolds)
                    for (let k = 0; k < 2; k++) {
                        const exhaustPipe = new THREE.Mesh(
                            new THREE.CylinderGeometry(0.045, 0.055, 0.62, 10),
                            mat.bluedSteel
                        );
                        exhaustPipe.position.set(side * 0.18, -0.45 - k * 0.12, -0.22);
                        exhaustPipe.rotation.z = side * 0.45;
                        canister.add(exhaustPipe);
                    }
                    this.m_RegisterExplodePart(canister, new THREE.Vector3(side, 0, -0.5), 1.6);
                }

                this.m_RegisterExplodePart(backpack, new THREE.Vector3(0, 0.35, -1), 2.1);
            }

            /**
             * 构建铰接式黄铜头骨、琥珀色独眼、黄铜眼眶环与头顶锈蚀装甲板
             */
            m_BuildHeadAndCyclopsEye(chest) {
                const mat = this.m_Materials;

                const neck = new THREE.Group();
                neck.name = 'Neck';
                neck.position.set(0, 1.26, 0.08);
                chest.add(neck);

                // 颈部液压支柱与岩石颈肌

                    craniumGroup.add(this.m_RegisterGear(earGear, 'z', side * 1.3));

                // 2. 头顶锈蚀装甲板 (Top Rusted Armor Crest Plates)

                domeArmor.rotation.y = Math.PI * 0.5;

                this.m_AddRivetsRing(crestGroup, 0.42, -0.05, 8, 0.026);
                this.m_RegisterExplodePart(crestGroup, new THREE.Vector3(0, 1, 0), 1.7);

                // 3. 铰接式下颚 (Articulated Brass Jaw)
                const jaw = new THREE.Group();

                jawPlate.scale.set(1.1, 1.0, 1.15);
                jawPlate.castShadow = true;
                jaw.add(jawPlate);

                // 下颚蒸汽格栅獠牙护齿
                for (let i = -2; i <= 2; i++) {

                        new THREE.BoxGeometry(0.055, 0.14, 0.055),

                    );
                    tooth.position.set(i * 0.11, -0.02, 0.48 - Math.abs(i) * 0.04);
                    jaw.add(tooth);
                }
                this.m_RegisterExplodePart(jaw, new THREE.Vector3(0, -0.8, 0.6), 1.4);

                // 4. 中央琥珀色巨大独眼与黄铜环眼眶 (Central Amber Cyclops Eye & Brass Rings)
                const eyeAssembly = new THREE.Group();

                const outerSocketRing = new THREE.Mesh(
                    new THREE.TorusGeometry(0.24, 0.048, 14, 28),

                // 内层可旋转机械快门齿环
                const innerIrisGear = this.m_CreateGearMesh(0.22, 0.17, 0.05, 14, mat.copper);

                eyeAssembly.add(this.m_RegisterGear(innerIrisGear, 'z', -0.8));

                // 琥珀色玻璃独眼眼球节点（支持独立微动 Saccades）
                const eyePivot = new THREE.Group();
                eyePivot.name = 'EyeBall';

            /**
             * 构建单侧手臂：锈蚀金属肩甲、粗壮岩石肌肉、肘部齿轮与液压活塞、裂纹皮革护腕、分段式五指巨掌
             */
            m_BuildArm(chest, sideName, sign) {
                const mat = this.m_Materials;
                const prefix = sideName.toLowerCase();

                // 肩关节 (Shoulder)
                const shoulder = new THREE.Group();
                shoulder.name = `${sideName}Shoulder`;
                shoulder.position.set(sign * 1.32, 1.02, 0.0);
                chest.add(shoulder);
                this.publicJoints[`${prefix}Shoulder`] = shoulder;

                // 肩部外露齿轮与三角肌
                const deltoid = new THREE.Mesh(
                    new THREE.DodecahedronGeometry(0.46, 2),
                    mat.rockSkin
                );
                deltoid.scale.set(1.05, 1.1, 1.0);
                deltoid.castShadow = true;
                shoulder.add(deltoid);

                const shoulderGear = this.m_CreateGearMesh(0.28, 0.08, 0.09, 12, mat.brass);
                shoulderGear.rotation.y = Math.PI * 0.5;
                shoulderGear.position.set(sign * 0.36, 0, 0);
                shoulder.add(this.m_RegisterGear(shoulderGear, 'z', sign * 1.2));

                // 锈蚀金属肩甲 (Rusted Metal Pauldron)
                const pauldronGroup = new THREE.Group();
                pauldronGroup.position.set(sign * 0.18, 0.22, 0);
                shoulder.add(pauldronGroup);

                for (let layer = 0; layer < 2; layer++) {
                    const plate = new THREE.Mesh(
                        new THREE.SphereGeometry(0.56 - layer * 0.06, 18, 14, 0, Math.PI * 1.15, 0, Math.PI * 0.58),
                        mat.rustedIron
                    );
                    plate.rotation.z = sign * (-0.35 - layer * 0.22);
                    plate.rotation.y = sign > 0 ? -0.4 : 2.1;
                    plate.castShadow = true;
                    pauldronGroup.add(plate);
                }

                // 肩甲黄铜包边与铆钉撞角
                const spike = new THREE.Mesh(
                    new THREE.ConeGeometry(0.09, 0.32, 8),
                    mat.brass
                );
                spike.position.set(sign * 0.32, 0.42, 0);
                spike.rotation.z = sign * -0.55;
                pauldronGroup.add(spike);
                this.m_RegisterExplodePart(pauldronGroup, new THREE.Vector3(sign, 0.85, 0), 1.9);

                // 上臂与肱二头肌束 (Upper Arm)
                const upperArm = new THREE.Group();
                upperArm.position.set(sign * 0.14, -0.52, 0);
                shoulder.add(upperArm);

                const bicep = new THREE.Mesh(
                    new THREE.CapsuleGeometry(0.33, 0.52, 10, 16),
                    mat.rockSkin
                );
                bicep.castShadow = true;
                upperArm.add(bicep);

                // 肘关节 (Elbow)
                const elbow = new THREE.Group();
                elbow.name = `${sideName}Elbow`;
                elbow.position.set(0, -0.48, 0);
                upperArm.add(elbow);
                this.publicJoints[`${prefix}Elbow`] = elbow;

                // 肘部外露齿轮与铰链轴
                const elbowAxle = new THREE.Mesh(
                    new THREE.CylinderGeometry(0.22, 0.22, 0.68, 14),
                    mat.bluedSteel
                );
                elbowAxle.rotation.z = Math.PI * 0.5;
                elbow.add(elbowAxle);

                const elbowGear = this.m_CreateGearMesh(0.24, 0.08, 0.07, 11, mat.brass);
                elbowGear.rotation.y = Math.PI * 0.5;
                elbowGear.position.set(sign * 0.36, 0, 0);
                elbow.add(this.m_RegisterGear(elbowGear, 'z', sign * -1.6));

                // 前臂巨型肌肉与裂纹皮革护腕 (Forearm & Leather Bracer)
                const forearmGroup = new THREE.Group();
                forearmGroup.position.set(0, -0.52, 0);
                elbow.add(forearmGroup);

                const forearmMuscle = new THREE.Mesh(
                    new THREE.CylinderGeometry(0.36, 0.28, 0.85, 16),
                    mat.rockSkin
                );
                forearmMuscle.castShadow = true;
                forearmGroup.add(forearmMuscle);

                const bracerGroup = new THREE.Group();
                forearmGroup.add(bracerGroup);
                const bracerLeather = new THREE.Mesh(
                    new THREE.CylinderGeometry(0.39, 0.31, 0.62, 18),
                    mat.leather
                );
                bracerLeather.position.y = -0.06;
                bracerLeather.castShadow = true;
                bracerGroup.add(bracerLeather);

                // 护腕黄铜箍与铜管
                [-0.26, 0.14].forEach((yRing) => {
                    const cuffRing = new THREE.Mesh(
                        new THREE.TorusGeometry(0.35, 0.035, 10, 20),
                        mat.brass
                    );
                    cuffRing.rotation.x = Math.PI * 0.5;
                    cuffRing.position.y = yRing;
                    bracerGroup.add(cuffRing);
                });
                this.m_RegisterExplodePart(bracerGroup, new THREE.Vector3(sign, -0.2, 0.6), 1.5);

                // 上臂至前臂的动态联动液压活塞
                this.m_CreateHydraulicPiston(
                    upperArm,
                    new THREE.Vector3(sign * 0.22, 0.15, -0.26),
                    elbow,
                    new THREE.Vector3(sign * 0.22, -0.45, -0.24),
                    0.055
                );

                // 腕关节与分段式五指巨掌 (Wrist & Segmented Five-Fingered Giant Hand)
                const hand = new THREE.Group();
                hand.name = `${sideName}Hand`;
                hand.position.set(0, -0.52, 0);
                forearmGroup.add(hand);
                this.publicJoints[`${prefix}Hand`] = hand;

                // 巨掌掌心岩石与黄铜背甲
                const palm = new THREE.Mesh(
                    new THREE.BoxGeometry(0.34, 0.36, 0.44),
                    mat.rockSkin
                );
                palm.position.set(0, -0.18, 0);
                palm.castShadow = true;
                hand.add(palm);

                const handPlate = new THREE.Mesh(
                    new THREE.BoxGeometry(0.20, 0.32, 0.40),
                    mat.rustedIron
                );
                handPlate.position.set(sign * 0.12, -0.18, 0);
                hand.add(handPlate);

                // 五指分段构建（拇指 + 食指/中指/无名指/小指，每指2节独立旋转骨骼）
                const fingerroots = [];
                const fingerZOffsets = [0.16, 0.05, -0.06, -0.16];
                fingerZOffsets.forEach((zOff, idx) => {
                    const fRoot = new THREE.Group();
                    fRoot.position.set(0, -0.36, zOff);
                    hand.add(fRoot);

                    const seg1 = new THREE.Mesh(
                        new THREE.CapsuleGeometry(0.055, 0.14, 6, 10),
                        mat.rockSkin
                    );
                    seg1.position.y = -0.09;
                    seg1.castShadow = true;
                    fRoot.add(seg1);

                    const knuckle = new THREE.Mesh(
                        new THREE.SphereGeometry(0.062, 8, 8),
                        mat.brass
                    );
                    fRoot.add(knuckle);

                    const fDistal = new THREE.Group();
                    fDistal.position.set(0, -0.18, 0);
                    fRoot.add(fDistal);

                    const seg2 = new THREE.Mesh(
                        new THREE.CapsuleGeometry(0.048, 0.12, 6, 10),
                        mat.brass
                    );
                    seg2.position.y = -0.08;
                    seg2.castShadow = true;
                    fDistal.add(seg2);

                    fingerroots.push({ root: fRoot, distal: fDistal, isThumb: false, index: idx });
                });

                // 拇指 (Thumb)
                const thumbRoot = new THREE.Group();
                thumbRoot.position.set(sign * -0.12, -0.22, 0.22);
                thumbRoot.rotation.x = 0.45;
                hand.add(thumbRoot);

                const tSeg1 = new THREE.Mesh(
                    new THREE.CapsuleGeometry(0.062, 0.13, 6, 10),
                    mat.rockSkin
                );
                tSeg1.position.y = -0.08;
                thumbRoot.add(tSeg1);

                const thumbDistal = new THREE.Group();
                thumbDistal.position.set(0, -0.16, 0);
                thumbRoot.add(thumbDistal);

                const tSeg2 = new THREE.Mesh(
                    new THREE.CapsuleGeometry(0.055, 0.11, 6, 10),
                    mat.brass
                );
                tSeg2.position.y = -0.07;
                thumbDistal.add(tSeg2);

                fingerroots.push({ root: thumbRoot, distal: thumbDistal, isThumb: true, index: 4 });
                this.publicJoints[`${prefix}Fingers`] = fingerroots;
            }

            /**
             * 构建右手持握的巨型蒸汽战锤（带发光核心、排气管与机械齿轮）
             */
            m_BuildGiantSteamHammer(rightHand) {
                const mat = this.m_Materials;

                const hammerGroup = new THREE.Group();
                hammerGroup.name = 'SteamHammer';
                // 嵌入右手掌心并朝向正前方 (+Z)
                hammerGroup.position.set(-0.06, -0.24, 0.02);
                rightHand.add(hammerGroup);
                this.publicJoints.hammer = hammerGroup;

                // 长柄主轴（沿 Z 轴延伸）
                const shaftLength = 3.35;
                const shaftMesh = new THREE.Mesh(
                    new THREE.CylinderGeometry(0.085, 0.095, shaftLength, 16),
                    mat.bluedSteel
                );
                shaftMesh.rotation.x = Math.PI * 0.5;
                shaftMesh.position.z = 0.65;
                shaftMesh.castShadow = true;
                hammerGroup.add(shaftMesh);

                // 皮革防滑握把缠绕
                const gripMesh = new THREE.Mesh(
                    new THREE.CylinderGeometry(0.105, 0.105, 1.35, 16),
                    mat.leather
                );
                gripMesh.rotation.x = Math.PI * 0.5;
                gripMesh.position.z = 0.15;
                hammerGroup.add(gripMesh);

                // 柄尾黄铜配重球
                const pommel = new THREE.Mesh(
                    new THREE.DodecahedronGeometry(0.18, 1),
                    mat.brass
                );
                pommel.position.z = -1.05;
                hammerGroup.add(pommel);

                // 锤头总成 (Hammerhead Assembly)
                const headGroup = new THREE.Group();
                headGroup.position.set(0, 0, 2.15);
                hammerGroup.add(headGroup);

                // 锤头中央锈蚀铁甲炉体
                const headBody = new THREE.Mesh(
                    new THREE.BoxGeometry(0.68, 1.48, 0.78),
                    mat.rustedIron
                );
                headBody.castShadow = true;
                headBody.receiveShadow = true;
                headGroup.add(headBody);

                // 上下双巨型冲击锤面（黄铜法兰 + 棱台撞击面）
                for (let dir of [-1, 1]) {
                    const faceCollar = new THREE.Mesh(
                        new THREE.CylinderGeometry(0.42, 0.46, 0.24, 12),
                        mat.brass
                    );
                    faceCollar.position.y = dir * 0.82;
                    faceCollar.castShadow = true;
                    headGroup.add(faceCollar);

                    const strikeHead = new THREE.Mesh(
                        new THREE.CylinderGeometry(0.50, 0.42, 0.26, 8),
                        mat.bluedSteel
                    );
                    strikeHead.position.y = dir * 1.02;
                    strikeHead.castShadow = true;
                    headGroup.add(strikeHead);
                }

                // 锤头内部发光蒸汽核心 (Hammer Glowing Core)
                const hammerCoreMesh = new THREE.Mesh(
                    new THREE.CylinderGeometry(0.28, 0.28, 0.86, 16),
                    mat.hammerCore
                );
                headGroup.add(hammerCoreMesh);
                this.publicJoints.hammerCore = hammerCoreMesh;

                // 两侧外露齿轮与防护格栅窗
                for (let side of [-1, 1]) {
                    const windowFrame = new THREE.Mesh(
                        new THREE.TorusGeometry(0.25, 0.045, 10, 20),
                        mat.brass
                    );
                    windowFrame.rotation.y = Math.PI * 0.5;
                    windowFrame.position.x = side * 0.35;
                    headGroup.add(windowFrame);

                    const sideGear = this.m_CreateGearMesh(0.24, 0.08, 0.07, 12, mat.copper);
                    sideGear.rotation.y = Math.PI * 0.5;
                    sideGear.position.set(side * 0.36, 0.42, 0.25);
                    headGroup.add(this.m_RegisterGear(sideGear, 'z', side * 2.0));

                    // 锤头蒸汽泄压短管
                    const ventPipe = new THREE.Mesh(
                        new THREE.CylinderGeometry(0.06, 0.08, 0.38, 10),
                        mat.copper
                    );
                    ventPipe.position.set(side * 0.32, -0.35, -0.38);
                    ventPipe.rotation.x = -0.5;
                    ventPipe.rotation.z = side * -0.4;
                    headGroup.add(ventPipe);
                }

                this.m_RegisterExplodePart(headGroup, new THREE.Vector3(0, 0.4, 1), 2.2);
            }

            /**
             * 构建柱状双腿：髋/膝齿轮与液压活塞、岩石大腿、重型装甲战靴
             */
            m_BuildLeg(pelvis, sideName, sign) {
                const mat = this.m_Materials;
                const prefix = sideName.toLowerCase();

                // 髋关节 (Hip)
                const hip = new THREE.Group();
                hip.name = `${sideName}Hip`;
                hip.position.set(sign * 0.54, -0.14, 0);
                pelvis.add(hip);
                this.publicJoints[`${prefix}Hip`] = hip;

                // 髋部外露大齿轮
                const hipGear = this.m_CreateGearMesh(0.25, 0.08, 0.08, 12, mat.brass);

                // 大腿岩石肌肉与外侧铁甲护板 (Thigh)

                thighArmor.rotation.y = sign * Math.PI * 0.5;
                thighArmor.position.y = -0.44;
                thighArmor.castShadow = true;
                hip.add(thighArmor);
                this.m_RegisterExplodePart(thighArmor, new THREE.Vector3(sign, 0, 0.5), 1.5);

                const kneeGear = this.m_CreateGearMesh(0.22, 0.06, 0.07, 10, mat.copper);

                // 柱状小腿 (Columnar Shin / Lower Leg)
                const shinGroup = new THREE.Group();
                shinGroup.position.set(0, -0.52, 0);

                const shinPillar = new THREE.Mesh(

                // 大腿后侧至小腿后侧的动态液压活塞
                this.m_CreateHydraulicPiston(

                // 踝关节与重型蒸汽战靴 (Ankle & Foot)
                const ankle = new THREE.Group();

                const bootBase = new THREE.Mesh(
