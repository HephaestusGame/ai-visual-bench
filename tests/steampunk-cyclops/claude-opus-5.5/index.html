<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { EffectComposer } from 'three/addons/postprocessing/EffectComposer.js';
import { RenderPass } from 'three/addons/postprocessing/RenderPass.js';
import { UnrealBloomPass } from 'three/addons/postprocessing/UnrealBloomPass.js';
import { OutputPass } from 'three/addons/postprocessing/OutputPass.js';
import { mergeGeometries } from 'three/addons/utils/BufferGeometryUtils.js';
import GUI from 'three/addons/libs/lil-gui.module.min.js';

//#region ==================== 数学与噪声工具 ====================

const k_TwoPi = Math.PI * 2;
const k_HalfPi = Math.PI * 0.5;
let s_MaxAnisotropy = 8;

function Clamp(value, minValue, maxValue)
{
    return value < minValue ? minValue : (value > maxValue ? maxValue : value);
}

function Lerp(a, b, t)
{
    return a + (b - a) * t;
}

function SmoothStep(edge0, edge1, x)
{
    const t = Clamp((x - edge0) / (edge1 - edge0), 0, 1);
    return t * t * (3 - 2 * t);
}

// 与帧率无关的指数阻尼插值
function Damp(current, target, lambda, deltaTime)
{
    return Lerp(current, target, 1 - Math.exp(-lambda * deltaTime));
}

// Mulberry32 可复现随机数生成器
function CreateRandom(seed)
{
    let state = seed >>> 0;
    return function ()
    {
        state = (state + 0x6D2B79F5) >>> 0;
        let t = state;
        t = Math.imul(t ^ (t >>> 15), t | 1);
        t ^= t + Math.imul(t ^ (t >>> 7), t | 61);
        return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
    };
}

function Hash2(x, y, seed)
{
    let h = (Math.imul(x, 374761393) + Math.imul(y, 668265263) + Math.imul(seed, 1442695041)) | 0;
    h = Math.imul(h ^ (h >>> 13), 1274126177);
    h ^= h >>> 16;
    return (h >>> 0) / 4294967296;
}

function Hash3(x, y, z, seed)
{
    let h = (Math.imul(x, 374761393) + Math.imul(y, 668265263) + Math.imul(z, 2246822519) + Math.imul(seed, 3266489917)) | 0;
    h = Math.imul(h ^ (h >>> 13), 1274126177);
    h ^= h >>> 16;
    return (h >>> 0) / 4294967296;
}

// 可平铺二维值噪声 (periodX / periodY 为整数周期)
function ValueNoise2(x, y, periodX, periodY, seed)
{
    const ix = Math.floor(x);
    const iy = Math.floor(y);
    const fx = x - ix;
    const fy = y - iy;
    const ux = fx * fx * (3 - 2 * fx);
    const uy = fy * fy * (3 - 2 * fy);
    const x0 = ((ix % periodX) + periodX) % periodX;
    const y0 = ((iy % periodY) + periodY) % periodY;
    const x1 = (x0 + 1) % periodX;
    const y1 = (y0 + 1) % periodY;
    const a = Hash2(x0, y0, seed);
    const b = Hash2(x1, y0, seed);
    const c = Hash2(x0, y1, seed);
    const d = Hash2(x1, y1, seed);
    return a + (b - a) * ux + (c - a) * uy + (a - b - c + d) * ux * uy;
}

// 可平铺分形噪声, u / v ∈ [0, 1]
function Fbm2(u, v, cellsX, cellsY, octaves, seed)
{
    let sum = 0;
    let amplitude = 0.5;
    let norm = 0;
    let fx = cellsX;
    let fy = cellsY;
    for (let i = 0; i < octaves; i++)
    {
        sum += amplitude * ValueNoise2(u * fx, v * fy, fx, fy, seed + i * 31);
        norm += amplitude;
        amplitude *= 0.5;
        fx *= 2;
        fy *= 2;
    }
    return sum / norm;
}

// 可平铺 Voronoi 细胞噪声 (返回共享对象, 调用方需立即取值)
const s_VoronoiResult = { f1: 0, f2: 0, id: 0 };
function Voronoi2(u, v, cells, seed)
{
    const x = u * cells;
    const y = v * cells;
    const ix = Math.floor(x);
    const iy = Math.floor(y);
    let f1 = 9;
    let f2 = 9;
    let id = 0;
    for (let j = -1; j <= 1; j++)
    {
        for (let i = -1; i <= 1; i++)
        {
            const cx = ix + i;
            const cy = iy + j;
            const wx = ((cx % cells) + cells) % cells;
            const wy = ((cy % cells) + cells) % cells;
            const px = cx + 0.12 + 0.76 * Hash2(wx, wy, seed);
            const py = cy + 0.12 + 0.76 * Hash2(wx, wy, seed + 57);
            const dx = px - x;
            const dy = py - y;
            const distance = Math.sqrt(dx * dx + dy * dy);
            if (distance < f1)
            {
                f2 = f1;
                f1 = distance;
                id = Hash2(wx, wy, seed + 113);
            }
            else if (distance < f2)
            {
                f2 = distance;
            }
        }
    }
    s_VoronoiResult.f1 = f1;
    s_VoronoiResult.f2 = f2;
    s_VoronoiResult.id = id;
    return s_VoronoiResult;
}

function ValueNoise3(x, y, z, seed)
{
    const ix = Math.floor(x);
    const iy = Math.floor(y);
    const iz = Math.floor(z);
    const fx = x - ix;
    const fy = y - iy;
    const fz = z - iz;
    const ux = fx * fx * (3 - 2 * fx);
    const uy = fy * fy * (3 - 2 * fy);
    const uz = fz * fz * (3 - 2 * fz);
    const x00 = Lerp(Hash3(ix, iy, iz, seed), Hash3(ix + 1, iy, iz, seed), ux);
    const x10 = Lerp(Hash3(ix, iy + 1, iz, seed), Hash3(ix + 1, iy + 1, iz, seed), ux);
    const x01 = Lerp(Hash3(ix, iy, iz + 1, seed), Hash3(ix + 1, iy, iz + 1, seed), ux);
    const x11 = Lerp(Hash3(ix, iy + 1, iz + 1, seed), Hash3(ix + 1, iy + 1, iz + 1, seed), ux);
    return Lerp(Lerp(x00, x10, uy), Lerp(x01, x11, uy), uz);
}

function Fbm3(x, y, z, octaves, seed)
{
    let sum = 0;
    let amplitude = 0.5;
    let norm = 0;
    let frequency = 1;
    for (let i = 0; i < octaves; i++)
    {
        sum += amplitude * ValueNoise3(x * frequency, y * frequency, z * frequency, seed + i * 19);
        norm += amplitude;
        amplitude *= 0.5;
        frequency *= 2.03;
    }
    return sum / norm;
}

//#endregion

//#region ==================== Canvas 程序化纹理工厂 ====================

function CreateCanvas(width, height = width)
{
    const canvas = document.createElement('canvas');
    canvas.width = width;
    canvas.height = height;
    return canvas;
}

function CanvasToTexture(canvas, isColor, repeatX = 1, repeatY = repeatX)
{
    const texture = new THREE.CanvasTexture(canvas);
    texture.wrapS = THREE.RepeatWrapping;
    texture.wrapT = THREE.RepeatWrapping;
    texture.repeat.set(repeatX, repeatY);
    texture.colorSpace = isColor ? THREE.SRGBColorSpace : THREE.NoColorSpace;
    texture.anisotropy = s_MaxAnisotropy;
    return texture;
}

// 逐像素生成 高度/颜色/粗糙度/金属度/自发光, 并导出 PBR 贴图组
class SurfaceBuilder
{
    constructor(size)
    {
        this.size = size;
        const count = size * size;
        this.m_HeightArray = new Float32Array(count);
        this.m_ColorArray = new Float32Array(count * 3);
        this.m_RoughArray = new Float32Array(count);
        this.m_MetalArray = new Float32Array(count);
        this.m_EmissiveArray = null;
    }

    Fill(pixelFunction)
    {
        const size = this.size;
        const pixel = { height: 0, r: 0, g: 0, b: 0, rough: 0.5, metal: 0, er: 0, eg: 0, eb: 0 };
        for (let y = 0; y < size; y++)
        {
            const v = y / size;
            for (let x = 0; x < size; x++)
            {
                const u = x / size;
                pixel.height = 0;
                pixel.er = 0;
                pixel.eg = 0;
                pixel.eb = 0;
                pixelFunction(u, v, pixel);
                const index = y * size + x;
                this.m_HeightArray[index] = pixel.height;
                this.m_ColorArray[index * 3] = pixel.r;
                this.m_ColorArray[index * 3 + 1] = pixel.g;
                this.m_ColorArray[index * 3 + 2] = pixel.b;
                this.m_RoughArray[index] = pixel.rough;
                this.m_MetalArray[index] = pixel.metal;
                if (pixel.er + pixel.eg + pixel.eb > 0)
                {
                    if (!this.m_EmissiveArray)
                    {
                        this.m_EmissiveArray = new Float32Array(size * size * 3);
                    }
                    this.m_EmissiveArray[index * 3] = pixel.er;
                    this.m_EmissiveArray[index * 3 + 1] = pixel.eg;
                    this.m_EmissiveArray[index * 3 + 2] = pixel.eb;
                }
            }
        }
        return this;
    }

    // 由高度场经 Sobel 差分生成法线贴图, 粗糙度写入 G 通道, 金属度写入 B 通道 (three.js 约定)
    Build(normalStrength)
    {
        const size = this.size;
        const colorCanvas = CreateCanvas(size);
        const normalCanvas = CreateCanvas(size);
        const ormCanvas = CreateCanvas(size);
        const colorImage = colorCanvas.getContext('2d').createImageData(size, size);
        const normalImage = normalCanvas.getContext('2d').createImageData(size, size);
        const ormImage = ormCanvas.getContext('2d').createImageData(size, size);
        let emissiveCanvas = null;
        let emissiveImage = null;
        if (this.m_EmissiveArray)
        {
            emissiveCanvas = CreateCanvas(size);
            emissiveImage = emissiveCanvas.getContext('2d').createImageData(size, size);
        }
        const heightArray = this.m_HeightArray;
        for (let y = 0; y < size; y++)
        {
            const yUp = ((y - 1 + size) % size) * size;
            const yDown = ((y + 1) % size) * size;
            for (let x = 0; x < size; x++)
            {
                const index = y * size + x;
                const o = index * 4;
                const xLeft = (x - 1 + size) % size;
                const xRight = (x + 1) % size;
                colorImage.data[o] = Clamp(this.m_ColorArray[index * 3], 0, 1) * 255;
                colorImage.data[o + 1] = Clamp(this.m_ColorArray[index * 3 + 1], 0, 1) * 255;
                colorImage.data[o + 2] = Clamp(this.m_ColorArray[index * 3 + 2], 0, 1) * 255;
                colorImage.data[o + 3] = 255;
                const dx = (heightArray[y * size + xRight] - heightArray[y * size + xLeft]) * normalStrength;
                const dy = (heightArray[yDown + x] - heightArray[yUp + x]) * normalStrength;
                const nx = -dx;
                const ny = dy;
                const inverseLength = 1 / Math.sqrt(nx * nx + ny * ny + 1);
                normalImage.data[o] = (nx * inverseLength * 0.5 + 0.5) * 255;
                normalImage.data[o + 1] = (ny * inverseLength * 0.5 + 0.5) * 255;
                normalImage.data[o + 2] = (inverseLength * 0.5 + 0.5) * 255;
                normalImage.data[o + 3] = 255;
                ormImage.data[o] = 255;
                ormImage.data[o + 1] = Clamp(this.m_RoughArray[index], 0, 1) * 255;
                ormImage.data[o + 2] = Clamp(this.m_MetalArray[index], 0, 1) * 255;
                ormImage.data[o + 3] = 255;
                if (emissiveImage)
                {
                    emissiveImage.data[o] = Clamp(this.m_EmissiveArray[index * 3], 0, 1) * 255;
                    emissiveImage.data[o + 1] = Clamp(this.m_EmissiveArray[index * 3 + 1], 0, 1) * 255;
                    emissiveImage.data[o + 2] = Clamp(this.m_EmissiveArray[index * 3 + 2], 0, 1) * 255;
                    emissiveImage.data[o + 3] = 255;
                }
            }
        }
        colorCanvas.getContext('2d').putImageData(colorImage, 0, 0);
        normalCanvas.getContext('2d').putImageData(normalImage, 0, 0);
        ormCanvas.getContext('2d').putImageData(ormImage, 0, 0);
        const result =
        {
            map: CanvasToTexture(colorCanvas, true),
            normalMap: CanvasToTexture(normalCanvas, false),
            ormMap: CanvasToTexture(ormCanvas, false),
            emissiveMap: null
        };
        if (emissiveCanvas)
        {
            emissiveCanvas.getContext('2d').putImageData(emissiveImage, 0, 0);
            result.emissiveMap = CanvasToTexture(emissiveCanvas, true);
        }
        return result;
    }
}

// 黄铜: 拉丝纹理 + 氧化发暗 + 局部铜绿
function GenerateBrassSurface()
{
    return new SurfaceBuilder(512).Fill((u, v, p) =>
    {
        const large = Fbm2(u, v, 4, 4, 5, 11);
        const fine = Fbm2(u, v, 32, 32, 3, 23);
        const brush = ValueNoise2(u * 512, v * 8, 512, 8, 37) * 0.6 + ValueNoise2(u * 256, v * 3, 256, 3, 41) * 0.4;
        const tarnish = SmoothStep(0.48, 0.72, large + (fine - 0.5) * 0.35);
        const patina = SmoothStep(0.74, 0.86, Fbm2(u, v, 8, 8, 4, 53) + (fine - 0.5) * 0.2);
        const polish = SmoothStep(0.45, 0.25, large);
        const shade = 0.9 + brush * 0.16;
        let r = Lerp(0.9, 0.55, tarnish);
        let g = Lerp(0.7, 0.4, tarnish);
        let b = Lerp(0.38, 0.19, tarnish);
        r = Lerp(r, 0.3, patina);
        g = Lerp(g, 0.5, patina);
        b = Lerp(b, 0.41, patina);
        p.r = r * shade;
        p.g = g * shade;
        p.b = b * shade;
        p.rough = Clamp(0.22 + tarnish * 0.28 + patina * 0.45 - polish * 0.1 + (brush - 0.5) * 0.14, 0.06, 1);
        p.metal = 1 - patina * 0.85;
        p.height = fine * 0.35 + patina * 0.45 + brush * 0.08;
    }).Build(5);
}

// 氧化铜: 铜底 + 斑驳铜绿结壳
function GenerateCopperSurface()
{
    return new SurfaceBuilder(512).Fill((u, v, p) =>
    {
        const large = Fbm2(u, v, 5, 5, 5, 71);
        const fine = Fbm2(u, v, 24, 24, 3, 83);
        const verdigris = SmoothStep(0.52, 0.64, large + (fine - 0.5) * 0.3);
        const darken = SmoothStep(0.3, 0.62, Fbm2(u, v, 9, 9, 3, 89));
        const r = Lerp(0.86, 0.5, darken);
        const g = Lerp(0.5, 0.25, darken);
        const b = Lerp(0.33, 0.15, darken);
        p.r = Lerp(r, Lerp(0.27, 0.5, fine), verdigris);
        p.g = Lerp(g, Lerp(0.56, 0.78, fine), verdigris);
        p.b = Lerp(b, Lerp(0.47, 0.66, fine), verdigris);
        p.rough = Lerp(0.26 + darken * 0.25, 0.88, verdigris);
        p.metal = 1 - verdigris;
        p.height = verdigris * 0.6 + fine * 0.25;
    }).Build(6);
}

// 发蓝钢: 回火色 (蓝/紫/草黄) + 细拉丝 + 零星锈点
function GenerateBluedSteelSurface()
{
    return new SurfaceBuilder(512).Fill((u, v, p) =>
    {
        const heat = Fbm2(u, v, 3, 3, 4, 101);
        const fine = Fbm2(u, v, 32, 32, 3, 103);
        const brush = ValueNoise2(u * 6, v * 384, 6, 384, 107);
        const speck = SmoothStep(0.8, 0.9, Fbm2(u, v, 20, 20, 3, 109));
        const purple = SmoothStep(0.48, 0.7, heat);
        const straw = SmoothStep(0.74, 0.86, heat);
        let r = Lerp(0.12, 0.3, purple);
        let g = Lerp(0.16, 0.19, purple);
        let b = Lerp(0.3, 0.38, purple);
        r = Lerp(r, 0.55, straw);
        g = Lerp(g, 0.44, straw);
        b = Lerp(b, 0.26, straw);
        const shade = 0.85 + brush * 0.25;
        p.r = Lerp(r * shade, 0.38, speck);
        p.g = Lerp(g * shade, 0.2, speck);
        p.b = Lerp(b * shade, 0.1, speck);
        p.rough = Clamp(0.2 + brush * 0.12 + speck * 0.6 + fine * 0.06, 0, 1);
        p.metal = 1 - speck * 0.8;
        p.height = brush * 0.1 + speck * 0.4 + fine * 0.15;
    }).Build(5);
}

// 锈蚀铁: 竖向锈迹流痕 + 点蚀坑 + 剥落铁锈
function GenerateRustSurface()
{
    return new SurfaceBuilder(512).Fill((u, v, p) =>
    {
        const large = Fbm2(u, v, 4, 4, 6, 131);
        const streak = Fbm2(u, v, 20, 2, 4, 137);
        const fine = Fbm2(u, v, 40, 40, 3, 139);
        const cell = Voronoi2(u, v, 28, 149);
        const pit = (1 - SmoothStep(0.0, 0.14, cell.f1)) * SmoothStep(0.4, 0.7, large);
        const rust = SmoothStep(0.4, 0.62, large * 0.7 + streak * 0.4 + (fine - 0.5) * 0.25);
        const ironTone = 0.8 + fine * 0.3;
        const rustTone = Fbm2(u, v, 12, 12, 3, 151);
        const rr = Lerp(0.36, 0.68, rustTone);
        const rg = Lerp(0.15, 0.36, rustTone);
        const rb = Lerp(0.06, 0.15, rustTone);
        p.r = Lerp(0.3 * ironTone, rr, rust) * (1 - pit * 0.5);
        p.g = Lerp(0.3 * ironTone, rg, rust) * (1 - pit * 0.5);
        p.b = Lerp(0.31 * ironTone, rb, rust) * (1 - pit * 0.5);
        p.rough = Lerp(0.42, 0.93, rust);
        p.metal = Lerp(0.92, 0.08, rust);
        p.height = rust * 0.45 + fine * 0.3 - pit * 0.35;
    }).Build(7);
}

// 裂纹皮革: 细胞状龟裂 + 磨损褪色
function GenerateLeatherSurface()
{
    return new SurfaceBuilder(512).Fill((u, v, p) =>
    {
        const cell = Voronoi2(u, v, 18, 161);
        const edge = cell.f2 - cell.f1;
        const id = cell.id;
        const fine = Fbm2(u, v, 64, 64, 2, 163);
        const wearMask = Fbm2(u, v, 4, 4, 4, 167);
        const crack = (1 - SmoothStep(0.0, 0.07, edge)) * SmoothStep(0.42, 0.62, wearMask);
        const wear = SmoothStep(0.55, 0.8, wearMask);
        const tone = 0.85 + id * 0.3;
        p.r = Lerp(Lerp(0.3 * tone, 0.5, wear), 0.09, crack);
        p.g = Lerp(Lerp(0.16 * tone, 0.31, wear), 0.045, crack);
        p.b = Lerp(Lerp(0.08 * tone, 0.16, wear), 0.02, crack);
        p.rough = Clamp(0.6 + fine * 0.18 - wear * 0.18 + crack * 0.2, 0, 1);
        p.metal = 0;
        p.height = 0.4 + SmoothStep(0, 0.25, edge) * 0.25 + fine * 0.15 - crack * 0.5;
    }).Build(9);
}

// 岩石皮肤: 玄武岩板块 + 苔痕 + 裂缝中的熔火微光 (自发光)
function GenerateRockSurface()
{
    return new SurfaceBuilder(512).Fill((u, v, p) =>
    {
        // 域扭曲使板块轮廓不规则, 裂缝只在部分细胞边界出现
        const warpU = Fbm2(u, v, 4, 4, 3, 167) - 0.5;
        const warpV = Fbm2(u, v, 4, 4, 3, 169) - 0.5;
        const cell = Voronoi2(u + warpU * 0.12, v + warpV * 0.12, 5, 171);
        const edge = cell.f2 - cell.f1;
        const id = cell.id;
        const large = Fbm2(u, v, 6, 6, 6, 173);
        const fine = Fbm2(u, v, 48, 48, 3, 179);
        const strata = 0.5 + 0.5 * Math.sin((v + large * 0.35) * k_TwoPi * 6);
        const crackMask = SmoothStep(0.38, 0.55, Fbm2(u, v, 5, 5, 4, 177));
        const hairline = (1 - SmoothStep(0.0, 0.025, Math.abs(Fbm2(u, v, 8, 8, 4, 183) - 0.5))) * 0.6;
        const crack = Math.max((1 - SmoothStep(0.0, 0.045, edge)) * crackMask, hairline * crackMask);
        const plate = SmoothStep(0.02, 0.2, edge) * 0.5 + 0.5;
        const lichen = SmoothStep(0.62, 0.75, Fbm2(u, v, 10, 10, 4, 181)) * plate;
        const tone = 0.68 + large * 0.45 + (id - 0.5) * 0.12 + (strata - 0.5) * 0.08 + (fine - 0.5) * 0.15;
        let r = 0.4 * tone + (id - 0.5) * 0.03;
        let g = 0.36 * tone;
        let b = 0.32 * tone - (id - 0.5) * 0.03;
        r = Lerp(r, 0.38, lichen);
        g = Lerp(g, 0.41, lichen);
        b = Lerp(b, 0.29, lichen);
        p.r = Lerp(r, 0.05, crack);
        p.g = Lerp(g, 0.035, crack);
        p.b = Lerp(b, 0.03, crack);
        const lava = crack * SmoothStep(0.48, 0.66, Fbm2(u, v, 3, 3, 3, 191));
        p.er = lava;
        p.eg = lava * 0.36;
        p.eb = lava * 0.06;
        p.rough = 0.9 - fine * 0.12;
        p.metal = 0;
        p.height = plate * 0.3 + large * 0.45 + fine * 0.25 + strata * 0.05 - crack * 0.3;
    }).Build(8);
}

// 地面: 石板 + 灰缝 + 油渍
function GenerateGroundSurface()
{
    return new SurfaceBuilder(512).Fill((u, v, p) =>
    {
        const cell = Voronoi2(u, v, 6, 211);
        const edge = cell.f2 - cell.f1;
        const id = cell.id;
        const large = Fbm2(u, v, 4, 4, 5, 213);
        const fine = Fbm2(u, v, 64, 64, 3, 217);
        const grout = 1 - SmoothStep(0.02, 0.07, edge);
        const stain = SmoothStep(0.55, 0.72, Fbm2(u, v, 3, 3, 4, 223));
        const tone = 0.7 + id * 0.4 + (large - 0.5) * 0.4;
        const stainShade = 1 - stain * 0.45;
        p.r = Lerp(0.25 * tone * stainShade, 0.07, grout);
        p.g = Lerp(0.235 * tone * stainShade * (1 - stain * 0.05), 0.065, grout);
        p.b = Lerp(0.22 * tone * stainShade * (1 - stain * 0.12), 0.06, grout);
        p.rough = Lerp(0.85 - stain * 0.5, 0.96, grout);
        p.metal = 0;
        p.height = (1 - grout) * 0.6 * SmoothStep(0, 0.2, edge) + fine * 0.2 + large * 0.2;
    }).Build(6);
}

// 琥珀独眼虹膜: 球面极坐标展开, 顶部行 = 瞳孔中心
function GenerateIrisTexture()
{
    const width = 512;
    const height = 256;
    const canvas = CreateCanvas(width, height);
    const context = canvas.getContext('2d');
    const image = context.createImageData(width, height);
    const data = image.data;
    const pupilAngle = 0.17;
    const irisAngle = 0.62;
    const limbusAngle = 0.7;
    for (let y = 0; y < height; y++)
    {
        const theta = (y + 0.5) / height * Math.PI;
        const vv = theta / Math.PI;
        for (let x = 0; x < width; x++)
        {
            const u = x / width;
            let r;
            let g;
            let b;
            if (theta < pupilAngle)
            {
                const rim = SmoothStep(pupilAngle - 0.05, pupilAngle, theta);
                r = Lerp(0.02, 0.6, rim);
                g = Lerp(0.0, 0.12, rim);
                b = 0;
            }
            else if (theta < irisAngle)
            {
                const k = (theta - pupilAngle) / (irisAngle - pupilAngle);
                const fiber = Fbm2(u, vv, 96, 8, 3, 401);
                const ring = ValueNoise2(u * 6, vv * 160, 6, 160, 409);
                const streak = 0.5 + fiber * 0.7 + (ring - 0.5) * 0.25;
                let gear = 1;
                if (k > 0.78 && k < 0.9)
                {
                    gear = Math.sin(u * k_TwoPi * 48) > 0 ? 1.15 : 0.55;
                }
                r = Lerp(1.0, 0.75, k) * streak * gear;
                g = Lerp(0.86, 0.26, Math.pow(k, 0.8)) * streak * gear;
                b = Lerp(0.42, 0.02, Math.pow(k, 0.5)) * streak * gear;
            }
            else if (theta < limbusAngle)
            {
                r = 0.16;
                g = 0.05;
                b = 0.01;
            }
            else
            {
                const vein = 1 - SmoothStep(0.0, 0.06, Math.abs(Fbm2(u, vv, 24, 6, 4, 419) - 0.5));
                const glass = 0.55 + Fbm2(u, vv, 12, 4, 3, 421) * 0.45;
                r = Lerp(0.36 * glass, 0.62, vein * 0.5);
                g = Lerp(0.14 * glass, 0.16, vein * 0.5);
                b = 0.02;
            }
            const o = (y * width + x) * 4;
            data[o] = Clamp(r, 0, 1) * 255;
            data[o + 1] = Clamp(g, 0, 1) * 255;
            data[o + 2] = Clamp(b, 0, 1) * 255;
            data[o + 3] = 255;
        }
    }
    context.putImageData(image, 0, 0);
    const texture = CanvasToTexture(canvas, true);
    texture.wrapT = THREE.ClampToEdgeWrapping;
    return texture;
}

// 能量核心: 域扭曲脊状噪声, 灰度热力图 (由材质颜色染色)
function GenerateCoreTexture()
{
    const size = 256;
    const canvas = CreateCanvas(size);
    const context = canvas.getContext('2d');
    const image = context.createImageData(size, size);
    for (let y = 0; y < size; y++)
    {
        for (let x = 0; x < size; x++)
        {
            const u = x / size;
            const v = y / size;
            const warp = Fbm2(u, v, 4, 4, 4, 307);
            const n = Fbm2(u + warp * 0.6, v + warp * 0.4, 4, 4, 5, 311);
            const ridge = 1 - Math.abs(n - 0.5) * 2;
            const heat = Math.pow(ridge, 3.2) * 0.85 + Math.pow(warp, 2) * 0.35;
            const o = (y * size + x) * 4;
            const value = Clamp(heat, 0, 1) * 255;
            image.data[o] = value;
            image.data[o + 1] = value;
            image.data[o + 2] = value;
            image.data[o + 3] = 255;
        }
    }
    context.putImageData(image, 0, 0);
    return CanvasToTexture(canvas, true);
}

// 压力表盘: 做旧表面 + 刻度 + 红区 + 字样
function GenerateGaugeTexture()
{
    const size = 256;
    const canvas = CreateCanvas(size);
    const context = canvas.getContext('2d');
    const center = size / 2;
    const gradient = context.createRadialGradient(center, center, 10, center, center, center);
    gradient.addColorStop(0, '#f1e6c9');
    gradient.addColorStop(0.75, '#d9c69c');
    gradient.addColorStop(1, '#6e5a3a');
    context.fillStyle = gradient;
    context.fillRect(0, 0, size, size);
    const random = CreateRandom(77);
    for (let i = 0; i < 60; i++)
    {
        context.fillStyle = `rgba(90, 60, 30, ${0.03 + random() * 0.05})`;
        context.beginPath();
        context.arc(random() * size, random() * size, 4 + random() * 20, 0, k_TwoPi);
        context.fill();
    }
    const startAngle = Math.PI * 0.75;
    const endAngle = Math.PI * 2.25;
    context.strokeStyle = '#b3241b';
    context.lineWidth = 12;
    context.beginPath();
    context.arc(center, center, 94, startAngle + (endAngle - startAngle) * 0.78, endAngle);
    context.stroke();
    context.strokeStyle = '#1d140c';
    for (let i = 0; i <= 50; i++)
    {
        const angle = startAngle + (endAngle - startAngle) * i / 50;
        const isMajor = i % 5 === 0;
        const length = isMajor ? 18 : 9;
        context.lineWidth = isMajor ? 3 : 1.4;
        context.beginPath();
        context.moveTo(center + Math.cos(angle) * 102, center + Math.sin(angle) * 102);
        context.lineTo(center + Math.cos(angle) * (102 - length), center + Math.sin(angle) * (102 - length));
        context.stroke();
    }
    context.fillStyle = '#1d140c';
    context.font = 'bold 19px Georgia, serif';
    context.textAlign = 'center';
    context.textBaseline = 'middle';
    for (let i = 0; i <= 10; i += 2)
    {
        const angle = startAngle + (endAngle - startAngle) * i / 10;
        context.fillText(String(i), center + Math.cos(angle) * 68, center + Math.sin(angle) * 68);
    }
    context.font = 'bold 15px Georgia, serif';
    context.fillText('PSI ×100', center, center + 46);
    context.font = 'italic 11px Georgia, serif';
    context.fillText('AETHER WORKS', center, center - 40);
    context.strokeStyle = 'rgba(40, 25, 10, 0.8)';
    context.lineWidth = 6;
    context.beginPath();
    context.arc(center, center, 125, 0, k_TwoPi);
    context.stroke();
    const texture = new THREE.CanvasTexture(canvas);
    texture.colorSpace = THREE.SRGBColorSpace;
    texture.anisotropy = s_MaxAnisotropy;
    return texture;
}

// 施法符文法阵
function GenerateRuneTexture()
{
    const size = 1024;
    const canvas = CreateCanvas(size);
    const context = canvas.getContext('2d');
    const center = size / 2;
    const random = CreateRandom(9001);
    const DrawAll = () =>
    {
        context.strokeStyle = 'rgba(255, 255, 255, 0.95)';
        for (const [radius, width] of [[500, 6], [470, 3], [400, 4], [330, 2], [250, 5], [120, 3]])
        {
            context.lineWidth = width;
            context.beginPath();
            context.arc(center, center, radius, 0, k_TwoPi);
            context.stroke();
        }
        context.lineWidth = 2;
        for (let i = 0; i < 120; i++)
        {
            const angle = i / 120 * k_TwoPi;
            const inner = i % 5 === 0 ? 474 : 486;
            context.beginPath();
            context.moveTo(center + Math.cos(angle) * inner, center + Math.sin(angle) * inner);
            context.lineTo(center + Math.cos(angle) * 498, center + Math.sin(angle) * 498);
            context.stroke();
        }
        // 符文带
        context.lineWidth = 4;
        for (let i = 0; i < 24; i++)
        {
            const angle = i / 24 * k_TwoPi;
            context.save();
            context.translate(center + Math.cos(angle) * 435, center + Math.sin(angle) * 435);
            context.rotate(angle + k_HalfPi);
            const strokeCount = 3 + Math.floor(random() * 3);
            context.beginPath();
            for (let s = 0; s < strokeCount; s++)
            {
                const x0 = (random() - 0.5) * 36;
                const y0 = (random() - 0.5) * 40;
                if (random() > 0.6)
                {
                    context.moveTo(x0 + 8, y0);
                    context.arc(x0, y0, 8, 0, Math.PI * (1 + random()));
                }
                else
                {
                    context.moveTo(x0, y0);
                    context.lineTo(x0 + (random() - 0.5) * 34, y0 + (random() - 0.5) * 38);
                }
            }
            context.stroke();
            context.restore();
        }
        // 六芒星与内方阵
        context.lineWidth = 3;
        for (let t = 0; t < 2; t++)
        {
            context.beginPath();
            for (let i = 0; i <= 3; i++)
            {
                const angle = (i / 3 + t / 6) * k_TwoPi - k_HalfPi;
                const px = center + Math.cos(angle) * 330;
                const py = center + Math.sin(angle) * 330;
                if (i === 0)
                {
                    context.moveTo(px, py);
                }
                else
                {
                    context.lineTo(px, py);
                }
            }
            context.stroke();
        }
        context.beginPath();
        for (let i = 0; i <= 4; i++)
        {
            const angle = i / 4 * k_TwoPi + Math.PI / 4;
            const px = center + Math.cos(angle) * 250;
            const py = center + Math.sin(angle) * 250;
            if (i === 0)
            {
                context.moveTo(px, py);
            }
            else
            {
                context.lineTo(px, py);
            }
        }
        context.stroke();
        // 中心齿轮纹
        context.beginPath();
        for (let i = 0; i <= 48; i++)
        {
            const angle = i / 48 * k_TwoPi;
            const radius = i % 2 === 0 ? 120 : 138;
            context.lineTo(center + Math.cos(angle) * radius, center + Math.sin(angle) * radius);
        }
        context.stroke();
    };
    context.shadowColor = 'rgba(255, 255, 255, 1)';
    context.shadowBlur = 18;
    DrawAll();
    context.shadowBlur = 0;
    DrawAll();
    const texture = new THREE.CanvasTexture(canvas);
    texture.colorSpace = THREE.SRGBColorSpace;
    texture.anisotropy = s_MaxAnisotropy;
    return texture;
}

// 通用径向渐变贴图 (粒子 / 光晕)
function GenerateRadialTexture(size, stopList)
{
    const canvas = CreateCanvas(size);
    const context = canvas.getContext('2d');
    const gradient = context.createRadialGradient(size / 2, size / 2, 0, size / 2, size / 2, size / 2);
    for (const [offset, color] of stopList)
    {
        gradient.addColorStop(offset, color);
    }
    context.fillStyle = gradient;
    context.fillRect(0, 0, size, size);
    const texture = new THREE.CanvasTexture(canvas);
    texture.colorSpace = THREE.SRGBColorSpace;
    return texture;
}

// 蒸汽烟团: 径向衰减 × 分形噪声
function GenerateSmokeTexture()
{
    const size = 128;
    const canvas = CreateCanvas(size);
    const context = canvas.getContext('2d');
    const image = context.createImageData(size, size);
    for (let y = 0; y < size; y++)
    {
        for (let x = 0; x < size; x++)
        {
            const dx = (x + 0.5) / size - 0.5;
            const dy = (y + 0.5) / size - 0.5;
            const radius = Math.sqrt(dx * dx + dy * dy) * 2;
            const falloff = Math.pow(Clamp(1 - radius, 0, 1), 1.6);
            const noise = Fbm2(x / size, y / size, 4, 4, 4, 503);
            const alpha = Clamp(falloff * (0.45 + noise * 0.9), 0, 1);
            const o = (y * size + x) * 4;
            image.data[o] = 255;
            image.data[o + 1] = 255;
            image.data[o + 2] = 255;
            image.data[o + 3] = alpha * 255;
        }
    }
    context.putImageData(image, 0, 0);
    const texture = new THREE.CanvasTexture(canvas);
    texture.colorSpace = THREE.SRGBColorSpace;
    return texture;
}

// 眩晕星星
function GenerateStarTexture()
{
    const size = 64;
    const canvas = CreateCanvas(size);
    const context = canvas.getContext('2d');
    context.translate(size / 2, size / 2);
    context.shadowColor = '#ffffff';
    context.shadowBlur = 8;
    context.fillStyle = '#ffffff';
    context.beginPath();
    for (let i = 0; i < 10; i++)
    {
        const angle = i / 10 * k_TwoPi - k_HalfPi;
        const radius = i % 2 === 0 ? 26 : 9;
        context.lineTo(Math.cos(angle) * radius, Math.sin(angle) * radius);
    }
    context.closePath();
    context.fill();
    const texture = new THREE.CanvasTexture(canvas);
    texture.colorSpace = THREE.SRGBColorSpace;
    return texture;
}

// 地面薄雾
function GenerateMistTexture()
{
    const size = 256;
    const canvas = CreateCanvas(size);
    const context = canvas.getContext('2d');
    const image = context.createImageData(size, size);
    for (let y = 0; y < size; y++)
    {
        for (let x = 0; x < size; x++)
        {
            const n = Fbm2(x / size, y / size, 4, 4, 5, 251);
            const o = (y * size + x) * 4;
            image.data[o] = 255;
            image.data[o + 1] = 255;
            image.data[o + 2] = 255;
            image.data[o + 3] = SmoothStep(0.38, 0.82, n) * 255;
        }
    }
    context.putImageData(image, 0, 0);
    return CanvasToTexture(canvas, true);
}

function GenerateTextureLibrary()
{
    const startTime = performance.now();
    const library =
    {
        brass: GenerateBrassSurface(),
        copper: GenerateCopperSurface(),
        steel: GenerateBluedSteelSurface(),
        rust: GenerateRustSurface(),
        leather: GenerateLeatherSurface(),
        rock: GenerateRockSurface(),
        ground: GenerateGroundSurface(),
        iris: GenerateIrisTexture(),
        core: GenerateCoreTexture(),
        gauge: GenerateGaugeTexture(),
        rune: GenerateRuneTexture(),
        soft: GenerateRadialTexture(64, [[0, 'rgba(255,255,255,1)'], [0.35, 'rgba(255,255,255,0.45)'], [1, 'rgba(255,255,255,0)']]),
        spark: GenerateRadialTexture(32, [[0, 'rgba(255,255,255,1)'], [0.18, 'rgba(255,255,255,0.9)'], [0.45, 'rgba(255,255,255,0.2)'], [1, 'rgba(255,255,255,0)']]),
        ring: GenerateRadialTexture(256, [[0, 'rgba(255,255,255,0)'], [0.55, 'rgba(255,255,255,0.05)'], [0.86, 'rgba(255,255,255,0.75)'], [0.93, 'rgba(255,255,255,1)'], [1, 'rgba(255,255,255,0)']]),
        smoke: GenerateSmokeTexture(),
        star: GenerateStarTexture(),
        mist: GenerateMistTexture()
    };
    console.log(`[TextureFactory](GenerateTextureLibrary) 程序化纹理生成完成, 耗时 ${(performance.now() - startTime).toFixed(0)} ms`);
    return library;
}

//#region ==================== 材质库 ====================

function ApplySurface(params, surface, normalScale)
{
    params.map = surface.map;
    params.normalMap = surface.normalMap;
    params.normalScale = new THREE.Vector2(normalScale, normalScale);
    params.roughnessMap = surface.ormMap;
    params.metalnessMap = surface.ormMap;
    params.roughness = 1;
    params.metalness = 1;
    if (surface.emissiveMap)
    {
        params.emissiveMap = surface.emissiveMap;
    }
    return params;
}

// 克隆材质并修改纹理平铺次数 (克隆纹理共享同一 GPU 图像源)
function CloneWithRepeat(material, repeatX, repeatY = repeatX)
{
    const clone = material.clone();
    const textureMap = new Map();
    for (const key of ['map', 'normalMap', 'roughnessMap', 'metalnessMap', 'emissiveMap'])
    {
        const texture = material[key];
        if (!texture)
        {
            continue;
        }
        if (!textureMap.has(texture))
        {
            const textureClone = texture.clone();
            textureClone.repeat.set(repeatX, repeatY);
            textureMap.set(texture, textureClone);
        }
        clone[key] = textureMap.get(texture);
    }
    return clone;
}

function CreateMaterialLibrary(tex)
{
    const library = {};
    library.brass = new THREE.MeshPhysicalMaterial(ApplySurface({ color: 0xffffff, clearcoat: 0.25, clearcoatRoughness: 0.3, envMapIntensity: 1.15 }, tex.brass, 0.45));
    library.brassDark = new THREE.MeshStandardMaterial(ApplySurface({ color: 0xb59670, side: THREE.DoubleSide }, tex.brass, 0.6));
    library.copper = new THREE.MeshStandardMaterial(ApplySurface({ color: 0xffffff, envMapIntensity: 1.1 }, tex.copper, 0.7));
    library.steel = new THREE.MeshStandardMaterial(ApplySurface({ color: 0xffffff, envMapIntensity: 1.25 }, tex.steel, 0.35));
    library.rust = new THREE.MeshStandardMaterial(ApplySurface({ color: 0xffffff, side: THREE.DoubleSide }, tex.rust, 1.0));
    library.leather = new THREE.MeshStandardMaterial(ApplySurface({ color: 0xffffff, side: THREE.DoubleSide }, tex.leather, 0.9));
    library.leatherDark = new THREE.MeshStandardMaterial(ApplySurface({ color: 0x8a7468, side: THREE.DoubleSide }, tex.leather, 0.9));
    library.rock = CloneWithRepeat(new THREE.MeshStandardMaterial(ApplySurface({ color: 0xffffff, emissive: 0xffffff, emissiveIntensity: 1.2 }, tex.rock, 1.2)), 2, 2);
    library.rockFine = CloneWithRepeat(library.rock, 1, 1);
    library.chrome = new THREE.MeshStandardMaterial({ color: 0xdfe4ea, metalness: 1, roughness: 0.12, envMapIntensity: 1.4 });
    library.blackIron = new THREE.MeshStandardMaterial({ color: 0x1f1c1a, metalness: 0.75, roughness: 0.5 });
    library.eye = new THREE.MeshStandardMaterial({ map: tex.iris, emissiveMap: tex.iris, emissive: 0xffffff, emissiveIntensity: 2.4, roughness: 0.3, metalness: 0 });
    library.glass = new THREE.MeshPhysicalMaterial({ color: 0xffc27a, metalness: 0, roughness: 0.03, transparent: true, opacity: 0.2, clearcoat: 1, clearcoatRoughness: 0.02, ior: 1.5, depthWrite: false, envMapIntensity: 1.8 });
    library.gaugeGlass = new THREE.MeshPhysicalMaterial({ color: 0xffffff, metalness: 0, roughness: 0.02, transparent: true, opacity: 0.12, clearcoat: 1, depthWrite: false, envMapIntensity: 2.0 });
    library.gaugeFace = new THREE.MeshStandardMaterial({ map: tex.gauge, roughness: 0.55, metalness: 0 });
    library.needle = new THREE.MeshStandardMaterial({ color: 0x9a1a10, metalness: 0.4, roughness: 0.35 });
    // 发光核心: 各自克隆纹理以便独立滚动
    const MakeCore = (r, g, b) =>
    {
        const texture = tex.core.clone();
        return new THREE.MeshBasicMaterial({ map: texture, color: new THREE.Color(r, g, b) });
    };
    library.coreChest = MakeCore(3.2, 1.25, 0.28);
    library.coreHammer = MakeCore(3.4, 1.4, 0.3);
    library.coreFire = MakeCore(2.6, 0.8, 0.15);
    library.coreMouth = MakeCore(1.6, 0.45, 0.08);
    library.coreOrb = MakeCore(0.6, 2.6, 3.4);
    library.coreBomb = MakeCore(3.0, 1.1, 0.2);
    library.glowAmber = new THREE.SpriteMaterial({ map: tex.soft, color: new THREE.Color(0.9, 0.4, 0.08), blending: THREE.AdditiveBlending, depthWrite: false, transparent: true });
    library.glowOrange = new THREE.SpriteMaterial({ map: tex.soft, color: new THREE.Color(1.5, 0.55, 0.12), blending: THREE.AdditiveBlending, depthWrite: false, transparent: true });
    library.glowCyan = new THREE.SpriteMaterial({ map: tex.soft, color: new THREE.Color(0.3, 1.4, 1.8), blending: THREE.AdditiveBlending, depthWrite: false, transparent: true });
    library.ground = CloneWithRepeat(new THREE.MeshStandardMaterial(ApplySurface({ color: 0xffffff }, tex.ground, 1.0)), 24, 24);
    library.dais = CloneWithRepeat(library.rust, 3, 3);
    library.dais.side = THREE.FrontSide;
    library.dais.metalness = 0.45;
    library.dais.color.setRGB(0.85, 0.8, 0.75);
    return library;
}

//#region ==================== 几何体工具 ====================

const s_GeometryCache = new Map();
const s_UpVector = new THREE.Vector3(0, 1, 0);
const s_TempVecA = new THREE.Vector3();
const s_TempVecB = new THREE.Vector3();
const s_TempVecC = new THREE.Vector3();
const s_TempQuat = new THREE.Quaternion();

function Cached(key, factory)
{
    let geometry = s_GeometryCache.get(key);
    if (!geometry)
    {
        geometry = factory();
        s_GeometryCache.set(key, geometry);
    }
    return geometry;
}

// 合并 UV 接缝处重复顶点的法线, 消除位移后的接缝明暗
function SmoothSeams(geometry)
{
    const position = geometry.attributes.position;
    const normal = geometry.attributes.normal;
    const sumMap = new Map();
    const keyList = new Array(position.count);
    for (let i = 0; i < position.count; i++)
    {
        const key = `${Math.round(position.getX(i) * 1e4)}_${Math.round(position.getY(i) * 1e4)}_${Math.round(position.getZ(i) * 1e4)}`;
        keyList[i] = key;
        let sum = sumMap.get(key);
        if (!sum)
        {
            sum = new THREE.Vector3();
            sumMap.set(key, sum);
        }
        sum.x += normal.getX(i);
        sum.y += normal.getY(i);
        sum.z += normal.getZ(i);
    }
    for (let i = 0; i < position.count; i++)
    {
        const sum = sumMap.get(keyList[i]);
        s_TempVecA.copy(sum).normalize();
        normal.setXYZ(i, s_TempVecA.x, s_TempVecA.y, s_TempVecA.z);
    }
    normal.needsUpdate = true;
}

// 岩石位移: 沿法线施加分形噪声 + 脊状噪声
function DisplaceRock(geometry, amplitude, frequency, seed)
{
    const position = geometry.attributes.position;
    const normal = geometry.attributes.normal;
    const point = new THREE.Vector3();
    const direction = new THREE.Vector3();
    for (let i = 0; i < position.count; i++)
    {
        point.fromBufferAttribute(position, i);
        direction.fromBufferAttribute(normal, i);
        const big = Fbm3(point.x * frequency + seed, point.y * frequency, point.z * frequency, 4, seed);
        const ridge = 1 - Math.abs(ValueNoise3(point.x * frequency * 2.3, point.y * frequency * 2.3 + seed, point.z * frequency * 2.3, seed + 5) * 2 - 1);
        const offset = (big - 0.5) * amplitude * 2 + (ridge - 0.5) * amplitude * 0.5;
        point.addScaledVector(direction, offset);
        position.setXYZ(i, point.x, point.y, point.z);
    }
    geometry.computeVertexNormals();
    SmoothSeams(geometry);
    return geometry;
}

function RockSphere(variant)
{
    return Cached(`rockSphere_${variant}`, () => DisplaceRock(new THREE.SphereGeometry(1, 40, 28), 0.07, 1.6, 17 + variant * 31));
}

function RockCapsule(radius, length, variant)
{
    return Cached(`rockCapsule_${radius}_${length}_${variant}`, () => DisplaceRock(new THREE.CapsuleGeometry(radius, length, 8, 22), radius * 0.09, 1.25 / radius, 41 + variant * 13));
}

function ScaleUv(geometry, scale)
{
    const uv = geometry.attributes.uv;
    for (let i = 0; i < uv.count; i++)
    {
        uv.setXY(i, uv.getX(i) * scale, uv.getY(i) * scale);
    }
    return geometry;
}

// 齿轮: 梯形齿 + 中心孔 + 可选辐条镂空
function GearGeometry(radius, teeth, thickness, spokes = 0)
{
    return Cached(`gear_${radius}_${teeth}_${thickness}_${spokes}`, () =>
    {
        const toothDepth = Math.min(radius * 0.16, 0.05);
        const rootRadius = radius - toothDepth;
        const step = k_TwoPi / teeth;
        const shape = new THREE.Shape();
        for (let i = 0; i < teeth; i++)
        {
            const angle = i * step;
            const pointList =
            [
                [rootRadius, angle],
                [radius, angle + step * 0.2],
                [radius, angle + step * 0.45],
                [rootRadius, angle + step * 0.65]
            ];
            for (let k = 0; k < pointList.length; k++)
            {
                const [r, a] = pointList[k];
                if (i === 0 && k === 0)
                {
                    shape.moveTo(Math.cos(a) * r, Math.sin(a) * r);
                }
                else
                {
                    shape.lineTo(Math.cos(a) * r, Math.sin(a) * r);
                }
            }
        }
        shape.closePath();
        const holeRadius = radius * 0.14;
        const hole = new THREE.Path();
        hole.absarc(0, 0, holeRadius, 0, k_TwoPi, true);
        shape.holes.push(hole);
        if (spokes > 0)
        {
            const innerRadius = radius * 0.3;
            const outerRadius = rootRadius - radius * 0.12;
            const gap = 0.32;
            for (let i = 0; i < spokes; i++)
            {
                const a0 = i / spokes * k_TwoPi + gap * 0.5;
                const a1 = (i + 1) / spokes * k_TwoPi - gap * 0.5;
                const path = new THREE.Path();
                path.absarc(0, 0, outerRadius, a0, a1, false);
                path.absarc(0, 0, innerRadius, a1, a0, true);
                path.closePath();
                shape.holes.push(path);
            }
        }
        const bevel = Math.min(thickness * 0.12, 0.008);
        const geometry = new THREE.ExtrudeGeometry(shape, { depth: thickness, bevelEnabled: true, bevelThickness: bevel, bevelSize: bevel, bevelSegments: 1, curveSegments: 8 });
        geometry.translate(0, 0, -thickness * 0.5);
        ScaleUv(geometry, 1.6);
        return geometry;
    });
}

// 铆钉合并网格
function RivetGeometry(pointList, normalList, rivetRadius)
{
    const base = new THREE.SphereGeometry(rivetRadius, 8, 4, 0, k_TwoPi, 0, k_HalfPi);
    const partList = [];
    const normal = new THREE.Vector3();
    for (let i = 0; i < pointList.length; i++)
    {
        const part = base.clone();
        normal.copy(normalList[i]).normalize();
        s_TempQuat.setFromUnitVectors(s_UpVector, normal);
        part.applyQuaternion(s_TempQuat);
        part.translate(pointList[i].x, pointList[i].y, pointList[i].z);
        partList.push(part);
    }
    const merged = mergeGeometries(partList);
    base.dispose();
    for (const part of partList)
    {
        part.dispose();
    }
    return merged;
}

function RivetRingOnCylinder(radius, y, count, rivetRadius, thetaStart = 0, thetaLength = k_TwoPi)
{
    return Cached(`rivetCyl_${radius}_${y}_${count}_${rivetRadius}_${thetaStart}_${thetaLength}`, () =>
    {
        const pointList = [];
        const normalList = [];
        const closed = Math.abs(thetaLength - k_TwoPi) < 1e-4;
        for (let i = 0; i < count; i++)
        {
            const t = closed ? i / count : (count === 1 ? 0.5 : i / (count - 1));
            const theta = thetaStart + thetaLength * t;
            normalList.push(new THREE.Vector3(Math.sin(theta), 0, Math.cos(theta)));
            pointList.push(new THREE.Vector3(Math.sin(theta) * radius, y, Math.cos(theta) * radius));
        }
        return RivetGeometry(pointList, normalList, rivetRadius);
    });
}

function RivetRingOnDisc(radius, count, rivetRadius)
{
    return Cached(`rivetDisc_${radius}_${count}_${rivetRadius}`, () =>
    {
        const pointList = [];
        const normalList = [];
        for (let i = 0; i < count; i++)
        {
            const angle = i / count * k_TwoPi;
            pointList.push(new THREE.Vector3(Math.cos(angle) * radius, Math.sin(angle) * radius, 0));
            normalList.push(new THREE.Vector3(0, 0, 1));
        }
        return RivetGeometry(pointList, normalList, rivetRadius);
    });
}

function RivetRingOnSphere(radius, theta, count, rivetRadius)
{
    return Cached(`rivetSphere_${radius}_${theta}_${count}_${rivetRadius}`, () =>
    {
        const pointList = [];
        const normalList = [];
        for (let i = 0; i < count; i++)
        {
            const phi = i / count * k_TwoPi;
            const normal = new THREE.Vector3(Math.sin(theta) * Math.cos(phi), Math.cos(theta), Math.sin(theta) * Math.sin(phi));
            normalList.push(normal);
            pointList.push(normal.clone().multiplyScalar(radius));
        }
        return RivetGeometry(pointList, normalList, rivetRadius);
    });
}

// 弯曲甲片 (圆柱片段, θ = 0 指向 +Z)
function CurvedPlateGeometry(radiusTop, radiusBottom, height, thetaStart, thetaLength)
{
    return Cached(`plate_${radiusTop}_${radiusBottom}_${height}_${thetaStart}_${thetaLength}`, () => new THREE.CylinderGeometry(radiusTop, radiusBottom, height, 20, 2, true, thetaStart, thetaLength));
}

// 与 CurvedPlateGeometry 对齐的弧形包边
function ArcTrimGeometry(radius, tube, thetaStart, thetaLength)
{
    return Cached(`arcTrim_${radius}_${tube}_${thetaStart}_${thetaLength}`, () =>
    {
        const geometry = new THREE.TorusGeometry(radius, tube, 6, 28, thetaLength);
        geometry.rotateX(-k_HalfPi);
        geometry.rotateY(thetaStart - k_HalfPi);
        return geometry;
    });
}

// 球冠甲片 (+Y 方向) 与其边缘包边
function CapGeometry(radius, thetaLength)
{
    return Cached(`cap_${radius}_${thetaLength}`, () => new THREE.SphereGeometry(radius, 36, 10, 0, k_TwoPi, 0, thetaLength));
}

function CapTrimGeometry(radius, thetaLength, tube)
{
    return Cached(`capTrim_${radius}_${thetaLength}_${tube}`, () =>
    {
        const geometry = new THREE.TorusGeometry(radius * Math.sin(thetaLength), tube, 6, 40);
        geometry.rotateX(k_HalfPi);
        geometry.translate(0, radius * Math.cos(thetaLength), 0);
        return geometry;
    });
}

function PipeGeometry(pointList, radius, radialSegments = 10)
{
    const curve = new THREE.CatmullRomCurve3(pointList.map((p) => new THREE.Vector3(p[0], p[1], p[2])), false, 'catmullrom', 0.5);
    const tubularSegments = Math.max(16, Math.round(curve.getLength() * 40));
    const geometry = new THREE.TubeGeometry(curve, tubularSegments, radius, radialSegments, false);
    geometry.userData.curve = curve;
    return geometry;
}

function AddMesh(parent, geometry, material, position, rotation, scale)
{
    const mesh = new THREE.Mesh(geometry, material);
    if (position)
    {
        mesh.position.set(position[0], position[1], position[2]);
    }
    if (rotation)
    {
        mesh.rotation.set(rotation[0], rotation[1], rotation[2]);
    }
    if (scale !== undefined)
    {
        if (typeof scale === 'number')
        {
            mesh.scale.setScalar(scale);
        }
        else
        {
            mesh.scale.set(scale[0], scale[1], scale[2]);
        }
    }
    mesh.castShadow = true;
    mesh.receiveShadow = true;
    parent.add(mesh);
    return mesh;
}

function AddGroup(parent, position, rotation)
{
    const group = new THREE.Group();
    if (position)
    {
        group.position.set(position[0], position[1], position[2]);
    }
    if (rotation)
    {
        group.rotation.set(rotation[0], rotation[1], rotation[2]);
    }
    parent.add(group);
    return group;
}

// 管道 + 两端黄铜法兰
function AddPipe(parent, pointList, radius, material, flangeMaterial)
{
    const geometry = PipeGeometry(pointList, radius);
    const mesh = AddMesh(parent, geometry, material);
    const curve = geometry.userData.curve;
    const flangeGeometry = Cached(`flange_${radius}`, () => new THREE.CylinderGeometry(radius * 1.55, radius * 1.55, radius * 1.1, 14));
    for (const t of [0, 1])
    {
        const point = curve.getPointAt(t);
        const tangent = curve.getTangentAt(t);
        const flange = AddMesh(parent, flangeGeometry, flangeMaterial, [point.x, point.y, point.z]);
        flange.quaternion.setFromUnitVectors(s_UpVector, tangent);
    }
    return mesh;
}

//#region ==================== 液压活塞 ====================

class HydraulicPiston
{
    constructor(boneA, pointA, boneB, pointB, radius, materials)
    {
        this.m_BoneA = boneA;
        this.m_BoneB = boneB;
        this.m_PointB = new THREE.Vector3().fromArray(pointB);
        this.group = AddGroup(boneA, pointA);
        const restLength = this.ComputeLocalTarget(s_TempVecA).sub(this.group.position).length();
        this.m_HousingLength = restLength * 0.58;
        this.m_RodLength = restLength * 0.62;
        const housingGeometry = new THREE.CylinderGeometry(radius, radius * 1.08, this.m_HousingLength, 14);
        housingGeometry.translate(0, this.m_HousingLength * 0.5, 0);
        AddMesh(this.group, housingGeometry, materials.brass);
        AddMesh(this.group, Cached(`pistonRing_${radius}`, () => new THREE.TorusGeometry(radius * 1.1, radius * 0.22, 6, 16)), materials.steel, [0, this.m_HousingLength, 0], [k_HalfPi, 0, 0]);
        AddMesh(this.group, Cached(`pistonEye_${radius}`, () => new THREE.SphereGeometry(radius * 1.25, 12, 8)), materials.steel);
        AddMesh(this.group, Cached(`pistonPort_${radius}`, () => new THREE.CylinderGeometry(radius * 0.35, radius * 0.35, radius * 1.6, 8)), materials.copper, [radius * 0.9, this.m_HousingLength * 0.3, 0], [0, 0, k_HalfPi]);
        const rodGeometry = new THREE.CylinderGeometry(radius * 0.48, radius * 0.48, this.m_RodLength, 10);
        rodGeometry.translate(0, -this.m_RodLength * 0.5, 0);
        this.m_Rod = AddMesh(this.group, rodGeometry, materials.chrome);
        AddMesh(this.m_Rod, Cached(`pistonEye_${radius}`, () => new THREE.SphereGeometry(radius * 1.25, 12, 8)), materials.steel);
        this.Update();
    }

    ComputeLocalTarget(out)
    {
        out.copy(this.m_PointB);
        this.m_BoneB.localToWorld(out);
        this.m_BoneA.worldToLocal(out);
        return out;
    }

    Update()
    {
        const direction = this.ComputeLocalTarget(s_TempVecA).sub(this.group.position);
        const length = direction.length();
        if (length < 1e-5)
        {
            return;
        }
        direction.divideScalar(length);
        this.group.quaternion.setFromUnitVectors(s_UpVector, direction);
        this.m_Rod.position.y = Math.min(length, this.m_HousingLength + this.m_RodLength * 0.97);
    }
}

//#region ==================== 蒸汽朋克独眼巨人: 骨骼与躯干 ====================

const k_CurlAngleList = [1.2, 1.45, 1.1];

class SteampunkCyclops
{
    constructor(materials)
    {
        this.m_Mat = materials;
        this.root = new THREE.Group();
        this.root.name = 'SteampunkCyclops';
        this.boneMap = {};
        this.fingerMap = { L: [], R: [] };
        this.thumbMap = { L: [], R: [] };
        this.gearList = [];
        this.gaugeList = [];
        this.pistonSpecList = [];
        this.pistonList = [];
        this.explodeList = [];
        this.anchors = {};
        this.lights = {};
        this.glowSpriteList = [];
        this.glow = 1;
        this.steam = 1;
        this.m_Random = CreateRandom(20261016);
        this.m_LidUpper = 0;
        this.m_LidLower = 0;
        this.m_BlinkTimer = 2.5;
        this.m_BlinkTime = -1;
        this.m_SaccadeTimer = 0.5;
        this.m_EyeTarget = new THREE.Vector2();
        this.m_EyeCurrent = new THREE.Vector2();

        this.BuildSkeleton();
        this.BuildPelvis();
        this.BuildTorso();
        this.BuildHead();
        this.BuildArm(1);
        this.BuildArm(-1);
        this.BuildLeg(1);
        this.BuildLeg(-1);
        this.BuildBackpack();
        this.BuildHammer();
        this.Finalize();
    }

    //#region 构建辅助

    AddAnchor(name, parent, position)
    {
        const anchor = new THREE.Object3D();
        anchor.position.set(position[0], position[1], position[2]);
        parent.add(anchor);
        this.anchors[name] = anchor;
        return anchor;
    }

    // 注册爆炸视图部件: distance 为满幅分离距离, center 为径向中心, direction 为自定义局部方向
    RegisterPart(object, distance, center, direction)
    {
        this.explodeList.push(
        {
            object: object,
            basePosition: object.position.clone(),
            distance: distance,
            center: center || this.torsoCenter,
            direction: direction ? new THREE.Vector3().fromArray(direction).normalize() : null,
            depth: 0
        });
        return object;
    }

    AddGear(parent, radius, teeth, thickness, position, rotation, speed, spokes = 0, material = null)
    {
        const m = this.m_Mat;
        const holder = AddGroup(parent, position, rotation);
        const gear = AddMesh(holder, GearGeometry(radius, teeth, thickness, spokes), material || m.brass);
        AddMesh(holder, Cached(`gearHub_${radius}_${thickness}`, () => new THREE.CylinderGeometry(radius * 0.2, radius * 0.2, thickness * 1.7, 16).rotateX(k_HalfPi)), m.steel);
        AddMesh(holder, Cached(`gearBolt_${radius}_${thickness}`, () => new THREE.CylinderGeometry(radius * 0.09, radius * 0.09, thickness * 2.2, 6).rotateX(k_HalfPi)), m.brass);
        this.gearList.push({ mesh: gear, speed: speed });
        return holder;
    }

    AddGauge(parent, radius, position, rotation)
    {
        const m = this.m_Mat;
        const group = AddGroup(parent, position, rotation);
        AddMesh(group, Cached(`gaugeBezel_${radius}`, () => new THREE.CylinderGeometry(radius * 1.14, radius * 1.22, radius * 0.5, 28).rotateX(k_HalfPi)), m.brass, [0, 0, -radius * 0.05]);
        AddMesh(group, Cached(`gaugeFace_${radius}`, () => new THREE.CircleGeometry(radius, 36)), m.gaugeFace, [0, 0, radius * 0.21]);
        const pivot = AddGroup(group, [0, 0, radius * 0.25]);
        const needleGeometry = Cached(`gaugeNeedle_${radius}`, () =>
        {
            const geometry = new THREE.BoxGeometry(radius * 0.86, radius * 0.07, radius * 0.03);
            geometry.translate(radius * 0.3, 0, 0);
            return geometry;
        });
        AddMesh(pivot, needleGeometry, m.needle);
        AddMesh(group, Cached(`gaugeCap_${radius}`, () => new THREE.SphereGeometry(radius * 0.09, 10, 8)), m.brass, [0, 0, radius * 0.27]);
        AddMesh(group, Cached(`gaugeGlass_${radius}`, () => new THREE.SphereGeometry(radius * 1.02, 24, 6, 0, k_TwoPi, 0, 0.55).rotateX(k_HalfPi)), m.gaugeGlass, [0, 0, -radius * 0.64]).castShadow = false;
        AddMesh(group, RivetRingOnDisc(radius * 1.17, 6, radius * 0.07), m.steel, [0, 0, radius * 0.2]);
        this.gaugeList.push({ needle: pivot, base: 0.25 + this.m_Random() * 0.4, phase: this.m_Random() * 10, speed: 0.6 + this.m_Random() * 0.8 });
        return group;
    }

    // 球冠甲片: 外层组位于甲片顶点, 方便以甲片自身为爆炸锚点
    AddCapPlate(parent, center, radius, thetaLength, rotation, rivetCount)
    {
        const m = this.m_Mat;
        const top = new THREE.Vector3(0, radius, 0).applyEuler(new THREE.Euler(rotation[0], rotation[1], rotation[2]));
        const group = AddGroup(parent, [center[0] + top.x, center[1] + top.y, center[2] + top.z], rotation);
        AddMesh(group, CapGeometry(radius, thetaLength), m.rust, [0, -radius, 0]);
        AddMesh(group, CapTrimGeometry(radius, thetaLength, radius * 0.045), m.brass, [0, -radius, 0]);
        if (rivetCount > 0)
        {
            AddMesh(group, RivetRingOnSphere(radius * 1.004, thetaLength - 0.09, rivetCount, radius * 0.035), m.brass, [0, -radius, 0]);
        }
        return group;
    }

    AddPiston(boneA, pointA, boneB, pointB, radius)
    {
        this.pistonSpecList.push({ boneA, pointA, boneB, pointB, radius });
    }

    AddGlowSprite(parent, material, position, scale)
    {
        const sprite = new THREE.Sprite(material);
        sprite.position.set(position[0], position[1], position[2]);
        sprite.scale.setScalar(scale);
        sprite.userData.baseScale = scale;
        sprite.renderOrder = 5;
        parent.add(sprite);
        this.glowSpriteList.push(sprite);
        return sprite;
    }

    //#endregion

    //#region 骨骼

    BuildSkeleton()
    {
        const AddBone = (name, parent, x, y, z) =>
        {
            const bone = new THREE.Bone();
            bone.name = name;
            bone.position.set(x, y, z);
            parent.add(bone);
            this.boneMap[name] = bone;
            return bone;
        };
        const rootBone = AddBone('root', this.root, 0, 0, 0);
        const pelvis = AddBone('pelvis', rootBone, 0, 2.05, 0);
        const spine = AddBone('spine', pelvis, 0, 0.35, 0);
        const chest = AddBone('chest', spine, 0, 0.55, 0);
        const neck = AddBone('neck', chest, 0, 1.0, 0.22);
        const head = AddBone('head', neck, 0, 0.28, 0.06);
        AddBone('jaw', head, 0, 0.12, 0.06);
        AddBone('backpack', chest, 0, 0.5, -0.86);
        const fingerZList = [0.17, 0.056, -0.058, -0.17];
        const fingerLengthList = [[0.2, 0.17, 0.14], [0.23, 0.19, 0.15], [0.21, 0.18, 0.14], [0.17, 0.14, 0.12]];
        for (const side of [1, -1])
        {
            const s = side > 0 ? 'L' : 'R';
            const shoulder = AddBone('shoulder' + s, chest, 1.0 * side, 0.62, -0.05);
            const upperArm = AddBone('upperArm' + s, shoulder, 0.28 * side, -0.08, 0);
            const foreArm = AddBone('foreArm' + s, upperArm, 0, -1.0, 0);
            const hand = AddBone('hand' + s, foreArm, 0, -0.95, 0);
            for (let f = 0; f < 4; f++)
            {
                const chain = [];
                let parentBone = hand;
                for (let k = 0; k < 3; k++)
                {
                    const bone = k === 0
                        ? AddBone(`finger${s}${f}_${k}`, parentBone, -0.02 * side, -0.48, fingerZList[f])
                        : AddBone(`finger${s}${f}_${k}`, parentBone, 0, -fingerLengthList[f][k - 1], 0);
                    bone.userData.length = fingerLengthList[f][k];
                    chain.push(bone);
                    parentBone = bone;
                }
                this.fingerMap[s].push(chain);
            }
            const thumbLengthList = [0.17, 0.15, 0.12];
            let thumbParent = hand;
            for (let k = 0; k < 3; k++)
            {
                const bone = k === 0
                    ? AddBone(`thumb${s}_${k}`, thumbParent, -0.1 * side, -0.16, 0.22)
                    : AddBone(`thumb${s}_${k}`, thumbParent, 0, -thumbLengthList[k - 1], 0);
                if (k === 0)
                {
                    bone.rotation.set(-0.6, 0, -0.3 * side);
                }
                bone.userData.length = thumbLengthList[k];
                this.thumbMap[s].push(bone);
                thumbParent = bone;
            }
            const thigh = AddBone('thigh' + s, pelvis, 0.5 * side, -0.05, 0);
            const shin = AddBone('shin' + s, thigh, 0, -0.95, 0);
            AddBone('foot' + s, shin, 0, -0.85, 0);
        }
        AddBone('grip', this.boneMap.handR, 0.1, -0.4, 0);
        this.torsoCenter = new THREE.Object3D();
        this.torsoCenter.position.set(0, 0.35, 0.1);
        chest.add(this.torsoCenter);
        for (const name in this.boneMap)
        {
            this.boneMap[name].userData.restRotation = this.boneMap[name].rotation.clone();
        }
    }

    BuildPelvis()
    {
        const m = this.m_Mat;
        const pelvis = this.boneMap.pelvis;
        AddMesh(pelvis, RockSphere(0), m.rock, [0, 0.02, -0.02], null, [0.84, 0.55, 0.62]);
        AddMesh(pelvis, RockSphere(1), m.rock, [0, -0.1, -0.3], [0.3, 0, 0], [0.62, 0.42, 0.4]);
        // 腰带
        const belt = AddGroup(pelvis, [0, 0.28, 0]);
        AddMesh(belt, Cached('belt', () => new THREE.CylinderGeometry(1, 1.02, 0.26, 64, 1, true)), m.leather, null, null, [0.9, 1, 0.68]);
        const beltTrim = Cached('beltTrim', () => new THREE.TorusGeometry(1, 0.018, 6, 72).rotateX(k_HalfPi));
        AddMesh(belt, beltTrim, m.brass, [0, 0.13, 0], null, [0.905, 1, 0.685]);
        AddMesh(belt, beltTrim, m.brass, [0, -0.13, 0], null, [0.915, 1, 0.695]);
        AddMesh(belt, RivetRingOnCylinder(1, 0, 34, 0.024), m.brass, null, null, [0.91, 1, 0.69]);
        this.RegisterPart(belt, 0.35, pelvis, [0, -0.25, 1]);
        // 皮带扣与中央齿轮
        const buckle = AddGroup(pelvis, [0, 0.28, 0.69]);
        AddMesh(buckle, Cached('buckleFrame', () => new THREE.BoxGeometry(0.36, 0.3, 0.05)), m.brass);
        AddMesh(buckle, Cached('buckleInner', () => new THREE.BoxGeometry(0.26, 0.2, 0.06)), m.rust);
        this.AddGear(buckle, 0.085, 10, 0.03, [0, 0, 0.045], null, 1.6);
        AddMesh(buckle, RivetGeometry([new THREE.Vector3(-0.15, 0.12, 0.025), new THREE.Vector3(0.15, 0.12, 0.025), new THREE.Vector3(-0.15, -0.12, 0.025), new THREE.Vector3(0.15, -0.12, 0.025)], Array(4).fill(new THREE.Vector3(0, 0, 1)), 0.018), m.steel);
        this.RegisterPart(buckle, 0.65, pelvis);
        // 腰包
        for (const side of [1, -1])
        {
            const pouch = AddGroup(pelvis, [side * 0.74, 0.1, 0.3], [0, side * 0.95, 0]);
            AddMesh(pouch, Cached('pouchBody', () => new THREE.BoxGeometry(0.26, 0.28, 0.15, 2, 2, 2)), m.leather);
            AddMesh(pouch, Cached('pouchFlap', () => new THREE.BoxGeometry(0.275, 0.12, 0.165)), m.leatherDark, [0, 0.09, 0.006]);
            AddMesh(pouch, Cached('pouchClasp', () => new THREE.CylinderGeometry(0.026, 0.026, 0.024, 12).rotateX(k_HalfPi)), m.brass, [0, 0.05, 0.09]);
            this.RegisterPart(pouch, 0.45, pelvis);
            if (side > 0)
            {
                this.AddAnchor('pouchL', pouch, [0, 0.1, 0.1]);
            }
        }
        // 锈蚀甲裙
        const tassetList = [{ angle: 0, width: 0.78 }, { angle: 1.3, width: 0.72 }, { angle: -1.3, width: 0.72 }, { angle: Math.PI, width: 0.9 }];
        for (const spec of tassetList)
        {
            const thetaStart = spec.angle - spec.width * 0.5;
            const scale = [0.93, 1, 0.74];
            const center = [Math.sin(spec.angle) * 0.82 * scale[0], -0.12, Math.cos(spec.angle) * 0.82 * scale[2]];
            const tasset = AddGroup(pelvis, center);
            const holder = AddGroup(tasset, [-center[0], 0, -center[2]]);
            holder.scale.set(scale[0], scale[1], scale[2]);
            AddMesh(holder, CurvedPlateGeometry(0.8, 0.88, 0.5, thetaStart, spec.width), m.rust);
            AddMesh(holder, ArcTrimGeometry(0.88, 0.022, thetaStart, spec.width), m.brass, [0, -0.25, 0]);
            AddMesh(holder, ArcTrimGeometry(0.8, 0.018, thetaStart, spec.width), m.brass, [0, 0.25, 0]);
            AddMesh(holder, RivetRingOnCylinder(0.815, 0.19, 5, 0.022, thetaStart + 0.08, spec.width - 0.16), m.brass);
            this.RegisterPart(tasset, 0.55, pelvis);
        }
    }

    BuildTorso()
    {
        const m = this.m_Mat;
        const spine = this.boneMap.spine;
        const chest = this.boneMap.chest;
        // 腹部与腹肌
        AddMesh(spine, RockSphere(2), m.rock, [0, 0.2, 0], null, [0.74, 0.52, 0.56]);
        for (let row = 0; row < 3; row++)
        {
            for (const side of [1, -1])
            {
                AddMesh(spine, RockSphere((row + side + 4) % 4), m.rock, [side * 0.16, 0.02 + row * 0.17, 0.47 - row * 0.015], [0.15, 0, 0], [0.15, 0.1, 0.09]);
            }
        }
        for (const side of [1, -1])
        {
            AddMesh(spine, RockSphere(3), m.rock, [side * 0.55, 0.22, 0.06], [0, 0, side * 0.2], [0.24, 0.36, 0.38]);
            const pipeGroup = AddGroup(spine, [side * 0.36, 0.35, 0.58]);
            AddPipe(pipeGroup, [[side * -0.06, 0.4, -0.12], [side * 0.02, 0.05, 0.0], [side * 0.06, -0.3, 0.02], [side * 0.08, -0.42, 0.08]], 0.038, m.copper, m.brass);
            this.RegisterPart(pipeGroup, 0.35, this.torsoCenter);
        }
        // 胸腔主体
        const torsoGeometry = Cached('torso', () => DisplaceRock(new THREE.SphereGeometry(1, 72, 54), 0.05, 2.3, 7));
        AddMesh(chest, torsoGeometry, m.rock, [0, 0.48, -0.12], null, [1.2, 0.92, 0.8]);
        for (const side of [1, -1])
        {
            AddMesh(chest, RockSphere(1), m.rock, [side * 0.56, 0.74, 0.36], [0.2, side * 0.3, side * 0.25], [0.48, 0.34, 0.3]);
            AddMesh(chest, RockSphere(2), m.rock, [side * 0.5, 1.12, -0.14], [0, 0, side * -0.5], [0.52, 0.28, 0.44]);
            AddMesh(chest, RockSphere(3), m.rock, [side * 0.78, 0.35, -0.3], [0, 0, side * 0.2], [0.42, 0.62, 0.48]);
            // 岩石肋骨环抱锅炉
            for (let i = 0; i < 3; i++)
            {
                AddMesh(chest, RockCapsule(0.075, 0.42, i), m.rock, [side * (0.5 - i * 0.02), 0.06 + i * 0.25, 0.64 - i * 0.03], [0, -side * 0.55, side * (1.25 - i * 0.12)]);
            }
        }
        // 外露锅炉
        const boiler = AddGroup(chest, [0, 0.4, 0.5]);
        AddMesh(boiler, Cached('boilerDrum', () => new THREE.CylinderGeometry(0.4, 0.4, 0.92, 48)), m.copper);
        AddMesh(boiler, Cached('boilerDomeTop', () => new THREE.SphereGeometry(0.4, 40, 12, 0, k_TwoPi, 0, k_HalfPi)), m.brass, [0, 0.46, 0], null, [1, 0.45, 1]);
        AddMesh(boiler, Cached('boilerDomeBottom', () => new THREE.SphereGeometry(0.4, 40, 12, 0, k_TwoPi, k_HalfPi, k_HalfPi)), m.brass, [0, -0.46, 0], null, [1, 0.4, 1]);
        const bandGeometry = Cached('boilerBand', () => new THREE.TorusGeometry(0.405, 0.03, 8, 56).rotateX(k_HalfPi));
        for (const y of [-0.34, 0.34])
        {
            AddMesh(boiler, bandGeometry, m.brass, [0, y, 0]);
            AddMesh(boiler, RivetRingOnCylinder(0.4, y > 0 ? y - 0.07 : y + 0.07, 28, 0.018), m.brass);
        }
        AddMesh(boiler, Cached('boilerValve', () => new THREE.CylinderGeometry(0.05, 0.065, 0.16, 12)), m.brass, [0.14, 0.6, 0.05]);
        AddMesh(boiler, Cached('boilerWhistle', () => new THREE.CylinderGeometry(0.035, 0.03, 0.14, 10)), m.copper, [0.14, 0.74, 0.05]);
        this.AddAnchor('boilerTop', boiler, [0.14, 0.82, 0.05]);
        this.RegisterPart(boiler, 0.8, this.torsoCenter);
        // 能量核心舷窗
        const porthole = AddGroup(boiler, [0, 0.02, 0.38]);
        AddMesh(porthole, Cached('portRing', () => new THREE.TorusGeometry(0.19, 0.045, 14, 40)), m.brass, [0, 0, 0.04]);
        AddMesh(porthole, Cached('portFlange', () => new THREE.TorusGeometry(0.235, 0.026, 8, 40)), m.steel, [0, 0, 0.0]);
        AddMesh(porthole, RivetRingOnDisc(0.235, 8, 0.024), m.steel, [0, 0, 0.02]);
        AddMesh(porthole, Cached('coreSphere', () => new THREE.SphereGeometry(0.165, 32, 24)), m.coreChest, [0, 0, -0.02]).castShadow = false;
        for (const x of [-0.09, 0, 0.09])
        {
            AddMesh(porthole, Cached('grilleBarV', () => new THREE.BoxGeometry(0.022, 0.36, 0.022)), m.steel, [x, 0, 0.14]);
        }
        AddMesh(porthole, Cached('grilleBarH', () => new THREE.BoxGeometry(0.36, 0.022, 0.022)), m.steel, [0, 0, 0.13]);
        AddMesh(porthole, Cached('portGlass', () => new THREE.SphereGeometry(0.2, 28, 10, 0, k_TwoPi, 0, 0.9).rotateX(k_HalfPi)), m.glass, [0, 0, -0.03]).castShadow = false;
        const coreLight = new THREE.PointLight(0xff8a2a, 6, 5, 2);
        coreLight.position.set(0, 0, 0.9);
        porthole.add(coreLight);
        this.lights.core = coreLight;
        this.AddGlowSprite(porthole, m.glowOrange, [0, 0, 0.12], 0.95);
        this.anchors.core = porthole;
        this.RegisterPart(porthole, 0.45, boiler);
        // 压力表
        this.RegisterPart(this.AddGauge(boiler, 0.1, [0.25, 0.28, 0.31], [0, 0.67, 0]), 0.35, boiler);
        this.RegisterPart(this.AddGauge(boiler, 0.085, [-0.25, -0.27, 0.31], [0, -0.67, 0]), 0.35, boiler);
        // 啮合齿轮组 (左右胸)
        const gearSetLeft = AddGroup(chest, [0.6, 0.84, 0.66], [0, 0.4, 0]);
        this.AddGear(gearSetLeft, 0.22, 18, 0.06, [0, 0, 0], null, 0.8, 5);
        this.AddGear(gearSetLeft, 0.13, 10, 0.06, [Math.cos(-0.65) * 0.32, Math.sin(-0.65) * 0.32, 0.0], null, -0.8 * 18 / 10, 0);
        this.RegisterPart(gearSetLeft, 0.55, this.torsoCenter);
        const gearSetRight = AddGroup(chest, [-0.6, 0.86, 0.66], [0, -0.4, 0]);
        this.AddGear(gearSetRight, 0.19, 14, 0.06, [0, 0, 0], null, -1.0, 4, m.copper);
        this.AddGear(gearSetRight, 0.11, 8, 0.05, [Math.cos(-2.4) * 0.27, Math.sin(-2.4) * 0.27, 0.01], null, 1.0 * 14 / 8, 0);
        this.AddGear(gearSetRight, 0.09, 7, 0.05, [Math.cos(0.9) * 0.25, Math.sin(0.9) * 0.25, 0.01], null, 1.0 * 14 / 7, 0);
        this.RegisterPart(gearSetRight, 0.55, this.torsoCenter);
        // 铜制液压管: 锅炉 → 背包 / 腋下
        for (const side of [1, -1])
        {
            const pipeGroup = AddGroup(chest, [side * 0.45, 1.0, 0.2]);
            const offset = [side * 0.45, 1.0, 0.2];
            const Local = (list) => list.map((p) => [p[0] - offset[0], p[1] - offset[1], p[2] - offset[2]]);
            AddPipe(pipeGroup, Local([[side * 0.2, 0.9, 0.6], [side * 0.3, 1.2, 0.42], [side * 0.36, 1.42, 0.02], [side * 0.34, 1.25, -0.5], [side * 0.32, 1.02, -0.78]]), 0.045, m.copper, m.brass);
            AddPipe(pipeGroup, Local([[side * 0.38, 0.12, 0.68], [side * 0.7, 0.24, 0.5], [side * 0.9, 0.4, 0.12], [side * 0.92, 0.5, -0.28]]), 0.04, m.copper, m.brass);
            this.RegisterPart(pipeGroup, 0.4, this.torsoCenter);
        }
        // 黄铜颈圈
        const collar = AddGroup(chest, [0, 1.02, 0.18], [k_HalfPi - 0.25, 0, 0]);
        AddMesh(collar, Cached('collar', () => new THREE.TorusGeometry(0.37, 0.06, 12, 48)), m.brass);
        AddMesh(collar, RivetRingOnDisc(0.37, 12, 0.03), m.steel, [0, 0, 0.05]);
        this.RegisterPart(collar, 0.5, this.torsoCenter, [0, 1, 0.3]);
    }
