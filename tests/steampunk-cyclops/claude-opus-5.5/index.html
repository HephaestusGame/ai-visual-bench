    //#region 头部: 铰接黄铜头骨与琥珀独眼

    BuildHead()
    {
        const m = this.m_Mat;
        const neck = this.boneMap.neck;
        const head = this.boneMap.head;
        const jaw = this.boneMap.jaw;
        // 颈部
        AddMesh(neck, RockCapsule(0.3, 0.25, 4), m.rock, [0, 0.12, 0.02], [0.2, 0, 0]);
        const neckRing = Cached('neckRing', () => new THREE.TorusGeometry(0.32, 0.028, 8, 36).rotateX(k_HalfPi));
        AddMesh(neck, neckRing, m.brass, [0, 0.06, 0.02]);
        AddMesh(neck, neckRing, m.steel, [0, 0.2, 0.04]);
        for (const side of [1, -1])
        {
            AddPipe(neck, [[side * 0.22, -0.06, -0.18], [side * 0.27, 0.15, -0.3], [side * 0.24, 0.4, -0.36]], 0.032, m.copper, m.brass);
        }
        // 头骨主体 (底部开口, 由下颌闭合)
        const craniumCenter = [0, 0.45, -0.06];
        AddMesh(head, Cached('cranium', () => new THREE.SphereGeometry(0.56, 56, 36, 0, k_TwoPi, 0, 2.2)), m.brass, craniumCenter, null, [1, 0.92, 1]);
        AddMesh(head, Cached('craniumSeamH', () => new THREE.TorusGeometry(0.565, 0.012, 6, 72).rotateX(k_HalfPi)), m.brassDark, [0, 0.47, -0.06], null, [1, 1, 1]);
        AddMesh(head, Cached('craniumSeamV', () => new THREE.TorusGeometry(0.565, 0.012, 6, 72, 2.4).rotateY(k_HalfPi)), m.brassDark, craniumCenter, [-0.3, 0, 0], [1, 0.92, 1]);
        AddMesh(head, Cached('mouthRoof', () => new THREE.CircleGeometry(0.46, 32).rotateX(k_HalfPi)), m.blackIron, [0, 0.135, -0.06]);
        // 上排钢牙
        for (let i = 0; i < 7; i++)
        {
            const angle = (i / 6 - 0.5) * 1.8;
            AddMesh(head, Cached('toothUpper', () => new THREE.ConeGeometry(0.036, 0.12, 6).rotateX(Math.PI)), m.steel, [Math.sin(angle) * 0.4, 0.08, -0.06 + Math.cos(angle) * 0.4]);
        }
        // 独眼
        const eyeSocket = AddGroup(head, [0, 0.52, 0.34]);
        const eyeball = AddGroup(eyeSocket);
        AddMesh(eyeball, Cached('eyeball', () => new THREE.SphereGeometry(0.27, 48, 32).rotateX(k_HalfPi)), m.eye).castShadow = false;
        AddMesh(eyeSocket, Cached('cornea', () => new THREE.SphereGeometry(0.284, 48, 32)), m.glass).castShadow = false;
        this.eyeball = eyeball;
        const lidUpper = AddGroup(eyeSocket);
        AddMesh(lidUpper, Cached('lidUpper', () => new THREE.SphereGeometry(0.3, 36, 12, 0, Math.PI, 0, k_HalfPi)), m.brassDark);
        AddMesh(lidUpper, Cached('lidEdge', () => new THREE.TorusGeometry(0.3, 0.016, 6, 28, Math.PI).rotateX(k_HalfPi)), m.steel);
        const lidLower = AddGroup(eyeSocket);
        AddMesh(lidLower, Cached('lidLower', () => new THREE.SphereGeometry(0.3, 36, 12, 0, Math.PI, k_HalfPi, k_HalfPi)), m.brassDark);
        AddMesh(lidLower, Cached('lidEdge', () => new THREE.TorusGeometry(0.3, 0.016, 6, 28, Math.PI).rotateX(k_HalfPi)), m.steel);
        this.lids = { upper: lidUpper, lower: lidLower };
        const socketRing = AddGroup(eyeSocket, [0, 0, 0.13]);
        AddMesh(socketRing, Cached('socketRing', () => new THREE.TorusGeometry(0.3, 0.055, 16, 56)), m.brass);
        AddMesh(socketRing, Cached('socketRingOuter', () => new THREE.TorusGeometry(0.37, 0.03, 10, 56)), m.steel, [0, 0, -0.05]);
        for (let i = 0; i < 10; i++)
        {
            const angle = i / 10 * k_TwoPi;
            AddMesh(socketRing, Cached('socketBolt', () => new THREE.CylinderGeometry(0.024, 0.024, 0.04, 6).rotateX(k_HalfPi)), m.brass, [Math.cos(angle) * 0.37, Math.sin(angle) * 0.37, -0.02]);
        }
        this.RegisterPart(socketRing, 0.55, head, [0, 0, 1]);
        const eyeLight = new THREE.PointLight(0xffa340, 5, 7, 2);
        eyeLight.position.set(0, 0, 1.1);
        eyeSocket.add(eyeLight);
        this.lights.eye = eyeLight;
                this.anchors.eye = eyeSocket;
        this.RegisterPart(eyeSocket, 0.3, head, [0, 0, 1]);
        // 怒眉甲片
        for (const side of [1, -1])
        {
            const brow = AddGroup(head, [side * 0.2, 0.84, 0.4], [-0.3, 0, side * 0.32]);
            AddMesh(brow, Cached('browPlate', () => new THREE.BoxGeometry(0.42, 0.085, 0.2, 2, 1, 2)), m.rust);
            AddMesh(brow, RivetGeometry([new THREE.Vector3(-0.13, 0.045, 0.02), new THREE.Vector3(0.13, 0.045, 0.02)], [s_UpVector, s_UpVector], 0.02), m.brass);
            this.RegisterPart(brow, 0.45, head);
        }
        // 头顶锈蚀装甲板
        const plateSpecList = [{ tilt: 0.42, radius: 0.6 }, { tilt: -0.18, radius: 0.615 }, { tilt: -0.82, radius: 0.6 }];
        plateSpecList.forEach((spec, index) =>
        {
            const plate = this.AddCapPlate(head, craniumCenter, spec.radius, 0.6, [spec.tilt, 0, 0], 12);
            this.RegisterPart(plate, 0.4 + index * 0.12, head);
        });
        // 散热鳍片冠
        const crest = AddGroup(head, [0, 1.05, -0.08]);
        for (let i = 0; i < 6; i++)
        {
            const angle = -0.85 + i * 0.2;
            const height = 0.16 - Math.abs(i - 2.5) * 0.02;
            AddMesh(crest, Cached(`fin_${height}`, () => new THREE.BoxGeometry(0.035, height, 0.13)), m.brass, [0, craniumCenter[1] - 1.05 + Math.cos(angle) * 0.66, craniumCenter[2] + 0.08 + Math.sin(angle) * 0.66], [angle, 0, 0]);
        }
        this.RegisterPart(crest, 0.7, head, [0, 1, 0]);
        // 下颌铰链齿轮
        for (const side of [1, -1])
        {
            const hinge = this.AddGear(head, 0.14, 12, 0.05, [side * 0.53, 0.22, -0.04], [0, side * k_HalfPi, 0], side * 0.7, 3);
            this.RegisterPart(hinge, 0.4, head);
            const exhaust = AddGroup(head, [side * 0.22, 0.66, -0.5], [-0.85, 0, side * -0.2]);
            AddMesh(exhaust, Cached('headExhaust', () => new THREE.CylinderGeometry(0.055, 0.065, 0.32, 14)), m.copper, [0, 0.12, 0]);
            AddMesh(exhaust, Cached('headExhaustLip', () => new THREE.TorusGeometry(0.062, 0.014, 6, 16).rotateX(k_HalfPi)), m.brass, [0, 0.28, 0]);
            this.AddAnchor(side > 0 ? 'headPipeL' : 'headPipeR', exhaust, [0, 0.3, 0]);
            this.RegisterPart(exhaust, 0.45, head);
        }
        // 下颌
        AddMesh(jaw, Cached('jawBowl', () => new THREE.SphereGeometry(0.5, 40, 16, 0, k_TwoPi, k_HalfPi, k_HalfPi)), m.brassDark, [0, 0.02, -0.12], null, [0.96, 0.62, 1.04]);
        AddMesh(jaw, Cached('jawRim', () => new THREE.TorusGeometry(0.5, 0.022, 8, 56).rotateX(k_HalfPi)), m.brass, [0, 0.02, -0.12], null, [0.96, 1, 1.04]);
        const mouthGlow = AddMesh(jaw, Cached('mouthGlow', () => new THREE.CircleGeometry(0.44, 32).rotateX(-k_HalfPi)), m.coreMouth, [0, -0.04, -0.12]);
        mouthGlow.castShadow = false;
        for (let i = 0; i < 7; i++)
        {
            const angle = (i / 6 - 0.5) * 1.7;
            AddMesh(jaw, Cached('toothLower', () => new THREE.ConeGeometry(0.03, 0.08, 6)), m.steel, [Math.sin(angle) * 0.39, 0.05, -0.12 + Math.cos(angle) * 0.39]);
        }
        for (let i = 0; i < 4; i++)
        {
            AddMesh(jaw, Cached('jawGrille', () => new THREE.BoxGeometry(0.4, 0.022, 0.03)), m.steel, [0, -0.06 - i * 0.055, 0.38 - i * 0.03], [-0.25 - i * 0.12, 0, 0]);
        }
        const chin = AddGroup(jaw, [0, -0.27, 0.22], [0.5, 0, 0]);
        AddMesh(chin, Cached('chinPlate', () => new THREE.BoxGeometry(0.34, 0.08, 0.24)), m.rust);
        AddMesh(chin, RivetGeometry([new THREE.Vector3(-0.12, 0.04, 0.06), new THREE.Vector3(0.12, 0.04, 0.06)], [s_UpVector, s_UpVector], 0.018), m.brass);
        this.RegisterPart(chin, 0.35, jaw);
        this.AddAnchor('mouth', jaw, [0, 0.06, 0.3]);
        this.RegisterPart(jaw, 0.35, head, [0, -1, 0.4]);
        this.RegisterPart(head, 0.9, this.torsoCenter);
    }

    //#region 手臂 / 分段巨掌

    BuildArm(side)
    {
        const m = this.m_Mat;
        const s = side > 0 ? 'L' : 'R';
        const shoulder = this.boneMap['shoulder' + s];
        const upperArm = this.boneMap['upperArm' + s];
        const foreArm = this.boneMap['foreArm' + s];
        const hand = this.boneMap['hand' + s];

        this.RegisterPart(this.AddGear(upperArm, 0.15, 12, 0.05, [side * 0.38, -1.0, 0], [0, side * k_HalfPi, 0], -side * 1.1, 0), 0.3, upperArm, [side, 0, 0]);
        this.AddPiston(upperArm, [side * 0.34, -0.3, -0.06], foreArm, [side * 0.37, -0.3, 0.0], 0.045);

        AddMesh(foreArm, RockSphere(2), m.rock, [side * 0.05, -0.2, 0.06], null, [0.36, 0.3, 0.32]);
        const bracer = AddGroup(foreArm, [0, -0.6, 0]);
        AddMesh(bracer, Cached('bracer', () => new THREE.CylinderGeometry(0.4, 0.365, 0.56, 40, 1, true)), m.leather);

    BuildHand(side, hand)
    {
        const m = this.m_Mat;
        const s = side > 0 ? 'L' : 'R';
        AddMesh(hand, RockSphere(3), m.rockFine, [0, -0.27, 0], null, [0.17, 0.28, 0.27]);
        const knuckle = AddGroup(hand, [side * 0.15, -0.3, 0]);
        AddMesh(knuckle, Cached('knucklePlate', () => new THREE.BoxGeometry(0.05, 0.34, 0.44)), m.brass);
        const rivetNormal = new THREE.Vector3(side, 0, 0);
        AddMesh(knuckle, RivetGeometry([new THREE.Vector3(side * 0.025, 0.13, 0.17), new THREE.Vector3(side * 0.025, 0.13, -0.17), new THREE.Vector3(side * 0.025, -0.13, 0.17), new THREE.Vector3(side * 0.025, -0.13, -0.17)], Array(4).fill(rivetNormal), 0.018), m.steel);
        AddMesh(knuckle, Cached('knuckleBar', () => new THREE.CylinderGeometry(0.05, 0.05, 0.5, 12).rotateX(k_HalfPi)), m.steel, [-side * 0.06, -0.18, 0]);
        this.RegisterPart(knuckle, 0.3, hand, [side, 0, 0]);
        const fingerRadiusList = [0.07, 0.076, 0.072, 0.062];
        const ringGeometry = (radius) => Cached(`knuckleRing_${radius}`, () => new THREE.TorusGeometry(radius * 1.12, 0.016, 6, 18).rotateX(k_HalfPi));
        const BuildSegment = (bone, radius, isTip) =>
        {
            const length = bone.userData.length;
            AddMesh(bone, RockCapsule(radius, Math.max(0.02, length - radius), 5), m.rockFine, [0, -length * 0.5, 0]);
            AddMesh(bone, ringGeometry(radius), m.brass);
            if (isTip)
            {
                AddMesh(bone, Cached(`claw_${radius}`, () => new THREE.ConeGeometry(radius * 0.75, 0.1, 8).rotateX(Math.PI)), m.rust, [0, -length - 0.03, 0]);
            }
        };
        this.fingerMap[s].forEach((chain, f) =>
        {
            chain.forEach((bone, k) =>
            {
                BuildSegment(bone, fingerRadiusList[f] * (1 - k * 0.1), k === 2);
            });
        });
        this.thumbMap[s].forEach((bone, k) =>
        {
            BuildSegment(bone, 0.082 * (1 - k * 0.1), k === 2);
        });
        this.AddAnchor('palm' + s, hand, [-side * 0.17, -0.42, 0.02]);
        this.AddAnchor('orb' + s, hand, [-side * 0.05, -1.0, 0]);
    }

    //#region 腿部

    BuildLeg(side)
    {
        const m = this.m_Mat;
        const s = side > 0 ? 'L' : 'R';
        const thigh = this.boneMap['thigh' + s];
        const shin = this.boneMap['shin' + s];
        const foot = this.boneMap['foot' + s];
        // 大腿
        AddMesh(thigh, RockSphere(0), m.rock, [side * 0.04, -0.06, 0], null, [0.42, 0.4, 0.44]);
        AddMesh(thigh, RockCapsule(0.37, 0.45, 3), m.rock, [0, -0.5, 0], null, [1, 1, 1.06]);
        AddMesh(thigh, RockSphere(1), m.rock, [0, -0.45, 0.2], null, [0.3, 0.42, 0.24]);
        AddMesh(thigh, RockSphere(2), m.rock, [0, -0.46, -0.18], null, [0.3, 0.4, 0.24]);
        this.RegisterPart(this.AddGear(thigh, 0.24, 16, 0.06, [side * 0.44, -0.04, 0], [0, side * k_HalfPi, 0], side * 0.5, 5), 0.35, thigh, [side, 0, 0]);
        const thighStrap = AddGroup(thigh, [0, -0.64, 0]);
        AddMesh(thighStrap, Cached('thighStrap', () => new THREE.TorusGeometry(0.405, 0.045, 10, 40).rotateX(k_HalfPi)), m.leather);
        AddMesh(thighStrap, Cached('thighBuckle', () => new THREE.BoxGeometry(0.12, 0.11, 0.04)), m.brass, [0, 0, 0.44]);
        this.RegisterPart(thighStrap, 0.4, thigh, [0, 0, 1]);
        this.AddPiston(thigh, [side * 0.38, -0.3, -0.1], shin, [side * 0.38, -0.3, -0.06], 0.05);
        // 膝盖: 黄铜护膝 + 齿轮
        this.RegisterPart(this.AddGear(shin, 0.15, 12, 0.05, [side * 0.4, 0, 0], [0, side * k_HalfPi, 0], -side * 0.9, 0), 0.3, shin, [side, 0, 0]);
        const kneeCap = AddGroup(shin, [0, 0.03, 0.4]);
        const kneeHolder = AddGroup(kneeCap, [0, 0, -0.21], [k_HalfPi, 0, 0]);
        AddMesh(kneeHolder, CapGeometry(0.21, 1.1), m.brass);
        AddMesh(kneeHolder, CapTrimGeometry(0.21, 1.1, 0.014), m.steel);
        AddMesh(kneeHolder, RivetRingOnSphere(0.212, 0.95, 10, 0.017), m.steel);
        AddMesh(kneeCap, Cached('kneeBolt', () => new THREE.CylinderGeometry(0.04, 0.04, 0.04, 6).rotateX(k_HalfPi)), m.steel, [0, 0, 0.0]);
        this.RegisterPart(kneeCap, 0.45, shin, [0, 0.2, 1]);
        // 柱状小腿 + 锈铁护胫 + 绑带
        AddMesh(shin, Cached('shinPillar', () => DisplaceRock(new THREE.CylinderGeometry(0.4, 0.36, 0.86, 40, 8, true), 0.012, 3.0, 61)), m.rock, [0, -0.42, 0]);
        AddMesh(shin, RockSphere(3), m.rock, [0, -0.25, -0.14], null, [0.3, 0.4, 0.26]);
        const greave = AddGroup(shin, [0, -0.42, 0.44]);
        const greaveHolder = AddGroup(greave, [0, 0, -0.44]);
        AddMesh(greaveHolder, CurvedPlateGeometry(0.46, 0.425, 0.62, -1.0, 2.0), m.rust);
        AddMesh(greaveHolder, ArcTrimGeometry(0.46, 0.02, -1.0, 2.0), m.brass, [0, 0.31, 0]);
        AddMesh(greaveHolder, ArcTrimGeometry(0.425, 0.02, -1.0, 2.0), m.brass, [0, -0.31, 0]);
        AddMesh(greaveHolder, RivetRingOnCylinder(0.457, 0.24, 7, 0.02, -0.9, 1.8), m.brass);
        AddMesh(greaveHolder, RivetRingOnCylinder(0.43, -0.24, 7, 0.02, -0.9, 1.8), m.brass);
        AddMesh(greaveHolder, Cached('greaveRidge', () => new THREE.BoxGeometry(0.06, 0.52, 0.04)), m.rust, [0, 0, 0.455]);
        this.RegisterPart(greave, 0.55, shin, [0, 0, 1]);
        for (const y of [-0.22, -0.62])
        {
            const strap = AddGroup(shin, [0, y, 0]);
            AddMesh(strap, Cached('shinStrap', () => new THREE.TorusGeometry(0.47, 0.034, 8, 44).rotateX(k_HalfPi)), m.leather);
            AddMesh(strap, Cached('shinBuckle', () => new THREE.BoxGeometry(0.1, 0.09, 0.035)), m.brass, [0, 0, -0.49]);
            this.RegisterPart(strap, 0.3, shin, [0, 0, -1]);
        }
        AddMesh(shin, Cached('ankleRing', () => new THREE.TorusGeometry(0.36, 0.05, 10, 40).rotateX(k_HalfPi)), m.brass, [0, -0.84, 0]);
        // 岩石巨足 + 铁趾套
        AddMesh(foot, RockSphere(1), m.rock, [0, -0.05, 0.16], null, [0.36, 0.17, 0.52]);
        AddMesh(foot, RockSphere(2), m.rock, [0, -0.08, -0.22], null, [0.22, 0.14, 0.18]);
        for (const t of [-1, 0, 1])
        {
            AddMesh(foot, RockSphere(t + 1), m.rockFine, [t * 0.17, -0.1, 0.62], null, [0.11, 0.09, 0.15]);
            const toeCap = AddGroup(foot, [t * 0.17, -0.09, 0.7]);
            AddMesh(toeCap, Cached('toeCap', () => new THREE.SphereGeometry(0.1, 16, 8, 0, k_TwoPi, 0, k_HalfPi).rotateX(k_HalfPi)), m.rust, null, null, [1.05, 0.85, 1]);
            this.RegisterPart(toeCap, 0.25, foot, [0, 0, 1]);
        }
        const anklePlate = AddGroup(foot, [0, 0.12, 0.3], [-0.35, 0, 0]);
        AddMesh(anklePlate, Cached('anklePlate', () => new THREE.BoxGeometry(0.42, 0.05, 0.36)), m.brass);
        AddMesh(anklePlate, RivetGeometry([new THREE.Vector3(-0.17, 0.025, 0.14), new THREE.Vector3(0.17, 0.025, 0.14), new THREE.Vector3(-0.17, 0.025, -0.14), new THREE.Vector3(0.17, 0.025, -0.14)], Array(4).fill(s_UpVector), 0.018), m.steel);
        this.RegisterPart(anklePlate, 0.35, foot, [0, 1, 0.5]);
        this.AddAnchor('foot' + s, foot, [0, -0.2, 0.15]);
    }

    //#region 双烟囱锅炉背包

    BuildBackpack()
    {
        const m = this.m_Mat;
        const pack = this.boneMap.backpack;
        const chest = this.boneMap.chest;
        for (const side of [1, -1])
        {
            AddMesh(chest, PipeGeometry([[side * 0.42, 0.85, -0.85], [side * 0.52, 1.3, -0.35], [side * 0.42, 1.22, 0.08]], 0.05, 6), m.leather);
        }
        // 横置主锅炉罐
        const tank = AddGroup(pack, [0, 0, 0]);
        AddMesh(tank, Cached('packTank', () => new THREE.CylinderGeometry(0.46, 0.46, 1.3, 44).rotateZ(k_HalfPi)), m.rust);
        for (const x of [-0.65, 0.65])
        {
            AddMesh(tank, Cached('packDome', () => new THREE.SphereGeometry(0.46, 36, 12, 0, k_TwoPi, 0, k_HalfPi)), m.brass, [x, 0, 0], [0, 0, x > 0 ? -k_HalfPi : k_HalfPi], [1, 0.42, 1]);
        }
        const rivetHolder = AddGroup(tank, null, [0, 0, k_HalfPi]);
        for (const x of [-0.42, 0, 0.42])
        {
            AddMesh(tank, Cached('packBand', () => new THREE.TorusGeometry(0.468, 0.03, 8, 56).rotateY(k_HalfPi)), m.brass, [x, 0, 0]);
            AddMesh(rivetHolder, RivetRingOnCylinder(0.46, x + 0.07, 24, 0.018), m.brass);
        }
        this.RegisterPart(tank, 0.3, pack, [0, 0, -1]);
        // 火箱 (背部发光炉栅)
        const firebox = AddGroup(pack, [0, -0.62, -0.05]);
        AddMesh(firebox, Cached('fireboxBody', () => new THREE.BoxGeometry(0.85, 0.42, 0.62)), m.rust);
        AddMesh(firebox, Cached('fireboxGlow', () => new THREE.PlaneGeometry(0.52, 0.22)), m.coreFire, [0, -0.02, -0.312], [0, Math.PI, 0]).castShadow = false;
        for (let i = -2; i <= 2; i++)
        {
            AddMesh(firebox, Cached('fireboxBar', () => new THREE.BoxGeometry(0.03, 0.26, 0.03)), m.steel, [i * 0.11, -0.02, -0.325]);
        }
        AddMesh(firebox, Cached('fireboxFrame', () => new THREE.BoxGeometry(0.6, 0.04, 0.04)), m.brass, [0, 0.12, -0.325]);
        AddMesh(firebox, Cached('fireboxFrame', () => new THREE.BoxGeometry(0.6, 0.04, 0.04)), m.brass, [0, -0.16, -0.325]);
        this.RegisterPart(firebox, 0.45, pack, [0, -0.6, -1]);
        // 双烟囱
        const chimneyGeometry = Cached('chimney', () =>
        {
            const profile = [[0.13, 0], [0.13, 0.9], [0.15, 1.0], [0.2, 1.22], [0.22, 1.3], [0.2, 1.34], [0.16, 1.3], [0.11, 1.05], [0.11, 0.85]];
            return new THREE.LatheGeometry(profile.map((p) => new THREE.Vector2(p[0], p[1])), 32);
        });
        for (const side of [1, -1])
        {
            const chimney = AddGroup(pack, [side * 0.36, 0.38, -0.08], [-0.12, 0, -side * 0.08]);
            AddMesh(chimney, Cached('chimneyCollar', () => new THREE.CylinderGeometry(0.17, 0.2, 0.16, 24)), m.brass);
            AddMesh(chimney, chimneyGeometry, m.rust);
            for (const y of [0.35, 0.75])
            {
                AddMesh(chimney, Cached('chimneyBand', () => new THREE.TorusGeometry(0.135, 0.022, 8, 28).rotateX(k_HalfPi)), m.brass, [0, y, 0]);
            }
            AddMesh(chimney, Cached('chimneyHat', () => new THREE.ConeGeometry(0.21, 0.14, 20, 1, true)), m.copper, [0, 1.53, 0]);
            for (let i = 0; i < 3; i++)
            {
                const angle = i / 3 * k_TwoPi;
                AddMesh(chimney, Cached('chimneyRod', () => new THREE.BoxGeometry(0.015, 0.2, 0.015)), m.steel, [Math.cos(angle) * 0.15, 1.4, Math.sin(angle) * 0.15]);
            }
            this.AddAnchor(side > 0 ? 'chimneyL' : 'chimneyR', chimney, [0, 1.36, 0]);
            this.RegisterPart(chimney, 0.65, pack, [side * 0.3, 1, 0]);
        }
        // 侧挂铜罐
        for (const side of [1, -1])
        {
            const can = AddGroup(pack, [side * 0.84, -0.2, 0.08]);
            AddMesh(can, Cached('copperCan', () => new THREE.CapsuleGeometry(0.18, 0.5, 8, 24)), m.copper);
            for (const y of [-0.22, 0.22])
            {
                AddMesh(can, Cached('canRing', () => new THREE.TorusGeometry(0.185, 0.02, 8, 32).rotateX(k_HalfPi)), m.brass, [0, y, 0]);
            }
            AddMesh(can, Cached('canStrap', () => new THREE.TorusGeometry(0.19, 0.03, 8, 32).rotateX(k_HalfPi)), m.leather, [0, 0, 0]);
            AddMesh(can, Cached('canStem', () => new THREE.CylinderGeometry(0.025, 0.025, 0.14, 8)), m.steel, [0, 0.48, 0]);
            const wheel = AddGroup(can, [0, 0.55, 0]);
            AddMesh(wheel, Cached('valveWheel', () => new THREE.TorusGeometry(0.09, 0.014, 6, 24).rotateX(k_HalfPi)), m.brass);
            for (let i = 0; i < 4; i++)
            {
                AddMesh(wheel, Cached('valveSpoke', () => new THREE.BoxGeometry(0.18, 0.012, 0.012)), m.brass, null, [0, i * Math.PI / 4, 0]);
            }
            AddPipe(can, [[-side * 0.12, 0.18, -0.02], [-side * 0.24, 0.26, -0.06], [-side * 0.36, 0.22, -0.1]], 0.03, m.copper, m.brass);
            this.RegisterPart(can, 0.55, pack, [side, 0, 0]);
        }
        // 排气管
        for (const side of [1, -1])
        {
            const exhaust = AddGroup(pack, [side * 0.52, -0.5, -0.2]);
            const pipe = AddPipe(exhaust, [[0, 0, 0], [side * 0.2, -0.3, -0.18], [side * 0.26, -0.66, -0.4]], 0.07, m.steel, m.brass);
            const curve = pipe.geometry.userData.curve;
            const endPoint = curve.getPointAt(1);
            const endTangent = curve.getTangentAt(1);
            const mouth = AddMesh(exhaust, Cached('exhaustMouth', () => new THREE.CylinderGeometry(0.075, 0.12, 0.2, 18, 1, true).rotateX(Math.PI)), m.steel, [endPoint.x, endPoint.y, endPoint.z]);
            mouth.quaternion.setFromUnitVectors(new THREE.Vector3(0, -1, 0), endTangent.clone().negate());
            const tip = endPoint.clone().addScaledVector(endTangent, 0.12);
            this.AddAnchor(side > 0 ? 'exhaustL' : 'exhaustR', exhaust, [tip.x, tip.y, tip.z]);
            this.RegisterPart(exhaust, 0.5, pack, [side, -1, -0.5]);
        }
        // 泄压阀与背部压力表
        const valve = AddGroup(pack, [0, 0.5, -0.12]);
        AddMesh(valve, Cached('reliefValve', () => new THREE.CylinderGeometry(0.08, 0.1, 0.18, 16)), m.brass);
        AddMesh(valve, Cached('reliefCap', () => new THREE.SphereGeometry(0.085, 16, 8, 0, k_TwoPi, 0, k_HalfPi)), m.copper, [0, 0.09, 0]);
        this.AddGauge(valve, 0.11, [0, 0.0, -0.14], [0, Math.PI, 0]);
        this.RegisterPart(valve, 0.5, pack, [0, 1, -0.6]);
        this.RegisterPart(pack, 1.1, this.torsoCenter);
    }

    //#region 巨型蒸汽锤

    BuildHammer()
    {
        const m = this.m_Mat;
        const hammer = AddGroup(this.boneMap.grip);
        this.hammer = hammer;
        AddMesh(hammer, Cached('hammerShaft', () => new THREE.CylinderGeometry(0.072, 0.072, 2.3, 16).rotateX(k_HalfPi)), m.steel, [0, 0, 0.62]);
        AddMesh(hammer, Cached('hammerWrap', () => new THREE.CylinderGeometry(0.088, 0.088, 0.62, 18).rotateX(k_HalfPi)), m.leather);
        for (let i = 0; i < 6; i++)
        {
            AddMesh(hammer, Cached('wrapRidge', () => new THREE.TorusGeometry(0.09, 0.012, 6, 18)), m.leatherDark, [0, 0, -0.25 + i * 0.1]);
        }
        for (const z of [-0.34, 0.34, 0.95])
        {
            AddMesh(hammer, Cached('shaftRing', () => new THREE.TorusGeometry(0.094, 0.022, 8, 20)), m.brass, [0, 0, z]);
        }
        const pommel = AddGroup(hammer, [0, 0, -0.6]);
        AddMesh(pommel, Cached('pommelBall', () => new THREE.SphereGeometry(0.12, 20, 14)), m.brass);
        AddMesh(pommel, Cached('pommelSpike', () => new THREE.ConeGeometry(0.06, 0.16, 10).rotateX(-k_HalfPi)), m.steel, [0, 0, -0.16]);
        this.AddGear(pommel, 0.12, 8, 0.03, [0, 0, 0.1], null, 2.0);
        this.RegisterPart(pommel, 0.4, hammer, [0, 0, -1]);
        AddPipe(hammer, [[0, 0.1, 0.4], [0, 0.112, 0.9], [0, 0.1, 1.3], [0, 0.2, 1.5]], 0.024, m.copper, m.brass);
        // 锤头 (筒轴沿局部 Y, 两端为打击面)
        const head = AddGroup(hammer, [0, 0, 1.85]);
        this.hammerHead = head;
        AddMesh(head, Cached('hammerDrum', () => new THREE.CylinderGeometry(0.34, 0.34, 0.8, 44)), m.brass);
        AddMesh(head, Cached('hammerCore', () => new THREE.CylinderGeometry(0.348, 0.348, 0.2, 44, 1, true)), m.coreHammer).castShadow = false;
        for (let i = 0; i < 10; i++)
        {
            const angle = i / 10 * k_TwoPi;
            AddMesh(head, Cached('hammerCage', () => new THREE.BoxGeometry(0.035, 0.24, 0.035)), m.steel, [Math.cos(angle) * 0.36, 0, Math.sin(angle) * 0.36], [0, -angle, 0]);
        }
        for (const y of [-0.11, 0.11])
        {
            AddMesh(head, Cached('hammerRim', () => new THREE.TorusGeometry(0.356, 0.02, 8, 44).rotateX(k_HalfPi)), m.brass, [0, y, 0]);
        }
        for (const sy of [1, -1])
        {
            const flange = AddGroup(head, [0, sy * 0.43, 0]);
            AddMesh(flange, Cached('hammerFlange', () => new THREE.CylinderGeometry(0.43, 0.43, 0.12, 44)), m.rust);
            AddMesh(flange, RivetRingOnCylinder(0.43, 0, 16, 0.02), m.brass);
            this.RegisterPart(flange, 0.3, head, [0, sy, 0]);
            const face = AddGroup(head, [0, sy * 0.58, 0], [sy > 0 ? 0 : Math.PI, 0, 0]);
            AddMesh(face, Cached('hammerFace', () => new THREE.CylinderGeometry(0.34, 0.4, 0.18, 44)), m.steel);
            AddMesh(face, Cached('hammerFaceBolt', () => new THREE.CylinderGeometry(0.07, 0.07, 0.03, 6)), m.brass, [0, 0.1, 0]);
            this.RegisterPart(face, 0.55, head, [0, sy, 0]);
        }
        for (const sx of [1, -1])
        {
            const sidePiston = AddGroup(head, [sx * 0.52, 0, 0]);
            AddMesh(sidePiston, Cached('sidePistonBody', () => new THREE.CylinderGeometry(0.06, 0.06, 0.5, 14)), m.steel);
            AddMesh(sidePiston, Cached('sidePistonRod', () => new THREE.CylinderGeometry(0.03, 0.03, 0.84, 10)), m.chrome);
            for (const y of [-0.4, 0.4])
            {
                AddMesh(sidePiston, Cached('sidePistonBracket', () => new THREE.BoxGeometry(0.14, 0.05, 0.08)), m.brass, [-sx * 0.06, y, 0]);
            }
            this.RegisterPart(sidePiston, 0.4, head, [sx, 0, 0]);
        }
        const collar = AddGroup(head, [0, 0, -0.42]);
        AddMesh(collar, Cached('hammerCollar', () => new THREE.CylinderGeometry(0.13, 0.16, 0.3, 22).rotateX(k_HalfPi)), m.brass);
        AddMesh(collar, RivetRingOnDisc(0.12, 6, 0.018), m.steel, [0, 0, -0.15]);
        this.RegisterPart(collar, 0.3, head, [0, 0, -1]);
        const vent = AddGroup(head, [0, 0, 0.34]);
        AddMesh(vent, Cached('hammerVent', () => new THREE.CylinderGeometry(0.07, 0.09, 0.26, 16).rotateX(k_HalfPi)), m.copper, [0, 0, 0.1]);
        AddMesh(vent, Cached('hammerVentLip', () => new THREE.TorusGeometry(0.075, 0.016, 6, 18)), m.brass, [0, 0, 0.23]);
        this.AddAnchor('hammerVent', vent, [0, 0, 0.26]);
        this.RegisterPart(vent, 0.45, head, [0, 0, 1]);
        this.RegisterPart(this.AddGauge(head, 0.09, [-0.355, 0.22, 0], [0, -k_HalfPi, 0]), 0.35, head, [-1, 0, 0]);
        const hammerLight = new THREE.PointLight(0xff8a2a, 4, 4, 2);
        hammerLight.position.set(0, 0, 0.9);
        head.add(hammerLight);
        this.lights.hammer = hammerLight;
        this.anchors.hammerHead = head;
        this.RegisterPart(head, 0.8, hammer, [0, 0, 1]);
        this.RegisterPart(hammer, 0.6, this.boneMap.handR, [-1, 0, 0]);
    }

    //#endregion

    //#region 完成构建 / 姿态应用 / 每帧更新

    Finalize()
    {
        for (const side of ['L', 'R'])
        {
            this.RegisterPart(this.boneMap['shoulder' + side], 0.55);
            this.RegisterPart(this.boneMap['upperArm' + side], 0.35);
            this.RegisterPart(this.boneMap['foreArm' + side], 0.45);
            this.RegisterPart(this.boneMap['hand' + side], 0.4);
            this.RegisterPart(this.boneMap['thigh' + side], 0.75);
            this.RegisterPart(this.boneMap['shin' + side], 0.45);
            this.RegisterPart(this.boneMap['foot' + side], 0.35);
        }
        this.root.updateMatrixWorld(true);
        for (const spec of this.pistonSpecList)
        {
            this.pistonList.push(new HydraulicPiston(spec.boneA, spec.pointA, spec.boneB, spec.pointB, spec.radius, this.m_Mat));
        }
        for (const item of this.explodeList)
        {
            let depth = 0;
            let node = item.object.parent;
            while (node)
            {
                depth++;
                node = node.parent;
            }
            item.depth = depth;
        }
        this.explodeList.sort((a, b) => a.depth - b.depth);
        this.materialSet = new Set();
        let meshCount = 0;
        this.root.traverse((object) =>
        {
            if (object.isMesh)
            {
                meshCount++;
                this.materialSet.add(object.material);
            }
        });
        console.log(`[SteampunkCyclops](Finalize) 构建完成: 网格 ${meshCount} 个, 齿轮 ${this.gearList.length} 个, 活塞 ${this.pistonList.length} 个, 爆炸部件 ${this.explodeList.length} 个`);
    }

    ApplyPose(pose)
    {
        for (let i = 0; i < k_RotBoneList.length; i++)
        {
            const bone = this.boneMap[k_RotBoneList[i]];
            const rest = bone.userData.restRotation;
            bone.rotation.set(rest.x + pose[i * 3], rest.y + pose[i * 3 + 1], rest.z + pose[i * 3 + 2]);
        }
        this.boneMap.root.position.set(pose[k_ChannelMap.posX], pose[k_ChannelMap.posY], pose[k_ChannelMap.posZ]);
        for (const s of ['L', 'R'])
        {
            const sideSign = s === 'L' ? 1 : -1;
            const curl = pose[k_ChannelMap['curl' + s]];
            this.fingerMap[s].forEach((chain, f) =>
            {
                const fingerCurl = Clamp(curl + (f - 1.5) * 0.04, 0, 1.1);
                for (let k = 0; k < 3; k++)
                {
                    chain[k].rotation.z = -sideSign * fingerCurl * k_CurlAngleList[k];
                    chain[k].rotation.x = k === 0 ? (f - 1.5) * -0.06 * (1 - fingerCurl) : 0;
                }
            });
            const thumb = pose[k_ChannelMap['thumb' + s]];
            this.thumbMap[s].forEach((bone, k) =>
            {
                const rest = bone.userData.restRotation;
                bone.rotation.set(rest.x + thumb * (k === 0 ? 0.35 : 0.3), rest.y, rest.z - sideSign * thumb * (k === 0 ? 0.5 : 0.65));
            });
        }
        this.m_LidUpper = pose[k_ChannelMap.lidU];
        this.m_LidLower = pose[k_ChannelMap.lidL];
        this.glow = pose[k_ChannelMap.glow];
        this.steam = pose[k_ChannelMap.steam];
    }

    Update(deltaTime, time, gearSpeed)
    {
        const m = this.m_Mat;
        const glow = Math.max(0, this.glow);
        // 眨眼
        this.m_BlinkTimer -= deltaTime;
        if (this.m_BlinkTimer <= 0)
        {
            this.m_BlinkTimer = 2.5 + this.m_Random() * 4;
            if (glow > 0.3)
            {
                this.m_BlinkTime = 0;
            }
        }
        let blink = 0;
        if (this.m_BlinkTime >= 0)
        {
            this.m_BlinkTime += deltaTime;
            const t = this.m_BlinkTime / 0.2;
            blink = t < 1 ? Math.sin(t * Math.PI) : 0;
            if (t >= 1)
            {
                this.m_BlinkTime = -1;
            }
        }
        this.lids.upper.rotation.x = Lerp(-1.2, 0, Math.max(this.m_LidUpper, blink));
        this.lids.lower.rotation.x = Lerp(1.1, 0, Math.max(this.m_LidLower, blink * 0.85));
        // 眼球微动: 扫视 + 生理震颤
        this.m_SaccadeTimer -= deltaTime;
        if (this.m_SaccadeTimer <= 0)
        {
            this.m_SaccadeTimer = 0.35 + this.m_Random() * 1.8;
            this.m_EyeTarget.set((this.m_Random() - 0.5) * 0.3, (this.m_Random() - 0.5) * 0.5);
        }
        this.m_EyeCurrent.x = Damp(this.m_EyeCurrent.x, this.m_EyeTarget.x, 16, deltaTime);
        this.m_EyeCurrent.y = Damp(this.m_EyeCurrent.y, this.m_EyeTarget.y, 16, deltaTime);
        this.eyeball.rotation.x = this.m_EyeCurrent.x + Math.sin(time * 23.0) * 0.004;
        this.eyeball.rotation.y = this.m_EyeCurrent.y + Math.sin(time * 19.0 + 1.3) * 0.004;
        // 独眼脉动发光 / 核心闪烁
        const pulse = 0.85 + 0.15 * Math.sin(time * 3.1) + 0.06 * Math.sin(time * 11.7);
        m.eye.emissiveIntensity = 1.25 * glow * pulse;
        this.lights.eye.intensity = 4 * glow * pulse;
        const flicker = 0.78 + 0.16 * Math.sin(time * 7.3) + 0.1 * Math.sin(time * 17.9 + 1.3) + 0.06 * Math.sin(time * 31.7);
        m.coreChest.color.setRGB(3.2, 1.25, 0.28).multiplyScalar(flicker * glow);
        this.lights.core.intensity = 3.5 * flicker * glow;
        const flicker2 = 0.8 + 0.14 * Math.sin(time * 5.1 + 2.0) + 0.1 * Math.sin(time * 13.3) + 0.05 * Math.sin(time * 27.1);
        m.coreHammer.color.setRGB(3.4, 1.4, 0.3).multiplyScalar(flicker2 * glow);
        this.lights.hammer.intensity = 4 * flicker2 * glow;
        m.coreFire.color.setRGB(2.6, 0.8, 0.15).multiplyScalar((0.7 + 0.3 * flicker) * Math.min(1, glow));
        const jawOpen = Clamp(this.boneMap.jaw.rotation.x, 0, 1);
        m.coreMouth.color.setRGB(1.6, 0.45, 0.08).multiplyScalar((0.25 + jawOpen * 2.5) * glow);
        const rockGlow = 1.1 * Math.min(1.6, glow) * (0.8 + 0.2 * Math.sin(time * 1.3));
        m.rock.emissiveIntensity = rockGlow;
        m.rockFine.emissiveIntensity = rockGlow;
        for (const sprite of this.glowSpriteList)
        {
            sprite.scale.setScalar(sprite.userData.baseScale * (0.75 + 0.3 * pulse * Math.min(glow, 2)));
            sprite.material.opacity = Clamp(glow, 0, 1);
        }
        m.coreChest.map.offset.set(time * 0.05, time * 0.13);
        m.coreHammer.map.offset.set(-time * 0.07, time * 0.11);
        m.coreFire.map.offset.set(time * 0.02, -time * 0.2);
        m.coreMouth.map.offset.set(time * 0.04, time * 0.08);
        // 齿轮转动 (啮合齿轮按齿数比反向)
        const gearFactor = deltaTime * gearSpeed * 1.6 * Clamp(glow, 0, 1.6);
        for (const gear of this.gearList)
        {
            gear.mesh.rotation.z += gear.speed * gearFactor;
        }
        // 压力表指针
        for (const gauge of this.gaugeList)
        {
            const value = Clamp(gauge.base + 0.1 * Math.sin(time * gauge.speed + gauge.phase) + 0.03 * Math.sin(time * 9.7 + gauge.phase) + (this.steam - 1) * 0.08, 0.02, 0.98) * Math.min(1, glow + 0.05);
            gauge.needle.rotation.z = -(Math.PI * 0.75 + Math.PI * 1.5 * value);
        }
    }

    UpdatePistons()
    {
        for (const piston of this.pistonList)
        {
            piston.Update();
        }
    }

    //#endregion
}

//#endregion

//#region ==================== 姿态通道与动作状态机 ====================

const k_RotBoneList = ['root', 'pelvis', 'spine', 'chest', 'neck', 'head', 'jaw', 'shoulderL', 'upperArmL', 'foreArmL', 'handL', 'shoulderR', 'upperArmR', 'foreArmR', 'handR', 'grip', 'thighL', 'shinL', 'footL', 'thighR', 'shinR', 'footR', 'backpack'];
const k_ScalarList = ['posX', 'posY', 'posZ', 'curlL', 'curlR', 'thumbL', 'thumbR', 'lidU', 'lidL', 'glow', 'steam'];
const k_PoseSize = k_RotBoneList.length * 3 + k_ScalarList.length;
const k_ChannelMap = {};
k_RotBoneList.forEach((name, index) =>
{
    k_ChannelMap[name] = index * 3;
});
k_ScalarList.forEach((name, index) =>
{
    k_ChannelMap[name] = k_RotBoneList.length * 3 + index;
});

function CreatePose(base, overrides)
{
    const pose = new Float32Array(k_PoseSize);
    if (base)
    {
        pose.set(base);
    }
    else
    {
        pose[k_ChannelMap.glow] = 1;
        pose[k_ChannelMap.steam] = 1;
        pose[k_ChannelMap.curlL] = 0.35;
        pose[k_ChannelMap.curlR] = 0.35;
    }
    if (overrides)
    {
        for (const key in overrides)
        {
            const offset = k_ChannelMap[key];
            if (offset === undefined)
            {
                console.warn(`[Pose](CreatePose) 未知姿态通道: ${key}`);
                continue;
            }
            const value = overrides[key];
            if (Array.isArray(value))
            {
                pose[offset] = value[0];
                pose[offset + 1] = value[1];
                pose[offset + 2] = value[2];
            }
            else
            {
                pose[offset] = value;
            }
        }
    }
    return pose;
}

function BlendPose(out, a, b, t)
{
    for (let i = 0; i < k_PoseSize; i++)
    {
        out[i] = a[i] + (b[i] - a[i]) * t;
    }
    return out;
}

function AddRotation(pose, name, x, y, z)
{
    const offset = k_ChannelMap[name];
    pose[offset] += x;
    pose[offset + 1] += y;
    pose[offset + 2] += z;
}

function AddScalar(pose, name, value)
{
    pose[k_ChannelMap[name]] += value;
}

function SetScalar(pose, name, value)
{
    pose[k_ChannelMap[name]] = value;
}

const k_EaseMap =
{
    linear: (t) => t,
    inOut: (t) => t * t * (3 - 2 * t),
    in: (t) => t * t * t,
    out: (t) => 1 - Math.pow(1 - t, 3),
    back: (t) =>
    {
        const c = 1.70158;
        const u = t - 1;
        return 1 + (c + 1) * u * u * u + c * u * u;
    }
};

function Key(t, pose, ease = 'inOut')
{
    return { t: t, pose: pose, ease: ease };
}

// 待机基础姿态: 驼背前倾, 右手将蒸汽锤扛在肩上
const k_PoseIdle = CreatePose(null,
{
    pelvis: [0.08, 0, 0],
    spine: [0.1, 0, 0],
    chest: [0.14, 0, 0],
    neck: [-0.12, 0, 0],
    head: [-0.14, 0, 0],
    jaw: [0.03, 0, 0],
    upperArmL: [-0.42, 0.1, 0.2],
    foreArmL: [-0.4, 0, 0],
    handL: [0, 0, 0.05],
    upperArmR: [-0.93, 0.31, -0.71],
    foreArmR: [-2.57, 0, 0],
    grip: [0.18, -0.67, 0.76],
    thighL: [-0.12, -0.12, 0.1],
    shinL: [0.22, 0, 0],
    footL: [-0.18, 0.12, -0.1],
    thighR: [-0.12, 0.12, -0.1],
    shinR: [0.22, 0, 0],
    footR: [-0.18, -0.12, 0.1],
    posY: -0.03,
    curlL: 0.45,
    curlR: 1.0,
    thumbL: 0.3,
    thumbR: 0.9
});

function Idle(overrides)
{
    return CreatePose(k_PoseIdle, overrides);
}

// 呼吸叠加层
function ApplyBreath(pose, time, weight)
{
    const breath = Math.sin(time * 1.7) * weight;
    AddRotation(pose, 'chest', 0.025 * breath, 0, 0);
    AddRotation(pose, 'spine', 0.01 * breath, 0, 0);
    AddRotation(pose, 'shoulderL', 0, 0, -0.02 * breath);
    AddRotation(pose, 'shoulderR', 0, 0, 0.02 * breath);
    AddRotation(pose, 'head', -0.02 * breath, 0, 0);
    AddRotation(pose, 'jaw', 0.015 * (breath + weight), 0, 0);
}

function BuildActionMap()
{
    const actionMap = {};

    //#region 循环动作: 待机 / 行走 / 奔跑

    actionMap.idle =
    {
        id: 'idle', label: '待机', loop: true, period: 4.0, blendIn: 0.35,
        phaseName: '呼吸循环',
        eventList: [],
        Sample: (time, out) =>
        {
            out.set(k_PoseIdle);
            const sway = Math.sin(time * 0.5);
            AddRotation(out, 'pelvis', 0, 0, 0.02 * sway);
            AddScalar(out, 'posX', 0.03 * sway);
            AddRotation(out, 'chest', 0, 0, -0.025 * sway);
            AddRotation(out, 'head', 0.03 * Math.sin(time * 0.29), 0.16 * Math.sin(time * 0.37) + 0.08 * Math.sin(time * 0.13), 0.03 * Math.sin(time * 0.23));
            AddRotation(out, 'upperArmR', 0.025 * Math.sin(time * 1.7 + 0.5), 0, 0);
            AddRotation(out, 'upperArmL', 0.03 * Math.sin(time * 0.8), 0, 0.02 * Math.sin(time * 0.6));
            AddScalar(out, 'curlL', 0.08 * Math.sin(time * 0.9));
        }
    };

    const walkBase = Idle({ spine: [0.12, 0, 0], chest: [0.2, 0, 0], neck: [-0.14, 0, 0], head: [-0.2, 0, 0] });
    actionMap.walk =
    {
        id: 'walk', label: '行走', loop: true, period: 1.25, blendIn: 0.3,
        phaseName: '步态循环',
        eventList: [{ t: 0.25, name: 'stepL' }, { t: 0.75, name: 'stepR' }],
        Sample: (time, out) =>
        {
            const phase = time / 1.25 * k_TwoPi;
            const s = Math.sin(phase);
            const c = Math.cos(phase);
            out.set(walkBase);
            const thighL = -0.42 * s;
            const thighR = 0.42 * s;
            const kneeL = 0.7 * Math.pow(Math.max(0, c), 1.5);
            const kneeR = 0.7 * Math.pow(Math.max(0, -c), 1.5);
            AddRotation(out, 'thighL', thighL, 0, 0);
            AddRotation(out, 'thighR', thighR, 0, 0);
            AddRotation(out, 'shinL', kneeL, 0, 0);
            AddRotation(out, 'shinR', kneeR, 0, 0);
            AddRotation(out, 'footL', -(thighL + kneeL) * 0.85, 0, 0);
            AddRotation(out, 'footR', -(thighR + kneeR) * 0.85, 0, 0);
            AddRotation(out, 'pelvis', 0.02 * Math.cos(2 * phase), -0.12 * s, 0.04 * c);
            AddRotation(out, 'chest', 0.03 * Math.cos(2 * phase), 0.16 * s, -0.03 * c);
            AddRotation(out, 'head', 0, -0.06 * s, 0.02 * c);
            AddRotation(out, 'upperArmL', 0.38 * s, 0, 0);
            AddRotation(out, 'foreArmL', -0.15 - 0.25 * Math.max(0, -s), 0, 0);
            AddRotation(out, 'upperArmR', 0.05 * s, 0, 0);
            AddScalar(out, 'posY', -0.04 + 0.05 * Math.cos(2 * phase));
            AddScalar(out, 'posX', -0.07 * c);
        }
    };

    const runBase = Idle({ pelvis: [0.2, 0, 0], spine: [0.18, 0, 0], chest: [0.28, 0, 0], neck: [-0.25, 0, 0], head: [-0.3, 0, 0], upperArmL: [-0.5, 0, 0.25], foreArmL: [-1.3, 0, 0], curlL: 1.0, steam: 1.8 });
    actionMap.run =
    {
        id: 'run', label: '奔跑', loop: true, period: 0.7, blendIn: 0.25,
        phaseName: '冲刺循环',
        eventList: [{ t: 0.25, name: 'stepL' }, { t: 0.75, name: 'stepR' }],
        Sample: (time, out) =>
        {
            const phase = time / 0.7 * k_TwoPi;
            const s = Math.sin(phase);
            const c = Math.cos(phase);
            out.set(runBase);
            const thighL = -0.75 * s;
            const thighR = 0.75 * s;
            const kneeL = 1.35 * Math.pow(Math.max(0, c), 1.2) + 0.15;
            const kneeR = 1.35 * Math.pow(Math.max(0, -c), 1.2) + 0.15;
            AddRotation(out, 'thighL', thighL, 0, 0);
            AddRotation(out, 'thighR', thighR, 0, 0);
            AddRotation(out, 'shinL', kneeL, 0, 0);
            AddRotation(out, 'shinR', kneeR, 0, 0);
            AddRotation(out, 'footL', -(thighL + kneeL) * 0.6, 0, 0);
            AddRotation(out, 'footR', -(thighR + kneeR) * 0.6, 0, 0);
            AddRotation(out, 'pelvis', 0, -0.18 * s, 0.05 * c);
            AddRotation(out, 'chest', 0.04 * Math.cos(2 * phase), 0.22 * s, -0.04 * c);
            AddRotation(out, 'head', 0.04 * Math.cos(2 * phase), -0.1 * s, 0);
            AddRotation(out, 'upperArmL', 0.75 * s, 0, 0);
            AddRotation(out, 'foreArmL', -0.2 * Math.max(0, s), 0, 0);
            AddRotation(out, 'upperArmR', 0.08 * s, 0, 0);
            AddScalar(out, 'posY', -0.13 - 0.07 * Math.cos(2 * phase));
            AddScalar(out, 'posX', -0.06 * c);
        }
    };

    //#endregion

    //#region 跳跃 / 落地

    const jumpTouch = Idle({ pelvis: [0.2, 0, 0], spine: [0.15, 0, 0], chest: [0.2, 0, 0], thighL: [-0.45, -0.1, 0.12], shinL: [0.6, 0, 0], footL: [-0.35, 0.1, -0.12], thighR: [-0.45, 0.1, -0.12], shinR: [0.6, 0, 0], footR: [-0.35, -0.1, 0.12], upperArmL: [-0.8, 0, 0.75], foreArmL: [-0.4, 0, 0], posY: 0.0 });
    actionMap.jump =
    {
        id: 'jump', label: '跳跃', loop: false, duration: 1.32, blendIn: 0.15, next: 'land',
        phaseList: [{ t: 0, name: '下蹲蓄力' }, { t: 0.3, name: '蒸汽起跳' }, { t: 0.5, name: '滞空' }, { t: 1.1, name: '下落' }],
        eventList: [{ t: 0.42, name: 'takeoff' }],
        keyList:

        phaseList: [{ t: 0, name: '踉跄' }, { t: 0.4, name: '跪倒' }, { t: 1.2, name: '倒伏' }, { t: 2.4, name: '熄火' }, { t: 3.0, name: '残骸 (即将重启)' }],
        eventList: [{ t: 1.2, name: 'deathKnees' }, { t: 2.0, name: 'deathSlump' }, { t: 2.6, name: 'powerDown' }],
        keyList: [Key(0, Idle()), Key(0.4, deathStagger, 'out'), Key(1.2, deathKneel, 'in'), Key(2.0, deathSlump), Key(3.0, deathEnd, 'out')]
    };

    //#endregion

    return actionMap;
}

// 动作状态机: 循环/非循环动作、关键帧采样、交叉淡入、事件派发、自动回到待机
class Animator
{
    constructor(actionMap)
    {
        this.m_ActionMap = actionMap;
        this.m_Current = actionMap.idle;
        this.m_Time = 0;
        this.m_GlobalTime = 0;
        this.m_FromPose = CreatePose(k_PoseIdle);
        this.m_TargetPose = CreatePose(k_PoseIdle);
        this.pose = CreatePose(k_PoseIdle);
        this.m_BlendTime = 1;
        this.m_BlendDuration = 0;
        this.m_FiredSet = new Set();
        this.onEvent = null;
        this.onStateChange = null;
    }

    get CurrentAction()
    {
        return this.m_Current;
    }

    get StateTime()
    {
        return this.m_Time;
    }

    get Progress()
    {
        const action = this.m_Current;
        if (action.loop)
        {
            return (this.m_Time / action.period) % 1;
        }
        return Clamp(this.m_Time / (action.duration + (action.hold || 0)), 0, 1);
    }

    get PhaseName()
    {
        const action = this.m_Current;
        if (action.loop)
        {
            return action.phaseName;
        }
        let name = action.phaseList[0].name;
        for (const phase of action.phaseList)
        {
            if (this.m_Time >= phase.t)
            {
                name = phase.name;
            }
        }
        return name;
    }

    Play(id, blendOverride)
    {
        const action = this.m_ActionMap[id];
        if (!action)
        {
            console.warn(`[Animator](Play) 未找到动作: ${id}`);
            return;
        }
        this.m_FromPose.set(this.pose);
        this.m_BlendDuration = blendOverride !== undefined ? blendOverride : action.blendIn;
        this.m_BlendTime = 0;
        this.m_Current = action;
        this.m_Time = 0;
        this.m_FiredSet.clear();
        console.log(`[Animator](Play) 切换动作 → ${action.label} (${action.id})`);
        if (this.onStateChange)
        {
            this.onStateChange(action);
        }
    }

    SampleKeys(action, time, out)
    {
        const keyList = action.keyList;
        if (time <= keyList[0].t)
        {
            out.set(keyList[0].pose);
            return;
        }
        for (let i = 0; i < keyList.length - 1; i++)
        {
            const a = keyList[i];
            const b = keyList[i + 1];
            if (time < b.t)
            {
                const u = (time - a.t) / Math.max(1e-5, b.t - a.t);
                BlendPose(out, a.pose, b.pose, k_EaseMap[b.ease](Clamp(u, 0, 1)));
                return;
            }
        }
        out.set(keyList[keyList.length - 1].pose);
    }

    FireEvent(name)
    {
        if (this.onEvent)
        {
            this.onEvent(name, this.m_Current);
        }
    }

    Update(deltaTime)
    {
        const action = this.m_Current;
        const previousTime = this.m_Time;
        this.m_Time += deltaTime;
        this.m_GlobalTime += deltaTime;
        const target = this.m_TargetPose;
        if (action.loop)
        {
            action.Sample(this.m_Time, target);
            const previousCycle = previousTime / action.period;
            const currentCycle = this.m_Time / action.period;
            for (const event of action.eventList)
            {
                if (Math.floor(currentCycle - event.t) > Math.floor(previousCycle - event.t))
                {
                    this.FireEvent(event.name);
                }
            }
        }
        else
        {
            const t = Math.min(this.m_Time, action.duration);
            this.SampleKeys(action, t, target);
            if (action.Extra)
            {
                action.Extra(t, target);
            }
            action.eventList.forEach((event, index) =>
            {
                if (!this.m_FiredSet.has(index) && this.m_Time >= event.t)
                {
                    this.m_FiredSet.add(index);
                    this.FireEvent(event.name);
                }
            });
            if (this.m_Time >= action.duration + (action.hold || 0))
            {
                const nextId = action.next || 'idle';
                this.Play(nextId, action.exitBlend);
                return this.pose;
            }
        }
        ApplyBreath(target, this.m_GlobalTime, action.breath !== undefined ? action.breath : 1);
        if (this.m_BlendTime < this.m_BlendDuration)
        {
            this.m_BlendTime += deltaTime;
            const weight = k_EaseMap.inOut(Clamp(this.m_BlendTime / this.m_BlendDuration, 0, 1));
            BlendPose(this.pose, this.m_FromPose, target, weight);
        }
        else
        {
            this.pose.set(target);
        }
        return this.pose;
    }
}
