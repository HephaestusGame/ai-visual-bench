function mulberry32(seed) {
  return function () {
    seed |= 0; seed = seed + 0x6D2B79F5 | 0;
    let t = Math.imul(seed ^ seed >>> 15, 1 | seed);
    t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
    return ((t ^ t >>> 14) >>> 0) / 4294967296;
  };
}
function makeCanvas(w, h) {
  const c = document.createElement('canvas');
  c.width = w; c.height = h;
  return [c, c.getContext('2d')];
}
const rgba = (c, a) => `rgba(${c[0] | 0},${c[1] | 0},${c[2] | 0},${a})`;

// soft blotch + streak grunge used for every weathered metal
function grungeCanvas(size, seed, base, blotches, streakCount) {
  const [c, ctx] = makeCanvas(size, size);
  const rnd = mulberry32(seed);
  ctx.fillStyle = rgba(base, 1);
  ctx.fillRect(0, 0, size, size);
  for (const b of blotches) {
    for (let i = 0; i < b.count; i++) {
      const x = rnd() * size, y = rnd() * size;
      const r = b.rMin + rnd() * (b.rMax - b.rMin);
      const g = ctx.createRadialGradient(x, y, 0, x, y, r);
      g.addColorStop(0, rgba(b.color, b.a));
      g.addColorStop(1, rgba(b.color, 0));
      ctx.fillStyle = g;
      ctx.fillRect(x - r, y - r, 2 * r, 2 * r);
    }
  }
  for (let i = 0; i < streakCount; i++) {
    const x = rnd() * size, y = rnd() * size;
    const a = rnd() * Math.PI, len = 20 + rnd() * 120;
    ctx.strokeStyle = rgba(rnd() < 0.5 ? [255, 255, 255] : [0, 0, 0], 0.03 + rnd() * 0.05);
    ctx.lineWidth = 0.5 + rnd() * 1.5;
    ctx.beginPath();
    ctx.moveTo(x, y);
    ctx.lineTo(x + Math.cos(a) * len, y + Math.sin(a) * len);
    ctx.stroke();
  }
  return c;
}
function canvasTexture(canvas, { srgb = false, repeat = null } = {}) {
  const t = new THREE.CanvasTexture(canvas);
  if (srgb) t.colorSpace = THREE.SRGBColorSpace;
  t.wrapS = t.wrapT = THREE.RepeatWrapping;
  if (repeat) t.repeat.set(repeat[0], repeat[1]);
  t.anisotropy = 8;
  return t;
}

// ---- amber compound eye: hexagonal facets ----
function eyeCanvas() {
  const [c, ctx] = makeCanvas(256, 256);
  const rnd = mulberry32(7);
  ctx.fillStyle = '#4a2300';
  ctx.fillRect(0, 0, 256, 256);
  const s = 13;                                    // hex radius
  for (let row = -1; row < 256 / s + 1; row++) {
    for (let col = -1; col < 256 / (s * 1.73) + 1; col++) {
      const cx = col * s * 1.732 + (row % 2 ? s * 0.866 : 0);
      const cy = row * s * 1.5;
      const l = 26 + rnd() * 26;                   // amber lightness variance
      ctx.fillStyle = `hsl(35,92%,${l}%)`;
      ctx.strokeStyle = 'rgba(255,214,140,0.35)';
      ctx.lineWidth = 1;
      ctx.beginPath();
      for (let k = 0; k < 6; k++) {
        const a = Math.PI / 6 + k * Math.PI / 3;
        const x = cx + Math.cos(a) * s * 0.92, y = cy + Math.sin(a) * s * 0.92;
        k ? ctx.lineTo(x, y) : ctx.moveTo(x, y);
      }
      ctx.closePath();
      ctx.fill(); ctx.stroke();
    }
  }
  return c;
}
const eyeTex = canvasTexture(eyeCanvas(), { srgb: true, repeat: [4, 3] });

  const [c, ctx] = makeCanvas(512, 256);

  else      { ctx.fillStyle = '#f7f2e6'; ctx.fillRect(0, 0, 512, 256); }
  ctx.lineCap = 'round';
  const vein = (x1, y1, x2, y2, w) => {
    ctx.strokeStyle = bump ? `rgba(255,255,255,0.9)` : `rgba(150,108,52,0.55)`;
    ctx.lineWidth = w;
    ctx.beginPath(); ctx.moveTo(x1, y1); ctx.lineTo(x2, y2); ctx.stroke();
  };
  vein(6, 128, 506, 118, 4);                                   // main vein
  for (let i = 0; i < 14; i++) {                               // branching veins
    const x = 30 + i * 34;
    const splay = 0.35 + rnd() * 0.55;
    vein(x, 126, x + 26 + rnd() * 14, 128 - 105 * splay, 2);   // up
    vein(x + 8, 130, x + 34 + rnd() * 14, 128 + 100 * splay, 2); // down
  }
  vein(6, 20, 500, 30, 3);                                     // leading edge
  vein(6, 232, 500, 215, 3);                                   // trailing edge
  return c;
}

  const [c, ctx] = makeCanvas(1024, 1024);

  ctx.strokeStyle = 'rgba(120,140,170,0.10)';
  for (let r = 40; r < 720; r += 40) {
    ctx.lineWidth = r % 120 === 0 ? 2 : 1;
    ctx.beginPath(); ctx.arc(512, 512, r, 0, Math.PI * 2); ctx.stroke();
  }
  ctx.strokeStyle = 'rgba(120,140,170,0.05)';
  for (let a = 0; a < 24; a++) {
    ctx.beginPath();
    ctx.moveTo(512 + Math.cos(a / 24 * Math.PI * 2) * 60, 512 + Math.sin(a / 24 * Math.PI * 2) * 60);
    ctx.lineTo(512 + Math.cos(a / 24 * Math.PI * 2) * 700, 512 + Math.sin(a / 24 * Math.PI * 2) * 700);
    ctx.stroke();
  }
  return c;
}

// Deterministic gear: pitch radius R = N*p/(2π), chunky trapezoid teeth.
function gearGeometry(N, p, th, { hole, spokes } = {}) {
  const R = N * p / (2 * Math.PI);
  const depth = p * 0.62;
  const outer = R + depth / 2, root = R - depth / 2;
  const step = 2 * Math.PI / N;
  const tipFrac = 0.26, rootFrac = 0.54;
  const shape = new THREE.Shape();
  for (let i = 0; i < N; i++) {
    const c = i * step;
    const pts = [
      [root, c - step * rootFrac / 2],
      [outer, c - step * tipFrac / 2],
      [outer, c + step * tipFrac / 2],
      [root, c + step * rootFrac / 2],
      [root, c + step / 2]
    ];
    for (let k = 0; k < pts.length; k++) {
      const x = Math.cos(pts[k][1]) * pts[k][0];
      const y = Math.sin(pts[k][1]) * pts[k][0];
      (i === 0 && k === 0) ? shape.moveTo(x, y) : shape.lineTo(x, y);
    }
  }
  const holeR = hole !== undefined ? hole : Math.max(0.022, root * 0.17);
  const hub = new THREE.Path();
  hub.absarc(0, 0, holeR, 0, Math.PI * 2, true);
  shape.holes.push(hub);
  const nSpokes = spokes !== undefined ? spokes : (N >= 12 ? 5 : 0);
  if (nSpokes > 0) {
    const midR = (holeR + root) / 2;
    const spokeR = Math.min((root - holeR) * 0.30, Math.PI * midR / nSpokes * 0.34);
    for (let i = 0; i < nSpokes; i++) {
      const a = i / nSpokes * Math.PI * 2 + Math.PI / nSpokes;
      const h = new THREE.Path();
      h.absarc(Math.cos(a) * midR, Math.sin(a) * midR, spokeR, 0, Math.PI * 2, true);
      shape.holes.push(h);
    }
  }
  const geo = new THREE.ExtrudeGeometry(shape, {
    depth: th, bevelEnabled: true, bevelThickness: th * 0.14,
    bevelSize: p * 0.05, bevelSegments: 1, curveSegments: 4 });
  geo.translate(0, 0, -th / 2);
  return { geo, R };
}

// gear with hub + hex nut; returns a Group rotated flat (teeth in XZ plane)
function makeGear(N, p, th, mat) {
  const { geo } = gearGeometry(N, p, th);
  const g = new THREE.Group();
  const wheel = new THREE.Mesh(geo, mat);
  g.add(wheel);
  const holeR = Math.max(0.022, (N * p / (2 * Math.PI) - p * 0.31) * 0.17);
  const hub = new THREE.Mesh(new THREE.CylinderGeometry(holeR * 1.9, holeR * 1.9, th * 2.4, 12), matGold);
  g.add(hub);
  const nut = new THREE.Mesh(new THREE.CylinderGeometry(holeR * 1.05, holeR * 1.05, th * 3.4, 6), matSteel);
  g.add(nut);
  g.rotation.x = -Math.PI / 2;   // lie flat on the thorax, spin around local Z
  return g;
}

// initial rotation of a driven gear so teeth interlock with the driver
function meshRot(rotPrev, Nprev, Nnext, phi) {
  const sA = 2 * Math.PI / Nprev, sB = 2 * Math.PI / Nnext;
  const alpha = (((phi - rotPrev) % sA) + sA) % sA / sA;   // driver tooth phase at mesh line
  const v = phi + Math.PI - (alpha + 0.5) * sB;
  return ((v % sB) + sB) % sB;
}

// tapering helix (antenna springs, spiral stinger)
class HelixCurve extends THREE.Curve {
  constructor(r0, r1, h, turns) { super(); this.r0 = r0; this.r1 = r1; this.h = h; this.turns = turns; }
  getPoint(u, target = new THREE.Vector3()) {
    const a = this.turns * Math.PI * 2 * u;
    const r = this.r0 + (this.r1 - this.r0) * u;
    return target.set(Math.cos(a) * r, this.h * u, Math.sin(a) * r);
  }
}

const rivetGeo = new THREE.SphereGeometry(0.016, 8, 8);
function addRivetRing(parent, rx, rz, y, count, mat) {
  for (let i = 0; i < count; i++) {
    const a = i / count * Math.PI * 2;
    const r = new THREE.Mesh(rivetGeo, mat);
    r.position.set(Math.cos(a) * rx, y, Math.sin(a) * rz);
    r.scale.set(1, 0.7, 1);
    parent.add(r);
  }
}

const gearDefs = [
  // N,  ratioToDriver, pos, material
  { N: 18, ratio: 1.0,    pos: [0, 0.470, 0.10],  mat: matBrass  },  // driver
  { N: 9,  ratio: -2.0,   pos: [0, 0.470, 0.423], mat: matIron   },
  { N: 12, ratio: 1.5,    pos: [-0.25, 0.470, 0.423], mat: matBrass },

];

{
  // solve tooth phases so every wheel interlocks with its driver
  const r = [0, 0, 0, 0, 0];
  r[0] = Math.PI / 18;
  r[1] = meshRot(r[0], 18, 9,  Math.PI / 2);   // B ahead of A (+z)
  r[2] = meshRot(r[1], 9, 12,  Math.PI);       // C beside B  (-x)
  r[3] = meshRot(r[0], 18, 8, -Math.PI / 2);   // D behind A  (-z)
  r[4] = meshRot(r[0], 18, 13, 0);             // E beside A  (+x)

  gearDefs.forEach((d, i) => {

}

/* ---------------- 5c. WINGS (4 rigs, iridescent) ---------------- */
function wingShapeGeo(len, wide) {
  const s = new THREE.Shape();
  s.moveTo(0, 0);
  s.lineTo(0.22 * len, 0.30 * wide);
  s.bezierCurveTo(0.62 * len, 0.34 * wide, 0.9 * len, 0.16 * wide, len, -0.02 * wide);
  s.bezierCurveTo(0.94 * len, -0.34 * wide, 0.5 * len, -0.46 * wide, 0.18 * len, -0.30 * wide);
  s.lineTo(0, 0);
  return new THREE.ShapeGeometry(s, 12);
}
// ShapeGeometry UVs equal raw coords — normalize into 0..1
function normalizeUVs(geo) {
  geo.computeBoundingBox();
  const bb = geo.boundingBox;
  const sx = bb.max.x - bb.min.x, sy = bb.max.y - bb.min.y;
  const uv = geo.attributes.uv, pos = geo.attributes.position;
  for (let i = 0; i < uv.count; i++) {
    uv.setXY(i, (pos.getX(i) - bb.min.x) / sx, (pos.getY(i) - bb.min.y) / sy);
  }
  uv.needsUpdate = true;
}
const foreWingGeo = wingShapeGeo(1.55, 1.0);
const hindWingGeo = wingShapeGeo(1.02, 0.9);
normalizeUVs(foreWingGeo);
normalizeUVs(hindWingGeo);

function buildWingRig(anchor, geo, isLeft) {
  const root = new THREE.Group();
  root.position.copy(anchor);
  if (isLeft) root.rotation.y = Math.PI;          // mirror the whole rig
  thorax.add(root);

  const sweep = new THREE.Group(); root.add(sweep);
  const flap = new THREE.Group(); sweep.add(flap);
  const twist = new THREE.Group(); flap.add(twist);

  const hinge = M(new THREE.SphereGeometry(0.062, 12, 10), matSteel);
  flap.add(hinge);
  const spar = M(cylinder(0.014, 0.008, 0.42, 8), matBrass);
  spar.rotation.z = -Math.PI / 2;
  spar.position.x = 0.21;
  flap.add(spar);

  const membrane = M(geo, matWing);
  membrane.rotation.x = Math.PI / 2;              // lie flat, leading edge +Z
  twist.add(membrane);
  return { root, sweep, flap, twist, isLeft };
}
const wingRigs = [

}

function buildLeg(anchorZ, isLeft) {

  const kneeRing = M(new THREE.TorusGeometry(0.050, 0.014, 8, 16), matBrass);
  kneeRing.rotation.x = Math.PI / 2;

/* ================================================================
   6. EXPLODED VIEW SYSTEM
================================================================ */
const V3 = (x, y, z) => new THREE.Vector3(x, y, z);
const explodeParts = [];
const dotGeo = new THREE.SphereGeometry(0.014, 8, 6);

function registerExplode(object, axial, radial, lineParent = object.parent) {
  const base = object.position.clone();
  const lineGeo = new THREE.BufferGeometry().setFromPoints([base, base]);
  const line = new THREE.Line(lineGeo, lineMat);
  line.visible = false;
  line.frustumCulled = false;
  lineParent.add(line);
  const dot = new THREE.Mesh(dotGeo, dotMat);
  dot.visible = false;
  lineParent.add(dot);
  explodeParts.push({ object, base, axial, radial, line, dot });
}

registerExplode(head,        V3(0, 0, 1.15),  V3(0, 0.15, 0));
eyes.forEach(e => registerExplode(e, V3(0, 0, 0.45), V3(Math.sign(e.position.x) * 0.55, 0.12, 0.30)));
antennaRoots.forEach(a => registerExplode(a.root, V3(0, 0.25, 0.45), V3(a.side * 0.35, 0.6, 0.1)));
mandibles.forEach(m => registerExplode(m.group, V3(0, 0, 0.5), V3(m.side * 0.22, -0.38, 0.35)));
registerExplode(canopy,      V3(0, 0.35, 0),   V3(0, 0.95, 0));
gears.forEach((g, i) => registerExplode(g.group, V3(0, 0.3, 0), V3(0, 0.7 + i * 0.12, 0)));
shoulderGears.forEach(g => registerExplode(g.group, V3(0, 0.55, 0), V3(g.side * 0.45, 0.35, g.hind ? -0.2 : 0.1)));
pistons.forEach((p, i) => registerExplode(p.rod, V3(0, 0.3, 0), V3((i ? -1 : 1) * 0.55, 0.45, 0.15)));
wingRigs.forEach((w, i) => registerExplode(
  w.root, V3(0, 0.4, -0.1), V3((w.isLeft ? -1 : 1) * 0.95, 0.4, isHind(i) ? -0.25 : -0.05)));
legs.forEach(l => registerExplode(
  l.rig.root, V3(0, -0.15, 0), V3((l.rig.root.rotation.y ? -1 : 1) * 0.55, -0.5, 0)));
registerExplode(petiole,     V3(0, 0, -0.18),  V3(0, 0.1, 0));
abdSegments.forEach((s, i) => registerExplode(s, V3(0, 0, -(0.30 + i * 0.33)), V3(0, 0.26, 0)));
registerExplode(core,        V3(0, 0, -0.6),   V3(0, 1.15, 0));
registerExplode(stinger,     V3(0, 0, -1.6),   V3(0, 0.28, 0));

const _dir = new THREE.Vector3();
function updateExplode() {
  const t = explodeCur;
  const eased = t * t * (3 - 2 * t);
  const show = t > 0.02;
  lineMat.opacity = 0.85 * t;
  dotMat.opacity = 0.9 * t;
  for (const p of explodeParts) {
    if (params.axis === 'Axial') _dir.copy(p.axial);
    else if (params.axis === 'Radial') _dir.copy(p.radial);
    else _dir.copy(p.axial).add(p.radial);
    p.object.position.copy(p.base).addScaledVector(_dir, eased);
    const posAttr = p.line.geometry.attributes.position;
    posAttr.setXYZ(1, p.object.position.x, p.object.position.y, p.object.position.z);
    posAttr.needsUpdate = true;
    p.dot.position.copy(p.object.position);
    p.line.visible = show;
    p.dot.visible = show;
  }
}

/* ================================================================
   8. ANIMATION LOOP
================================================================ */
const clock = new THREE.Clock();
const lerp = THREE.MathUtils.lerp;

function animate() {
  const dt = Math.min(clock.getDelta(), 0.05);
  simTime += dt;

  // smoothed control states
  flightBlend += ((params.mode === 'Flight' ? 1 : 0) - flightBlend) * Math.min(1, dt * 3);
  explodeCur += (params.explode - explodeCur) * Math.min(1, dt * 5);
  const idle = 1 - flightBlend;

  // ---- wing flapping (0–60 Hz) ----
  flapPhase += dt * params.freq * Math.PI * 2 * flightBlend;
  wingRigs.forEach((w, i) => {
    const hind = isHind(i);
    const phase = flapPhase - (hind ? 0.45 : 0);
    const amp = (hind ? 0.68 : 0.82) * flightBlend;
    const foldZ = -0.28 * idle - 0.05;
    const sweepR = lerp(hind ? 1.45 : 1.25, hind ? -0.02 : -0.14, flightBlend);
    w.sweep.rotation.y = sweepR;
    w.flap.rotation.z = Math.sin(phase) * amp + foldZ;
    w.twist.rotation.x = Math.cos(phase - 0.9) * 0.30 * flightBlend;
  });
  shoulderGears.forEach(g => {
    g.group.rotation.z = flapPhase - (g.hind ? 0.45 : 0) + Math.PI / 8;
  });

  // ---- gear train ----
  gearAngle += dt * params.gearSpeed * (1.0 + (params.freq / 60) * 3.5 * flightBlend);
  gears.forEach(g => { g.group.rotation.z = g.phase0 + g.ratio * gearAngle; });

  // ---- pistons beat with the flap ----
  pistons.forEach((p, i) => {
    p.rod.position.y = p.baseY + Math.sin(flapPhase + i * Math.PI) * 0.028 - 0.008;
  });

  // ---- body motion ----
  const bob = Math.sin(simTime * 2.1) * 0.05 * flightBlend + Math.sin(simTime * 1.1) * 0.015 * idle;
  bee.position.y = 1.5 + bob * (1 - explodeCur * 0.5);
  bee.rotation.z = Math.sin(simTime * 1.7) * 0.03 * flightBlend;
  bee.rotation.x = Math.sin(simTime * 1.3 + 1) * 0.025 * flightBlend;
  bee.rotation.y = Math.sin(simTime * 0.4) * 0.07 * idle;

  // articulated head: looks around when idle, vibrates in flight
  head.rotation.y = Math.sin(simTime * 0.55) * 0.28 * idle
                  + Math.sin(simTime * 9.3) * 0.012 * flightBlend;
  head.rotation.x = Math.sin(simTime * 0.9 + 2) * 0.05 * idle;

  // antennae: lazy sway idle, fast tremor in flight
  antennaRoots.forEach((a, i) => {
    a.root.rotation.x = -0.45 + Math.sin(simTime * 2.6 + i) * 0.16 * idle
                      + Math.sin(simTime * 12 + i * 2) * 0.06 * flightBlend;
    a.root.rotation.z = a.side * (0.55 + Math.sin(simTime * 2.2 + i) * 0.10);
  });

  // mandibles occasionally clamp at idle
  mandibles.forEach(m => {
    m.group.rotation.x = 0.05 + Math.pow(Math.max(0, Math.sin(simTime * 0.53 + m.side)), 14) * 0.35 * idle;
  });

  // ---- legs ----
  legs.forEach(l => {
    const f = legFlight[l.pose], d = legIdle[l.pose];
    l.rig.femur.rotation.z = lerp(d.fz, f.fz, flightBlend);
    l.rig.femur.rotation.x = lerp(d.fx, f.fx, flightBlend)
      + Math.sin(simTime * 3 + l.pose) * 0.03 * idle;
    l.rig.tibia.rotation.z = lerp(d.tz, f.tz, flightBlend);
    l.rig.tibia.rotation.x = lerp(d.tx, f.tx, flightBlend);
    l.rig.tarsus.rotation.z = lerp(d.rs, f.rs, flightBlend);
  });

  // ---- abdomen: breathing + power core ----
  const breathe = 1 + Math.sin(simTime * 2.4) * 0.02 * idle;
  abdomen.scale.set(1, breathe, 1);
  const pulse = 0.75 + 0.25 * Math.sin(simTime * (3.2 + 2.5 * flightBlend));
  matCore.emissiveIntensity = 1.6 + 1.6 * pulse;
  coreLight.intensity = 1.5 + 3.5 * pulse;
  gyro1.rotation.x += dt * 1.6 * params.gearSpeed;
  gyro1.rotation.y += dt * 0.7 * params.gearSpeed;
  gyro2.rotation.z += dt * 1.1 * params.gearSpeed;
  stinger.rotation.z += dt * 4 * params.gearSpeed * flightBlend;   // drill spin

  updateExplode();
  controls.update();
  renderer.render(scene, camera);
}
renderer.setAnimationLoop(animate);
