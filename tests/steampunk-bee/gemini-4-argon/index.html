            rivet.position.set(
              Math.sin(a) * def.rBack * 1.05,
              Math.cos(a) * def.rBack * 0.89,
              def.len * 0.46
            );
            dorsalGroup.add(rivet);
          }

          segGroup.add(dorsalGroup);
          // Register dorsal hood to lift radially in exploded view
          this.m_RegisterExplodePart(
            dorsalGroup,
            new THREE.Vector3(0, 0.45 + i * 0.08, 0.1 * i),
            new THREE.Vector3(0, 0.22, 0),
            false
          );

          // B. Ventral Sternite Belly Plate
          const ventralGroup = new THREE.Group();
          const sterniteGeo = new THREE.CylinderGeometry(
            def.rFront * 0.96,
            def.rBack * 0.96,
            def.len * 0.92,
            20,
            1,
            true,
            Math.PI * 0.58,
            Math.PI * 0.84
          );
          const sterniteMesh = new THREE.Mesh(sterniteGeo, this.m_Materials.darkBronze);
          sterniteMesh.rotation.x = Math.PI * 0.5;
          sterniteMesh.scale.set(1.02, 1.0, 0.86);
          sterniteMesh.castShadow = true;
          ventralGroup.add(sterniteMesh);

          // Lateral Spiracle Steam Relief Valves (left & right)
          for (let side of [-1, 1]) {
            const spiracleValve = new THREE.Mesh(
              new THREE.CylinderGeometry(0.032, 0.042, 0.08, 12),
              this.m_Materials.polishedBrass
            );
            spiracleValve.rotation.z = -side * Math.PI * 0.5;
            spiracleValve.position.set(side * ((def.rFront + def.rBack) * 0.52), -0.05, 0);
            ventralGroup.add(spiracleValve);
          }

          segGroup.add(ventralGroup);
          this.m_RegisterExplodePart(
            ventralGroup,
            new THREE.Vector3(0, -0.42 - i * 0.05, 0.08 * i),
            new THREE.Vector3(0, -0.18, 0),
            false
          );

          abdomenMaster.add(segGroup);
          this.m_AbdomenSegments.push({
            group: segGroup,
            basePos: segGroup.position.clone(),
            index: i
          });

          // Register entire segment for axial telescoping and radial expansion
          this.m_RegisterExplodePart(
            segGroup,
            new THREE.Vector3(0, -0.05 * i, (i + 1) * 0.34),
            new THREE.Vector3(0, -0.04 * i, (i + 1) * 0.58),
            true
          );
        }

        // 4. Precision Spiral Stinger Assembly at Apex of Segment 5
        this.m_StingerAssembly = new THREE.Group();
        this.m_StingerAssembly.position.set(0, -0.13, 1.86);

        // Telescoping blued-steel base housing
        const stingerCollar = new THREE.Mesh(
          new THREE.CylinderGeometry(0.18, 0.12, 0.18, 18),
          this.m_Materials.bluedSteel
        );
        stingerCollar.rotation.x = Math.PI * 0.5;
        stingerCollar.castShadow = true;
        this.m_StingerAssembly.add(stingerCollar);

        // Glowing amber energy injector ring at stinger root
        const stingerGlowRing = new THREE.Mesh(
          new THREE.TorusGeometry(0.125, 0.022, 10, 20),
          this.m_Materials.powerCore
        );
        stingerGlowRing.position.z = 0.09;
        this.m_StingerAssembly.add(stingerGlowRing);

        // Tapered blued-steel needle core
        const stingerNeedle = new THREE.Mesh(
          new THREE.ConeGeometry(0.105, 0.68, 20),
          this.m_Materials.gunmetalSteel
        );
        stingerNeedle.rotation.x = Math.PI * 0.5;
        stingerNeedle.position.z = 0.42;
        stingerNeedle.castShadow = true;
        this.m_StingerAssembly.add(stingerNeedle);

        // Coiled brass spiral auger thread wrapped around the stinger needle
        class ConicalSpiralCurve extends THREE.Curve {
          getPoint(t, optionalTarget = new THREE.Vector3()) {
            const turns = 7.5;
            const angle = t * turns * Math.PI * 2;
            const radius = (1.0 - t * 0.92) * 0.108;
            const z = 0.09 + t * 0.62;
            return optionalTarget.set(Math.cos(angle) * radius, Math.sin(angle) * radius, z);
          }
        }
        const spiralAugerGeo = new THREE.TubeGeometry(new ConicalSpiralCurve(), 120, 0.012, 8, false);
        const spiralAugerMesh = new THREE.Mesh(spiralAugerGeo, this.m_Materials.polishedBrass);
        spiralAugerMesh.castShadow = true;
        this.m_StingerAssembly.add(spiralAugerMesh);

        abdomenMaster.add(this.m_StingerAssembly);
        this.m_RegisterExplodePart(
          this.m_StingerAssembly,
          new THREE.Vector3(0, -0.28, 2.35),
          new THREE.Vector3(0, -0.22, 3.65),
          true
        );
      }

      /**
       * --------------------------------------------------------------------------
       * F. CYAN CAD LEADER LINES FOR EXPLODED VIEW
       * Connects every exploded component's current world position back to its
       * un-exploded home anchor position on the parent assembly.
       * --------------------------------------------------------------------------
       */
      m_BuildCyanLeaderLines() {
        const leaderItems = this.m_ExplodeRegistry.filter(item => item.includeLeaderLine);
        const count = leaderItems.length;

        const linePositions = new Float32Array(count * 2 * 3);
        this.m_LeaderLineGeometry = new THREE.BufferGeometry();
        this.m_LeaderLineGeometry.setAttribute(
          'position',
          new THREE.BufferAttribute(linePositions, 3)
        );

        const lineMat = new THREE.LineDashedMaterial({
          color: 0x00f2ff,
          dashSize: 0.055,
          gapSize: 0.03,
          transparent: true,
          opacity: 0.0,
          depthWrite: false
        });

        this.m_LeaderLineSegments = new THREE.LineSegments(this.m_LeaderLineGeometry, lineMat);
        this.m_LeaderLineSegments.visible = false;
        this.m_LeaderLineSegments.frustumCulled = false;
        this.m_RootGroup.add(this.m_LeaderLineSegments);

        // Glowing cyan CAD datum nodes at endpoints
        const dotPositions = new Float32Array(count * 2 * 3);
        const dotGeo = new THREE.BufferGeometry();
        dotGeo.setAttribute('position', new THREE.BufferAttribute(dotPositions, 3));
        const dotMat = new THREE.PointsMaterial({
          color: 0x00f2ff,
          size: 0.045,
          transparent: true,
          opacity: 0.0,
          depthWrite: false
        });
        this.m_LeaderAnchorDots = new THREE.Points(dotGeo, dotMat);
        this.m_LeaderAnchorDots.visible = false;
        this.m_LeaderAnchorDots.frustumCulled = false;
        this.m_RootGroup.add(this.m_LeaderAnchorDots);
      }

      /**
       * --------------------------------------------------------------------------
       * G. MAIN FRAME UPDATE (KINEMATICS + EXPLODED VIEW + LEADER LINES)
       * --------------------------------------------------------------------------
       */
      update(deltaTime, config) {
        // 1. Smoothly damp exploded view transition
        this.m_CurrentExplode = THREE.MathUtils.lerp(
          this.m_CurrentExplode,
          config.explodedView,
          Math.min(1.0, deltaTime * 12.0)
        );

        // Smooth blend between Flight (1.0) and Idle (0.0)
        const targetFlightBlend = config.flightMode ? 1.0 : 0.0;
        this.m_FlightBlend = THREE.MathUtils.lerp(
          this.m_FlightBlend,
          targetFlightBlend,
          Math.min(1.0, deltaTime * 6.0)
        );

        // 2. Apply Exploded View Offsets along selected axis ('Radial' or 'Axial')
        const tExplode = this.m_CurrentExplode;
        const axisMode = config.explodeAxis;

        for (let i = 0; i < this.m_ExplodeRegistry.length; i++) {
          const item = this.m_ExplodeRegistry[i];
          const base = item.basePosition;

          let ox = 0, oy = 0, oz = 0;
          if (axisMode === 'Radial') {
            ox = item.radialOffset.x * tExplode;
            oy = item.radialOffset.y * tExplode;
            oz = item.radialOffset.z * tExplode;
          } else if (axisMode === 'Axial') {
            ox = item.axialOffset.x * tExplode;
            oy = item.axialOffset.y * tExplode;
            oz = item.axialOffset.z * tExplode;
          } else {
            // Combined (Radial + Axial)
            ox = (item.radialOffset.x * 0.65 + item.axialOffset.x * 0.65) * tExplode;
            oy = (item.radialOffset.y * 0.65 + item.axialOffset.y * 0.65) * tExplode;
            oz = (item.radialOffset.z * 0.55 + item.axialOffset.z * 0.75) * tExplode;
          }

          item.object.position.set(base.x + ox, base.y + oy, base.z + oz);
        }

        // 3. Advance continuous phase accumulators using deltaTime
        const activeFlapHz = config.flapFrequency * (0.08 + 0.92 * this.m_FlightBlend);
        this.m_WingPhase += deltaTime * activeFlapHz * Math.PI * 2.0;

        const baseGearOmega = (1.2 + 2.8 * this.m_FlightBlend) * config.gearSpeed;
        this.m_GearPhase += deltaTime * baseGearOmega;
        this.m_BodyPhase += deltaTime * (1.5 + 2.2 * this.m_FlightBlend);

        // 4. Subtle Body Hover / Idle Breathing Motion (attenuated slightly when fully exploded)
        const motionScale = 1.0 - tExplode * 0.65;
        const hoverBob = Math.sin(this.m_BodyPhase * 1.4) * (0.025 + 0.075 * this.m_FlightBlend) * motionScale;
        const hoverPitch = Math.sin(this.m_BodyPhase * 0.9) * (0.015 + 0.045 * this.m_FlightBlend) * motionScale;
        const hoverRoll = Math.cos(this.m_BodyPhase * 0.75) * (0.01 + 0.035 * this.m_FlightBlend) * motionScale;

        this.m_RootGroup.position.y = hoverBob;
        this.m_RootGroup.rotation.x = hoverPitch - 0.06 * this.m_FlightBlend * motionScale;
        this.m_RootGroup.rotation.z = hoverRoll;

        // 5. Head, Mandibles & Spring Antennae Kinematics
        if (this.m_HeadGroup) {
          this.m_HeadGroup.rotation.x = Math.sin(this.m_BodyPhase * 1.3) * 0.055 * motionScale;
          this.m_HeadGroup.rotation.y = Math.sin(this.m_BodyPhase * 0.85) * 0.075 * motionScale;
        }

        const antennaVib = Math.sin(this.m_WingPhase * 0.5) * 0.028 * this.m_FlightBlend;
        if (this.m_LeftAntenna) {
          this.m_LeftAntenna.root.rotation.x =
            this.m_LeftAntenna.baseRot.x + Math.sin(this.m_BodyPhase * 1.8) * 0.12 + antennaVib;
          this.m_LeftAntenna.root.rotation.z =
            this.m_LeftAntenna.baseRot.z + Math.cos(this.m_BodyPhase * 1.4) * 0.08;
          this.m_LeftAntenna.tip.rotation.x = 0.72 + Math.sin(this.m_BodyPhase * 2.4) * 0.14;
        }
        if (this.m_RightAntenna) {
          this.m_RightAntenna.root.rotation.x =
            this.m_RightAntenna.baseRot.x + Math.sin(this.m_BodyPhase * 1.8 + 0.9) * 0.12 - antennaVib;
          this.m_RightAntenna.root.rotation.z =
            this.m_RightAntenna.baseRot.z + Math.cos(this.m_BodyPhase * 1.4 + 0.9) * 0.08;
          this.m_RightAntenna.tip.rotation.x = 0.72 + Math.sin(this.m_BodyPhase * 2.4 + 0.9) * 0.14;
        }

        if (this.m_LeftMandible && this.m_RightMandible) {
          const pincerAngle = Math.sin(this.m_BodyPhase * 2.1) * 0.12;
          this.m_LeftMandible.rotation.y = pincerAngle;
          this.m_RightMandible.rotation.y = -pincerAngle;
        }

        // 6. Synchronized Interlocking Clockwork Gears & Steam Pistons
        for (let i = 0; i < this.m_Gears.length; i++) {
          const g = this.m_Gears[i];
          if (g.isOscillating) {
            // Balance wheel oscillates back and forth like a real escapement
            g.mesh.rotation.y = Math.sin(this.m_GearPhase * g.ratio) * 0.85;
          } else {
            g.mesh.rotation.y = this.m_GearPhase * g.ratio + g.phaseOffset;
          }
        }

        for (let i = 0; i < this.m_Pistons.length; i++) {
          const p = this.m_Pistons[i];
          p.mesh.position.z = p.baseZ + Math.sin(this.m_GearPhase * 2.0 + p.phaseOffset) * p.stroke;
        }

        // 7. High-Frequency Figure-8 Mechanical Wing Flapping
        for (let i = 0; i < this.m_Wings.length; i++) {
          const w = this.m_Wings[i];
          const sideSign = w.isRight ? 1 : -1;
          const hindLag = w.isFore ? 0.0 : -0.42;
          const phase = this.m_WingPhase + hindLag;

          // Interpolate baseline posture between Idle (folded back) and Flight (extended)
          const baseX = THREE.MathUtils.lerp(w.idleEuler.x, w.flightEuler.x, this.m_FlightBlend);
          const baseY = THREE.MathUtils.lerp(w.idleEuler.y, w.flightEuler.y, this.m_FlightBlend);
          const baseZ = THREE.MathUtils.lerp(w.idleEuler.z, w.flightEuler.z, this.m_FlightBlend);

          const flapAmp = (w.isFore ? 0.68 : 0.54) * (0.06 + 0.94 * this.m_FlightBlend);
          const featherAmp = (w.isFore ? 0.36 : 0.28) * (0.06 + 0.94 * this.m_FlightBlend);
          const sweepAmp = 0.14 * this.m_FlightBlend;

          // Primary stroke (Z), pronation/supination feathering (X), and figure-8 sweep (Y)
          w.pivot.rotation.z = baseZ + sideSign * Math.sin(phase) * flapAmp;
          w.pivot.rotation.x = baseX + Math.cos(phase) * featherAmp;
          w.pivot.rotation.y = baseY + sideSign * Math.sin(phase * 2.0) * sweepAmp;
        }

        // 8. Articulated 6-Leg Suspension & Servo Kinematics
        for (let i = 0; i < this.m_Legs.length; i++) {
          const leg = this.m_Legs[i];
          const s = leg.side;
          const tripodPhase = this.m_BodyPhase * 1.6 + (leg.index * 1.1) + (s === 1 ? 0 : Math.PI);

          // In Flight: aerodynamic tucked posture; In Idle: poised standing stance
          const femurFlight = -s * 0.22;
          const femurIdle = s * 0.32;
          const tibiaFlight = -s * 0.95;
          const tibiaIdle = -s * 0.38;

          const sway = Math.sin(tripodPhase) * (0.04 + 0.06 * this.m_FlightBlend);
          leg.coxa.rotation.y = leg.baseYaw + Math.cos(tripodPhase) * 0.05;
          leg.femur.rotation.z = THREE.MathUtils.lerp(femurIdle, femurFlight, this.m_FlightBlend) + s * sway;
          leg.tibia.rotation.z = THREE.MathUtils.lerp(tibiaIdle, tibiaFlight, this.m_FlightBlend) - s * sway * 1.3;
          leg.tarsus.rotation.z = s * (0.25 + Math.sin(tripodPhase + 1.0) * 0.08);
        }

        // 9. Abdomen Breathing Articulation, Power Core Pulse & Spiral Stinger Rotation
        for (let i = 0; i < this.m_AbdomenSegments.length; i++) {
          const seg = this.m_AbdomenSegments[i];
          const wave = Math.sin(this.m_BodyPhase * 1.8 - i * 0.45) * 0.025 * (1.0 - tExplode * 0.5);
          seg.group.rotation.x = wave * (i + 1) * 0.35;
        }

        // Gyroscopic rings & pulsing core light
        for (let i = 0; i < this.m_CoreGyroRings.length; i++) {
          const gyro = this.m_CoreGyroRings[i];
          gyro.mesh.rotation.x += deltaTime * gyro.speedX * config.gearSpeed;
          gyro.mesh.rotation.z += deltaTime * gyro.speedZ * config.gearSpeed;
        }

        const corePulse = 0.85 + 0.25 * Math.sin(this.m_GearPhase * 3.0);
        if (this.m_PowerCoreLight) {
          this.m_PowerCoreLight.intensity = (3.8 + 1.8 * this.m_FlightBlend) * corePulse;
        }
        if (this.m_PowerCoreMesh) {
          this.m_PowerCoreMesh.rotation.z += deltaTime * 1.5 * config.gearSpeed;
        }
        if (this.m_StingerAssembly) {
          this.m_StingerAssembly.rotation.z += deltaTime * 3.2 * config.gearSpeed;
        }

        // 10. Update Cyan CAD Leader Lines when Exploded View > 0
        this.m_UpdateLeaderLines(tExplode);
      }

      m_UpdateLeaderLines(tExplode) {
        const showLines = tExplode > 0.004;
        this.m_LeaderLineSegments.visible = showLines;
        this.m_LeaderAnchorDots.visible = showLines;

        if (!showLines) return;

        this.m_RootGroup.updateMatrixWorld(true);
        const rootInverse = new THREE.Matrix4().copy(this.m_RootGroup.matrixWorld).invert();

        const leaderItems = this.m_ExplodeRegistry.filter(item => item.includeLeaderLine);
        const linePosAttr = this.m_LeaderLineGeometry.attributes.position;
        const dotPosAttr = this.m_LeaderAnchorDots.geometry.attributes.position;

        const worldCurrent = new THREE.Vector3();
        const worldOrigin = new THREE.Vector3();
        const parentMatrix = new THREE.Matrix4();

        for (let i = 0; i < leaderItems.length; i++) {
          const item = leaderItems[i];
          const obj = item.object;

          // Current displaced position in root local space
          worldCurrent.setFromMatrixPosition(obj.matrixWorld).applyMatrix4(rootInverse);

          // Home (un-exploded) position in root local space
          if (obj.parent) {
            parentMatrix.copy(obj.parent.matrixWorld);
            worldOrigin.copy(item.basePosition).applyMatrix4(parentMatrix).applyMatrix4(rootInverse);
          } else {
            worldOrigin.copy(item.basePosition);
          }

          const idx = i * 2;
          linePosAttr.setXYZ(idx, worldOrigin.x, worldOrigin.y, worldOrigin.z);
          linePosAttr.setXYZ(idx + 1, worldCurrent.x, worldCurrent.y, worldCurrent.z);

          dotPosAttr.setXYZ(idx, worldOrigin.x, worldOrigin.y, worldOrigin.z);
          dotPosAttr.setXYZ(idx + 1, worldCurrent.x, worldCurrent.y, worldCurrent.z);
        }

        linePosAttr.needsUpdate = true;
        dotPosAttr.needsUpdate = true;
        this.m_LeaderLineSegments.computeLineDistances();

        const lineOpacity = Math.min(0.88, tExplode * 1.4);
        this.m_LeaderLineSegments.material.opacity = lineOpacity;
        this.m_LeaderAnchorDots.material.opacity = Math.min(0.95, tExplode * 1.6);
      }
    }

    /**
     * ============================================================================
     * 4. MAIN APPLICATION CONTROLLER
     * Manages WebGLRenderer, ACES Tone Mapping, Studio Lighting, OrbitControls,
     * lil-gui, Atmospheric Steampunk Motes, and Telemetry HUD.
     * ============================================================================
     */
    class SteampunkBeeApplication {
      constructor() {
        // Public GUI configuration state (follows camelCase publicVar convention)
        this.publicConfig = {
          explodedView: 0.0,
          explodeAxis: 'Radial',
          flapFrequency: 32.0,
          flightMode: true,
          modeLabel: 'Flight',
          gearSpeed: 1.0,
          wireframe: false,
          resetCamera: () => this.m_ResetCameraView()
        };

        // Private members (follow m_VarName convention)
        this.m_Container = document.getElementById('canvas-container');
        this.m_Scene = null;
        this.m_Cam = null;
        this.m_Renderer = null;
        this.m_Controls = null;
        this.m_Gui = null;
        this.m_Clock = new THREE.Clock();
        this.m_MaterialLibrary = null;
        this.m_BeeAutomaton = null;
        this.m_SteamParticles = null;

        // HUD DOM elements
        this.m_HudState = document.getElementById('hud-state');
        this.m_HudFlap = document.getElementById('hud-flap');
        this.m_HudRpm = document.getElementById('hud-rpm');
        this.m_HudFlux = document.getElementById('hud-flux');
        this.m_HudExplode = document.getElementById('hud-explode');
        this.m_HudDot = document.getElementById('hud-dot');

        this.m_InitializeRendererAndScene();
        this.m_SetupCinematicLighting();
        this.m_BuildSceneObjects();
        this.m_SetupGuiControls();
        this.m_BindEvents();

        this.m_Animate();
      }

      m_InitializeRendererAndScene() {
        this.m_Scene = new THREE.Scene();
        this.m_Scene.fog = new THREE.FogExp2(0x090b10, 0.048);

        this.m_Cam = new THREE.PerspectiveCamera(
          42,
          window.innerWidth / window.innerHeight,
          0.1,
          100
        );
        this.m_Cam.position.set(3.45, 2.05, -2.95);

        this.m_Renderer = new THREE.WebGLRenderer({
          antialias: true,
          powerPreference: 'high-performance'
        });
        this.m_Renderer.setSize(window.innerWidth, window.innerHeight);
        this.m_Renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
        this.m_Renderer.toneMapping = THREE.ACESFilmicToneMapping;
        this.m_Renderer.toneMappingExposure = 1.22;
        this.m_Renderer.outputColorSpace = THREE.SRGBColorSpace;
        this.m_Renderer.shadowMap.enabled = true;
        this.m_Renderer.shadowMap.type = THREE.PCFSoftShadowMap;
        this.m_Container.appendChild(this.m_Renderer.domElement);

        // Studio PBR environment reflections
        const pmremGenerator = new THREE.PMREMGenerator(this.m_Renderer);
        pmremGenerator.compileEquirectangularShader();
        const roomEnv = new RoomEnvironment();
        this.m_Scene.environment = pmremGenerator.fromScene(roomEnv, 0.04).texture;
        roomEnv.dispose();
        pmremGenerator.dispose();

        this.m_Controls = new OrbitControls(this.m_Cam, this.m_Renderer.domElement);
        this.m_Controls.enableDamping = true;
        this.m_Controls.dampingFactor = 0.06;
        this.m_Controls.maxDistance = 16;
        this.m_Controls.minDistance = 1.2;
        this.m_Controls.target.set(0, 0.05, 0.15);
        this.m_Controls.update();
      }

      m_SetupCinematicLighting() {
        // 1. Warm Studio Key Spotlight with high-res soft shadows
        const keyLight = new THREE.SpotLight(0xfff1d6, 55.0);
        keyLight.position.set(4.5, 6.8, -3.8);
        keyLight.angle = Math.PI * 0.28;
        keyLight.penumbra = 0.75;
        keyLight.decay = 1.6;
        keyLight.distance = 25;
        keyLight.castShadow = true;
        keyLight.shadow.mapSize.width = 2048;
        keyLight.shadow.mapSize.height = 2048;
        keyLight.shadow.camera.near = 2.0;
        keyLight.shadow.camera.far = 16.0;
        keyLight.shadow.bias = -0.0003;
        keyLight.shadow.radius = 3.5;
        this.m_Scene.add(keyLight);

        // 2. Cool Cyan-Blue Rim Backlight (accentuates blued steel & wing iridescence)
        const rimLight = new THREE.DirectionalLight(0x4dc3ff, 2.6);
        rimLight.position.set(-4.5, 3.2, 4.8);
        this.m_Scene.add(rimLight);

        // 3. Warm Copper Under-Bounce Fill Light
        const bounceLight = new THREE.DirectionalLight(0xff8844, 1.35);
        bounceLight.position.set(0.5, -4.0, -1.5);
        this.m_Scene.add(bounceLight);

        // 4. Soft Studio Hemisphere Fill
        const hemiLight = new THREE.HemisphereLight(0xddeeff, 0x2a1f16, 0.65);
        this.m_Scene.add(hemiLight);
      }

      m_BuildSceneObjects() {
        const maxAniso = this.m_Renderer.capabilities.getMaxAnisotropy();
        this.m_MaterialLibrary = new ProceduralMaterialLibrary(maxAniso);
        const materials = this.m_MaterialLibrary.getMaterials();

        // Build the Steampunk Mechanical Bee
        this.m_BeeAutomaton = new SteampunkMechanicalBee(materials);
        this.m_Scene.add(this.m_BeeAutomaton.getRootGroup());

        // Studio Calibration Floor Disk (receives soft shadows below the bee)
        const floorGroup = new THREE.Group();
        floorGroup.position.set(0, -1.35, 0.15);

        const floorPlane = new THREE.Mesh(
          new THREE.CircleGeometry(4.8, 64),
          materials.studioFloor
        );
        floorPlane.rotation.x = -Math.PI * 0.5;
        floorPlane.receiveShadow = true;
        floorGroup.add(floorPlane);

        const outerBrassBezel = new THREE.Mesh(
          new THREE.TorusGeometry(4.8, 0.035, 12, 96),
          materials.agedBrass
        );
        outerBrassBezel.rotation.x = Math.PI * 0.5;
        floorGroup.add(outerBrassBezel);

        this.m_Scene.add(floorGroup);

        // Subtle floating golden dust / aether motes in studio air
        const particleCount = 140;
        const pPositions = new Float32Array(particleCount * 3);
        for (let i = 0; i < particleCount; i++) {
          pPositions[i * 3] = (Math.random() - 0.5) * 9.0;
          pPositions[i * 3 + 1] = -1.2 + Math.random() * 4.5;
          pPositions[i * 3 + 2] = (Math.random() - 0.5) * 9.0;
        }
        const pGeo = new THREE.BufferGeometry();
        pGeo.setAttribute('position', new THREE.BufferAttribute(pPositions, 3));
        const pMat = new THREE.PointsMaterial({
          color: 0xffcc66,
          size: 0.028,
          transparent: true,
          opacity: 0.42,
          blending: THREE.AdditiveBlending,
          depthWrite: false
        });
        this.m_SteamParticles = new THREE.Points(pGeo, pMat);
        this.m_Scene.add(this.m_SteamParticles);
      }

      m_SetupGuiControls() {
        this.m_Gui = new GUI({ title: 'Chronometric Bee Controls', width: 310 });

        // 1. Exploded View (0 - 1 slider)
        this.m_Gui
          .add(this.publicConfig, 'explodedView', 0.0, 1.0, 0.001)
          .name('Exploded View');

        // 2. Explode Axis ('Radial' / 'Axial' / 'Combined')
        this.m_Gui
          .add(this.publicConfig, 'explodeAxis', ['Radial', 'Axial', 'Combined'])
          .name('Explode Axis');

        // 3. Flap Frequency (0 - 60 Hz)
        this.m_Gui
          .add(this.publicConfig, 'flapFrequency', 0.0, 60.0, 0.1)
          .name('Flap Frequency (Hz)');

        // 4. Flight / Idle Mode Selector
        this.m_Gui
          .add(this.publicConfig, 'modeLabel', ['Flight', 'Idle'])
          .name('Flight / Idle')
          .onChange((val) => {
            this.publicConfig.flightMode = (val === 'Flight');
          });

        // 5. Gear Speed (0.1x - 5.0x)
        this.m_Gui
          .add(this.publicConfig, 'gearSpeed', 0.1, 5.0, 0.05)
          .name('Gear Speed (×)');

        // 6. Wireframe Toggle
        this.m_Gui
          .add(this.publicConfig, 'wireframe')
          .name('Wireframe')
          .onChange((enabled) => {
            this.m_MaterialLibrary.setWireframe(enabled);
          });

        // 7. Camera Reset Utility
        this.m_Gui
          .add(this.publicConfig, 'resetCamera')
          .name('Reset Camera View');
      }

      m_ResetCameraView() {
        this.m_Cam.position.set(3.45, 2.05, -2.95);
        this.m_Controls.target.set(0, 0.05, 0.15);
        this.m_Controls.update();
      }

      m_BindEvents() {
        window.addEventListener('resize', () => {
          this.m_Cam.aspect = window.innerWidth / window.innerHeight;
          this.m_Cam.updateProjectionMatrix();
          this.m_Renderer.setSize(window.innerWidth, window.innerHeight);
        });
      }

      m_UpdateTelemetryHud() {
        const isFlight = this.publicConfig.flightMode;
        this.m_HudState.textContent = isFlight ? 'FLIGHT (ACTIVE)' : 'IDLE (STANDBY)';
        this.m_HudState.className = isFlight ? 'hud-value amber' : 'hud-value cyan';
        this.m_HudDot.style.background = isFlight ? '#ff9911' : '#00f2ff';
        this.m_HudDot.style.boxShadow = isFlight ? '0 0 8px #ff9911' : '0 0 8px #00f2ff';

        const effectiveHz = isFlight
          ? this.publicConfig.flapFrequency
          : this.publicConfig.flapFrequency * 0.08;
        this.m_HudFlap.textContent = `${effectiveHz.toFixed(1)} Hz`;

        const rpm = (isFlight ? 120.0 : 30.0) * this.publicConfig.gearSpeed;
        this.m_HudRpm.textContent = `${rpm.toFixed(1)} RPM`;

        const flux = isFlight
          ? Math.min(100, 82.0 + this.publicConfig.gearSpeed * 3.6)
          : 42.5;
        this.m_HudFlux.textContent = `${flux.toFixed(1)} %`;

        const explodePct = (this.publicConfig.explodedView * 100).toFixed(1);
        this.m_HudExplode.textContent = `${explodePct} % (${this.publicConfig.explodeAxis.toUpperCase()})`;
      }

      m_Animate() {
        requestAnimationFrame(() => this.m_Animate());

        const deltaTime = Math.min(this.m_Clock.getDelta(), 0.1);

        // Update bee kinematics & exploded CAD view
        this.m_BeeAutomaton.update(deltaTime, this.publicConfig);

        // Gentle studio particle drift
        if (this.m_SteamParticles) {
          this.m_SteamParticles.rotation.y += deltaTime * 0.035;
        }

        this.m_Controls.update();
        this.m_UpdateTelemetryHud();
        this.m_Renderer.render(this.m_Scene, this.m_Cam);
      }
    }

    // Bootstrap application
    window.addEventListener('DOMContentLoaded', () => {
      new SteampunkBeeApplication();
    });
  </script>
