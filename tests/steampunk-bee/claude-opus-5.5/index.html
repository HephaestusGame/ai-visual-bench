const toWingSpace = ([x, y]) => v3(x, 0, y);

function buildWing(m, kind, side) {
  const design = WING_DESIGNS[kind];
  const root = WING_ROOTS[kind];
  const group = new THREE.Group();
  group.position.set(side * root.x, root.y, root.z);
  // Mirroring the left wings keeps every pose angle identical on both sides.
  group.scale.x = side;
  const pivot = new THREE.Group();
  pivot.rotation.order = 'YZX';
  group.add(pivot);

  const membraneGeometry = cached(`membrane:${kind}`, () => {
    const { shape, bounds } = wingOutline(design);
    const geometry = new THREE.ShapeGeometry(shape, WING_CURVE_SEGMENTS);
    const pos = geometry.attributes.position;
    const uv = geometry.attributes.uv;
    const size = bounds.getSize(new THREE.Vector2());
    // ShapeGeometry UVs are in shape units; remap to the 0..1 box the wing textures were drawn in.
    for (let i = 0; i < pos.count; i++) {
      uv.setXY(i, (pos.getX(i) - bounds.min.x) / size.x, (pos.getY(i) - bounds.min.y) / size.y);
    }
    return geometry.rotateX(Math.PI / 2);
  });
  const frameGeometry = cached(`wingFrame:${kind}`, () => mergeGeometries([
    tube(design.costa.map(toWingSpace), kind === 'fore' ? 0.014 : 0.011, 40, 7),
    new THREE.CylinderGeometry(0.03, 0.03, 0.1, 16).rotateX(Math.PI / 2),
    new THREE.SphereGeometry(0.036, 14, 10).translate(0.03, 0, 0),
  ]));
  const veinGeometry = cached(`wingVeins:${kind}`, () => mergeGeometries([
    ...design.veins.map((vein) => tube(vein.map(toWingSpace), 0.0065, 32, 5)),
    ...design.crossVeins.map((vein) => tube(vein.map(toWingSpace), 0.0042, 4, 4)),
  ]));

  const membraneMaterial = kind === 'fore' ? m.membraneFore : m.membraneHind;
  pivot.add(mesh(membraneGeometry, membraneMaterial, { cast: false, receive: false }));
  const structure = [mesh(frameGeometry, m.brass), mesh(veinGeometry, m.bluedSteel)];
  pivot.add(...structure);

  const ghosts = new THREE.InstancedMesh(membraneGeometry, kind === 'fore' ? m.ghostFore : m.ghostHind, GHOSTS_PER_WING);
  ghosts.instanceMatrix.setUsage(THREE.DynamicDrawUsage);
  ghosts.frustumCulled = false;
  ghosts.visible = false;
  group.add(ghosts);
  return { group, pivot, ghosts, structure, kind, side };
}

const _ghostPose = new THREE.Euler(0, 0, 0, 'YZX');
const _ghostMatrix = new THREE.Matrix4();

// Stroke (about the body axis), feathering (about the span) and a figure-eight sweep; `fold`
// blends toward the resting pose with the wings swept back over the abdomen.
function setWingPose(rotation, phase, kind, fold) {
  const hind = kind === 'hind';
  const stroke = degToRad(50) * (hind ? 0.9 : 1) * Math.sin(phase) + degToRad(11);
  // Negative so the trailing edge lags the stroke instead of leading it.
  const feather = -degToRad(25) * Math.cos(phase);
  const sweep = degToRad(hind ? 18 : 10) + degToRad(8) * Math.sin(2 * phase);
  const foldedSweep = degToRad(hind ? 70 : 76);
  const foldedElevation = degToRad(hind ? 9 : 12);
  rotation.set(lerp(feather, 0, fold), lerp(sweep, foldedSweep, fold), lerp(stroke, foldedElevation, fold));
}

// ============================================================================
// Bee parts: legs
// ============================================================================
const FEMUR_LENGTH = 0.55;
const TIBIA_LENGTH = 0.58;
const TARSUS_LENGTH = 0.1;
const CLAW_RADIUS = 0.028;
const CLAW_TUBE = 0.006;
const CLAW_ARC = Math.PI * 0.45;
const CLAW_DROP = CLAW_RADIUS * (1 - Math.cos(CLAW_ARC)) + CLAW_TUBE;
const LEG_LAYOUT = [
  { hip: HIP_POSITIONS[0], splay: degToRad(40), scale: 0.9, reach: 0.6 },
  { hip: HIP_POSITIONS[1], splay: degToRad(4), scale: 1.0, reach: 0.68 },
  { hip: HIP_POSITIONS[2], splay: degToRad(-38), scale: 1.12, reach: 0.72 },
];

// Two-bone IK in the leg plane so all six feet rest on the floor when the bee is idle.
function solveStandingPose(layout) {
  const tarsiWorld = [-0.6, -0.15, 0];
  // Leg-local units: the tarsi and claw hang this far below the ankle, so the claw tips touch y = 0.
  const ankleHeight = tarsiWorld.reduce((drop, angle) => drop - TARSUS_LENGTH * Math.sin(angle), CLAW_DROP);
  const hipHeight = (IDLE_HEIGHT + layout.hip.y) / layout.scale;
  const targetX = layout.reach / layout.scale;
  const targetY = -(hipHeight - ankleHeight);
  const reach = Math.min(Math.hypot(targetX, targetY), (FEMUR_LENGTH + TIBIA_LENGTH) * 0.999);
  const lawOfCosines = (a, b, c) => Math.acos(clamp((a * a + b * b - c * c) / (2 * a * b), -1, 1));
  const femurWorld = Math.atan2(targetY, targetX) + lawOfCosines(FEMUR_LENGTH, reach, TIBIA_LENGTH);
  const tibiaWorld = femurWorld - (Math.PI - lawOfCosines(FEMUR_LENGTH, TIBIA_LENGTH, reach));
  return {
    femur: femurWorld,
    tibia: tibiaWorld - femurWorld,
    tarsi: [tarsiWorld[0] - tibiaWorld, tarsiWorld[1] - tarsiWorld[0], tarsiWorld[2] - tarsiWorld[1]],
  };
}

// Every leg part sits at its joint's origin (the claw is pre-offset to the last tarsus tip),
// so each instance can use the joint's world matrix directly.
function createLegParts(m) {
  return {
    coxa: new InstancedPart(new THREE.SphereGeometry(0.075, 20, 14), m.brassAged),
    femur: new InstancedPart(scaleUV(new THREE.CylinderGeometry(0.034, 0.046, FEMUR_LENGTH - 0.06, 14)
      .rotateZ(-Math.PI / 2).translate(FEMUR_LENGTH / 2 + 0.02, 0, 0), 2), m.brass),
    piston: new InstancedPart(new THREE.CylinderGeometry(0.022, 0.022, 0.26, 12)
      .rotateZ(-Math.PI / 2).translate(0.23, -0.052, 0), m.copper, NO_SHADOW),
    pistonRodKnee: new InstancedPart(mergeGeometries([
      new THREE.CylinderGeometry(0.009, 0.009, 0.17, 8).rotateZ(-Math.PI / 2).translate(0.44, -0.052, 0),
      new THREE.CylinderGeometry(0.038, 0.038, 0.085, 16).rotateX(Math.PI / 2).translate(FEMUR_LENGTH, 0, 0),
      new THREE.CylinderGeometry(0.016, 0.016, 0.05, 8).translate(0.1, -0.03, 0),
    ]), m.bluedSteel, NO_SHADOW),
    tibia: new InstancedPart(new THREE.CylinderGeometry(0.022, 0.03, TIBIA_LENGTH - 0.04, 12)
      .rotateZ(-Math.PI / 2).translate(TIBIA_LENGTH / 2, 0, 0), m.bluedSteel),
    tarsus: new InstancedPart(mergeGeometries([
      new THREE.SphereGeometry(0.026, 12, 8),
      new THREE.CylinderGeometry(0.015, 0.019, TARSUS_LENGTH - 0.02, 10).rotateZ(-Math.PI / 2).translate(TARSUS_LENGTH / 2 + 0.005, 0, 0),
    ]), m.brassAged, NO_SHADOW),
    claw: new InstancedPart(mergeGeometries([-0.014, 0.014].map((z) => new THREE.TorusGeometry(CLAW_RADIUS, CLAW_TUBE, 6, 10, CLAW_ARC)
      .rotateZ(-Math.PI / 2).rotateX(Math.PI).translate(TARSUS_LENGTH, -CLAW_RADIUS, z))), m.bluedSteel, NO_SHADOW),
  };
}

function buildLeg(pair, side, parts) {
  const layout = LEG_LAYOUT[pair];
  const group = new THREE.Group();
  group.position.set(side * layout.hip.x, layout.hip.y, layout.hip.z);
  // Local +X points outward along the leg, local +Y up; joints bend about local Z.
  group.rotation.y = side > 0 ? -layout.splay : Math.PI + layout.splay;
  group.scale.setScalar(layout.scale);

  const coxa = new THREE.Group();
  group.add(coxa);
  parts.coxa.follow(coxa);

  const femur = new THREE.Group();
  coxa.add(femur);
  for (const part of [parts.femur, parts.piston, parts.pistonRodKnee]) part.follow(femur);

  const tibia = new THREE.Group();
  tibia.position.x = FEMUR_LENGTH;
  femur.add(tibia);
  parts.tibia.follow(tibia);

  const tarsi = [];
  let parent = tibia;
  for (let i = 0; i < 3; i++) {
    const pivot = new THREE.Group();
    pivot.position.x = i === 0 ? TIBIA_LENGTH : TARSUS_LENGTH;
    parts.tarsus.follow(pivot);
    parent.add(pivot);
    parent = pivot;
    tarsi.push(pivot);
  }
  parts.claw.follow(parent);

  return { group, coxa, femur, tibia, tarsi, side, pair, stand: solveStandingPose(layout) };
}

// ============================================================================
// Bee parts: abdomen, power core, stinger
// ============================================================================
const SEGMENT_SPECS = [
  { R: 0.4, rear: 0.38, front: 0.16, material: 'brassEngraved', window: false },
  { R: 0.5, rear: 0.47, front: 0.36, material: 'bluedSteel', window: true },
  { R: 0.53, rear: 0.5, front: 0.45, material: 'brass', window: true },
  { R: 0.47, rear: 0.44, front: 0.46, material: 'bluedSteel', window: true },
  { R: 0.34, rear: 0.17, front: 0.33, material: 'brassEngraved', window: false },
];
const WINDOW_HALF_WIDTH = 0.42;

function segmentProfile({ R, rear, front }) {
  return [[front, 0], [front, 0.05], [lerp(front, R, 0.6), 0.1], [R * 0.99, 0.16], [R, 0.24], [R * 0.975, 0.36], [rear, 0.43], [rear * 0.97, 0.44]];
}

function profileRadiusAt(profile, along) {
  for (let i = 1; i < profile.length; i++) {
    const [r1, a1] = profile[i];
    if (along <= a1) {
      const [r0, a0] = profile[i - 1];
      return { radius: lerp(r0, r1, (along - a0) / (a1 - a0)), slope: (r1 - r0) / (a1 - a0) };
    }
  }
  return { radius: profile[profile.length - 1][0], slope: 0 };
}

function buildSegment(m, index) {
  const spec = SEGMENT_SPECS[index];
  const profile = segmentProfile(spec);
  const nextFront = index < SEGMENT_SPECS.length - 1 ? SEGMENT_SPECS[index + 1].front : 0.1;
  const group = new THREE.Group();
  group.position.z = -index * SEGMENT_SPACING;

  const shellGeometry = cached(`segmentShell:${index}`, () => {
    if (!spec.window) return scaleUV(latheAlongZ(profile, 56, -1), 3, 1);
    const g = WINDOW_HALF_WIDTH;
    const middle = profile.slice(2, 6);
    return scaleUV(mergeGeometries([
      latheAlongZ(profile.slice(0, 3), 56, -1),
      latheAlongZ(profile.slice(5), 56, -1),
      latheAlongZ(middle, 22, -1, -(Math.PI / 2 - g), Math.PI - 2 * g),
      latheAlongZ(middle, 22, -1, Math.PI / 2 + g, Math.PI - 2 * g),
    ]), 3, 1);
  });
  group.add(mesh(shellGeometry, m[spec.material]));

  const copperGeometry = cached(`segmentCopper:${index}`, () => {
    const parts = [
      new THREE.TorusGeometry(spec.rear + 0.004, 0.02, 10, 56).translate(0, 0, -0.425),
      new THREE.RingGeometry(nextFront - 0.01, spec.rear, 56).rotateY(Math.PI).translate(0, 0, -0.44),
    ];
    if (spec.window) {
      for (const center of [Math.PI / 2, (3 * Math.PI) / 2]) {
        const loop = [];
        const point = (phi, along) => {
          const r = profileRadiusAt(profile, along).radius + 0.006;
          return v3(Math.sin(phi) * r, Math.cos(phi) * r, -along);
        };
        for (let i = 0; i < 6; i++) loop.push(point(center - WINDOW_HALF_WIDTH + (i / 6) * 2 * WINDOW_HALF_WIDTH, 0.1));
        for (let i = 0; i < 6; i++) loop.push(point(center + WINDOW_HALF_WIDTH, 0.1 + (i / 6) * 0.26));
        for (let i = 0; i < 6; i++) loop.push(point(center + WINDOW_HALF_WIDTH - (i / 6) * 2 * WINDOW_HALF_WIDTH, 0.36));
        for (let i = 0; i < 6; i++) loop.push(point(center - WINDOW_HALF_WIDTH, 0.36 - (i / 6) * 0.26));
        parts.push(tube(loop, 0.012, 96, 6, true));
      }
    }
    return mergeGeometries(parts);
  });
  group.add(mesh(copperGeometry, m.copper, NO_SHADOW));

  if (spec.window) {
    const paneGeometry = cached(`segmentPane:${index}`, () => {
      const middle = profile.slice(2, 6).map(([r, a]) => [r * 0.985, a]);
      const g = WINDOW_HALF_WIDTH;
      return mergeGeometries([
        latheAlongZ(middle, 10, -1, Math.PI / 2 - g, 2 * g),
        latheAlongZ(middle, 10, -1, (3 * Math.PI) / 2 - g, 2 * g),
      ]);
    });
    group.add(mesh(paneGeometry, m.coreGlass, { cast: false, receive: false }));
    // The shell is single-sided, so without an inner wall the windows would show the floor behind.
    const linerGeometry = cached(`segmentLiner:${index}`, () => latheAlongZ(profile.map(([r, a]) => [r * 0.95, a]), 40, -1));
    group.add(mesh(linerGeometry, m.liner, NO_SHADOW));
  }

  const rivets = [];
  const { radius, slope } = profileRadiusAt(profile, 0.395);
  for (let k = 0; k < 20; k++) {
    const phi = (k / 20) * TAU;
    rivets.push({
      position: v3(Math.sin(phi) * radius, Math.cos(phi) * radius, -0.395),
      normal: v3(Math.sin(phi), Math.cos(phi), slope).normalize(),
    });
  }
  group.add(makeRivets(m.brassAged, rivets, 0.014));
  return group;
}

function buildPowerCore(m) {
  const group = new THREE.Group();
  group.position.z = -0.99;
  group.add(mesh(cached('coreGlass', () => new THREE.CapsuleGeometry(0.12, 0.8, 8, 28).rotateX(Math.PI / 2)), m.coreGlass, { cast: false, receive: false }));
  group.add(mesh(cached('coreRod', () => new THREE.CylinderGeometry(0.035, 0.035, 0.86, 12).rotateX(Math.PI / 2)), m.coreGlow, { cast: false }));
  group.add(mesh(cached('coreCoil', () => new THREE.TubeGeometry(new HelixCurve(0.075, 0.8, 11), 300, 0.011, 6).translate(0, 0, -0.4)), m.coreCoil, { cast: false }));
  group.add(mesh(cached('coreCaps', () => mergeGeometries([
    new THREE.CylinderGeometry(0.135, 0.135, 0.05, 28).rotateX(Math.PI / 2).translate(0, 0, 0.45),
    new THREE.CylinderGeometry(0.135, 0.135, 0.05, 28).rotateX(Math.PI / 2).translate(0, 0, -0.45),
    new THREE.CylinderGeometry(0.05, 0.07, 0.08, 16).rotateX(Math.PI / 2).translate(0, 0, 0.5),
    new THREE.CylinderGeometry(0.05, 0.07, 0.08, 16).rotateX(-Math.PI / 2).translate(0, 0, -0.5),
  ])), m.brass));
  // Short range: the light casts no shadows and would otherwise tint the thorax through the shell.
  const light = new THREE.PointLight(0x40d6ff, 3, 1.0, 2);
  group.add(light);
  return { group, light };
}

function buildStinger(m) {
  const group = new THREE.Group();
  group.position.z = -(SEGMENT_SPECS.length - 1) * SEGMENT_SPACING - 0.44;
  group.add(mesh(cached('stingerCollar', () => scaleUV(latheAlongZ([[0.15, 0], [0.165, 0.02], [0.15, 0.05], [0.1, 0.08]], 40, -1), 3, 1)), m.brass));
  const ring = mesh(cached('stingerRing', () => new THREE.TorusGeometry(0.158, 0.014, 8, 40)), m.copper, NO_SHADOW);
  ring.position.z = -0.012;
  group.add(ring);
  const spike = new THREE.Group();
  spike.position.z = -0.07;
  spike.add(mesh(cached('stingerSpike', () => makeStingerGeometry(0.48, 0.085, 3, 7)), m.bluedSteel));
  group.add(spike);
  return { group, spike };
}

// ============================================================================
// Exploded view with cyan leader lines
// ============================================================================
const EXPLODE_AXES = ['Radial', 'Axial', 'Vertical'];
const _offset = new THREE.Vector3();
const _home = new THREE.Vector3();
const _current = new THREE.Vector3();
const _chain = new THREE.Matrix4();
const _marker = new THREE.Matrix4();

class ExplodedView {
  constructor(assembly) {
    this.assembly = assembly;
    this.parts = [];
    this.amount = 0;
    this.weights = [1, 0, 0];
  }

  // Directions are offsets (unit = scene units) in the part's parent space at full explosion.
  add(object, { anchor, radial, axial, vertical }) {
    this.parts.push({
      object,
      home: object.position.clone(),
      anchor: v3(...anchor),
      directions: [v3(...radial), v3(...axial), v3(...vertical)],
      chain: [],
      delay: 0,
    });
  }

  finalize() {
    const count = this.parts.length;
    for (let i = 0; i < count; i++) {
      const part = this.parts[i];
      part.delay = 0.12 * (i / (count - 1));
      for (let node = part.object.parent; node !== this.assembly; node = node.parent) part.chain.unshift(node);
    }

    const leaderColor = new THREE.Color(LEADER_COLOR).multiplyScalar(1.35);
    const geometry = new LineSegmentsGeometry();
    geometry.setPositions(new Float32Array(count * 6));
    this.lineBuffer = geometry.attributes.instanceStart.data;
    this.lineBuffer.setUsage(THREE.DynamicDrawUsage);
    this.lineMaterial = new LineMaterial({
      color: leaderColor, linewidth: 1.8, transparent: true, opacity: 0, depthTest: false, depthWrite: false,
    });
    this.lines = new LineSegments2(geometry, this.lineMaterial);
    this.lines.frustumCulled = false;
    this.lines.renderOrder = 998;
    this.lines.visible = false;

    this.markerMaterial = new THREE.MeshBasicMaterial({
      color: leaderColor, transparent: true, opacity: 0, depthTest: false, depthWrite: false,
    });
    this.markers = new THREE.InstancedMesh(new THREE.SphereGeometry(0.022, 10, 8), this.markerMaterial, count * 2);
    this.markers.instanceMatrix.setUsage(THREE.DynamicDrawUsage);
    this.markers.frustumCulled = false;
    this.markers.renderOrder = 999;
    this.markers.visible = false;
    this.assembly.add(this.lines, this.markers);
  }

  setResolution(width, height) {
    this.lineMaterial.resolution.set(width, height);
  }

  update(dt, target, axisIndex) {
    this.amount = damp(this.amount, target, 8, dt);
    for (let a = 0; a < 3; a++) this.weights[a] = damp(this.weights[a], a === axisIndex ? 1 : 0, 5, dt);
    for (const part of this.parts) {
      const progress = easeInOutCubic(clamp((this.amount - part.delay) / (1 - part.delay), 0, 1));
      _offset.set(0, 0, 0);
      for (let a = 0; a < 3; a++) _offset.addScaledVector(part.directions[a], this.weights[a] * progress);
      part.object.position.copy(part.home).add(_offset);
    }
  }

  // Runs after all animation so the anchors follow articulated parents (head, abdomen).
  updateLeaders() {
    const visible = this.amount > 0.002;
    this.lines.visible = visible;
    this.markers.visible = visible;
    if (!visible) return;
    const opacity = smoothstep(this.amount, 0, 0.15) * 0.95;
    this.lineMaterial.opacity = opacity;
    this.markerMaterial.opacity = opacity;
    const array = this.lineBuffer.array;
    for (let i = 0; i < this.parts.length; i++) {
      const part = this.parts[i];
      const { object } = part;
      _chain.identity();
      for (const node of part.chain) {
        node.updateMatrix();
        _chain.multiply(node.matrix);
      }
      _home.copy(part.anchor).multiply(object.scale).applyQuaternion(object.quaternion).add(part.home).applyMatrix4(_chain);
      object.updateMatrix();
      _current.copy(part.anchor).applyMatrix4(object.matrix).applyMatrix4(_chain);
      _home.toArray(array, i * 6);
      _current.toArray(array, i * 6 + 3);
      this.markers.setMatrixAt(i * 2, _marker.makeTranslation(_home));
      this.markers.setMatrixAt(i * 2 + 1, _marker.makeTranslation(_current));
    }
    this.lineBuffer.needsUpdate = true;
    this.markers.instanceMatrix.needsUpdate = true;
  }
}

// ============================================================================
// Bee assembly: scene -> root (hover) -> assembly (exploded space) -> parts -> pivots
// ============================================================================
function buildBee(m) {
  const root = new THREE.Group();
  const assembly = new THREE.Group();
  root.add(assembly);
  const explode = new ExplodedView(assembly);
  const legParts = createLegParts(m);
  const antennaParts = createAntennaParts(m);
  assembly.add(buildChassis(m));

  const head = buildHead(m);
  head.neck.rotation.order = 'YXZ';
  assembly.add(head.group);
  explode.add(head.group, { anchor: [0, 0.1, 0.45], radial: [0, 0.35, 1.35], axial: [0, 0.1, 1.75], vertical: [0, 1.05, 0.45] });

  const eyes = [-1, 1].map((side) => {
    const eye = buildEye(m, side);
    head.neck.add(eye);
    explode.add(eye, { anchor: [side * 0.1, 0, 0], radial: [side * 0.75, 0.1, 0.15], axial: [side * 0.4, 0, 0.55], vertical: [side * 0.3, 0.55, 0] });
    return eye;
  });
  const antennae = [-1, 1].map((side) => {
    const antenna = buildAntenna(m, side, antennaParts);
    head.neck.add(antenna.group);
    explode.add(antenna.group, { anchor: [0, 0, 0], radial: [side * 0.35, 0.65, 0.35], axial: [side * 0.25, 0.25, 0.9], vertical: [side * 0.15, 0.95, 0.1] });
    return antenna;
  });

  for (const side of [-1, 1]) {
    const shell = buildThoraxShell(m, side);
    assembly.add(shell);
    explode.add(shell, { anchor: [side * 0.45, 0, 0], radial: [side * 1.25, 0.15, 0], axial: [side * 0.7, 0, 0.45], vertical: [side * 0.4, 0.8, 0] });
  }
  const gearTrains = [-1, 1].map((side) => {
    const gearTrain = buildGearTrain(m, side);
    assembly.add(gearTrain.group);
    explode.add(gearTrain.group, { anchor: [0, 0, 0.03], radial: [side * 0.72, 0, 0], axial: [side * 0.4, 0, -0.75], vertical: [side * 0.55, -0.2, 0] });
    return gearTrain.train;
  });

  const gauge = buildGauge(m);
  assembly.add(gauge.group);
  explode.add(gauge.group, { anchor: [0, 0.04, 0], radial: [0, 0.95, 0.3], axial: [0, 0.25, 1.0], vertical: [0, 1.4, 0] });

  const balance = buildBalanceWheel(m);
  assembly.add(balance.group);
  explode.add(balance.group, { anchor: [0, 0.05, 0], radial: [0, 0.95, -0.25], axial: [0, 0.3, -0.45], vertical: [0, 1.0, 0] });

  const pipes = buildPipes(m);
  assembly.add(pipes);
  explode.add(pipes, { anchor: [0, -0.22, 0.5], radial: [0, -0.55, 0.15], axial: [0, -0.2, 0.35], vertical: [0, -0.5, 0] });

  const wings = [];
  for (const kind of ['fore', 'hind']) {
    for (const side of [-1, 1]) {
      const wing = buildWing(m, kind, side);
      assembly.add(wing.group);
      const fore = kind === 'fore';
      explode.add(wing.group, {
        anchor: [0.05, 0, 0],
        radial: fore ? [side * 0.7, 0.95, 0.3] : [side * 0.75, 0.75, -0.4],
        axial: fore ? [side * 0.3, 0.75, 0.65] : [side * 0.3, 0.35, -0.35],
        vertical: fore ? [side * 0.15, 1.4, 0] : [side * 0.2, 1.15, 0],
      });
      wings.push(wing);
    }
  }

  const legs = [];
  for (let pair = 0; pair < 3; pair++) {
    const forward = [1, 0, -1][pair];
    for (const side of [-1, 1]) {
      const leg = buildLeg(pair, side, legParts);
      assembly.add(leg.group);
      explode.add(leg.group, { anchor: [0, 0, 0], radial: [side * 0.95, -0.15, forward * 0.45], axial: [side * 0.35, -0.05, forward * 0.45], vertical: [side * 0.5, -0.3, 0] });
      legs.push(leg);
    }
  }

  const abdomenPivot = new THREE.Group();
  abdomenPivot.position.copy(ABDOMEN_PIVOT);
  assembly.add(abdomenPivot);
  const verticalLayers = [0.35, -0.35, 0.7, -0.7, 1.05];
  const segments = SEGMENT_SPECS.map((spec, i) => {
    const segment = buildSegment(m, i);
    abdomenPivot.add(segment);
    explode.add(segment, { anchor: [0, spec.R, -0.24], radial: [0, 0.05 * i, -0.3 * (i + 1)], axial: [0, 0, -0.42 * (i + 1)], vertical: [0, verticalLayers[i], 0] });
    return segment;
  });
  const core = buildPowerCore(m);
  abdomenPivot.add(core.group);
  explode.add(core.group, { anchor: [0, -0.13, 0], radial: [0, -1.0, 0], axial: [0, -0.9, -0.9], vertical: [0, -1.4, 0] });
  const stinger = buildStinger(m);
  abdomenPivot.add(stinger.group);
  explode.add(stinger.group, { anchor: [0, 0, -0.04], radial: [0, 0, -1.9], axial: [0, 0, -2.5], vertical: [0, 1.4, -0.3] });

  explode.finalize();
  return {
    root, assembly, explode, materials: m, head, eyes, antennae, gearTrains, gauge, balance, wings, legs,
    abdomen: { pivot: abdomenPivot, segments, core, stinger },
    instancedParts: [...Object.values(legParts), ...Object.values(antennaParts)],
  };
}

// ============================================================================
// Animation (delta-time based, frame-rate independent smoothing, no allocations)
// ============================================================================
const hoverHeight = (t) => FLIGHT_HEIGHT + 0.06 * Math.sin(t * 2.2) + 0.025 * Math.sin(t * 3.7 + 1);
const headYaw = (t) => 0.28 * wobble(t * 0.35, 3);
const headPitch = (t) => 0.12 + 0.1 * wobble(t * 0.27, 6);

function createAnimationState() {
  return {
    time: 0, flapPhase: 0, flightBlend: 1, gearAngle: 0, balancePhase: 0, pulsePhase: 0, needleAngle: degToRad(-135),
    // Seeded with the t = 0 pose so the first finite-difference velocities do not kick the antennae.
    prevYaw: headYaw(0), prevPitch: headPitch(0), yawVelocity: 0, pitchVelocity: 0,
    prevRootY: hoverHeight(0), rootVelocityY: 0, rootAccelY: 0,
  };
}

function updateBody(bee, s, flight, dt) {
  const t = s.time;
  const lift = easeInOutCubic(clamp(bee.explode.amount, 0, 1)) * lerp(EXPLODE_LIFT, EXPLODE_FLIGHT_LIFT, flight);
  // No idle bob: the standing feet are planted on the floor.
  bee.root.position.set(0.16 * wobble(t * 0.23, 1) * flight, lerp(IDLE_HEIGHT, hoverHeight(t), flight) + lift, 0.12 * wobble(t * 0.19, 4) * flight);
  bee.root.rotation.set((0.045 * wobble(t * 0.43, 5) - 0.04) * flight, 0.14 * wobble(t * 0.13, 9) * flight, 0.06 * wobble(t * 0.5, 2) * flight);
  const velocityY = (bee.root.position.y - s.prevRootY) / dt;
  s.rootAccelY = damp(s.rootAccelY, (velocityY - s.rootVelocityY) / dt, 10, dt);
  s.rootVelocityY = velocityY;
  s.prevRootY = bee.root.position.y;
}

function updateWings(bee, s, params, flight, dt) {
  const m = bee.materials;
  const frequency = params.flapFrequency;
  s.flapPhase = (s.flapPhase + TAU * frequency * dt) % TAU;
  // Sub-frame ghosts turn 30-60 Hz strobing into a motion-blurred shimmer.
  const ghostFade = smoothstep(frequency * flight, 6, 16);
  const spread = Math.min(TAU * frequency * dt, TAU);
  m.membraneFore.opacity = m.membraneHind.opacity = 1 - 0.45 * ghostFade;
  m.ghostFore.opacity = m.ghostHind.opacity = 0.2 * ghostFade;
  const fold = 1 - flight;
  // Once a frame spans about half a cycle the crisp spars only strobe; the membrane and ghosts carry the blur.
  const showStructure = spread * flight < 0.9 * Math.PI;
  // Fore and hind wings share one phase, as if hooked together like a real bee's.
  const phase = s.flapPhase;
  for (const wing of bee.wings) {
    setWingPose(wing.pivot.rotation, phase, wing.kind, fold);
    for (const part of wing.structure) part.visible = showStructure;
    wing.ghosts.visible = ghostFade > 0.01;
    if (!wing.ghosts.visible) continue;
    for (let i = 0; i < GHOSTS_PER_WING; i++) {
      setWingPose(_ghostPose, phase - ((i + 1) * spread) / (GHOSTS_PER_WING + 1), wing.kind, fold);
      wing.ghosts.setMatrixAt(i, _ghostMatrix.makeRotationFromEuler(_ghostPose));
    }
    wing.ghosts.instanceMatrix.needsUpdate = true;
  }
}

function updateLegs(bee, s, flight) {
  const t = s.time;
  // A joint-space blend straightens the legs halfway, so they only start tucking once the body is high enough.
  const legFlight = smoothstep(flight, 0.5, 1);
  for (const leg of bee.legs) {
    const k = leg.pair * 1.7 + (leg.side > 0 ? 0 : 0.9);
    leg.coxa.rotation.y = leg.side * 0.35 * legFlight;
    leg.femur.rotation.z = lerp(leg.stand.femur, -0.25 + 0.08 * Math.sin(t * 2.1 + k), legFlight);
    leg.tibia.rotation.z = lerp(leg.stand.tibia, -1.9 + 0.1 * Math.sin(t * 2.1 + k + 0.6), legFlight);
    for (let i = 0; i < 3; i++) {
      leg.tarsi[i].rotation.z = lerp(leg.stand.tarsi[i], -0.35 + 0.06 * Math.sin(t * 2.6 + k + i), legFlight);
    }
  }
}

function updateHead(bee, s, dt) {
  const t = s.time;
  const yaw = headYaw(t);
  const pitch = headPitch(t);
  bee.head.neck.rotation.set(pitch, yaw, 0.07 * wobble(t * 0.31, 8));
  s.yawVelocity = damp(s.yawVelocity, (yaw - s.prevYaw) / dt, 12, dt);
  s.pitchVelocity = damp(s.pitchVelocity, (pitch - s.prevPitch) / dt, 12, dt);
  s.prevYaw = yaw;
  s.prevPitch = pitch;
  const open = 0.08 + 0.14 * (0.5 + 0.5 * Math.sin(t * 1.9));
  for (const mandible of bee.head.mandibles) mandible.rotation.y = mandible.userData.side * open;
}

// Damped-spring chain: each bead lags head motion and body acceleration, plus a gentle twitch.
function updateAntennae(bee, s, flight, dt) {
  const t = s.time;
  const bodyKick = clamp(s.rootAccelY * 0.03, -0.35, 0.35) + s.pitchVelocity * 0.35;
  const buzz = 0.012 * flight * Math.sin(s.flapPhase);
  for (const antenna of bee.antennae) {
    for (let i = 0; i < antenna.beads.length; i++) {
      const weight = 0.4 + i * 0.15;
      const twitch = i > 0 ? 0.07 * wobble(t * 1.3 + i * 0.4, antenna.side * 3 + 1) : 0;
      const targetX = antenna.rest[i] + bodyKick * weight + twitch + buzz;
      const targetY = -s.yawVelocity * 0.4 * weight + 0.05 * wobble(t * 0.9 + i, antenna.side * 5);
      const stiffness = 140 - i * 12;
      const damping = 6.5;
      antenna.velocityX[i] += (stiffness * (targetX - antenna.angleX[i]) - damping * antenna.velocityX[i]) * dt;
      antenna.velocityY[i] += (stiffness * (targetY - antenna.angleY[i]) - damping * antenna.velocityY[i]) * dt;
      antenna.angleX[i] += antenna.velocityX[i] * dt;
      antenna.angleY[i] += antenna.velocityY[i] * dt;
      antenna.beads[i].rotation.set(antenna.angleX[i], antenna.angleY[i], 0);
    }
  }
}

function updateMechanisms(bee, s, params, flight, dt) {
  const t = s.time;
  s.gearAngle += 1.2 * params.gearSpeed * dt;
  for (const train of bee.gearTrains) train.update(s.gearAngle);
  bee.head.craniumTrain.update(s.gearAngle * 2.2);

  s.balancePhase = (s.balancePhase + TAU * 1.8 * params.gearSpeed * dt) % TAU;
  const swing = 2.2 * Math.sin(s.balancePhase);
  bee.balance.wheel.rotation.y = swing;
  bee.balance.hairspring.rotation.y = swing * 0.5;
  const breath = 1 + 0.06 * Math.sin(s.balancePhase);
  bee.balance.hairspring.scale.set(breath, 1, breath);

  const needleTarget = degToRad(-135 + clamp((params.flapFrequency * flight) / 60, 0, 1) * 270);
  s.needleAngle = damp(s.needleAngle, needleTarget, 5, dt);
  bee.gauge.needlePivot.rotation.y = -(s.needleAngle + 0.012 * Math.sin(t * 37) * flight);

  const { pivot, segments, core, stinger } = bee.abdomen;
  pivot.rotation.set(-0.1 - 0.08 * flight + 0.03 * Math.sin(t * 1.1), 0.05 * Math.sin(t * 0.8) * (0.4 + 0.6 * flight), 0);
  for (let i = 0; i < segments.length; i++) {
    const breathe = 1 + 0.016 * Math.sin(t * 2.4 - i * 0.7);
    segments[i].scale.set(breathe, breathe, 1);
  }
  stinger.spike.rotation.z = (stinger.spike.rotation.z + 1.5 * params.gearSpeed * dt) % TAU;

  s.pulsePhase = (s.pulsePhase + dt * lerp(2.0, 5.0, flight)) % TAU;
  const pulse = 0.5 + 0.5 * Math.sin(s.pulsePhase);
  const m = bee.materials;
  m.coreGlow.emissiveIntensity = 3 + 2.5 * pulse * pulse;
  m.coreCoil.emissiveIntensity = 4 + 2 * pulse;
  m.eyeCore.emissiveIntensity = 2.2 + 0.4 * Math.sin(t * 3.1);
  core.light.intensity = 1.8 + 2.4 * pulse;
}

function updateBee(bee, s, params, dt) {
  s.time += dt;
  s.flightBlend = damp(s.flightBlend, params.mode === 'Flight' ? 1 : 0, 1.6, dt);
  const flight = easeInOutCubic(s.flightBlend);
  bee.explode.update(dt, params.explode, EXPLODE_AXES.indexOf(params.explodeAxis));
  updateBody(bee, s, flight, dt);
  updateWings(bee, s, params, flight, dt);
  updateLegs(bee, s, flight);
  updateHead(bee, s, dt);
  updateAntennae(bee, s, flight, dt);
  updateMechanisms(bee, s, params, flight, dt);
  bee.explode.updateLeaders();
  bee.root.updateMatrixWorld();
  for (const part of bee.instancedParts) part.sync();
}

// ============================================================================
// Studio: environment, backdrop, display floor, lights
// ============================================================================
function buildStudio(scene, renderer, textures) {
  const pmrem = new THREE.PMREMGenerator(renderer);
  const room = new RoomEnvironment();
  scene.environment = pmrem.fromScene(room, 0.04).texture;
  room.dispose();
  pmrem.dispose();

  const horizon = new THREE.Color(0x2a1d14);
  scene.fog = new THREE.Fog(horizon, 16, 46);
  const backdrop = new THREE.Mesh(new THREE.SphereGeometry(60, 48, 24), new THREE.ShaderMaterial({
    side: THREE.BackSide,
    depthWrite: false,
    uniforms: {
      topColor: { value: new THREE.Color(0x0b0b0d) },
      horizonColor: { value: horizon },
      bottomColor: { value: new THREE.Color(0x070605) },
      glowColor: { value: new THREE.Color(0x6a4420) },
    },
    vertexShader: /* glsl */ `
      varying vec3 vDirection;
      void main() {
        vDirection = normalize(position);
        gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0);
      }`,
    fragmentShader: /* glsl */ `
      uniform vec3 topColor;
      uniform vec3 horizonColor;
      uniform vec3 bottomColor;
      uniform vec3 glowColor;
      varying vec3 vDirection;
      void main() {
        float h = vDirection.y;
        vec3 color = mix(horizonColor, topColor, smoothstep(0.0, 0.55, h));
        color = mix(color, bottomColor, 1.0 - smoothstep(-0.25, 0.0, h));
        float glow = pow(max(dot(vDirection, normalize(vec3(-0.55, 0.15, -0.65))), 0.0), 5.0);
        gl_FragColor = vec4(color + glowColor * glow * 0.6, 1.0);
      }`,
  }));
  scene.add(backdrop);

  const floorMaterial = new THREE.MeshPhysicalMaterial({
    map: textures.floorColor, metalness: 0.2, roughness: 1, roughnessMap: textures.floorRough,
    clearcoat: 0.15, clearcoatRoughness: 0.35, envMapIntensity: 0.14,
  });
  const rimMaterial = new THREE.MeshPhysicalMaterial({ color: 0xb08a3e, metalness: 1, roughness: 0.3, clearcoat: 0.3, envMapIntensity: 0.8 });
  const floor = new THREE.Mesh(new THREE.CylinderGeometry(3.6, 3.75, 0.14, 128, 1), [rimMaterial, floorMaterial, floorMaterial]);
  floor.position.y = -0.07;
  floor.receiveShadow = true;
  const rim = new THREE.Mesh(new THREE.TorusGeometry(3.6, 0.045, 12, 160), rimMaterial);
  rim.rotation.x = Math.PI / 2;
  rim.receiveShadow = true;
  scene.add(floor, rim);

  const key = new THREE.DirectionalLight(0xffd6a0, 3.2);
  key.position.set(4.5, 8, 5.5);
  key.target.position.set(0, 0.9, -0.3);
  key.castShadow = true;
  key.shadow.mapSize.set(2048, 2048);
  Object.assign(key.shadow.camera, { left: -3.4, right: 3.4, top: 3.4, bottom: -3.4, near: 4, far: 18 });
  key.shadow.bias = -0.0004;
  key.shadow.normalBias = 0.02;
  scene.add(key, key.target);

  const rimLight = new THREE.SpotLight(0x9cc0ff, 130, 30, 0.4, 0.55, 2);
  rimLight.position.set(-3.5, 6.5, -6.5);
  rimLight.target.position.set(0, 1.0, -0.2);
  scene.add(rimLight, rimLight.target);

  const fill = new THREE.DirectionalLight(0xffb070, 0.5);
  fill.position.set(-5, 2, 4);
  scene.add(fill, new THREE.HemisphereLight(0xb7c6dc, 0x2a1c10, 0.35));
}

// ============================================================================
// Post-processing: render -> bloom (HDR emissives only) -> output (ACES + sRGB)
// ============================================================================
function createComposer(renderer, scene, camera) {
  const target = new THREE.WebGLRenderTarget(1, 1, { type: THREE.HalfFloatType, samples: 4 });
  const composer = new EffectComposer(renderer, target);
  composer.addPass(new RenderPass(scene, camera));
  // UnrealBloomPass already works at half the composer resolution.
  composer.addPass(new UnrealBloomPass(new THREE.Vector2(1, 1), 0.42, 0.4, 1.0));
  composer.addPass(new OutputPass());
  return composer;
}

function createGui(params, bee) {
  const gui = new GUI({ title: 'Mechanical Bee' });
  gui.add(params, 'explode', 0, 1, 0.001).name('Exploded View');
  gui.add(params, 'flapFrequency', 0, 60, 0.1).name('Flap Frequency (Hz)');
  gui.add(params, 'mode', ['Flight', 'Idle']).name('Mode');
  gui.add(params, 'gearSpeed', 0.1, 5, 0.01).name('Gear Speed (×)');
  gui.add(params, 'wireframe').name('Wireframe').onChange((enabled) => {
    for (const material of Object.values(bee.materials)) material.wireframe = enabled;
  });
  gui.add(params, 'explodeAxis', EXPLODE_AXES).name('Explode Axis');
  return gui;
}

// ============================================================================
// App
// ============================================================================
const CAMERA_FOV = 35;
// Narrower (portrait) screens widen the vertical FOV to keep the horizontal view of a 1.7:1 screen.
const MIN_FRAMED_ASPECT = 1.7;
const EXPLODE_DOLLY = 0.42;
const EXPLODE_TARGET_SHIFT = new THREE.Vector3(0, 0.65, 0.15);

function startApp(renderer) {
  renderer.outputColorSpace = THREE.SRGBColorSpace;
  renderer.toneMapping = THREE.ACESFilmicToneMapping;
  renderer.toneMappingExposure = 1.0;
  renderer.shadowMap.enabled = true;
  renderer.shadowMap.type = THREE.PCFSoftShadowMap;
  document.body.appendChild(renderer.domElement);

  const scene = new THREE.Scene();
  const camera = new THREE.PerspectiveCamera(CAMERA_FOV, 1, 0.1, 200);
  camera.position.set(7.2, 3.15, 3.3);
  const controls = new OrbitControls(camera, renderer.domElement);
  controls.target.set(0, 1.3, -0.5);
  controls.enableDamping = true;
  controls.minDistance = 3;
  // Leaves room for the explode dolly on top of a fully zoomed-out view, so it is never clamped.
  controls.maxDistance = 26;
  controls.maxPolarAngle = Math.PI / 2 - 0.05;
  controls.update();

  const textures = createTextures(renderer.capabilities.getMaxAnisotropy());
  buildStudio(scene, renderer, textures);
  const bee = buildBee(createMaterials(textures));
  scene.add(bee.root, ...bee.instancedParts.map((part) => part.createMesh()));

  const params = { explode: 0, flapFrequency: 24, mode: 'Flight', gearSpeed: 1, wireframe: false, explodeAxis: 'Radial' };
  createGui(params, bee);
  const composer = createComposer(renderer, scene, camera);
  const state = createAnimationState();

  function onResize() {
    const width = window.innerWidth;
    const height = window.innerHeight;
    // A hidden or minimized embed reports 0×0; resizing to it would give a NaN aspect and zero-size render targets.
    if (width === 0 || height === 0) return;
    // Re-read every time: browser zoom and moving to another monitor change devicePixelRatio.
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    camera.aspect = width / height;
    camera.fov = radToDeg(2 * Math.atan(Math.tan(degToRad(CAMERA_FOV) / 2) * Math.max(1, MIN_FRAMED_ASPECT / camera.aspect)));
    camera.updateProjectionMatrix();
    renderer.setSize(width, height);
    composer.setPixelRatio(renderer.getPixelRatio());
    composer.setSize(width, height);
    bee.explode.setResolution(width, height);
  }
  window.addEventListener('resize', onResize);
  onResize();

  const orbitOffset = new THREE.Vector3();
  let framedAmount = 0;
  // Dolly out and lift the orbit target as parts separate. Applied as a change since the last frame,
  // so the viewer's own orbit, zoom and pan are kept.
  function frameExplosion(amount) {
    orbitOffset.copy(camera.position).sub(controls.target)
      .multiplyScalar((1 + EXPLODE_DOLLY * amount) / (1 + EXPLODE_DOLLY * framedAmount));
    controls.target.addScaledVector(EXPLODE_TARGET_SHIFT, amount - framedAmount);
    camera.position.copy(controls.target).add(orbitOffset);
    framedAmount = amount;
  }

  const clock = new THREE.Clock();
  // Started now so the first frame already gets a non-zero delta and a posed bee.
  clock.start();
  renderer.setAnimationLoop(() => {
    const dt = Math.min(clock.getDelta(), 1 / 20);
    if (dt > 0) updateBee(bee, state, params, dt);
    frameExplosion(bee.explode.amount);
    // OrbitControls applies its damping once per call; this keeps the glide the same at any refresh rate.
    controls.dampingFactor = 1 - Math.pow(1 - 0.06, dt * 60);
    controls.update();
    composer.render();
  });
}

function createRenderer() {
  try {
    // The scene renders into the composer's MSAA target, so the canvas needs no antialiasing, depth or stencil.
    return new THREE.WebGLRenderer({ antialias: false, depth: false, stencil: false, powerPreference: 'high-performance' });
  } catch {
    return null;
  }
}

const renderer = createRenderer();
if (renderer) startApp(renderer);
else document.getElementById('webgl-error').style.display = 'flex';
</script>
</body>
