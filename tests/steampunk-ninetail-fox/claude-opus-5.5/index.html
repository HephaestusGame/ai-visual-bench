    //#region 头部: 铰接黄铜狐首 / 琥珀玻璃眼 / 额心狐火晶石 / 扇叶双耳

    BuildHead()
    {
        const m = this.m_Mat;
        const head = this.boneMap.head;
        const jaw = this.boneMap.jaw;
        const unitSphere = Cached('unitSphere', () => new THREE.SphereGeometry(1, 32, 20));
        // 头骨 / 颊部 / 细长吻部
        const skull = AddGroup(head);
        AddMesh(skull, unitSphere, m.brassBright, [0, 0.03, -0.01], null, [0.12, 0.11, 0.14]);
        for (const side of [1, -1])
        {
            AddMesh(skull, unitSphere, m.brass, [0.072 * side, -0.035, 0.03], null, [0.052, 0.05, 0.095]);
        }
        AddMesh(skull, Cached('snoutUpper', () => new THREE.CylinderGeometry(0.028, 0.07, 0.3, 18).rotateX(k_HalfPi)), m.brassBright, [0, -0.015, 0.22], null, [1, 0.75, 1]);
        AddMesh(skull, Cached('noseBridge', () => new THREE.BoxGeometry(0.034, 0.012, 0.27)), m.copperPlate, [0, 0.03, 0.21], [0.13, 0, 0]);
        AddMesh(skull, RivetGeometry([0.1, 0.17, 0.24, 0.31].map((z) => new THREE.Vector3(0, 0.037 - (z - 0.1) * 0.13, z)), Array(4).fill(new THREE.Vector3(0, 1, 0)), 0.006), m.steel);
        AddMesh(skull, unitSphere, m.blackIron, [0, 0.004, 0.372], null, [0.03, 0.022, 0.026]);
        this.RegisterPart(skull, 0.12, head, [0, 0.4, 1]);
        // 额顶铜甲
        const foreheadPlate = AddGroup(head, [0, 0.03, 0]);
        AddMesh(foreheadPlate, CapGeometry(0.125, 0.75), m.copperPlate, null, [0.45, 0, 0], [0.98, 1, 1.12]);
        AddMesh(foreheadPlate, CapTrimGeometry(0.125, 0.75, 0.005), m.brassBright, null, [0.45, 0, 0], [0.98, 1, 1.12]);
        this.RegisterPart(foreheadPlate, 0.25, head, [0, 1, 0.2]);
        // 上排钢牙 / 獠牙 / 口腔狐火
        const toothGeometry = Cached('tooth', () => new THREE.ConeGeometry(0.0065, 0.022, 6));
        const fangGeometry = Cached('fang', () => new THREE.ConeGeometry(0.009, 0.04, 6));
        for (const side of [1, -1])
        {
            for (let i = 0; i < 5; i++)
            {
                const z = 0.14 + i * 0.045;
                const halfWidth = Lerp(0.05, 0.022, i / 4);
                AddMesh(skull, toothGeometry, m.chrome, [halfWidth * side, -0.05, z], [Math.PI, 0, 0]);
            }
            AddMesh(skull, fangGeometry, m.chrome, [0.026 * side, -0.058, 0.33], [Math.PI, 0, 0]);
        }
        AddMesh(head, Cached('mouthGlowUpper', () => new THREE.BoxGeometry(0.06, 0.006, 0.24)), m.coreMouth, [0, -0.045, 0.24]).castShadow = false;
        this.AddAnchor('mouth', head, [0, -0.07, 0.38]);
        // 下颌 (可开合)
        const jawGroup = AddGroup(jaw);
        AddMesh(jawGroup, Cached('snoutLower', () => new THREE.CylinderGeometry(0.022, 0.05, 0.27, 16).rotateX(k_HalfPi)), m.brass, [0, -0.008, 0.15], null, [1, 0.55, 1]);
        AddMesh(jawGroup, Cached('chinPlate', () => new THREE.BoxGeometry(0.05, 0.008, 0.16)), m.copperPlate, [0, -0.024, 0.12], [-0.06, 0, 0]);
        AddMesh(jawGroup, Cached('mouthGlowLower', () => new THREE.BoxGeometry(0.05, 0.006, 0.2)), m.coreMouth, [0, 0.008, 0.15]).castShadow = false;
        for (const side of [1, -1])
        {
            for (let i = 0; i < 5; i++)
            {
                const z = 0.07 + i * 0.045;
                AddMesh(jawGroup, toothGeometry, m.chrome, [Lerp(0.04, 0.016, i / 4) * side, 0.012, z]);
            }
            AddMesh(jawGroup, fangGeometry, m.chrome, [0.02 * side, 0.016, 0.25]);
            this.AddGear(jawGroup, 0.024, 9, 0.012, [0.062 * side, 0, -0.005], [0, k_HalfPi, 0], 1.6 * side, 0, m.steel);
            this.AddPiston(head, [0.078 * side, 0.0, -0.03], jaw, [0.048 * side, -0.014, 0.09], 0.0075);
        }
        this.RegisterPart(jawGroup, 0.25, head, [0, -1, 0.3]);
        // 颊侧银白金属须毛
        for (const side of [1, -1])
        {
            const cheekGeometry = Cached(`cheekFur_${side}`, () =>
            {
                const specList = [];
                for (let i = 0; i < 6; i++)
                {
                    const k = i / 5 - 0.5;
                    specList.push({ length: 0.13 + (0.5 - Math.abs(k)) * 0.05, width: 0.04, thickness: 0.004, cup: 0.3, bend: 0.12, position: [0.1 * side, -0.035 + k * 0.05, 0.03], azimuth: side * (Math.PI - 0.75 + k * 0.4), tilt: k_HalfPi + 0.25 - k * 0.5, colorBase: k_FoxSilver, colorTip: k_FoxWhite });
                }
                return MergeBlades(specList);
            });
            const cheek = AddMesh(head, cheekGeometry, m.fur);
            this.RegisterPart(cheek, 0.2, head, [side, 0, -0.3]);
        }
        // 琥珀玻璃眼: 眼窝 + 虹膜球 + 玻璃壳 + 黄铜眼睑 + 眉甲
        for (const side of [1, -1])
        {
            const eyeGroup = AddGroup(head, [0.07 * side, 0.045, 0.105], [0, 0.42 * side, -0.28 * side]);
            AddMesh(eyeGroup, Cached('eyeSocket', () => new THREE.TorusGeometry(0.033, 0.0075, 8, 28)), m.brassBright, [0, 0, 0.006], null, [1.15, 0.85, 1]);
            const eyeHolder = AddGroup(eyeGroup);
            AddMesh(eyeHolder, Cached('eyeBall', () => new THREE.SphereGeometry(0.028, 28, 18)), m.eye, null, [k_HalfPi, 0, 0], [1.1, 1, 0.85]).castShadow = false;
            this.eyeList.push(eyeHolder);
            AddMesh(eyeGroup, Cached('eyeShell', () => new THREE.SphereGeometry(0.0305, 24, 10, 0, k_TwoPi, 0, 1.2).rotateX(k_HalfPi)), m.eyeGlass, null, null, [1.1, 0.95, 0.9]).castShadow = false;
            const lidPivot = AddGroup(eyeGroup);
            AddMesh(lidPivot, Cached('eyeLid', () => new THREE.SphereGeometry(0.035, 22, 10, 0, k_TwoPi, 0, k_HalfPi)), m.brass, null, null, [1.12, 1, 1]);
            this.lidList.push(lidPivot);
            AddMesh(eyeGroup, Cached('eyeBrow', () => new THREE.BoxGeometry(0.078, 0.011, 0.034)), m.copperPlate, [0, 0.037, 0.006], [0.32, 0, 0]);
            this.AddGlowSprite(eyeGroup, m.glowAmber, [0, 0, 0.03], 0.05);
            this.AddAnchor(side > 0 ? 'eyeL' : 'eyeR', eyeGroup, [0, 0, 0.03]);
            this.RegisterPart(eyeGroup, 0.22, head, [side, 0.2, 0.6]);
        }
        this.lights.eye = new THREE.PointLight(0xffa040, 0.6, 1.3, 2);
        this.lights.eye.position.set(0, 0.06, 0.22);
        head.add(this.lights.eye);
        // 额心狐火晶石 (卧于额面, 长轴指向吻部)
        const crystalGroup = AddGroup(head, [0, 0.128, 0.09], [0.62, 0, 0]);
        AddMesh(crystalGroup, Cached('crystalSetting', () => new THREE.TorusGeometry(0.026, 0.005, 8, 24).rotateX(k_HalfPi)), m.brassBright, null, null, [0.8, 1, 1.5]);
        for (let i = 0; i < 4; i++)
        {
            const angle = i / 4 * k_TwoPi + Math.PI / 4;
            AddMesh(crystalGroup, Cached('crystalProng', () => new THREE.BoxGeometry(0.006, 0.014, 0.006)), m.brass, [Math.cos(angle) * 0.021, 0.004, Math.sin(angle) * 0.034]);
        }
        this.crystal = AddMesh(crystalGroup, Cached('crystal', () => new THREE.OctahedronGeometry(0.03, 0)), m.crystal, [0, 0.008, 0], null, [0.6, 0.55, 1.45]);
        this.AddGlowSprite(crystalGroup, m.glowCyan, [0, 0.012, 0], 0.06);
        this.AddAnchor('crystal', crystalGroup, [0, 0.015, 0]);
        this.RegisterPart(crystalGroup, 0.3, head, [0, 1, 0.5]);
        // 扇形黄铜叶片双耳
        const earGeometry = Cached('earFan', () =>
        {
            const specList = [];
            const leafCount = 7;
            for (let i = 0; i < leafCount; i++)
            {
                const k = i / (leafCount - 1) - 0.5;
                specList.push({ length: 0.19 - Math.abs(k) * 0.13, width: 0.05, thickness: 0.004, cup: 0.35, bend: 0.06, position: [k * 0.04, 0, -0.004 * Math.abs(k)], azimuth: 0, tilt: 0, roll: -k * 0.95, colorBase: k_FoxOrange, colorTip: k_FoxDark });
            }
            return MergeBlades(specList);
        });
        for (const side of [1, -1])
        {
            const ear = this.boneMap[side > 0 ? 'earL' : 'earR'];
            AddMesh(ear, Cached('earSocket', () => new THREE.CylinderGeometry(0.03, 0.036, 0.03, 16)), m.brass);
            this.AddGear(ear, 0.026, 9, 0.012, [0.034 * side, 0.004, 0], [0, k_HalfPi, 0], 2.2 * side, 0, m.steel);
            AddMesh(ear, earGeometry, m.fur, [0, 0.012, 0]);
            AddMesh(ear, Cached('earInner', () => new THREE.ConeGeometry(0.04, 0.13, 3)), m.leatherDark, [0, 0.075, 0.01], null, [1, 1, 0.25]);
            this.RegisterPart(ear, 0.25, head);
        }
        // 颈侧液压活塞 (胸腔 → 头骨)
        for (const side of [1, -1])
        {
            this.AddPiston(this.boneMap.chest, [0.075 * side, 0.16, 0.2], head, [0.06 * side, -0.05, -0.07], 0.013);
        }
    }

    //#region 四肢: 趾行腿 / 关节齿轮 / 液压活塞 / 分段利爪

    BuildPaw(paw, side, anchorName)
    {
        const m = this.m_Mat;
        const unitSphere = Cached('unitSphere', () => new THREE.SphereGeometry(1, 32, 20));
        AddMesh(paw, Cached('pawKnuckle', () => new THREE.CylinderGeometry(0.026, 0.026, 0.08, 14).rotateZ(k_HalfPi)), m.brass, [0, -0.008, 0.012]);
        AddMesh(paw, unitSphere, m.leatherDark, [0, -0.042, 0.02], null, [0.044, 0.02, 0.05]);
        const toeXList = [-0.033, -0.011, 0.011, 0.033];
        toeXList.forEach((x, index) =>
        {
            const isInner = index === 1 || index === 2;
            const proximalLength = isInner ? 0.05 : 0.04;
            const toe = AddGroup(paw, [x, -0.02, 0.03], [0.12, x * 2.4, 0]);
            AddStrut(toe, [0, 0, 0], [0, -0.008, proximalLength], 0.011, m.brass, 0.0095, 8);
            AddMesh(toe, Cached('toeKnuckle', () => new THREE.SphereGeometry(0.012, 10, 8)), m.steel, [0, -0.008, proximalLength]);
            const middle = AddGroup(toe, [0, -0.008, proximalLength], [0.32, 0, 0]);
            AddStrut(middle, [0, 0, 0], [0, -0.002, 0.03], 0.0095, m.brassBright, 0.0085, 8);
            AddMesh(middle, unitSphere, m.leatherDark, [0, -0.01, 0.012], null, [0.011, 0.007, 0.016]);
            const clawPivot = AddGroup(middle, [0, 0.0, 0.03]);
            AddMesh(clawPivot, ClawGeometry(0.05, 0.0085), m.steel);
            this.clawList.push(clawPivot);
        });
        this.AddAnchor(anchorName, paw, [0, -0.06, 0.03]);
    }

    BuildFrontLeg(side)
    {
        const m = this.m_Mat;
        const s = side > 0 ? 'L' : 'R';
        const shoulder = this.boneMap['shoulder' + s];
        const elbow = this.boneMap['elbow' + s];
        const wrist = this.boneMap['wrist' + s];
        const paw = this.boneMap['pawF' + s];
        const unitSphere = Cached('unitSphere', () => new THREE.SphereGeometry(1, 32, 20));
        // 肩关节: 外露齿轮 + 钢球铰 + 三层肩甲
        AddMesh(shoulder, Cached('jointBall_0.05', () => new THREE.SphereGeometry(0.05, 18, 12)), m.steel);
        const shoulderGear = this.AddGear(shoulder, 0.075, 15, 0.024, [0.06 * side, 0, 0], [0, k_HalfPi, 0], 1.2 * side, 5);
        this.RegisterPart(shoulderGear, 0.3, shoulder, [side, 0, 0]);

        for (let i = 0; i < 3; i++)

            this.AddLimbPlate(pauldron, [0, -0.04 - i * 0.07, -0.015 * i], 0.082 + i * 0.003, 0.072, 0.1, side * 1.15, 2.5, 0.27, i % 2 === 0 ? m.brass : m.copperPlate);
        }
        this.RegisterPart(pauldron, 0.35, shoulder, [side, 0.3, 0.2]);
        this.AddPiston(shoulder, [0, -0.03, 0.062], elbow, [0, -0.1, 0.036], 0.014);

        const elbowGear = this.AddGear(elbow, 0.05, 11, 0.02, [0.045 * side, 0, 0], [0, k_HalfPi, 0], -1.65 * side);
        this.RegisterPart(elbowGear, 0.25, elbow, [side, 0, 0]);
        AddStrut(elbow, [0, 0, 0], [0, -0.4, 0.03], 0.034, m.steel, 0.026, 12);

        this.RegisterPart(greave, 0.25, elbow, [0, 0, 1]);
        this.AddPiston(elbow, [0, -0.06, -0.038], wrist, [0, -0.07, -0.026], 0.011);
        // 腕关节 + 掌骨
        AddMesh(wrist, Cached('jointBall_0.03', () => new THREE.SphereGeometry(0.03, 14, 10)), m.steel);
        this.AddGear(wrist, 0.034, 9, 0.016, [0.034 * side, 0, 0], [0, k_HalfPi, 0], 2.2 * side, 0, m.copper);
        AddStrut(wrist, [0, 0, 0], [0, -0.22, 0.04], 0.026, m.steel, 0.022, 10);
        AddMesh(wrist, Cached('wristCuff', () => new THREE.TorusGeometry(0.026, 0.007, 6, 18).rotateX(k_HalfPi)), m.brassBright, [0, -0.08, 0.015], [0.18, 0, 0]);
        this.BuildPaw(paw, side, 'pawF' + s);
    }

    BuildHindLeg(side)
    {
        const m = this.m_Mat;

        const hip = this.boneMap['hip' + s];

        AddMesh(hip, Cached('jointBall_0.06', () => new THREE.SphereGeometry(0.06, 18, 12)), m.steel);

        this.RegisterPart(haunch, 0.35, hip, [side, 0.2, 0]);
        const thighPlate = this.AddDomePlate(hip, [-0.03 * side, -0.27, 0.115], 0.11, 0.72, [0, 0.35 * side, -k_HalfPi * side], 6, m.copperPlate);
        this.RegisterPart(thighPlate, 0.3, hip, [side, -0.2, 0.3]);
        this.AddPiston(hip, [0, -0.03, 0.075], knee, [0, -0.09, 0.03], 0.015);
        // 膝关节 + 胫骨
        AddMesh(knee, Cached('jointBall_0.042', () => new THREE.SphereGeometry(0.042, 16, 12)), m.steel);
        AddMesh(knee, unitSphere, m.brass, [0, 0.0, 0.04], null, [0.032, 0.036, 0.024]);

        const shinPlate = this.AddLimbPlate(knee, [0, -0.17, -0.092], 0.042, 0.033, 0.26, side * 0.7, 2.4, 0.507, m.brass);
        this.RegisterPart(shinPlate, 0.25, knee, [side, 0, 0.3]);
        this.AddPiston(knee, [0, -0.04, -0.046], hock, [0, -0.05, -0.034], 0.012);
        // 跗关节 + 跖骨 + 足跟刺
        AddMesh(hock, Cached('jointBall_0.032', () => new THREE.SphereGeometry(0.032, 14, 10)), m.steel);
        this.AddGear(hock, 0.036, 9, 0.016, [0.035 * side, 0, 0], [0, k_HalfPi, 0], 2.0 * side, 0, m.copper);
        AddMesh(hock, Cached('heelSpur', () => new THREE.ConeGeometry(0.014, 0.05, 8).rotateX(-k_HalfPi)), m.brassBright, [0, 0.01, -0.045]);
        AddStrut(hock, [0, 0, 0], [0, -0.25, 0.03], 0.026, m.steel, 0.022, 10);
        AddMesh(hock, Cached('wristCuff', () => new THREE.TorusGeometry(0.026, 0.007, 6, 18).rotateX(k_HalfPi)), m.brassBright, [0, -0.1, 0.012]);
        this.BuildPaw(paw, side, 'pawB' + s);
    }

    //#endregion

    //#region 九尾: 齿轮毂 / 分节机械尾 / 层叠金属尾毛 / 尾尖狐火灯

    // 每节尾毛几何体由九条尾巴共享: 根部铜橙 → 尾梢银白
    BuildTailFurGeometry(index)
    {
        return Cached(`tailFur_${index}`, () =>
        {
            const segmentCount = k_TailSegmentLengthList.length;
            const length = k_TailSegmentLengthList[index];
            const radius = k_TailFurRadiusList[index];
            const t = index / (segmentCount - 1);
            const colorBase = k_FoxOrange.clone().lerp(k_FoxSilver, SmoothStep(0.55, 0.95, t));
            const colorTip = k_FoxOrangeBright.clone().lerp(k_FoxWhite, SmoothStep(0.45, 0.85, t));
            const tilt = 0.5;
            const bladeLength = Math.max(0.12, (radius - 0.02) / Math.sin(tilt) * 1.05 + length * 0.35);
            const specList = [];
            const bladeCount = 8;
            for (let ring = 0; ring < 2; ring++)
            {
                for (let i = 0; i < bladeCount; i++)
                {
                    const azimuth = (i + ring * 0.5 + index * 0.25) / bladeCount * k_TwoPi;
                    specList.push({ length: bladeLength, width: radius * 0.75 + 0.02, thickness: 0.005, cup: 0.3, bend: 0.16, position: [Math.sin(azimuth) * 0.022, ring * length * 0.5, Math.cos(azimuth) * 0.022], azimuth: azimuth, tilt: tilt - ring * 0.06, colorBase: colorBase, colorTip: colorTip });
                }
            }
            return MergeBlades(specList);
        });
    }

    BuildTails()
    {
        const m = this.m_Mat;
        const tailBase = this.boneMap.tailBase;
        const segmentCount = k_TailSegmentLengthList.length;
        // 尾部齿轮毂
        const hub = AddGroup(tailBase, [0, 0, -0.01]);
        this.AddGear(hub, 0.15, 20, 0.035, [0, 0, 0], null, 0.5, 6);
        AddMesh(hub, Cached('tailHubCap', () => new THREE.SphereGeometry(0.06, 20, 12, 0, k_TwoPi, 0, k_HalfPi).rotateX(-k_HalfPi)), m.brassBright, [0, 0, -0.03]);
        AddMesh(hub, RivetRingOnDisc(0.12, 12, 0.008), m.steel, [0, 0, -0.022], [Math.PI, 0, 0]);
        this.RegisterPart(hub, 0.3, this.boneMap.hips, [0, 0.2, -1]);
        this.lights.tail = new THREE.PointLight(0x5fe0ff, 2.0, 4.5, 2);
        this.lights.tail.position.set(0, 0.55, -0.55);
        tailBase.add(this.lights.tail);
        const socketGeometry = Cached('tailSocket', () => new THREE.SphereGeometry(0.027, 14, 10));
        for (let i = 0; i < k_TailCount; i++)
        {
            const u = (i - (k_TailCount - 1) / 2) / ((k_TailCount - 1) / 2);
            const rootPosition = [u * 0.1, 0.035 * (1 - Math.abs(u)), -0.06];
            AddMesh(tailBase, socketGeometry, m.steel, rootPosition);
            const boneList = [];
            let parent = tailBase;
            for (let k = 0; k < segmentCount; k++)
            {
                const bone = new THREE.Bone();
                bone.name = `tail${i}_${k}`;
                if (k === 0)
                {
                    bone.position.set(rootPosition[0], rootPosition[1], rootPosition[2]);
                    bone.rotation.order = 'YXZ';
                }
                else
                {
                    bone.position.set(0, k_TailSegmentLengthList[k - 1], 0);
                }
                parent.add(bone);
                const length = k_TailSegmentLengthList[k];
                const vertebraRadius = Lerp(0.024, 0.013, k / (segmentCount - 1));
                AddMesh(bone, Cached(`tailVertebra_${k}`, () => new THREE.CylinderGeometry(vertebraRadius * 0.85, vertebraRadius, length, 10).translate(0, length * 0.5, 0)), m.steel);
                AddMesh(bone, Cached(`tailRing_${k}`, () => new THREE.TorusGeometry(vertebraRadius + 0.008, 0.006, 6, 16).rotateX(k_HalfPi)), k % 2 === 0 ? m.brassBright : m.copper);
                AddMesh(bone, this.BuildTailFurGeometry(k), m.fur);
                if (k === 3 || k === 6)
                {
                    this.RegisterPart(bone, 0.07, tailBase, [0, 1, 0]);
                }
                boneList.push(bone);
                parent = bone;
            }
            // 尾尖狐火灯: 黄铜灯座 + 笼架 + 玻璃罩 + 火焰 + 光晕
            const lantern = AddGroup(parent, [0, k_TailSegmentLengthList[segmentCount - 1] + 0.015, 0]);
            AddMesh(lantern, Cached('lanternBase', () => new THREE.CylinderGeometry(0.03, 0.016, 0.03, 14)), m.brassBright);
            for (let c = 0; c < 4; c++)
            {
                const angle = c / 4 * k_TwoPi + Math.PI / 4;
                AddStrut(lantern, [Math.cos(angle) * 0.03, 0.012, Math.sin(angle) * 0.03], [Math.cos(angle) * 0.03, 0.1, Math.sin(angle) * 0.03], 0.0035, m.brass, 0.0035, 5);
            }
            AddMesh(lantern, Cached('lanternGlass', () => new THREE.SphereGeometry(0.04, 18, 12)), m.lanternGlass, [0, 0.056, 0]).castShadow = false;
            AddMesh(lantern, Cached('lanternTop', () => new THREE.ConeGeometry(0.034, 0.03, 14)), m.brassBright, [0, 0.112, 0]);
            AddMesh(lantern, Cached('lanternFinial', () => new THREE.SphereGeometry(0.009, 8, 6)), m.brass, [0, 0.132, 0]);
            const flame = AddMesh(lantern, Cached('foxFlame', () => new THREE.SphereGeometry(0.024, 16, 12)), m.coreFlame, [0, 0.052, 0]);
            flame.castShadow = false;
            const sprite = new THREE.Sprite(m.glowFire);
            sprite.position.set(0, 0.056, 0);
            sprite.renderOrder = 5;
            lantern.add(sprite);
            this.flameList.push({ mesh: flame, sprite: sprite, phase: i * 1.37 });
            this.tailTipList.push(this.AddAnchor(`tailTip${i}`, lantern, [0, 0.056, 0]));
            this.RegisterPart(lantern, 0.15, tailBase, [0, 1, 0]);
            this.RegisterPart(boneList[0], 0.42, tailBase, [-u * 1.2, 0.6, -1]);
            const stiffness = 13 + this.m_Random() * 12;
            this.tailList.push(
            {
                u: u,
                boneList: boneList,
                spring: { x: 0, y: 0, vx: 0, vy: 0 },
                stiffness: stiffness,
                damping: 2 * Math.sqrt(stiffness) * (0.28 + this.m_Random() * 0.12),
                phase: this.m_Random() * k_TwoPi,
                freq: 1.1 + this.m_Random() * 0.7
            });
        }
    }

    //#endregion

    //#region 完成构建 / 姿态应用 / 尾巴跟随 / 每帧更新

    Finalize()
    {
        // 四肢以侧向为主分离, 避免末端沉入地面
        for (const side of ['L', 'R'])
        {
            const x = side === 'L' ? 1 : -1;
            this.RegisterPart(this.boneMap['shoulder' + side], 0.45, null, [x, 0.35, 0.25]);
            this.RegisterPart(this.boneMap['elbow' + side], 0.3, null, [x * 0.8, -0.25, 0.1]);
            this.RegisterPart(this.boneMap['wrist' + side], 0.25, null, [x * 0.7, -0.25, 0.2]);
            this.RegisterPart(this.boneMap['pawF' + side], 0.22, null, [x * 0.5, -0.1, 0.6]);
            this.RegisterPart(this.boneMap['hip' + side], 0.45, null, [x, 0.35, -0.25]);
            this.RegisterPart(this.boneMap['knee' + side], 0.3, null, [x * 0.8, -0.25, -0.1]);
            this.RegisterPart(this.boneMap['hock' + side], 0.25, null, [x * 0.7, -0.25, -0.2]);
            this.RegisterPart(this.boneMap['pawB' + side], 0.22, null, [x * 0.5, -0.1, 0.6]);
        }
        this.RegisterPart(this.boneMap.neck, 0.3, this.torsoCenter, [0, 0.5, 1]);
        this.RegisterPart(this.boneMap.head, 0.4, this.torsoCenter, [0, 0.6, 1]);
        this.RegisterPart(this.boneMap.tailBase, 0.45, this.torsoCenter, [0, 0.4, -1]);
        this.root.updateMatrixWorld(true);
        for (const spec of this.pistonSpecList)
        {
            this.pistonList.push(new HydraulicPiston(spec.boneA, spec.pointA, spec.boneB, spec.pointB, spec.radius, this.m_Mat));
        }
        for (const item of this.explodeList)
        {
            let depth = 0;
            let node = item.object.parent;
            while (node)
            {
                depth++;
                node = node.parent;
            }
            item.depth = depth;
        }
        this.explodeList.sort((a, b) => a.depth - b.depth);
        this.materialSet = new Set();
        let meshCount = 0;
        this.root.traverse((object) =>
        {
            if (object.isMesh)
            {
                meshCount++;
                this.materialSet.add(object.material);
            }
        });
        console.log(`[SteampunkFox](Finalize) 构建完成: 网格 ${meshCount} 个, 齿轮 ${this.gearList.length} 个, 活塞 ${this.pistonList.length} 个, 尾巴 ${this.tailList.length} 条, 爆炸部件 ${this.explodeList.length} 个`);
    }

    ApplyPose(pose)
    {
        for (let i = 0; i < k_RotBoneList.length; i++)
        {
            const bone = this.boneMap[k_RotBoneList[i]];
            const rest = bone.userData.restRotation;
            bone.rotation.set(rest.x + pose[i * 3], rest.y + pose[i * 3 + 1], rest.z + pose[i * 3 + 2]);
        }
        this.boneMap.root.position.set(pose[k_ChannelMap.posX], pose[k_ChannelMap.posY], pose[k_ChannelMap.posZ]);
        const tail = this.m_TailParam;
        tail.lift = pose[k_ChannelMap.tailLift];
        tail.spread = pose[k_ChannelMap.tailSpread];
        tail.curl = pose[k_ChannelMap.tailCurl];
        tail.sweep = pose[k_ChannelMap.tailSweep];
        tail.wag = pose[k_ChannelMap.tailWag];
        this.m_Lid = pose[k_ChannelMap.lid];
        this.glow = pose[k_ChannelMap.glow];
        this.fire = pose[k_ChannelMap.fire];
        this.steam = pose[k_ChannelMap.steam];
        this.claw = pose[k_ChannelMap.claw];
    }

    // 九尾独立跟随: 尾毂的线速度/角速度驱动每条尾巴各自的阻尼弹簧, 叠加相位各异的摆动波
    UpdateTails(deltaTime, time)
    {
        const param = this.m_TailParam;
        const tailBase = this.boneMap.tailBase;
        this.root.updateMatrixWorld(true);
        const position = s_TempVecA.setFromMatrixPosition(tailBase.matrixWorld);
        const quaternion = this.m_TailQuaternion.setFromRotationMatrix(tailBase.matrixWorld);
        let driveYaw = 0;
        let drivePitch = 0;
        if (this.m_HasPreviousTail && deltaTime > 1e-4)
        {
            this.m_TailInverse.copy(quaternion).invert();
            const velocity = this.m_TailVelocity.subVectors(position, this.m_PreviousTailPosition).divideScalar(deltaTime).applyQuaternion(this.m_TailInverse);
            const delta = this.m_TailDelta.copy(this.m_PreviousTailQuaternion).invert().premultiply(quaternion);
            if (delta.w < 0)
            {
                delta.set(-delta.x, -delta.y, -delta.z, -delta.w);
            }
            const sinHalf = Math.sqrt(delta.x * delta.x + delta.y * delta.y + delta.z * delta.z);
            const omega = this.m_TailOmega.set(0, 0, 0);
            if (sinHalf > 1e-6)
            {
                const angle = 2 * Math.atan2(sinHalf, delta.w);
                omega.set(delta.x, delta.y, delta.z).multiplyScalar(angle / sinHalf / deltaTime).applyQuaternion(this.m_TailInverse);
            }
            driveYaw = Clamp(-omega.y * 0.16 + velocity.x * 0.22, -1.4, 1.4);
            drivePitch = Clamp(-omega.x * 0.12 - velocity.y * 0.16 - Math.max(0, velocity.z) * 0.03, -1.2, 1.2);
        }
        this.m_PreviousTailPosition.copy(position);
        this.m_PreviousTailQuaternion.copy(quaternion);
        this.m_HasPreviousTail = true;
        // 子步积分保证高动画倍速下弹簧稳定
        const steps = Math.min(10, Math.max(1, Math.ceil(deltaTime / 0.012)));
        const h = deltaTime / steps;
        const spread = Lerp(0.3, 1.2, Clamp(param.spread, -0.3, 1.5));
        const segmentCount = k_TailSegmentLengthList.length;
        for (const tail of this.tailList)
        {
            const spring = tail.spring;
            for (let n = 0; n < steps; n++)
            {
                spring.vx += (tail.stiffness * (driveYaw - spring.x) - tail.damping * spring.vx) * h;
                spring.vy += (tail.stiffness * (drivePitch - spring.y) - tail.damping * spring.vy) * h;
                spring.x += spring.vx * h;
                spring.y += spring.vy * h;
            }
            const u = tail.u;
            const wagWave = Math.sin(time * 9 + tail.phase * 0.3) * param.wag;
            const lift = 0.05 + (1 - Math.abs(u)) * 0.5 + param.lift + spring.y * 0.7 + Math.sin(time * tail.freq * 0.6 + tail.phase) * 0.04;
            tail.boneList[0].rotation.set(lift - k_HalfPi, -u * spread + param.sweep + spring.x * 0.7 + wagWave * 0.25, -u * 0.2);
            for (let k = 1; k < segmentCount; k++)
            {
                const w = k / (segmentCount - 1);
                const wave = Math.sin(time * tail.freq - k * 0.62 + tail.phase);
                const wave2 = Math.cos(time * tail.freq * 0.73 - k * 0.5 + tail.phase * 1.7);
                const bone = tail.boneList[k];
                bone.rotation.x = 0.07 + param.curl * 0.13 + wave2 * 0.05 * (0.4 + w) + spring.y * 0.14 * w;
                bone.rotation.z = wave * 0.075 * (0.4 + w) + Math.sin(time * 9 - k * 0.7 + tail.phase * 0.3) * param.wag * 0.09 + spring.x * 0.16 * w;
            }
        }
    }

    // 滚子链沿两链轮的跑道形路径运动, 线速度与链轮齿面一致
    UpdateChain(gearFactor)
    {
        const chain = this.chain;
        const radius = chain.radius;
        const halfSpan = chain.halfSpan;
        const straight = 2 * halfSpan;
        const arc = Math.PI * radius;
        const total = 2 * straight + 2 * arc;
        chain.offset = (chain.offset + chain.speed * gearFactor * radius / total) % 1;
        const count = chain.linkList.length;
        for (let i = 0; i < count; i++)
        {
            const s = ((i / count + chain.offset) % 1) * total;
            let y;
            let z;
            let ty;
            let tz;
            if (s < straight)
            {
                y = radius;
                z = -halfSpan + s;
                ty = 0;
                tz = 1;
            }
            else if (s < straight + arc)
            {
                const a = (s - straight) / radius;
                y = radius * Math.cos(a);
                z = halfSpan + radius * Math.sin(a);
                ty = -Math.sin(a);
                tz = Math.cos(a);
            }
            else if (s < 2 * straight + arc)
            {
                y = -radius;
                z = halfSpan - (s - straight - arc);
                ty = 0;
                tz = -1;
            }
            else
            {
                const a = (s - 2 * straight - arc) / radius;
                y = -radius * Math.cos(a);
                z = -halfSpan - radius * Math.sin(a);
                ty = Math.sin(a);
                tz = -Math.cos(a);
            }
            const link = chain.linkList[i];
            link.position.set(0, y, z);
            link.rotation.set(Math.atan2(ty, -tz), k_HalfPi, 0);
        }
    }

    // 铃铛与符牌: 始终沿重力方向悬垂, 朝向跟随身体偏航
    UpdatePendants(time)
    {
        this.boneMap.root.getWorldQuaternion(s_TempQuat);
        const forward = s_TempVecB.set(0, 0, 1).applyQuaternion(s_TempQuat);
        const yaw = Math.atan2(forward.x, forward.z);
        const motion = Math.min(1.5, Math.abs(this.m_TailOmega.y) * 0.1 + this.m_TailVelocity.length() * 0.15);
        for (const pendant of this.pendantList)
        {
            const swing = (0.08 + motion * 0.25) * pendant.amplitude;
            s_TempEuler.set(Math.sin(time * 3.7 + pendant.phase) * swing, yaw, Math.sin(time * 2.9 + pendant.phase * 1.3) * swing * 0.6, 'YXZ');
            pendant.pivot.parent.getWorldQuaternion(s_TempQuatB).invert();
            pendant.pivot.quaternion.setFromEuler(s_TempEuler).premultiply(s_TempQuatB);
        }
    }

    Update(deltaTime, time, gearSpeed)
    {
        const m = this.m_Mat;
        const glow = Math.max(0, this.glow);
        const fire = Math.max(0, this.fire);
        // 眨眼 (黄铜眼睑)
        this.m_BlinkTimer -= deltaTime;
        if (this.m_BlinkTimer <= 0)
        {
            this.m_BlinkTimer = 2.2 + this.m_Random() * 4;
            if (glow > 0.3)
            {
                this.m_BlinkTime = 0;
            }
        }
        let blink = 0;
        if (this.m_BlinkTime >= 0)
        {
            this.m_BlinkTime += deltaTime;
            const t = this.m_BlinkTime / 0.18;
            blink = t < 1 ? Math.sin(t * Math.PI) : 0;
            if (t >= 1)
            {
                this.m_BlinkTime = -1;
            }
        }
        const close = Clamp(Math.max(this.m_Lid, blink), 0, 1);
        for (const lid of this.lidList)
        {
            lid.rotation.x = Lerp(-0.85, 1.5, close);
        }
        // 眼球微动: 扫视 + 生理震颤
        this.m_SaccadeTimer -= deltaTime;
        if (this.m_SaccadeTimer <= 0)
        {
            this.m_SaccadeTimer = 0.3 + this.m_Random() * 1.6;
            this.m_EyeTarget.set((this.m_Random() - 0.5) * 0.25, (this.m_Random() - 0.5) * 0.45);
        }
        this.m_EyeCurrent.x = Damp(this.m_EyeCurrent.x, this.m_EyeTarget.x, 18, deltaTime);
        this.m_EyeCurrent.y = Damp(this.m_EyeCurrent.y, this.m_EyeTarget.y, 18, deltaTime);
        this.eyeList.forEach((eye, index) =>
        {
            eye.rotation.x = this.m_EyeCurrent.x + Math.sin(time * 23.0 + index) * 0.005;
            eye.rotation.y = this.m_EyeCurrent.y + Math.sin(time * 19.0 + 1.3 + index) * 0.005;
        });
        // 双眼脉动发光 / 炉心 / 晶石 / 尾尖狐火闪烁
        const pulse = 0.85 + 0.15 * Math.sin(time * 3.1) + 0.06 * Math.sin(time * 11.7);
        m.eye.emissiveIntensity = 1.0 * glow * pulse * (1 - close * 0.6);
        this.lights.eye.intensity = 0.5 * glow * pulse * (1 - close * 0.8);
        const flicker = 0.78 + 0.16 * Math.sin(time * 7.3) + 0.1 * Math.sin(time * 17.9 + 1.3) + 0.06 * Math.sin(time * 31.7);
        m.coreChest.color.setRGB(0.45, 2.1, 3.2).multiplyScalar(flicker * glow);
        this.lights.core.intensity = 1.3 * flicker * glow;
        const crystalFlicker = 0.78 + 0.22 * Math.sin(time * 2.3) * Math.sin(time * 5.9 + 0.7) + 0.08 * Math.sin(time * 23.0);
        m.crystal.emissiveIntensity = 1.5 * crystalFlicker * glow;
        m.coreFlame.color.setRGB(0.6, 2.4, 3.4).multiplyScalar((0.75 + 0.25 * flicker) * Math.min(fire, 2.5));
        m.glowFire.opacity = Clamp(fire, 0, 1);
        const flameSize = Math.min(1.8, 0.3 + 0.7 * fire);
        for (const flame of this.flameList)
        {
            const f = 0.85 + 0.12 * Math.sin(time * 13 + flame.phase) + 0.08 * Math.sin(time * 29 + flame.phase * 2.1);
            const stretch = 1.45 + 0.2 * Math.sin(time * 17 + flame.phase);
            flame.mesh.scale.set(f * flameSize, f * flameSize * stretch, f * flameSize);
            flame.sprite.scale.setScalar(0.26 * f * Math.min(1.5, fire));
        }
        this.lights.tail.intensity = 2.2 * fire * (0.8 + 0.2 * flicker);
        const jawOpen = Clamp(this.boneMap.jaw.rotation.x, 0, 1);
        m.coreMouth.color.setRGB(0.4, 1.6, 2.4).multiplyScalar((0.25 + jawOpen * 3.0) * glow);
        m.coreVent.color.setRGB(2.4, 1.0, 0.25).multiplyScalar((0.35 + 0.3 * Math.min(3, this.steam)) * Math.min(1, glow + 0.1) * flicker);
        for (const sprite of this.glowSpriteList)
        {
            sprite.scale.setScalar(sprite.userData.baseScale * (0.75 + 0.3 * pulse * Math.min(glow, 2)));
            sprite.material.opacity = Clamp(glow, 0, 1);
        }
        m.coreChest.map.offset.set(time * 0.05, time * 0.13);
        m.coreFlame.map.offset.set(-time * 0.07, time * 0.31);
        m.coreMouth.map.offset.set(time * 0.04, time * 0.08);
        m.coreVent.map.offset.set(time * 0.02, -time * 0.2);
        // 齿轮 / 链条 / 压力表
        const gearFactor = deltaTime * gearSpeed * 1.6 * Clamp(glow, 0, 1.6);
        for (const gear of this.gearList)
        {
            gear.mesh.rotation.z += gear.speed * gearFactor;
        }
        this.UpdateChain(gearFactor);
        for (const gauge of this.gaugeList)
        {
            const value = Clamp(gauge.base + 0.1 * Math.sin(time * gauge.speed + gauge.phase) + 0.03 * Math.sin(time * 9.7 + gauge.phase) + (this.steam - 1) * 0.08 + (fire - 1) * 0.06, 0.02, 0.98) * Math.min(1, glow + 0.05);
            gauge.needle.rotation.z = -(Math.PI * 0.75 + Math.PI * 1.5 * value);
        }
        // 利爪伸缩
        const clawAngle = Lerp(-0.2, 0.45, Clamp(this.claw, 0, 1));
        const clawScale = 1 + Clamp(this.claw, 0, 1) * 0.35;
        for (const pivot of this.clawList)
        {
            pivot.rotation.x = clawAngle;
            pivot.scale.set(1, 1, clawScale);
        }
        this.UpdatePendants(time);
    }

    UpdatePistons()
    {
        for (const piston of this.pistonList)
        {
            piston.Update();
        }
    }

    //#endregion
}

//#endregion

//#region ==================== 姿态通道与动作状态机 ====================

const k_RotBoneList = ['root', 'hips', 'spine', 'chest', 'neck', 'head', 'jaw', 'earL', 'earR', 'shoulderL', 'elbowL', 'wristL', 'pawFL', 'shoulderR', 'elbowR', 'wristR', 'pawFR', 'hipL', 'kneeL', 'hockL', 'pawBL', 'hipR', 'kneeR', 'hockR', 'pawBR', 'tailBase'];
const k_ScalarList = ['posX', 'posY', 'posZ', 'tailLift', 'tailSpread', 'tailCurl', 'tailSweep', 'tailWag', 'lid', 'glow', 'fire', 'steam', 'claw'];
const k_PoseSize = k_RotBoneList.length * 3 + k_ScalarList.length;
const k_ChannelMap = {};
k_RotBoneList.forEach((name, index) =>
{
    k_ChannelMap[name] = index * 3;
});
k_ScalarList.forEach((name, index) =>
{
    k_ChannelMap[name] = k_RotBoneList.length * 3 + index;
});

function WrapAngle(angle)
{
    return angle - k_TwoPi * Math.round(angle / k_TwoPi);
}

function CreatePose(base, overrides)
{
    const pose = new Float32Array(k_PoseSize);
    if (base)
    {
        pose.set(base);
    }
    else
    {
        pose[k_ChannelMap.glow] = 1;
        pose[k_ChannelMap.fire] = 1;
        pose[k_ChannelMap.steam] = 1;
    }
    if (overrides)
    {
        for (const key in overrides)
        {
            const offset = k_ChannelMap[key];
            if (offset === undefined)
            {
                console.warn(`[Pose](CreatePose) 未知姿态通道: ${key}`);
                continue;
            }
            const value = overrides[key];
            if (Array.isArray(value))
            {
                pose[offset] = value[0];
                pose[offset + 1] = value[1];
                pose[offset + 2] = value[2];
            }
            else
            {
                pose[offset] = value;
            }
        }
    }
    return pose;
}

function BlendPose(out, a, b, t)
{
    for (let i = 0; i < k_PoseSize; i++)
    {
        out[i] = a[i] + (b[i] - a[i]) * t;
    }
    return out;
}

function AddRotation(pose, name, x, y, z)
{
    const offset = k_ChannelMap[name];
    pose[offset] += x;
    pose[offset + 1] += y;
    pose[offset + 2] += z;
}

function AddScalar(pose, name, value)
{
    pose[k_ChannelMap[name]] += value;
}

function SetScalar(pose, name, value)
{
    pose[k_ChannelMap[name]] = value;
}

const k_EaseMap =
{
    linear: (t) => t,
    inOut: (t) => t * t * (3 - 2 * t),
    in: (t) => t * t * t,
    out: (t) => 1 - Math.pow(1 - t, 3),
    back: (t) =>
    {
        const c = 1.70158;
        const u = t - 1;
        return 1 + (c + 1) * u * u * u + c * u * u;
    }
};

function Key(t, pose, ease = 'inOut')
{
    return { t: t, pose: pose, ease: ease };
}

// 待机基础姿态: 昂首站立, 九尾半展上扬
const k_PoseIdle = CreatePose(null,
{
    neck: [-0.2, 0, 0],
    head: [0.18, 0, 0],
    tailSpread: 0.55,
    tailCurl: 0.3,
    posY: -0.005
});

function Idle(overrides)
{
    return CreatePose(k_PoseIdle, overrides);
}

// 将左侧通道镜像到右侧 (Y / Z 旋转取反), 已显式给出的右侧通道保持不变
function Sym(overrides)
{
    const result = Object.assign({}, overrides);
    for (const key in overrides)
    {
        if (!key.endsWith('L'))
        {
            continue;
        }
        const mirrorKey = key.slice(0, -1) + 'R';
        if (k_ChannelMap[mirrorKey] === undefined || overrides[mirrorKey] !== undefined)
        {
            continue;
        }
        const value = overrides[key];
        result[mirrorKey] = Array.isArray(value) ? [value[0], -value[1], -value[2]] : value;
    }
    return result;
}

// 前躯下蹲: 前肢屈曲, 躯干绕髋前倾, 后肢反向补偿保持竖直
function ApplyCrouchFront(pose, amount)
{
    const pitch = 0.17 * amount;
    AddRotation(pose, 'hips', pitch, 0, 0);
    for (const s of ['L', 'R'])
    {
        AddRotation(pose, 'shoulder' + s, 0.5 * amount - pitch, 0, 0);
        AddRotation(pose, 'elbow' + s, -1.05 * amount, 0, 0);
        AddRotation(pose, 'wrist' + s, 0.6 * amount, 0, 0);
        AddRotation(pose, 'hip' + s, -pitch, 0, 0);
    }
}

// 后躯下蹲: 后肢屈曲, 躯干后仰并整体下沉, 前肢反向补偿
function ApplyCrouchHind(pose, amount)
{
    const pitch = 0.17 * amount;
    AddRotation(pose, 'hips', -pitch, 0, 0);
    AddScalar(pose, 'posY', -0.17 * amount);
    for (const s of ['L', 'R'])
    {
        AddRotation(pose, 'hip' + s, -0.33 * amount + pitch, 0, 0);
        AddRotation(pose, 'knee' + s, 0.72 * amount, 0, 0);
        AddRotation(pose, 'hock' + s, -0.33 * amount, 0, 0);
        AddRotation(pose, 'shoulder' + s, pitch, 0, 0);
    }
}

function FoxPose(overrides, crouchFront = 0, crouchHind = crouchFront)
{
    const pose = CreatePose(k_PoseIdle, overrides);
    ApplyCrouchFront(pose, crouchFront);
    ApplyCrouchHind(pose, crouchHind);
    return pose;
}

// 四足步态单腿相位: reach ∈ [-1, 1] (1 = 前伸着地), lift ∈ [0, 1] (摆动期抬腿)
const s_Gait = { reach: 0, lift: 0 };
function GaitLeg(phase, duty)
{
    const p = phase - Math.floor(phase);
    if (p < duty)
    {
        s_Gait.reach = 1 - 2 * p / duty;
        s_Gait.lift = 0;
    }
    else
    {
        const t = (p - duty) / (1 - duty);
        s_Gait.reach = -1 + 2 * t * t * (3 - 2 * t);
        s_Gait.lift = Math.sin(t * Math.PI);
    }
    return s_Gait;
}

function ApplyFrontLeg(pose, s, phase, duty, swing, flex)
{
    const g = GaitLeg(phase, duty);
    AddRotation(pose, 'shoulder' + s, -g.reach * swing - g.lift * 0.15 * flex, 0, 0);
    AddRotation(pose, 'elbow' + s, -g.lift * 0.75 * flex, 0, 0);
    AddRotation(pose, 'wrist' + s, g.lift * 1.25 * flex, 0, 0);
    AddRotation(pose, 'pawF' + s, g.reach * swing * 0.7 + g.lift * 0.3 * flex, 0, 0);
}

function ApplyHindLeg(pose, s, phase, duty, swing, flex)
{
    const g = GaitLeg(phase, duty);
    AddRotation(pose, 'hip' + s, -g.reach * swing - g.lift * 0.2 * flex, 0, 0);
    AddRotation(pose, 'knee' + s, g.lift * 0.85 * flex, 0, 0);
    AddRotation(pose, 'hock' + s, -g.lift * 0.75 * flex, 0, 0);
    AddRotation(pose, 'pawB' + s, g.reach * swing * 0.7 + g.lift * 0.45 * flex, 0, 0);
}

// 呼吸叠加层
function ApplyBreath(pose, time, weight)
{
    const breath = Math.sin(time * 1.9) * weight;
    AddRotation(pose, 'chest', 0.02 * breath, 0, 0);
    AddRotation(pose, 'spine', -0.008 * breath, 0, 0);
    AddRotation(pose, 'neck', -0.012 * breath, 0, 0);
    AddRotation(pose, 'head', 0.01 * breath, 0, 0);
    AddRotation(pose, 'jaw', 0.012 * (breath + weight), 0, 0);
    AddScalar(pose, 'tailLift', 0.025 * breath);
}

// 动作状态机: 循环/非循环动作、关键帧采样、交叉淡入、事件派发、自动回到待机
class Animator
{
    constructor(actionMap)
    {
        this.m_ActionMap = actionMap;
        this.m_Current = actionMap.idle;
        this.m_Time = 0;
        this.m_GlobalTime = 0;
        this.m_FromPose = CreatePose(k_PoseIdle);
        this.m_TargetPose = CreatePose(k_PoseIdle);
        this.pose = CreatePose(k_PoseIdle);
        this.m_BlendTime = 1;
        this.m_BlendDuration = 0;
        this.m_FiredSet = new Set();
        this.onEvent = null;
        this.onStateChange = null;
    }

    get CurrentAction()
    {
        return this.m_Current;
    }

    get StateTime()
    {
        return this.m_Time;
    }

    get Progress()
    {
        const action = this.m_Current;
        if (action.loop)
        {
            return (this.m_Time / action.period) % 1;
        }
        // 无限保持 (死亡倒地) 的动作只按主体时长计算进度
        const hold = Number.isFinite(action.hold) ? (action.hold || 0) : 0;
        return Clamp(this.m_Time / (action.duration + hold), 0, 1);
    }

    get PhaseName()
    {
        const action = this.m_Current;
        if (action.loop)
        {
            return action.phaseName;
        }
        let name = action.phaseList[0].name;
        for (const phase of action.phaseList)
        {
            if (this.m_Time >= phase.t)
            {
                name = phase.name;
            }
        }
        return name;
    }

    Play(id, blendOverride)
    {
        const action = this.m_ActionMap[id];
        if (!action)
        {
            console.warn(`[Animator](Play) 未找到动作: ${id}`);
            return;
        }
        this.m_FromPose.set(this.pose);
        // 回旋类动作结束时根骨骼偏航可能为 ±2π, 折回 [-π, π] 避免过渡时反向倒转
        const yawChannel = k_ChannelMap.root + 1;
        this.m_FromPose[yawChannel] = WrapAngle(this.m_FromPose[yawChannel]);
        this.pose[yawChannel] = this.m_FromPose[yawChannel];
        // 离开倒地等姿态差异大的动作时使用更长的过渡
        const leaveBlend = this.m_Current.exitBlend || 0;
        this.m_BlendDuration = blendOverride !== undefined ? blendOverride : Math.max(action.blendIn, leaveBlend);
        this.m_BlendTime = 0;
        this.m_Current = action;
        this.m_Time = 0;
        this.m_FiredSet.clear();
        console.log(`[Animator](Play) 切换动作 → ${action.label} (${action.id})`);
        if (this.onStateChange)
        {
            this.onStateChange(action);
        }
    }

    SampleKeys(action, time, out)
    {
        const keyList = action.keyList;
        if (time <= keyList[0].t)
        {
            out.set(keyList[0].pose);
            return;
        }
        for (let i = 0; i < keyList.length - 1; i++)
        {
            const a = keyList[i];
            const b = keyList[i + 1];
            if (time < b.t)
            {
                const u = (time - a.t) / Math.max(1e-5, b.t - a.t);
                BlendPose(out, a.pose, b.pose, k_EaseMap[b.ease](Clamp(u, 0, 1)));
                return;
            }
        }
        out.set(keyList[keyList.length - 1].pose);
    }

    FireEvent(name)
    {
        if (this.onEvent)
        {
            this.onEvent(name, this.m_Current);
        }
    }

    Update(deltaTime)
    {
        const action = this.m_Current;
        const previousTime = this.m_Time;
        this.m_Time += deltaTime;
        this.m_GlobalTime += deltaTime;
        const target = this.m_TargetPose;
        if (action.loop)
        {
            action.Sample(this.m_Time, target);
            const previousCycle = previousTime / action.period;
            const currentCycle = this.m_Time / action.period;
            for (const event of action.eventList)
            {
                if (Math.floor(currentCycle - event.t) > Math.floor(previousCycle - event.t))
                {
                    this.FireEvent(event.name);
                }
            }
        }
        else
        {
            const t = Math.min(this.m_Time, action.duration);
            this.SampleKeys(action, t, target);
            if (action.Extra)
            {
                action.Extra(t, target);
            }
            action.eventList.forEach((event, index) =>
            {
                if (!this.m_FiredSet.has(index) && this.m_Time >= event.t)
                {
                    this.m_FiredSet.add(index);
                    this.FireEvent(event.name);
                }
            });
            if (this.m_Time >= action.duration + (action.hold || 0))
            {
                const nextId = action.next || 'idle';
                this.Play(nextId, action.exitBlend);
                return this.pose;
            }
        }
        ApplyBreath(target, this.m_GlobalTime, action.breath !== undefined ? action.breath : 1);
        if (this.m_BlendTime < this.m_BlendDuration)
        {
            this.m_BlendTime += deltaTime;
            const weight = k_EaseMap.inOut(Clamp(this.m_BlendTime / this.m_BlendDuration, 0, 1));
            BlendPose(this.pose, this.m_FromPose, target, weight);
        }
        else
        {
            this.pose.set(target);
        }
        return this.pose;
    }
}
