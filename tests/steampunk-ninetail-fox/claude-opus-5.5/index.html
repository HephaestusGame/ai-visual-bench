const k_ParticleVertexShader = `
attribute vec3 aColor;
attribute float aSize;
attribute float aAlpha;
attribute float aRotation;
uniform float uScale;
varying vec3 vColor;
varying float vAlpha;
varying float vRotation;
void main()
{
    vec4 mvPosition = modelViewMatrix * vec4(position, 1.0);
    gl_PointSize = aSize * uScale / max(0.1, -mvPosition.z);
    gl_Position = projectionMatrix * mvPosition;
    vColor = aColor;
    vAlpha = aAlpha;
    vRotation = aRotation;
}`;

const k_ParticleFragmentShader = `
uniform sampler2D uMap;
varying vec3 vColor;
varying float vAlpha;
varying float vRotation;
void main()
{
    vec2 uv = gl_PointCoord - 0.5;
    float c = cos(vRotation);
    float s = sin(vRotation);
    uv = vec2(c * uv.x - s * uv.y, s * uv.x + c * uv.y) + 0.5;
    vec4 tex = texture2D(uMap, uv);
    float alpha = tex.a * vAlpha;
    if (alpha < 0.002)
    {
        discard;
    }
    gl_FragColor = vec4(vColor * tex.rgb, alpha);
}`;

class ParticleSystem
{
    constructor(maxCount, texture, blending, renderOrder)
    {
        this.maxCount = maxCount;
        this.m_Cursor = 0;
        this.m_PositionArray = new Float32Array(maxCount * 3);
        this.m_VelocityArray = new Float32Array(maxCount * 3);
        this.m_ColorArray = new Float32Array(maxCount * 3);
        this.m_SizeArray = new Float32Array(maxCount);
        this.m_AlphaArray = new Float32Array(maxCount);
        this.m_RotationArray = new Float32Array(maxCount);
        this.m_LifeArray = new Float32Array(maxCount);
        this.m_MaxLifeArray = new Float32Array(maxCount);
        this.m_StartSizeArray = new Float32Array(maxCount);
        this.m_EndSizeArray = new Float32Array(maxCount);
        this.m_StartAlphaArray = new Float32Array(maxCount);
        this.m_SpinArray = new Float32Array(maxCount);
        this.m_DragArray = new Float32Array(maxCount);
        this.m_GravityArray = new Float32Array(maxCount);
        const geometry = new THREE.BufferGeometry();
        geometry.setAttribute('position', new THREE.BufferAttribute(this.m_PositionArray, 3).setUsage(THREE.DynamicDrawUsage));
        geometry.setAttribute('aColor', new THREE.BufferAttribute(this.m_ColorArray, 3).setUsage(THREE.DynamicDrawUsage));
        geometry.setAttribute('aSize', new THREE.BufferAttribute(this.m_SizeArray, 1).setUsage(THREE.DynamicDrawUsage));
        geometry.setAttribute('aAlpha', new THREE.BufferAttribute(this.m_AlphaArray, 1).setUsage(THREE.DynamicDrawUsage));
        geometry.setAttribute('aRotation', new THREE.BufferAttribute(this.m_RotationArray, 1).setUsage(THREE.DynamicDrawUsage));
        this.material = new THREE.ShaderMaterial(
        {
            uniforms: { uMap: { value: texture }, uScale: { value: 500 } },
            vertexShader: k_ParticleVertexShader,
            fragmentShader: k_ParticleFragmentShader,
            transparent: true,
            depthWrite: false,
            blending: blending
        });
        this.points = new THREE.Points(geometry, this.material);
        this.points.frustumCulled = false;
        this.points.renderOrder = renderOrder;
    }

    // options: life, startSize, endSize, alpha, color[3], drag, gravity, spin
    Emit(x, y, z, vx, vy, vz, options)
    {
        const i = this.m_Cursor;
        this.m_Cursor = (this.m_Cursor + 1) % this.maxCount;
        this.m_PositionArray[i * 3] = x;
        this.m_PositionArray[i * 3 + 1] = y;
        this.m_PositionArray[i * 3 + 2] = z;
        this.m_VelocityArray[i * 3] = vx;
        this.m_VelocityArray[i * 3 + 1] = vy;
        this.m_VelocityArray[i * 3 + 2] = vz;
        this.m_ColorArray[i * 3] = options.color[0];
        this.m_ColorArray[i * 3 + 1] = options.color[1];
        this.m_ColorArray[i * 3 + 2] = options.color[2];
        this.m_LifeArray[i] = options.life;
        this.m_MaxLifeArray[i] = options.life;
        this.m_StartSizeArray[i] = options.startSize;
        this.m_EndSizeArray[i] = options.endSize;
        this.m_StartAlphaArray[i] = options.alpha;
        this.m_SpinArray[i] = options.spin || 0;
        this.m_DragArray[i] = options.drag || 0;
        this.m_GravityArray[i] = options.gravity || 0;
        this.m_RotationArray[i] = Math.random() * k_TwoPi;
        this.m_SizeArray[i] = options.startSize;
        this.m_AlphaArray[i] = 0;
    }

    Update(deltaTime)
    {
        for (let i = 0; i < this.maxCount; i++)
        {
            if (this.m_LifeArray[i] <= 0)
            {
                this.m_AlphaArray[i] = 0;
                continue;
            }
            this.m_LifeArray[i] -= deltaTime;
            if (this.m_LifeArray[i] <= 0)
            {
                this.m_AlphaArray[i] = 0;
                continue;
            }
            const drag = Math.exp(-this.m_DragArray[i] * deltaTime);
            const o = i * 3;
            this.m_VelocityArray[o] *= drag;
            this.m_VelocityArray[o + 1] = this.m_VelocityArray[o + 1] * drag + this.m_GravityArray[i] * deltaTime;
            this.m_VelocityArray[o + 2] *= drag;
            this.m_PositionArray[o] += this.m_VelocityArray[o] * deltaTime;
            this.m_PositionArray[o + 1] += this.m_VelocityArray[o + 1] * deltaTime;
            this.m_PositionArray[o + 2] += this.m_VelocityArray[o + 2] * deltaTime;
            const t = 1 - this.m_LifeArray[i] / this.m_MaxLifeArray[i];
            this.m_SizeArray[i] = Lerp(this.m_StartSizeArray[i], this.m_EndSizeArray[i], 1 - (1 - t) * (1 - t));
            this.m_AlphaArray[i] = this.m_StartAlphaArray[i] * SmoothStep(0, 0.08, t) * (1 - SmoothStep(0.45, 1, t));
            this.m_RotationArray[i] += this.m_SpinArray[i] * deltaTime;
        }
        const attributes = this.points.geometry.attributes;
        attributes.position.needsUpdate = true;
        attributes.aColor.needsUpdate = true;
        attributes.aSize.needsUpdate = true;
        attributes.aAlpha.needsUpdate = true;
        attributes.aRotation.needsUpdate = true;
    }
}

// 冲击波光环池
class ShockwavePool
{
    constructor(scene, texture, count)
    {
        this.m_ItemList = [];
        this.m_Cursor = 0;
        const geometry = new THREE.PlaneGeometry(2, 2);
        for (let i = 0; i < count; i++)
        {
            const material = new THREE.MeshBasicMaterial({ map: texture, transparent: true, blending: THREE.AdditiveBlending, depthWrite: false, side: THREE.DoubleSide, toneMapped: true });
            const mesh = new THREE.Mesh(geometry, material);
            mesh.visible = false;
            mesh.renderOrder = 4;
            scene.add(mesh);
            this.m_ItemList.push({ mesh: mesh, age: 0, duration: 1, radius: 1, color: new THREE.Color(), active: false });
        }
    }

    Spawn(position, normal, radius, duration, color)
    {
        const item = this.m_ItemList[this.m_Cursor];
        this.m_Cursor = (this.m_Cursor + 1) % this.m_ItemList.length;
        item.mesh.position.copy(position);
        item.mesh.quaternion.setFromUnitVectors(new THREE.Vector3(0, 0, 1), normal);
        item.age = 0;
        item.duration = duration;
        item.radius = radius;
        item.color.copy(color);
        item.active = true;
        item.mesh.visible = true;
    }

    Update(deltaTime)
    {
        for (const item of this.m_ItemList)
        {
            if (!item.active)
            {
                continue;
            }
            item.age += deltaTime;
            const t = item.age / item.duration;
            if (t >= 1)
            {
                item.active = false;
                item.mesh.visible = false;
                continue;
            }
            item.mesh.scale.setScalar(Lerp(0.15, item.radius, 1 - (1 - t) * (1 - t)));
            item.mesh.material.color.copy(item.color).multiplyScalar(Math.pow(1 - t, 1.5));
        }
    }
}

class EffectsDirector
{
    constructor(scene, fox, animator, textures, materials)
    {
        this.m_Scene = scene;
        this.m_Fox = fox;
        this.m_Animator = animator;
        this.m_Materials = materials;
        this.steam = new ParticleSystem(700, textures.smoke, THREE.NormalBlending, 6);
        this.dust = new ParticleSystem(500, textures.smoke, THREE.NormalBlending, 6);
        this.sparks = new ParticleSystem(1400, textures.spark, THREE.AdditiveBlending, 7);
        this.wisps = new ParticleSystem(1000, textures.flame, THREE.AdditiveBlending, 7);
        scene.add(this.steam.points, this.dust.points, this.sparks.points, this.wisps.points);
        this.shockwaves = new ShockwavePool(scene, textures.ring, 16);
        this.flash = new THREE.PointLight(0x60f0ff, 0, 16, 2);
        scene.add(this.flash);
        this.cameraShake = 0;
        this.m_VentAccumulator = 0;
        this.m_EmberAccumulator = 0;
        this.m_WispAccumulator = 0;
        this.m_VentToggle = false;
        this.m_TrailMap = new Map();
        this.m_Up = new THREE.Vector3(0, 1, 0);
        this.m_Forward = new THREE.Vector3(0, 0, 1);
        this.m_TempA = new THREE.Vector3();
        this.m_TempB = new THREE.Vector3();
        this.m_TempC = new THREE.Vector3();
        this.m_TempD = new THREE.Vector3();
        this.BuildFireball(materials);
        this.BuildCastEffects(textures, materials);
        this.BuildSlashes();
        this.BuildStars(textures);
        this.BuildMotes(textures);
    }

    //#region 构建

    BuildFireball(materials)
    {
        const fireball = new THREE.Group();
        AddMesh(fireball, new THREE.SphereGeometry(0.15, 28, 20), materials.coreOrb).castShadow = false;
        const halo = new THREE.Sprite(materials.glowCyan);
        halo.scale.setScalar(0.9);
        fireball.add(halo);
        this.fireballLight = new THREE.PointLight(0x5ff3ff, 0, 6, 2);
        fireball.add(this.fireballLight);
        fireball.visible = false;
        this.m_Scene.add(fireball);
        this.fireball = fireball;
        this.m_FireballState = 'none';
        this.m_FireballVelocity = new THREE.Vector3();
    }

    BuildCastEffects(textures, materials)
    {
        const runeMaterial = new THREE.MeshBasicMaterial({ map: textures.rune, color: new THREE.Color(0.45, 1.5, 2.4), transparent: true, opacity: 0, blending: THREE.AdditiveBlending, depthWrite: false });
        this.runeOuter = new THREE.Mesh(new THREE.PlaneGeometry(6.4, 6.4), runeMaterial);
        this.runeOuter.rotation.x = -k_HalfPi;
        this.runeOuter.position.y = 0.05;
        this.runeOuter.renderOrder = 3;
        this.runeInner = new THREE.Mesh(new THREE.PlaneGeometry(3.6, 3.6), runeMaterial.clone());
        this.runeInner.material.color.setRGB(1.6, 0.9, 2.4);
        this.runeInner.rotation.x = -k_HalfPi;
        this.runeInner.position.y = 0.06;
        this.runeInner.renderOrder = 3;
        this.m_Scene.add(this.runeOuter, this.runeInner);
        this.m_RuneOpacity = 0;
        // 九颗环绕狐火球
        this.castOrbList = [];
        const orbGeometry = new THREE.SphereGeometry(0.075, 18, 14);
        for (let i = 0; i < k_TailCount; i++)
        {
            const group = new THREE.Group();
            AddMesh(group, orbGeometry, materials.coreOrb).castShadow = false;
            const halo = new THREE.Sprite(materials.glowCyan);
            halo.scale.setScalar(0.32);
            group.add(halo);
            group.visible = false;
            this.m_Scene.add(group);
            this.castOrbList.push({ group: group, start: new THREE.Vector3(), control: new THREE.Vector3(), end: new THREE.Vector3(), delay: 0, done: false });
        }
        this.castLight = new THREE.PointLight(0x7fe8ff, 0, 8, 2);
        this.m_Scene.add(this.castLight);
        this.m_CastState = 'none';
        this.m_CastTime = 0;
        this.m_CastTarget = new THREE.Vector3();
    }

    // 爪击残影: 三道平行弧光
    BuildSlashes()
    {
        this.slashList = [];
        const arcGeometry = new THREE.TorusGeometry(0.55, 0.012, 6, 40, 1.7);
        arcGeometry.rotateZ(-0.85);
        for (let n = 0; n < 2; n++)
        {
            const group = new THREE.Group();
            const material = new THREE.MeshBasicMaterial({ color: new THREE.Color(1.2, 2.4, 3.0), transparent: true, opacity: 0, blending: THREE.AdditiveBlending, depthWrite: false, side: THREE.DoubleSide });
            for (let k = 0; k < 3; k++)
            {
                const arc = new THREE.Mesh(arcGeometry, material);
                arc.position.set(0, (k - 1) * 0.1, 0);
                arc.scale.setScalar(1 - Math.abs(k - 1) * 0.12);
                arc.renderOrder = 8;
                group.add(arc);
            }
            group.visible = false;
            this.m_Scene.add(group);
            this.slashList.push({ group: group, material: material, age: 1, duration: 0.4 });
        }
        this.m_SlashCursor = 0;
    }

    BuildStars(textures)
    {
        this.starGroup = new THREE.Group();
        this.m_StarMaterial = new THREE.SpriteMaterial({ map: textures.star, color: new THREE.Color(2.2, 1.9, 0.6), blending: THREE.AdditiveBlending, transparent: true, opacity: 0, depthWrite: false });
        for (let i = 0; i < 5; i++)
        {
            const star = new THREE.Sprite(this.m_StarMaterial);
            star.scale.setScalar(0.15);
            this.starGroup.add(star);
        }
        this.m_StarOpacity = 0;
        this.m_Scene.add(this.starGroup);
    }

    BuildMotes(textures)
    {
        const count = 320;
        const random = CreateRandom(4242);
        this.m_MoteBaseArray = new Float32Array(count * 3);
        const positionArray = new Float32Array(count * 3);
        for (let i = 0; i < count; i++)
        {
            this.m_MoteBaseArray[i * 3] = (random() - 0.5) * 16;
            this.m_MoteBaseArray[i * 3 + 1] = 0.2 + random() * 5;
            this.m_MoteBaseArray[i * 3 + 2] = (random() - 0.5) * 16;
        }
        positionArray.set(this.m_MoteBaseArray);
        const geometry = new THREE.BufferGeometry();
        geometry.setAttribute('position', new THREE.BufferAttribute(positionArray, 3).setUsage(THREE.DynamicDrawUsage));
        const material = new THREE.PointsMaterial({ map: textures.spark, color: new THREE.Color(0.55, 0.95, 1.2), size: 0.045, transparent: true, opacity: 0.5, blending: THREE.AdditiveBlending, depthWrite: false });
        this.motes = new THREE.Points(geometry, material);
        this.motes.frustumCulled = false;
        this.m_Scene.add(this.motes);
    }

    //#endregion

    //#region 发射工具

    SetParticleScale(value)
    {
        for (const system of [this.steam, this.dust, this.sparks, this.wisps])
        {
            system.material.uniforms.uScale.value = value;
        }
    }

    EmitSteam(position, vx, vy, vz, count, sizeScale = 1)
    {
        for (let i = 0; i < count; i++)
        {
            const shade = 0.3 + Math.random() * 0.08;
            this.steam.Emit(
                position.x + (Math.random() - 0.5) * 0.06, position.y + (Math.random() - 0.5) * 0.05, position.z + (Math.random() - 0.5) * 0.06,
                vx + (Math.random() - 0.5) * 0.35, vy + Math.random() * 0.35, vz + (Math.random() - 0.5) * 0.35,
                { life: 1.6 + Math.random() * 1.2, startSize: 0.12 * sizeScale, endSize: (0.7 + Math.random() * 0.35) * sizeScale, alpha: 0.24, color: [shade, shade * 0.98, shade * 0.96], drag: 0.8, gravity: 0.3, spin: (Math.random() - 0.5) * 0.8 });
        }
    }

    EmitSparks(position, count, speed, color, spread = 1, upBias = 0.6, life = 0.9)
    {
        for (let i = 0; i < count; i++)
        {
            const theta = Math.random() * k_TwoPi;
            const phi = Math.acos(Math.random() * 2 - 1);
            const velocity = speed * (0.4 + Math.random() * 0.8);
            const dx = Math.sin(phi) * Math.cos(theta) * spread;
            const dy = Math.abs(Math.cos(phi)) * upBias + (1 - upBias) * Math.cos(phi);
            const dz = Math.sin(phi) * Math.sin(theta) * spread;
            this.sparks.Emit(position.x, position.y, position.z, dx * velocity, dy * velocity, dz * velocity,
                { life: life * (0.5 + Math.random() * 0.7), startSize: 0.07, endSize: 0.015, alpha: 1, color: color, drag: 1.2, gravity: -6.5 });
        }
    }

    // 狐火火苗: 上升、收缩的青色焰团
    EmitWisps(position, count, speed, sizeScale = 1, life = 0.8)
    {
        for (let i = 0; i < count; i++)
        {
            const angle = Math.random() * k_TwoPi;
            const radial = speed * Math.random();
            const heat = 0.8 + Math.random() * 0.5;
            this.wisps.Emit(position.x + (Math.random() - 0.5) * 0.04, position.y + (Math.random() - 0.5) * 0.04, position.z + (Math.random() - 0.5) * 0.04,
                Math.cos(angle) * radial, speed * (0.4 + Math.random() * 0.6), Math.sin(angle) * radial,
                { life: life * (0.6 + Math.random() * 0.6), startSize: 0.13 * sizeScale, endSize: 0.02 * sizeScale, alpha: 0.9, color: [0.35 * heat, 1.5 * heat, 2.4 * heat], drag: 1.6, gravity: 1.2, spin: (Math.random() - 0.5) * 3 });
        }
    }

    DustBurst(x, y, z, count, strength)
    {
        for (let i = 0; i < count; i++)
        {
            const angle = Math.random() * k_TwoPi;
            const speed = (1.0 + Math.random() * 1.6) * strength;
            const shade = 0.2 + Math.random() * 0.07;
            this.dust.Emit(x + Math.cos(angle) * 0.12, y + 0.04, z + Math.sin(angle) * 0.12, Math.cos(angle) * speed, 0.25 + Math.random() * 0.6 * strength, Math.sin(angle) * speed,
                { life: 1.2 + Math.random() * 1.0, startSize: 0.25 * strength, endSize: 1.1 * strength, alpha: 0.4, color: [shade * 1.05, shade * 0.95, shade * 0.82], drag: 2.6, gravity: 0.15, spin: (Math.random() - 0.5) });
        }
    }

    Flash(position, color, intensity)
    {
        this.flash.position.copy(position);
        this.flash.color.set(color);
        this.flash.intensity = intensity;
    }

    WorldPosition(anchorName, out)
    {
        return this.m_Fox.anchors[anchorName].getWorldPosition(out);
    }

    // 狐狸当前的水平朝向
    FoxForward(out)
    {
        this.m_Fox.boneMap.root.getWorldQuaternion(s_TempQuat);
        out.set(0, 0, 1).applyQuaternion(s_TempQuat);
        out.y = 0;
        if (out.lengthSq() < 1e-6)
        {
            out.set(0, 0, 1);
        }
        return out.normalize();
    }

    SpawnSlash(anchorName, roll)
    {
        const slash = this.slashList[this.m_SlashCursor];
        this.m_SlashCursor = (this.m_SlashCursor + 1) % this.slashList.length;
        const forward = this.FoxForward(this.m_TempB);
        this.WorldPosition(anchorName, slash.group.position);
        slash.group.position.addScaledVector(forward, 0.45);
        slash.group.position.y = Math.max(0.45, slash.group.position.y + 0.25);
        s_TempEuler.set(0, Math.atan2(forward.x, forward.z), roll, 'YXZ');
        slash.group.quaternion.setFromEuler(s_TempEuler);
        slash.age = 0;
        slash.group.visible = true;
    }

    //#endregion

    //#region 动作事件

    HandleEvent(name, action)
    {
        const fox = this.m_Fox;
        const position = this.m_TempA;
        const up = this.m_Up;
        switch (name)
        {
            case 'stepFL':
            case 'stepFR':
            case 'stepBL':
            case 'stepBR':
            {
                this.WorldPosition('paw' + name.slice(4), position);
                const heavy = action.id === 'run' ? 1.4 : 0.8;
                this.DustBurst(position.x, 0.02, position.z, Math.round(5 * heavy), 0.6 * heavy);
                if (action.id === 'run')
                {
                    position.y = 0.05;
                    this.shockwaves.Spawn(position, up, 0.8, 0.4, new THREE.Color(0.3, 0.26, 0.2));
                    this.cameraShake = Math.max(this.cameraShake, 0.025);
                }
                break;
            }
            case 'takeoff':
            case 'pounceLeap':
            {
                for (const paw of ['pawBL', 'pawBR'])
                {
                    this.WorldPosition(paw, position);
                    this.DustBurst(position.x, 0.02, position.z, 10, 1.0);
                }
                for (const vent of ['ventL', 'ventR'])
                {
                    this.WorldPosition(vent, position);
                    this.EmitSteam(position, 0, 1.5, -1.2, 10, 1.0);
                }
                this.cameraShake = Math.max(this.cameraShake, 0.1);
                break;
            }
            case 'landImpact':
            {
                fox.boneMap.root.getWorldPosition(position);
                this.DustBurst(position.x, 0.02, position.z, 30, 1.5);
                position.y = 0.06;
                this.shockwaves.Spawn(position, up, 3.6, 0.7, new THREE.Color(0.7, 0.55, 0.35));
                this.cameraShake = Math.max(this.cameraShake, 0.22);
                break;
            }
            case 'bite':
            {
                this.WorldPosition('mouth', position);
                const forward = this.FoxForward(this.m_TempB);
                this.EmitSparks(position, 50, 5, [1.6, 2.6, 3.2], 1.0, 0.3, 0.6);
                this.EmitWisps(position, 14, 1.5, 1.2);
                this.shockwaves.Spawn(this.m_TempC.copy(position).addScaledVector(forward, 0.15), forward, 1.4, 0.35, new THREE.Color(0.6, 2.0, 2.6));
                this.Flash(position, 0x80f0ff, 50);
                this.cameraShake = Math.max(this.cameraShake, 0.2);
                break;
            }
            case 'pounceLand':
            {
                for (const paw of ['pawFL', 'pawFR'])
                {
                    this.WorldPosition(paw, position);
                    this.DustBurst(position.x, 0.02, position.z, 12, 1.1);
                }
                this.cameraShake = Math.max(this.cameraShake, 0.15);
                break;
            }
            case 'clawSwipeR':
            case 'clawSwipeL':
            {
                const anchorName = name === 'clawSwipeR' ? 'pawFR' : 'pawFL';
                this.SpawnSlash(anchorName, name === 'clawSwipeR' ? -0.6 : 0.6 + Math.PI);
                this.WorldPosition(anchorName, position);
                this.EmitSparks(position, 30, 4, [1.8, 2.6, 3.0], 1.0, 0.4, 0.5);
                this.cameraShake = Math.max(this.cameraShake, 0.1);
                break;
            }
            case 'sweepStart':
            {
                for (const tip of fox.tailTipList)
                {
                    tip.getWorldPosition(position);
                    this.EmitWisps(position, 6, 1.2, 1.3);
                }
                for (const vent of ['ventL', 'ventR'])
                {
                    this.WorldPosition(vent, position);
                    this.EmitSteam(position, 0, 2.0, -0.8, 10, 1.0);
                }
                break;
            }
            case 'sweepImpact':
            {
                fox.boneMap.root.getWorldPosition(position);
                position.y = 0.07;
                this.shockwaves.Spawn(position, up, 4.6, 0.85, new THREE.Color(0.4, 1.8, 2.6));
                this.shockwaves.Spawn(position, up, 2.6, 0.55, new THREE.Color(1.8, 2.2, 2.4));
                for (let i = 0; i < 24; i++)
                {
                    const angle = i / 24 * k_TwoPi;
                    this.m_TempB.set(position.x + Math.cos(angle) * 1.8, 0.15, position.z + Math.sin(angle) * 1.8);
                    this.EmitWisps(this.m_TempB, 2, 1.4, 1.4);
                }
                this.EmitSparks(this.m_TempB.set(position.x, 0.4, position.z), 120, 7, [0.6, 2.2, 3.0], 1.3, 0.5, 1.0);
                this.DustBurst(position.x, 0.02, position.z, 34, 1.8);
                position.y = 0.8;
                this.Flash(position, 0x60f0ff, 120);
                this.cameraShake = Math.max(this.cameraShake, 0.35);
                break;
            }
            case 'gatherFire':
            {
                this.m_FireballState = 'charging';
                this.fireball.visible = true;
                this.fireball.scale.setScalar(0.1);
                break;
            }
            case 'throwFire':
            {
                if (this.m_FireballState !== 'charging')
                {
                    break;
                }
                const forward = this.FoxForward(this.m_TempB);
                this.m_FireballVelocity.copy(forward).multiplyScalar(2.4);
                this.m_FireballVelocity.y = 2.6;
                this.m_FireballState = 'flying';
                this.EmitWisps(this.fireball.position, 20, 2.0, 1.5);
                this.Flash(this.fireball.position, 0x60f0ff, 60);
                this.cameraShake = Math.max(this.cameraShake, 0.12);
                break;
            }
            case 'hitImpact':
            {
                this.WorldPosition('core', position);
                this.EmitSparks(position, 60, 6, [3.0, 1.8, 0.7], 1.0, 0.3);
                this.Flash(position, 0xffc080, 50);
                this.cameraShake = Math.max(this.cameraShake, 0.22);
                break;
            }
            case 'stunHit':
            {
                this.WorldPosition('crystal', position);
                this.EmitSparks(position, 30, 3.5, [2.6, 2.2, 0.8], 1.0, 0.7);
                this.cameraShake = Math.max(this.cameraShake, 0.14);
                break;
            }
            case 'tauntYip':
            {
                this.WorldPosition('mouth', position);
                fox.anchors.mouth.getWorldQuaternion(s_TempQuat);
                const forward = this.m_TempB.set(0, 0, 1).applyQuaternion(s_TempQuat).normalize();
                this.shockwaves.Spawn(this.m_TempC.copy(position).addScaledVector(forward, 0.2), forward, 1.2, 0.45, new THREE.Color(0.6, 1.8, 2.4));
                for (const tip of fox.tailTipList)
                {
                    tip.getWorldPosition(position);
                    this.EmitWisps(position, 3, 0.8, 1.0);
                }
                break;
            }
            case 'howlStart':
            {
                for (const tip of fox.tailTipList)
                {
                    tip.getWorldPosition(position);
                    this.EmitWisps(position, 10, 2.2, 1.6, 1.2);
                }
                for (const vent of ['ventL', 'ventR'])
                {
                    this.WorldPosition(vent, position);
                    this.EmitSteam(position, 0, 3.0, -0.6, 18, 1.2);
                }
                this.WorldPosition('crystal', position);
                this.Flash(position, 0x60f0ff, 70);
                this.cameraShake = Math.max(this.cameraShake, 0.25);
                break;
            }
            case 'howlWave':
            {
                const mouth = fox.anchors.mouth;
                mouth.getWorldPosition(position);
                mouth.getWorldQuaternion(s_TempQuat);
                const forward = this.m_TempB.set(0, 0, 1).applyQuaternion(s_TempQuat).normalize();
                position.addScaledVector(forward, 0.35);
                this.shockwaves.Spawn(position, forward, 2.6, 0.8, new THREE.Color(0.5, 1.6, 2.4));
                this.cameraShake = Math.max(this.cameraShake, 0.08);
                break;
            }
            case 'castBegin':
            {
                fox.boneMap.root.getWorldPosition(position);
                position.y = 0.08;
                this.shockwaves.Spawn(position, up, 3.4, 0.9, new THREE.Color(0.4, 1.6, 2.4));
                this.m_CastState = 'rising';
                this.m_CastTime = 0;
                fox.tailTipList.forEach((tip, index) =>
                {
                    const orb = this.castOrbList[index];
                    tip.getWorldPosition(orb.start);
                    orb.group.position.copy(orb.start);
                    orb.group.visible = true;
                    orb.done = false;
                });
                break;
            }
            case 'castRelease':
            {
                if (this.m_CastState !== 'rising' && this.m_CastState !== 'orbit')
                {
                    break;
                }
                const forward = this.FoxForward(this.m_TempB);
                fox.boneMap.root.getWorldPosition(this.m_CastTarget).addScaledVector(forward, 3.3);
                this.m_CastTarget.y = 0.1;
                const side = this.m_TempC.set(forward.z, 0, -forward.x);
                this.castOrbList.forEach((orb, index) =>
                {
                    orb.start.copy(orb.group.position);
                    orb.end.copy(this.m_CastTarget).addScaledVector(side, (index - 4) * 0.22);
                    orb.control.addVectors(orb.start, orb.end).multiplyScalar(0.5).addScaledVector(side, (index - 4) * 0.55);
                    orb.control.y += 2.2;
                    orb.delay = index * 0.045;
                    orb.done = false;
                });
                this.m_CastState = 'fire';
                this.m_CastTime = 0;
                this.WorldPosition('crystal', position);
                this.Flash(position, 0x80f0ff, 90);
                this.cameraShake = Math.max(this.cameraShake, 0.2);
                break;
            }
            case 'deathCollapse':
            {
                for (const paw of ['pawFL', 'pawFR'])
                {
                    this.WorldPosition(paw, position);
                    this.DustBurst(position.x, 0.02, position.z, 12, 1.0);
                }
                this.cameraShake = Math.max(this.cameraShake, 0.2);
                break;
            }
            case 'deathFall':
            {
                this.WorldPosition('core', position);
                this.DustBurst(position.x, 0.02, position.z, 30, 1.6);
                this.EmitSteam(position, 0, 1.0, 0, 12, 1.0);
                this.cameraShake = Math.max(this.cameraShake, 0.3);
                break;
            }
            case 'powerDown':
            {
                this.WorldPosition('core', position);
                this.EmitSparks(position, 45, 3.5, [0.6, 2.0, 3.0], 1.0, 0.4);
                this.Flash(position, 0x60f0ff, 30);
                for (const tip of fox.tailTipList)
                {
                    tip.getWorldPosition(position);
                    this.EmitSteam(position, 0, 0.6, 0, 2, 0.6);
                }
                break;
            }
            default:
                break;
        }
    }

    //#endregion

    //#region 每帧更新

    Update(deltaTime, time)
    {
        const fox = this.m_Fox;
        const action = this.m_Animator.CurrentAction;
        const stateTime = this.m_Animator.StateTime;
        const position = this.m_TempA;
        // 背部排气阀持续蒸汽 (沿阀口方向喷出)
        this.m_VentAccumulator += 4.5 * Math.max(0, fox.steam) * deltaTime;
        while (this.m_VentAccumulator >= 1)
        {
            this.m_VentAccumulator -= 1;
            this.m_VentToggle = !this.m_VentToggle;
            const anchor = fox.anchors[this.m_VentToggle ? 'ventL' : 'ventR'];
            anchor.getWorldPosition(position);
            anchor.getWorldQuaternion(s_TempQuat);
            const boost = Math.min(2.5, fox.steam);
            const direction = this.m_TempB.set(0, 1, 0).applyQuaternion(s_TempQuat).multiplyScalar(0.6 + boost * 0.4);
            this.EmitSteam(position, direction.x, direction.y, direction.z, 1, 0.6 + boost * 0.2);
        }
        // 排气阀余烬
        this.m_EmberAccumulator += 1.2 * Math.min(2, fox.glow) * deltaTime;
        while (this.m_EmberAccumulator >= 1)
        {
            this.m_EmberAccumulator -= 1;
            this.WorldPosition(Math.random() > 0.5 ? 'ventL' : 'ventR', position);
            this.sparks.Emit(position.x, position.y, position.z, (Math.random() - 0.5) * 0.5, 1.0 + Math.random(), -0.4, { life: 1.3, startSize: 0.05, endSize: 0.015, alpha: 1, color: [3, 1.2, 0.3], drag: 0.6, gravity: -0.5 });
        }
        // 尾尖狐火火苗
        this.m_WispAccumulator += 7 * Math.max(0, fox.fire) * deltaTime;
        while (this.m_WispAccumulator >= 1)
        {
            this.m_WispAccumulator -= 1;
            const tip = fox.tailTipList[Math.floor(Math.random() * fox.tailTipList.length)];
            tip.getWorldPosition(position);
            this.EmitWisps(position, 1, 0.5, 0.75 + Math.min(1.5, fox.fire) * 0.25, 0.7);
        }
        // 爪击拖尾 / 九尾横扫弧光
        for (const anchorName of ['pawFL', 'pawFR'])
        {
            let active = false;
            if (action.trailList)
            {
                for (const trail of action.trailList)
                {
                    active = active || (trail.anchor === anchorName && stateTime >= trail.from && stateTime <= trail.to);
                }
            }
            this.UpdateTrail(anchorName, fox.anchors[anchorName], active, 'claw');
        }
        const tailTrailActive = !!action.tailTrail && stateTime >= action.tailTrail[0] && stateTime <= action.tailTrail[1];
        fox.tailTipList.forEach((tip, index) =>
        {
            this.UpdateTrail('tail' + index, tip, tailTrailActive, 'fire');
        });
        this.UpdateFireball(deltaTime, time, action, stateTime);
        this.UpdateCast(deltaTime, time, action, stateTime);
        this.UpdateSlashes(deltaTime);
        this.UpdateStars(deltaTime, time, action, stateTime);
        this.UpdateMotes(time);
        this.steam.Update(deltaTime);
        this.dust.Update(deltaTime);
        this.sparks.Update(deltaTime);
        this.wisps.Update(deltaTime);
        this.shockwaves.Update(deltaTime);
        this.flash.intensity *= Math.exp(-deltaTime * 7);
        this.cameraShake *= Math.exp(-deltaTime * 5);
    }

    // 记录锚点上一帧位置, 激活时沿运动路径插值发射粒子
    UpdateTrail(key, anchor, active, kind)
    {
        const current = anchor.getWorldPosition(this.m_TempD);
        const previous = this.m_TrailMap.get(key);
        if (!previous)
        {
            this.m_TrailMap.set(key, current.clone());
            return;
        }
        if (active)
        {
            const steps = kind === 'fire' ? 3 : 5;
            for (let i = 0; i < steps; i++)
            {
                const t = i / steps;
                const x = Lerp(previous.x, current.x, t);
                const y = Lerp(previous.y, current.y, t);
                const z = Lerp(previous.z, current.z, t);
                if (kind === 'fire')
                {
                    this.wisps.Emit(x, y, z, (Math.random() - 0.5) * 0.3, Math.random() * 0.3, (Math.random() - 0.5) * 0.3,
                        { life: 0.45 + Math.random() * 0.25, startSize: 0.17, endSize: 0.03, alpha: 0.85, color: [0.4, 1.7, 2.6], drag: 2, gravity: 0.6, spin: 2 });
                }
                else
                {
                    this.sparks.Emit(x, y, z, (Math.random() - 0.5) * 0.6, Math.random() * 0.5, (Math.random() - 0.5) * 0.6,
                        { life: 0.35 + Math.random() * 0.2, startSize: 0.08, endSize: 0.02, alpha: 1, color: [1.6, 2.6, 3.2], drag: 2, gravity: -2 });
                }
            }
        }
        previous.copy(current);
    }

    // 狐火爆裂: 冲击波 + 火花 + 火苗 + 闪光
    FoxfireBurst(position, scale)
    {
        this.m_TempC.set(position.x, 0.08, position.z);
        this.shockwaves.Spawn(this.m_TempC, this.m_Up, 4.8 * scale, 0.8, new THREE.Color(0.4, 2.0, 2.8));
        this.shockwaves.Spawn(this.m_TempC, this.m_Up, 2.4 * scale, 0.5, new THREE.Color(1.8, 2.4, 2.6));
        this.EmitSparks(position, Math.round(140 * scale), 7.5 * scale, [0.6, 2.2, 3.0], 1.1, 0.7, 1.2);
        this.EmitWisps(position, Math.round(36 * scale), 2.6 * scale, 1.8 * scale, 1.0);
        this.EmitSteam(position, 0, 1.6, 0, Math.round(14 * scale), 1.3 * scale);
        this.DustBurst(position.x, 0.02, position.z, Math.round(24 * scale), 1.6 * scale);
        this.m_TempC.y = 0.8;
        this.Flash(this.m_TempC, 0x60f0ff, 160 * scale);
        this.cameraShake = Math.max(this.cameraShake, 0.32 * scale);
    }

    UpdateFireball(deltaTime, time, action, stateTime)
    {
        const fox = this.m_Fox;
        const fireball = this.fireball;
        if (this.m_FireballState === 'charging')
        {
            // 投掷被其他动作打断时熄灭火球
            if (action.id !== 'foxfire')
            {
                fireball.visible = false;
                this.fireballLight.intensity = 0;
                this.m_FireballState = 'none';
                return;
            }
            const mouth = fox.anchors.mouth;
            mouth.getWorldPosition(fireball.position);
            mouth.getWorldQuaternion(s_TempQuat);
            fireball.position.addScaledVector(this.m_TempB.set(0, 0, 1).applyQuaternion(s_TempQuat), 0.24);
            const charge = SmoothStep(0.45, 1.15, stateTime);
            fireball.scale.setScalar(0.15 + charge * (0.85 + 0.08 * Math.sin(time * 22)));
            this.fireballLight.intensity = 10 * charge;
            // 九尾狐火流汇聚到火球
            const streamCount = Math.floor(deltaTime * 60 + Math.random());
            for (let i = 0; i < streamCount; i++)
            {
                const tip = fox.tailTipList[Math.floor(Math.random() * fox.tailTipList.length)];
                tip.getWorldPosition(this.m_TempC);
                const direction = this.m_TempD.subVectors(fireball.position, this.m_TempC).multiplyScalar(1 / 0.42);
                this.wisps.Emit(this.m_TempC.x, this.m_TempC.y, this.m_TempC.z, direction.x, direction.y, direction.z, { life: 0.42, startSize: 0.11, endSize: 0.05, alpha: 0.9, color: [0.4, 1.8, 2.8], drag: 0, gravity: 0 });
            }
        }
        else if (this.m_FireballState === 'flying')
        {
            this.m_FireballVelocity.y -= 9.0 * deltaTime;
            fireball.position.addScaledVector(this.m_FireballVelocity, deltaTime);
            fireball.scale.setScalar(1 + 0.12 * Math.sin(time * 30));
            const trailCount = Math.floor(deltaTime * 90 + Math.random());
            this.EmitWisps(fireball.position, trailCount, 0.4, 1.5, 0.5);
            if (fireball.position.y <= 0.18)
            {
                this.FoxfireBurst(fireball.position, 1.0);
                fireball.visible = false;
                this.fireballLight.intensity = 0;
                this.m_FireballState = 'none';
            }
        }
    }

    UpdateCast(deltaTime, time, action, stateTime)
    {
        const fox = this.m_Fox;
        const isCasting = action.id === 'cast';
        const runeTarget = isCasting && stateTime > 0.5 && stateTime < 3.2 ? 1 : 0;
        this.m_RuneOpacity = Damp(this.m_RuneOpacity, runeTarget, 4, deltaTime);
        const rootPosition = fox.boneMap.root.getWorldPosition(this.m_TempC);
        this.runeOuter.position.set(rootPosition.x, 0.05, rootPosition.z);
        this.runeInner.position.set(rootPosition.x, 0.06, rootPosition.z);
        this.runeOuter.rotation.z += deltaTime * 0.35;
        this.runeInner.rotation.z -= deltaTime * 0.7;
        const pulse = 0.85 + 0.15 * Math.sin(time * 6);
        this.runeOuter.material.opacity = this.m_RuneOpacity * pulse;
        this.runeInner.material.opacity = this.m_RuneOpacity * (1.1 - pulse * 0.3);
        this.runeOuter.visible = this.m_RuneOpacity > 0.003;
        this.runeInner.visible = this.runeOuter.visible;
        if (this.m_CastState === 'none')
        {
            this.castLight.intensity *= Math.exp(-deltaTime * 6);
            return;
        }
        this.m_CastTime += deltaTime;
        if ((this.m_CastState === 'rising' || this.m_CastState === 'orbit') && !isCasting)
        {
            for (const orb of this.castOrbList)
            {
                orb.group.visible = false;
            }
            this.m_CastState = 'none';
            return;
        }
        if (this.m_CastState === 'rising' || this.m_CastState === 'orbit')
        {
            // 引导: 九颗狐火自尾尖升起, 环绕头顶旋转
            const rise = SmoothStep(0, 0.7, this.m_CastTime);
            if (rise >= 1)
            {
                this.m_CastState = 'orbit';
            }
            const center = this.m_TempD.set(rootPosition.x, rootPosition.y + 2.35, rootPosition.z);
            this.castOrbList.forEach((orb, index) =>
            {
                const angle = time * 2.2 + index / k_TailCount * k_TwoPi;
                const radius = 0.95 + 0.08 * Math.sin(time * 3 + index);
                this.m_TempB.set(center.x + Math.cos(angle) * radius, center.y + Math.sin(time * 2.6 + index * 1.3) * 0.12, center.z + Math.sin(angle) * radius);
                orb.group.position.lerpVectors(orb.start, this.m_TempB, rise);
                orb.group.scale.setScalar(0.6 + rise * 0.5 + 0.1 * Math.sin(time * 18 + index));
                if (Math.random() < deltaTime * 10)
                {
                    this.EmitWisps(orb.group.position, 1, 0.3, 0.8, 0.5);
                }
            });
            this.castLight.position.copy(center);
            this.castLight.intensity = 8 * rise * (0.85 + 0.15 * Math.sin(time * 9));
        }
        else if (this.m_CastState === 'fire')
        {
            // 释放: 九火沿二次贝塞尔曲线依次齐射, 最后一颗引发大爆裂
            let remaining = 0;
            this.castOrbList.forEach((orb, index) =>
            {
                if (orb.done)
                {
                    return;
                }
                remaining++;
                const t = Clamp((this.m_CastTime - orb.delay) / 0.55, 0, 1);
                const e = t * t;
                const a = (1 - e) * (1 - e);
                const b = 2 * (1 - e) * e;
                const c = e * e;
                orb.group.position.set(
                    orb.start.x * a + orb.control.x * b + orb.end.x * c,
                    orb.start.y * a + orb.control.y * b + orb.end.y * c,
                    orb.start.z * a + orb.control.z * b + orb.end.z * c);
                if (t > 0)
                {
                    this.EmitWisps(orb.group.position, 1, 0.2, 1.1, 0.4);
                }
                if (t >= 1)
                {
                    orb.done = true;
                    orb.group.visible = false;
                    this.shockwaves.Spawn(this.m_TempB.set(orb.end.x, 0.08, orb.end.z), this.m_Up, 1.6, 0.5, new THREE.Color(0.5, 2.0, 2.8));
                    this.EmitSparks(orb.end, 24, 4, [0.6, 2.2, 3.0], 1.0, 0.7, 0.8);
                    if (index === k_TailCount - 1)
                    {
                        this.FoxfireBurst(this.m_CastTarget, 1.25);
                    }
                }
            });
            this.castLight.position.copy(this.m_CastTarget);
            this.castLight.intensity = Damp(this.castLight.intensity, remaining > 0 ? 10 : 0, 5, deltaTime);
            if (remaining === 0)
            {
                this.m_CastState = 'none';
            }
        }
    }

    UpdateSlashes(deltaTime)
    {
        for (const slash of this.slashList)
        {
            if (slash.age >= slash.duration)
            {
                slash.group.visible = false;
                continue;
            }
            slash.age += deltaTime;
            const t = Clamp(slash.age / slash.duration, 0, 1);
            slash.material.opacity = Math.pow(1 - t, 1.5) * 0.95;
            slash.group.scale.setScalar(1 + t * 0.35);
        }
    }

    UpdateStars(deltaTime, time, action, stateTime)
    {
        const visible = action.id === 'stun' && stateTime > 0.3 && stateTime < 3.4;
        this.m_StarOpacity = Damp(this.m_StarOpacity, visible ? 1 : 0, 6, deltaTime);
        this.m_StarMaterial.opacity = this.m_StarOpacity;
        this.starGroup.visible = this.m_StarOpacity > 0.01;
        if (!this.starGroup.visible)
        {
            return;
        }
        const center = this.WorldPosition('crystal', this.m_TempA);
        center.y += 0.3;
        this.starGroup.children.forEach((star, index) =>
        {
            const angle = time * 3.2 + index / 5 * k_TwoPi;
            star.position.set(center.x + Math.cos(angle) * 0.36, center.y + Math.sin(time * 5 + index) * 0.05, center.z + Math.sin(angle) * 0.36);
            star.material.rotation = time * 4;
        });
    }

    UpdateMotes(time)
    {
        const attribute = this.motes.geometry.attributes.position;
        const array = attribute.array;
        const base = this.m_MoteBaseArray;
        for (let i = 0; i < array.length; i += 3)
        {
            const k = i * 0.37;
            array[i] = base[i] + Math.sin(time * 0.21 + k) * 0.6;
            array[i + 1] = base[i + 1] + Math.sin(time * 0.33 + k * 1.7) * 0.35;
            array[i + 2] = base[i + 2] + Math.cos(time * 0.17 + k * 0.9) * 0.6;
        }
        attribute.needsUpdate = true;
    }

    //#endregion
}

//#endregion

//#region ==================== 爆炸视图 ====================

const k_ExplodeScale = 1.8;

class ExplodeView
{
    constructor(scene, character, sparkTexture)
    {
        this.m_Character = character;
        this.m_ItemList = character.explodeList;
        this.amount = 0;
        this.target = 0;
        this.axisMode = 'radial';
        const count = this.m_ItemList.length;
        this.m_AnchorList = this.m_ItemList.map(() => new THREE.Vector3());
        this.m_PositionArray = new Float32Array(count * 6);
        const positionAttribute = new THREE.BufferAttribute(this.m_PositionArray, 3).setUsage(THREE.DynamicDrawUsage);
        const lineGeometry = new THREE.BufferGeometry();
        lineGeometry.setAttribute('position', positionAttribute);
        this.m_LineMaterial = new THREE.LineBasicMaterial({ color: new THREE.Color(0.2, 1.5, 1.8), transparent: true, opacity: 0, depthTest: false, depthWrite: false });
        this.lines = new THREE.LineSegments(lineGeometry, this.m_LineMaterial);
        this.lines.frustumCulled = false;
        this.lines.renderOrder = 20;
        const pointGeometry = new THREE.BufferGeometry();
        pointGeometry.setAttribute('position', positionAttribute);
        this.m_PointMaterial = new THREE.PointsMaterial({ map: sparkTexture, color: new THREE.Color(0.4, 2.0, 2.4), size: 9, sizeAttenuation: false, transparent: true, opacity: 0, depthTest: false, depthWrite: false, blending: THREE.AdditiveBlending });
        this.points = new THREE.Points(pointGeometry, this.m_PointMaterial);
        this.points.frustumCulled = false;
        this.points.renderOrder = 21;
        scene.add(this.lines, this.points);
        this.m_ParentPosition = new THREE.Vector3();
        this.m_ParentQuaternion = new THREE.Quaternion();
        this.m_ParentScale = new THREE.Vector3();
        this.m_AxisMap = { x: new THREE.Vector3(1, 0, 0), y: new THREE.Vector3(0, 1, 0), z: new THREE.Vector3(0, 0, 1) };
    }

    // 在骨骼姿态应用后调用: 先复位, 再按层级顺序沿径向/轴向施加偏移
    Apply(deltaTime)
    {
        this.amount = Damp(this.amount, this.target, 6, deltaTime);
        if (Math.abs(this.amount - this.target) < 1e-4)
        {
            this.amount = this.target;
        }
        const amount = this.amount;
        const itemList = this.m_ItemList;
        for (const item of itemList)
        {
            item.object.position.copy(item.basePosition);
        }
        const active = amount > 1e-4;
        this.lines.visible = active;
        this.points.visible = active;
        if (!active)
        {
            return;
        }
        const anchorWorld = s_TempVecA;
        const centerWorld = s_TempVecB;
        const direction = s_TempVecC;
        const customWorld = new THREE.Vector3();
        for (let i = 0; i < itemList.length; i++)
        {
            const item = itemList[i];
            const parent = item.object.parent;
            parent.updateWorldMatrix(true, false);
            parent.matrixWorld.decompose(this.m_ParentPosition, this.m_ParentQuaternion, this.m_ParentScale);
            anchorWorld.copy(item.basePosition).applyMatrix4(parent.matrixWorld);
            this.m_AnchorList[i].copy(anchorWorld);
            item.center.updateWorldMatrix(true, false);
            centerWorld.setFromMatrixPosition(item.center.matrixWorld);
            if (item.direction)
            {
                customWorld.copy(item.direction).applyQuaternion(this.m_ParentQuaternion);
            }
            let magnitude = item.distance * amount * k_ExplodeScale;
            if (this.axisMode === 'radial')
            {
                if (item.direction)
                {
                    direction.copy(customWorld);
                }
                else
                {
                    direction.subVectors(anchorWorld, centerWorld);
                    const length = direction.length();
                    if (length < 1e-3)
                    {
                        direction.set(0, 1, 0);
                    }
                    else
                    {
                        direction.divideScalar(length);
                        magnitude *= 1 + length * 0.25;
                    }
                }
            }
            else
            {
                const axis = this.m_AxisMap[this.axisMode];
                direction.subVectors(anchorWorld, centerWorld);
                const offset = direction.dot(axis);
                let sign = Math.sign(offset);
                if (item.direction && Math.abs(customWorld.dot(axis)) > 0.2)
                {
                    sign = Math.sign(customWorld.dot(axis));
                }
                else if (Math.abs(offset) < 0.03)
                {
                    sign = i % 2 === 0 ? 1 : -1;
                }
                direction.copy(axis).multiplyScalar(sign);
                magnitude *= 1 + Math.abs(offset) * 0.35;
            }
            // 世界空间偏移 → 父节点局部空间
            direction.multiplyScalar(magnitude).applyQuaternion(this.m_ParentQuaternion.invert()).divide(this.m_ParentScale);
            item.object.position.add(direction);
        }
        this.m_Character.root.updateMatrixWorld(true);
        const array = this.m_PositionArray;
        for (let i = 0; i < itemList.length; i++)
        {
            const anchor = this.m_AnchorList[i];
            itemList[i].object.getWorldPosition(direction);
            array[i * 6] = anchor.x;
            array[i * 6 + 1] = anchor.y;
            array[i * 6 + 2] = anchor.z;
            array[i * 6 + 3] = direction.x;
            array[i * 6 + 4] = direction.y;
            array[i * 6 + 5] = direction.z;
        }
        this.lines.geometry.attributes.position.needsUpdate = true;
        const opacity = Clamp(amount * 4, 0, 1);
        this.m_LineMaterial.opacity = opacity * 0.85;
        this.m_PointMaterial.opacity = opacity;
    }
}

//#endregion

//#region ==================== 场景 / 渲染 / GUI / 主循环 ====================

// 程序化 PMREM 环境: 渐变穹顶 + 多块柔光箱面板
function BuildEnvironmentMap(targetRenderer)
{
    const environmentScene = new THREE.Scene();
    const roomMaterial = new THREE.ShaderMaterial(
    {
        side: THREE.BackSide,
        uniforms:
        {
            uTop: { value: new THREE.Color(0.16, 0.18, 0.22) },
            uHorizon: { value: new THREE.Color(0.26, 0.2, 0.15) },
            uBottom: { value: new THREE.Color(0.04, 0.032, 0.025) }
        },
        vertexShader: `
            varying vec3 vDirection;
            void main()
            {
                vDirection = normalize(position);
                gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0);
            }`,
        fragmentShader: `
            uniform vec3 uTop;
            uniform vec3 uHorizon;
            uniform vec3 uBottom;
            varying vec3 vDirection;
            void main()
            {
                float h = vDirection.y;
                vec3 color = h > 0.0 ? mix(uHorizon, uTop, smoothstep(0.0, 0.7, h)) : mix(uHorizon, uBottom, smoothstep(0.0, -0.25, h));
                gl_FragColor = vec4(color, 1.0);
            }`
    });
    environmentScene.add(new THREE.Mesh(new THREE.SphereGeometry(20, 48, 24), roomMaterial));
    const AddPanel = (color, intensity, position, size) =>
    {
        const material = new THREE.MeshBasicMaterial({ color: new THREE.Color(color).multiplyScalar(intensity), side: THREE.DoubleSide });
        const panel = new THREE.Mesh(new THREE.PlaneGeometry(size[0], size[1]), material);
        panel.position.set(position[0], position[1], position[2]);
        panel.lookAt(0, 2, 0);
        environmentScene.add(panel);
    };
    AddPanel(0xffd2a0, 9, [8, 9, 6], [6, 4]);
    AddPanel(0x9ec4ff, 3, [-9, 5, 4], [5, 6]);
    AddPanel(0x7fe8ff, 5, [-3, 6, -9], [8, 2]);
    AddPanel(0xffa060, 2.5, [7, 2, -7], [4, 3]);
    AddPanel(0xffffff, 1.5, [0, 12, 0], [10, 10]);
    const generator = new THREE.PMREMGenerator(targetRenderer);
    const target = generator.fromScene(environmentScene, 0.035);
    generator.dispose();
    console.log('[Main](BuildEnvironmentMap) PMREM 程序化环境贴图生成完成');
    return target.texture;
}

const container = document.getElementById('app');
const renderer = new THREE.WebGLRenderer({ antialias: false, powerPreference: 'high-performance' });
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.outputColorSpace = THREE.SRGBColorSpace;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.0;
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
container.appendChild(renderer.domElement);
s_MaxAnisotropy = Math.min(8, renderer.capabilities.getMaxAnisotropy());

// 让加载提示先完成绘制, 再执行耗时的程序化生成
await new Promise((resolve) => setTimeout(resolve, 60));

const textures = GenerateTextureLibrary();
const materials = CreateMaterialLibrary(textures);

const scene = new THREE.Scene();
const k_FogColor = new THREE.Color(0x16120e);
scene.fog = new THREE.FogExp2(k_FogColor, 0.03);
scene.environment = BuildEnvironmentMap(renderer);

// 背景穹顶: 世界空间渐变, 地平线颜色与雾色一致
const skyMaterial = new THREE.ShaderMaterial(
{
    side: THREE.BackSide,
    depthWrite: false,
    uniforms:
    {
        uTop: { value: new THREE.Color(0x05070b) },
        uHorizon: { value: k_FogColor.clone() },
        uBottom: { value: new THREE.Color(0x0c0a08) },
        uGlow: { value: new THREE.Color(0x4a2a12) }
    },
    vertexShader: `
        varying vec3 vDirection;
        void main()
        {
            vDirection = normalize(position);
            gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0);
        }`,
    fragmentShader: `
        uniform vec3 uTop;
        uniform vec3 uHorizon;
        uniform vec3 uBottom;
        uniform vec3 uGlow;
        varying vec3 vDirection;
        void main()
        {
            float h = vDirection.y;
            vec3 color = h > 0.0 ? mix(uHorizon, uTop, pow(smoothstep(0.0, 0.6, h), 0.8)) : mix(uHorizon, uBottom, smoothstep(0.0, -0.3, h));
            color += uGlow * exp(-h * h * 36.0) * (0.55 + 0.45 * vDirection.z);
            gl_FragColor = vec4(color, 1.0);
        }`
});
const sky = new THREE.Mesh(new THREE.SphereGeometry(95, 48, 24), skyMaterial);
sky.renderOrder = -1;
scene.add(sky);

const camera = new THREE.PerspectiveCamera(38, window.innerWidth / window.innerHeight, 0.1, 240);
camera.position.set(5.4, 2.6, 4.6);
const controls = new OrbitControls(camera, renderer.domElement);
controls.target.set(0, 0.9, 0.7);
controls.enableDamping = true;
controls.dampingFactor = 0.07;
controls.minDistance = 1.8;
controls.maxDistance = 22;
controls.maxPolarAngle = 1.53;
controls.autoRotateSpeed = 0.8;
controls.update();

//#region 电影级工作室灯光

scene.add(new THREE.HemisphereLight(0x8a9bb5, 0x2a1d12, 0.45));
const keyLight = new THREE.DirectionalLight(0xffd6a8, 3.2);
keyLight.position.set(6, 11, 7);
keyLight.target.position.set(0, 2, 0);
keyLight.castShadow = true;
keyLight.shadow.mapSize.set(2048, 2048);
keyLight.shadow.camera.left = -4.5;
keyLight.shadow.camera.right = 4.5;
keyLight.shadow.camera.top = 5.0;
keyLight.shadow.camera.bottom = -2.5;
keyLight.shadow.camera.near = 1;
keyLight.shadow.camera.far = 32;
keyLight.shadow.bias = -0.0004;
keyLight.shadow.normalBias = 0.025;
scene.add(keyLight, keyLight.target);
const fillLight = new THREE.DirectionalLight(0x8fb4ff, 0.7);
fillLight.position.set(-8, 4, 5);
scene.add(fillLight);
const rimLight = new THREE.DirectionalLight(0x6fe6ff, 1.9);
rimLight.position.set(-5, 7, -9);
scene.add(rimLight);
const rimWarmLight = new THREE.DirectionalLight(0xffa060, 1.3);
rimWarmLight.position.set(7, 3, -6);
scene.add(rimWarmLight);

//#endregion

//#region 程序化地面 / 黄铜圆台 / 地面薄雾

const ground = new THREE.Mesh(new THREE.CircleGeometry(70, 96), materials.ground);
ground.rotation.x = -k_HalfPi;
ground.receiveShadow = true;
scene.add(ground);

const dais = new THREE.Group();
scene.add(dais);
const daisMaterialList = [materials.dais];
AddMesh(dais, new THREE.CylinderGeometry(3.4, 3.5, 0.1, 96), materials.dais, [0, -0.03, 0]).castShadow = false;
AddMesh(dais, new THREE.TorusGeometry(3.42, 0.06, 10, 128).rotateX(k_HalfPi), materials.brass, [0, 0.02, 0]);
AddMesh(dais, new THREE.TorusGeometry(2.6, 0.025, 6, 128).rotateX(k_HalfPi), materials.steel, [0, 0.022, 0]);
AddMesh(dais, new THREE.TorusGeometry(1.6, 0.02, 6, 96).rotateX(k_HalfPi), materials.brass, [0, 0.022, 0]);
AddMesh(dais, RivetRingOnDisc(3.22, 40, 0.035), materials.brass, [0, 0.02, 0], [-k_HalfPi, 0, 0]);
const floorGearList = [];
for (const [x, z, radius, teeth, speed] of [[2.75, -1.5, 0.62, 20, 0.25], [-2.6, -1.9, 0.48, 16, -0.32], [2.2, 2.3, 0.4, 14, 0.36]])
{
    const gear = AddMesh(dais, GearGeometry(radius, teeth, 0.05), materials.brassDark, [x, 0.01, z], [-k_HalfPi, 0, 0]);
    gear.castShadow = false;
    floorGearList.push({ mesh: gear, speed: speed });
}

const mistList = [];
for (let i = 0; i < 3; i++)
{
    const texture = textures.mist.clone();
    texture.repeat.set(3, 3);
    const material = new THREE.MeshBasicMaterial({ map: texture, color: new THREE.Color(0.55, 0.5, 0.44), transparent: true, opacity: 0.1 - i * 0.025, depthWrite: false });
    const mist = new THREE.Mesh(new THREE.PlaneGeometry(46, 46), material);
    mist.rotation.x = -k_HalfPi;
    mist.position.y = 0.12 + i * 0.22;
    mist.renderOrder = 2;
    scene.add(mist);
    mistList.push({ texture: texture, speedX: (0.006 + i * 0.004) * (i % 2 === 0 ? 1 : -1), speedY: 0.004 + i * 0.002 });
}

//#endregion

//#region 角色 / 动画 / 特效 / 爆炸视图

const fox = new SteampunkFox(materials);
fox.root.position.y = 0.02;
scene.add(fox.root);

const actionMap = BuildActionMap();
const animator = new Animator(actionMap);
const effects = new EffectsDirector(scene, fox, animator, textures, materials);
const explodeView = new ExplodeView(scene, fox, textures.spark);
animator.onEvent = (name, action) =>
{
    effects.HandleEvent(name, action);
};

const skeletonHelper = new THREE.SkeletonHelper(fox.root);
skeletonHelper.material.depthTest = false;
skeletonHelper.material.depthWrite = false;
skeletonHelper.material.transparent = true;
skeletonHelper.renderOrder = 30;
skeletonHelper.visible = false;
{
    const colorAttribute = skeletonHelper.geometry.getAttribute('color');
    for (let i = 0; i < colorAttribute.count; i++)
    {
        if (i % 2 === 0)
        {
            colorAttribute.setXYZ(i, 0.3, 1.6, 1.9);
        }
        else
        {
            colorAttribute.setXYZ(i, 1.9, 1.3, 0.4);
        }
    }
    colorAttribute.needsUpdate = true;
}
scene.add(skeletonHelper);
const jointPositionArray = new Float32Array(skeletonHelper.bones.length * 3);
const jointGeometry = new THREE.BufferGeometry();
jointGeometry.setAttribute('position', new THREE.BufferAttribute(jointPositionArray, 3).setUsage(THREE.DynamicDrawUsage));
const jointPoints = new THREE.Points(jointGeometry, new THREE.PointsMaterial({ map: textures.spark, color: new THREE.Color(2.0, 1.4, 0.45), size: 10, sizeAttenuation: false, transparent: true, depthTest: false, depthWrite: false, blending: THREE.AdditiveBlending }));
jointPoints.frustumCulled = false;
jointPoints.renderOrder = 31;
jointPoints.visible = false;
scene.add(jointPoints);

//#endregion

//#region 后期: 多重采样 HDR → 辉光 → ACES 输出

const renderTarget = new THREE.WebGLRenderTarget(window.innerWidth, window.innerHeight, { type: THREE.HalfFloatType, samples: 4 });
const composer = new EffectComposer(renderer, renderTarget);
composer.addPass(new RenderPass(scene, camera));
const bloomPass = new UnrealBloomPass(new THREE.Vector2(window.innerWidth, window.innerHeight), 0.38, 0.5, 0.94);
composer.addPass(bloomPass);
composer.addPass(new OutputPass());
composer.setSize(window.innerWidth, window.innerHeight);

//#endregion

//#region GUI

const k_ActionOrderList = ['idle', 'walk', 'run', 'jump', 'land', 'pounce', 'claw', 'tailSweep', 'foxfire', 'hit', 'stun', 'taunt', 'howl', 'cast', 'death'];
const k_ActionLabelMap = {};
for (const id of k_ActionOrderList)
{
    k_ActionLabelMap[actionMap[id].label] = id;
}
const k_AxisLabelMap = { '径向': 'radial', 'X 轴': 'x', 'Y 轴': 'y', 'Z 轴': 'z' };

const params =
{
    explode: 0,
    explodeAxis: '径向',
    action: '待机',
    animSpeed: 1,
    gearSpeed: 1,
    wireframe: false,
    showSkeleton: false,
    autoRotate: false,
    bloom: true,
    exposure: 1.0,
    replay: () =>
    {
        animator.Play(k_ActionLabelMap[params.action]);
    }
};

const gui = new GUI({ title: '⚙ 蒸汽九尾狐 · 控制台' });
const explodeFolder = gui.addFolder('爆炸视图');
const explodeController = explodeFolder.add(params, 'explode', 0, 1, 0.001).name('分离程度').onChange((value) =>
{
    explodeView.target = value;
});
explodeFolder.add(params, 'explodeAxis', Object.keys(k_AxisLabelMap)).name('爆炸轴').onChange((value) =>
{
    explodeView.axisMode = k_AxisLabelMap[value];
});
const actionFolder = gui.addFolder('动作状态机');
const actionController = actionFolder.add(params, 'action', Object.keys(k_ActionLabelMap)).name('动作状态').onChange((value) =>
{
    animator.Play(k_ActionLabelMap[value]);
});
actionFolder.add(params, 'replay').name('▶ 重播当前动作');
actionFolder.add(params, 'animSpeed', 0.1, 5, 0.01).name('动画速度');
actionFolder.add(params, 'gearSpeed', 0.1, 5, 0.01).name('齿轮转速');
const viewFolder = gui.addFolder('显示');
viewFolder.add(params, 'wireframe').name('线框模式').onChange((value) =>
{
    for (const material of fox.materialSet)
    {
        material.wireframe = value;
    }
    for (const material of daisMaterialList)
    {
        material.wireframe = value;
    }
});
viewFolder.add(params, 'showSkeleton').name('显示骨骼').onChange((value) =>
{
    skeletonHelper.visible = value;
    jointPoints.visible = value;
});
viewFolder.add(params, 'autoRotate').name('自动旋转').onChange((value) =>
{
    controls.autoRotate = value;
});
viewFolder.add(params, 'bloom').name('辉光').onChange((value) =>
{
    bloomPass.enabled = value;
});
viewFolder.add(params, 'exposure', 0.4, 2.0, 0.01).name('曝光').onChange((value) =>
{
    renderer.toneMappingExposure = value;
});

animator.onStateChange = (action) =>
{
    params.action = action.label;
    actionController.updateDisplay();
};

const k_KeyActionMap = { Digit1: 'idle', Digit2: 'walk', Digit3: 'run', Space: 'jump', Digit4: 'pounce', Digit5: 'claw', Digit6: 'tailSweep', Digit7: 'foxfire', Digit8: 'hit', Digit9: 'stun', Digit0: 'taunt', KeyH: 'howl', KeyQ: 'cast', KeyX: 'death' };
window.addEventListener('keydown', (event) =>
{
    const tagName = event.target && event.target.tagName;
    if (tagName === 'INPUT' || tagName === 'SELECT' || tagName === 'TEXTAREA')
    {
        return;
    }
    const id = k_KeyActionMap[event.code];
    if (id)
    {
        animator.Play(id);
        event.preventDefault();
    }
    else if (event.code === 'KeyE')
    {
        params.explode = params.explode > 0.5 ? 0 : 1;
        explodeView.target = params.explode;
        explodeController.updateDisplay();
    }
});

//#endregion

//#region HUD / 自适应 / 主循环

const hudState = document.getElementById('hudState');
const hudPhase = document.getElementById('hudPhase');
const hudBar = document.getElementById('hudBar');
let s_LastHudText = '';

function UpdateHud()
{
    const action = animator.CurrentAction;
    const phaseName = animator.PhaseName;
    const text = action.id + '|' + phaseName;
    if (text !== s_LastHudText)
    {
        s_LastHudText = text;
        hudState.textContent = `${action.label} · ${action.loop ? '循环' : '单次'}`;
        hudPhase.textContent = `阶段：${phaseName}`;
    }
    hudBar.style.width = `${(animator.Progress * 100).toFixed(1)}%`;
}

function OnResize()
{
    const width = window.innerWidth;
    const height = window.innerHeight;
    camera.aspect = width / height;
    camera.updateProjectionMatrix();
    renderer.setSize(width, height);
    composer.setSize(width, height);
    effects.SetParticleScale(height * renderer.getPixelRatio() / (2 * Math.tan(THREE.MathUtils.degToRad(camera.fov) * 0.5)));
}
window.addEventListener('resize', OnResize);
OnResize();

const clock = new THREE.Clock();
const shakeOffset = new THREE.Vector3();
let s_AnimationTime = 0;
let s_FirstFrame = true;

function Animate()
{
    const deltaTime = Math.min(clock.getDelta(), 0.05);
    if (window.innerWidth === 0 || window.innerHeight === 0)
    {
        return;
    }
    const animationDelta = deltaTime * params.animSpeed;
    s_AnimationTime += animationDelta;
    // 动作状态机 → 骨骼姿态 → 爆炸视图 → 活塞/齿轮/发光 → 特效
    const pose = animator.Update(animationDelta);
    fox.ApplyPose(pose);
    fox.UpdateTails(animationDelta, s_AnimationTime);
    explodeView.Apply(deltaTime);
    fox.root.updateMatrixWorld(true);
    fox.UpdatePistons();
    fox.Update(animationDelta, s_AnimationTime, params.gearSpeed);
    effects.Update(animationDelta, s_AnimationTime);
    for (const gear of floorGearList)
    {
        gear.mesh.rotation.z += gear.speed * params.gearSpeed * animationDelta;
    }
    for (const mist of mistList)
    {
        mist.texture.offset.x += mist.speedX * deltaTime;
        mist.texture.offset.y += mist.speedY * deltaTime;
    }
    if (jointPoints.visible)
    {
        skeletonHelper.bones.forEach((bone, index) =>
        {
            bone.getWorldPosition(s_TempVecA);
            jointPositionArray[index * 3] = s_TempVecA.x;
            jointPositionArray[index * 3 + 1] = s_TempVecA.y;
            jointPositionArray[index * 3 + 2] = s_TempVecA.z;
        });
        jointGeometry.attributes.position.needsUpdate = true;
    }
    // 相机震动: 先撤销上一帧偏移, 再由轨道控制器更新
    camera.position.sub(shakeOffset);
    controls.update();
    shakeOffset.set(Math.random() - 0.5, Math.random() - 0.5, Math.random() - 0.5).multiplyScalar(effects.cameraShake * 0.35);
    camera.position.add(shakeOffset);
    UpdateHud();
    composer.render(deltaTime);
    if (s_FirstFrame)
    {
        s_FirstFrame = false;
        const loading = document.getElementById('loading');
        loading.style.opacity = '0';
        setTimeout(() => loading.remove(), 900);
        console.log('[Main](Animate) 首帧渲染完成');
    }
}
renderer.setAnimationLoop(Animate);

//#endregion

//#endregion
