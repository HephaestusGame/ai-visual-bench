<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no" />
  <title>蒸汽朋克机械九尾狐 - 3D 骨骼动作与机械拆解系统</title>
  <style>
    :root {
      --brass-light: #f3d27a;
      --brass-mid: #c8963e;
      --brass-dark: #5a3c11;
      --foxfire-cyan: #00f5d4;
      --foxfire-blue: #00bbf9;
      --amber-glow: #ff9f1c;
      --bg-dark: #0b0d12;
      --panel-bg: rgba(14, 17, 24, 0.82);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      -webkit-user-select: none;
    }

    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background-color: var(--bg-dark);
      font-family: "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
      color: #e8dfd1;
    }

    #canvas-container {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
      z-index: 1;
    }

    /* 顶部蒸汽朋克銘牌 HUD */
    .hud-header {
      position: fixed;
      top: 18px;
      left: 22px;
      z-index: 10;
      pointer-events: none;
      background: var(--panel-bg);
      border: 1px solid rgba(200, 150, 62, 0.45);
      border-left: 4px solid var(--brass-mid);
      padding: 12px 18px;
      border-radius: 4px;
      backdrop-filter: blur(8px);
      box-shadow: 0 8px 32px rgba(0, 0, 0, 0.65), inset 0 0 15px rgba(200, 150, 62, 0.08);
      max-width: 390px;
    }

    .hud-title {
      font-size: 16px;
      font-weight: 700;
      letter-spacing: 1.5px;
      color: var(--brass-light);
      text-transform: uppercase;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .hud-title .core-dot {
      width: 9px;
      height: 9px;
      border-radius: 50%;
      background: var(--foxfire-cyan);
      box-shadow: 0 0 10px var(--foxfire-cyan), 0 0 20px var(--foxfire-blue);
      animation: pulseDot 1.6s infinite ease-in-out;
    }

    @keyframes pulseDot {
      0%, 100% { transform: scale(1); opacity: 0.9; }
      50% { transform: scale(1.3); opacity: 1; }
    }

    .hud-subtitle {
      font-size: 11px;
      color: #9ba4b4;
      margin-top: 4px;
      letter-spacing: 0.5px;
    }

    .hud-telemetry {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 8px;
      margin-top: 10px;
      padding-top: 8px;
      border-top: 1px solid rgba(200, 150, 62, 0.22);
      font-size: 11px;
    }

    .telemetry-item span {
      display: block;
      color: #7f8c9f;
      font-size: 10px;
    }

    .telemetry-item strong {
      color: var(--foxfire-cyan);
      font-family: "Consolas", "Monaco", monospace;
      font-size: 12px;
    }

    .progress-wrap {
      margin-top: 8px;
      width: 100%;
      height: 4px;
      background: rgba(255, 255, 255, 0.08);
      border-radius: 2px;
      overflow: hidden;
    }

    .progress-bar {
      height: 100%;
      width: 0%;
      background: linear-gradient(90deg, var(--brass-mid), var(--foxfire-cyan));
      transition: width 0.05s linear;
    }

    /* 底部快捷动作技能栏 */
    .action-dock {
      position: fixed;
      bottom: 18px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 10;
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 6px;
      max-width: 92vw;
      background: var(--panel-bg);
      border: 1px solid rgba(200, 150, 62, 0.45);
      padding: 8px 12px;
      border-radius: 6px;
      backdrop-filter: blur(8px);
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.7);
    }

    .action-btn {
      background: linear-gradient(180deg, rgba(45, 38, 28, 0.9) 0%, rgba(24, 20, 16, 0.95) 100%);
      border: 1px solid rgba(200, 150, 62, 0.45);
      color: #dfd3c3;
      font-size: 12px;
      padding: 6px 11px;
      border-radius: 4px;
      cursor: pointer;
      transition: all 0.18s ease;
      letter-spacing: 0.5px;
    }

    .action-btn:hover {
      border-color: var(--brass-light);
      color: #ffffff;
      transform: translateY(-1px);
      box-shadow: 0 0 12px rgba(200, 150, 62, 0.4);
    }

    .action-btn.active {
      background: linear-gradient(180deg, rgba(0, 187, 249, 0.32) 0%, rgba(16, 45, 62, 0.92) 100%);
      border-color: var(--foxfire-cyan);
      color: var(--foxfire-cyan);
      box-shadow: 0 0 14px rgba(0, 245, 212, 0.35);
      font-weight: 600;
    }

    /* 调整 lil-gui 样式契合蒸汽朋克主题 */
    .lil-gui.root {
      z-index: 20 !important;
      --background-color: rgba(14, 17, 24, 0.88);
      --text-color: #e4d7c5;
      --title-background-color: #261d13;
      --widget-color: #2b241c;
      --hover-color: #3c3124;
      --focus-color: #52412d;
      --number-color: #00f5d4;
      --string-color: #f3d27a;
      border: 1px solid rgba(200, 150, 62, 0.45);
      border-radius: 4px;
      box-shadow: 0 8px 28px rgba(0, 0, 0, 0.65);
    }
  </style>

  <!-- Three.js r162 ES Module Import Map -->
  <script type="importmap">
    {
      "imports": {
        "three": "https://unpkg.com/three@0.162.0/build/three.module.js",

<body>
  <div id="canvas-container"></div>

  <!-- 顶部状态监控面板 -->
  <div class="hud-header">
    <div class="hud-title">
      <span class="core-dot"></span>
      <span>AUTOMATON // 九尾天狐·机关兽</span>
    </div>
    <div class="hud-subtitle">发条蒸汽炉心驱动 · 九尾分节齿轮传动 · 实时骨骼状态机</div>
    <div class="hud-telemetry">
      <div class="telemetry-item">

        <strong id="hud-pressure">142 PSI</strong>
      </div>
      <div class="telemetry-item">
        <span>活动骨骼 / 齿轮</span>
        <strong id="hud-bones">72 / 38</strong>
      </div>
    </div>
    <div class="progress-wrap">
      <div class="progress-bar" id="hud-progress"></div>
    </div>

  <!-- 底部动作状态机快捷触发栏 -->
  <div class="action-dock" id="action-dock"></div>

  <script type="module">
    import * as THREE from 'three';
    import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
    import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';
    import GUI from 'lil-gui';

    // ============================================================================
    // 1. 程序化纹理与 PBR 材质工厂 (ProceduralTextureFactory)
    // ============================================================================
    class ProceduralTextureFactory {
      constructor(maxAnisotropy = 4) {
        this.maxAnisotropy = maxAnisotropy;
        this.m_Cache = new Map();
      }

      m_Hash2D(x, y) {
        const s = Math.sin(x * 127.1 + y * 311.7) * 43758.5453123;
        return s - Math.floor(s);
      }

      m_ValueNoise(x, y) {
        const ix = Math.floor(x);
        const iy = Math.floor(y);
        const fx = x - ix;
        const fy = y - iy;
        const ux = fx * fx * (3.0 - 2.0 * fx);
        const uy = fy * fy * (3.0 - 2.0 * fy);

        const a = this.m_Hash2D(ix, iy);
        const b = this.m_Hash2D(ix + 1, iy);
        const c = this.m_Hash2D(ix, iy + 1);
        const d = this.m_Hash2D(ix + 1, iy + 1);

        return a + (b - a) * ux + (c - a) * uy + (a - b - c + d) * ux * uy;
      }

      m_Fbm(x, y, octaves = 4) {
        let value = 0.0;
        let amp = 0.5;
        let freq = 1.0;
        for (let i = 0; i < octaves; i++) {
          value += amp * this.m_ValueNoise(x * freq, y * freq);
          freq *= 2.02;
          amp *= 0.5;
        }
        return value;
      }

      m_ConfigureTexture(canvas, isSRGB = true, repeat = 2) {
        const tex = new THREE.CanvasTexture(canvas);
        tex.wrapS = THREE.RepeatWrapping;
        tex.wrapT = THREE.RepeatWrapping;
        tex.repeat.set(repeat, repeat);
        tex.anisotropy = this.maxAnisotropy;
        tex.colorSpace = isSRGB ? THREE.SRGBColorSpace : THREE.NoColorSpace;
        tex.needsUpdate = true;
        return tex;
      }

      /**
       * 生成拉丝磨损黄铜贴图套件 (Albedo, Roughness, Bump)
       */
      createBrassMaps() {
        const size = 256;
        const colorCanvas = document.createElement('canvas');
        const roughCanvas = document.createElement('canvas');
        const bumpCanvas = document.createElement('canvas');
        colorCanvas.width = roughCanvas.width = bumpCanvas.width = size;
        colorCanvas.height = roughCanvas.height = bumpCanvas.height = size;

        const cCtx = colorCanvas.getContext('2d');
        const rCtx = roughCanvas.getContext('2d');
        const bCtx = bumpCanvas.getContext('2d');

        const cData = cCtx.createImageData(size, size);
        const rData = rCtx.createImageData(size, size);
        const bData = bCtx.createImageData(size, size);

        for (let y = 0; y < size; y++) {
          for (let x = 0; x < size; x++) {
            const idx = (y * size + x) * 4;
            const n = this.m_Fbm(x * 0.04, y * 0.04, 4);
            const brush = this.m_ValueNoise(x * 0.35, y * 0.02);
            const scratch = Math.abs(Math.sin((x + y * 0.3) * 0.25 + n * 6.0)) < 0.04 ? 1.0 : 0.0;
            const tarnish = Math.max(0, (n - 0.58) * 2.4);

            // 黄铜基底色 + 氧化暗部 + 划痕高光
            const r = Math.min(255, Math.max(0, 212 - tarnish * 75 + brush * 18 + scratch * 30));
            const g = Math.min(255, Math.max(0, 162 - tarnish * 65 + brush * 14 + scratch * 25));
            const b = Math.min(255, Math.max(0, 74 - tarnish * 30 + brush * 8 + scratch * 15));

            cData.data[idx] = r;
            cData.data[idx + 1] = g;
            cData.data[idx + 2] = b;
            cData.data[idx + 3] = 255;

            const roughVal = Math.min(255, Math.max(25, 58 + tarnish * 115 - scratch * 25 + brush * 22));
            rData.data[idx] = rData.data[idx + 1] = rData.data[idx + 2] = roughVal;
            rData.data[idx + 3] = 255;

            const bumpVal = Math.min(255, Math.max(0, 128 + brush * 30 - scratch * 45 - tarnish * 20));
            bData.data[idx] = bData.data[idx + 1] = bData.data[idx + 2] = bumpVal;
            bData.data[idx + 3] = 255;
          }
        }

        // 添加铆钉装饰点
        cCtx.putImageData(cData, 0, 0);
        rCtx.putImageData(rData, 0, 0);
        bCtx.putImageData(bData, 0, 0);

        bCtx.fillStyle = 'rgb(220,220,220)';
        for (let i = 16; i < size; i += 32) {
          bCtx.beginPath();
          bCtx.arc(i, 12, 3, 0, Math.PI * 2);
          bCtx.arc(i, size - 12, 3, 0, Math.PI * 2);
          bCtx.fill();
        }

        return {
          map: this.m_ConfigureTexture(colorCanvas, true, 2),
          roughnessMap: this.m_ConfigureTexture(roughCanvas, false, 2),
          bumpMap: this.m_ConfigureTexture(bumpCanvas, false, 2)
        };
      }

      /**
       * 生成带铜绿(Verdigris)的氧化紫铜贴图套件
       */
      createOxidizedCopperMaps() {
        const size = 256;
        const colorCanvas = document.createElement('canvas');
        const roughCanvas = document.createElement('canvas');
        const metalCanvas = document.createElement('canvas');
        colorCanvas.width = roughCanvas.width = metalCanvas.width = size;
        colorCanvas.height = roughCanvas.height = metalCanvas.height = size;

        const cCtx = colorCanvas.getContext('2d');
        const rCtx = roughCanvas.getContext('2d');
        const mCtx = metalCanvas.getContext('2d');

        const cData = cCtx.createImageData(size, size);
        const rData = rCtx.createImageData(size, size);
        const mData = mCtx.createImageData(size, size);

        for (let y = 0; y < size; y++) {
          for (let x = 0; x < size; x++) {
            const idx = (y * size + x) * 4;
            const n = this.m_Fbm(x * 0.05, y * 0.05, 5);
            const patina = Math.max(0, Math.min(1, (n - 0.52) * 3.2));

            // 紫铜色与青绿铜绿插值
            const baseR = 186, baseG = 98, baseB = 64;
            const patR = 66, patG = 165, patB = 142;

            cData.data[idx] = baseR * (1 - patina) + patR * patina;
            cData.data[idx + 1] = baseG * (1 - patina) + patG * patina;
            cData.data[idx + 2] = baseB * (1 - patina) + patB * patina;
            cData.data[idx + 3] = 255;

            const rough = Math.min(255, 70 + patina * 155);
            rData.data[idx] = rData.data[idx + 1] = rData.data[idx + 2] = rough;
            rData.data[idx + 3] = 255;

            const metal = Math.max(20, 240 - patina * 185);
            mData.data[idx] = mData.data[idx + 1] = mData.data[idx + 2] = metal;
            mData.data[idx + 3] = 255;
          }
        }

        cCtx.putImageData(cData, 0, 0);
        rCtx.putImageData(rData, 0, 0);
        mCtx.putImageData(mData, 0, 0);

        return {
          map: this.m_ConfigureTexture(colorCanvas, true, 2),
          roughnessMap: this.m_ConfigureTexture(roughCanvas, false, 2),
          metalnessMap: this.m_ConfigureTexture(metalCanvas, false, 2)
        };
      }

      /**
       * 生成发蓝钢 (Blued Steel) 车削金属纹理
       */
      createBluedSteelMaps() {
        const size = 256;
        const colorCanvas = document.createElement('canvas');
        const roughCanvas = document.createElement('canvas');
        colorCanvas.width = roughCanvas.width = size;
        colorCanvas.height = roughCanvas.height = size;

        const cCtx = colorCanvas.getContext('2d');
        const rCtx = roughCanvas.getContext('2d');
        const cData = cCtx.createImageData(size, size);
        const rData = rCtx.createImageData(size, size);

        for (let y = 0; y < size; y++) {
          for (let x = 0; x < size; x++) {
            const idx = (y * size + x) * 4;
            const lathe = Math.sin(y * 0.65) * 0.5 + 0.5;
            const n = this.m_Fbm(x * 0.06, y * 0.06, 3);
            const wear = Math.max(0, (n - 0.62) * 2.5);

            cData.data[idx] = 36 + lathe * 10 + wear * 55;
            cData.data[idx + 1] = 48 + lathe * 12 + wear * 58;
            cData.data[idx + 2] = 68 + lathe * 16 + wear * 50;
            cData.data[idx + 3] = 255;

            const rough = 75 + (1 - lathe) * 35 - wear * 25;
            rData.data[idx] = rData.data[idx + 1] = rData.data[idx + 2] = rough;
            rData.data[idx + 3] = 255;
          }
        }

        cCtx.putImageData(cData, 0, 0);
        rCtx.putImageData(rData, 0, 0);

        return {
          map: this.m_ConfigureTexture(colorCanvas, true, 3),
          roughnessMap: this.m_ConfigureTexture(roughCanvas, false, 3),
          bumpMap: this.m_ConfigureTexture(roughCanvas, false, 3)
        };
      }

      /**
       * 生成锈蚀铸铁 (Rusted Iron) 贴图套件
       */
      createRustedIronMaps() {
        const size = 256;
        const colorCanvas = document.createElement('canvas');
        const roughCanvas = document.createElement('canvas');
        colorCanvas.width = roughCanvas.width = size;
        colorCanvas.height = roughCanvas.height = size;

        const cCtx = colorCanvas.getContext('2d');
        const rCtx = roughCanvas.getContext('2d');
        const cData = cCtx.createImageData(size, size);
        const rData = rCtx.createImageData(size, size);

        for (let y = 0; y < size; y++) {
          for (let x = 0; x < size; x++) {
            const idx = (y * size + x) * 4;
            const n = this.m_Fbm(x * 0.07, y * 0.07, 5);
            const rust = Math.max(0, Math.min(1, (n - 0.48) * 3.0));

            cData.data[idx] = 52 * (1 - rust) + 148 * rust;
            cData.data[idx + 1] = 50 * (1 - rust) + 68 * rust;
            cData.data[idx + 2] = 52 * (1 - rust) + 34 * rust;
            cData.data[idx + 3] = 255;

            const rough = 120 + rust * 125;
            rData.data[idx] = rData.data[idx + 1] = rData.data[idx + 2] = rough;
            rData.data[idx + 3] = 255;
          }
        }

        cCtx.putImageData(cData, 0, 0);
        rCtx.putImageData(rData, 0, 0);

        return {
          map: this.m_ConfigureTexture(colorCanvas, true, 2),
          roughnessMap: this.m_ConfigureTexture(roughCanvas, false, 2),
          bumpMap: this.m_ConfigureTexture(roughCanvas, false, 2)
        };
      }

      /**
       * 生成裂纹旧皮革 (Cracked Leather) 贴图套件
       */
      createCrackedLeatherMaps() {
        const size = 256;
        const colorCanvas = document.createElement('canvas');
        const bumpCanvas = document.createElement('canvas');
        colorCanvas.width = bumpCanvas.width = size;
        colorCanvas.height = bumpCanvas.height = size;

        const cCtx = colorCanvas.getContext('2d');
        const bCtx = bumpCanvas.getContext('2d');
        const cData = cCtx.createImageData(size, size);
        const bData = bCtx.createImageData(size, size);

        for (let y = 0; y < size; y++) {
          for (let x = 0; x < size; x++) {
            const idx = (y * size + x) * 4;
            const grain = this.m_Fbm(x * 0.14, y * 0.14, 4);
            const wave = Math.abs(Math.sin(x * 0.09 + grain * 5.5) * Math.cos(y * 0.09 + grain * 5.5));
            const crack = wave < 0.07 ? (0.07 - wave) / 0.07 : 0.0;

            cData.data[idx] = Math.max(18, 78 - grain * 18 - crack * 38);
            cData.data[idx + 1] = Math.max(10, 42 - grain * 12 - crack * 24);
            cData.data[idx + 2] = Math.max(6, 24 - grain * 8 - crack * 14);
            cData.data[idx + 3] = 255;

            const bump = Math.max(0, 160 - grain * 45 - crack * 130);
            bData.data[idx] = bData.data[idx + 1] = bData.data[idx + 2] = bump;
            bData.data[idx + 3] = 255;
          }
        }

        cCtx.putImageData(cData, 0, 0);
        bCtx.putImageData(bData, 0, 0);

        return {
          map: this.m_ConfigureTexture(colorCanvas, true, 2),
          bumpMap: this.m_ConfigureTexture(bumpCanvas, false, 2)
        };
      }

      /**
       * 生成层叠金属尾毛 (Metallic Fur) 羽状雕纹贴图
       */
      createMetallicFurMaps() {
        const size = 256;
        const colorCanvas = document.createElement('canvas');
        const bumpCanvas = document.createElement('canvas');
        colorCanvas.width = bumpCanvas.width = size;
        colorCanvas.height = bumpCanvas.height = size;

        const cCtx = colorCanvas.getContext('2d');
        const bCtx = bumpCanvas.getContext('2d');
        const cData = cCtx.createImageData(size, size);
        const bData = bCtx.createImageData(size, size);

        for (let y = 0; y < size; y++) {
          for (let x = 0; x < size; x++) {
            const idx = (y * size + x) * 4;
            const strand = Math.sin(x * 0.85 + Math.sin(y * 0.08) * 2.0) * 0.5 + 0.5;
            const grad = y / size;

            cData.data[idx] = Math.min(255, 175 + strand * 45 + grad * 25);
            cData.data[idx + 1] = Math.min(255, 128 + strand * 35 + grad * 20);
            cData.data[idx + 2] = Math.min(255, 55 + strand * 22 + grad * 35);
            cData.data[idx + 3] = 255;

            const bump = Math.floor(80 + strand * 165);
            bData.data[idx] = bData.data[idx + 1] = bData.data[idx + 2] = bump;
            bData.data[idx + 3] = 255;
          }
        }

        cCtx.putImageData(cData, 0, 0);
        bCtx.putImageData(bData, 0, 0);

        return {
          map: this.m_ConfigureTexture(colorCanvas, true, 1),
          bumpMap: this.m_ConfigureTexture(bumpCanvas, false, 1)
        };
      }

      /**
       * 生成狐火能量纹理 (Foxfire Plasma)
       */
      createFoxfireMaps() {
        const size = 256;
        const canvas = document.createElement('canvas');
        canvas.width = canvas.height = size;
        const ctx = canvas.getContext('2d');
        const img = ctx.createImageData(size, size);

        for (let y = 0; y < size; y++) {
          for (let x = 0; x < size; x++) {
            const idx = (y * size + x) * 4;
            const n = this.m_Fbm(x * 0.05, y * 0.05, 4);
            const vein = Math.pow(Math.sin(n * Math.PI * 3.0) * 0.5 + 0.5, 2.2);

            img.data[idx] = Math.min(255, 15 + vein * 170);
            img.data[idx + 1] = Math.min(255, 195 + vein * 60);
            img.data[idx + 2] = Math.min(255, 215 + vein * 40);
            img.data[idx + 3] = 255;
          }
        }
        ctx.putImageData(img, 0, 0);
        return this.m_ConfigureTexture(canvas, true, 1);
      }

      /**
       * 生成蒸汽朋克压力表盘贴图
       */
      createGaugeDialTexture() {
        const size = 256;
        const canvas = document.createElement('canvas');
        canvas.width = canvas.height = size;
        const ctx = canvas.getContext('2d');
        const cx = size / 2;
        const cy = size / 2;

        // 复古羊皮黄表盘背景
        const radGrad = ctx.createRadialGradient(cx, cy, 10, cx, cy, 118);
        radGrad.addColorStop(0, '#f5ebd6');
        radGrad.addColorStop(0.8, '#cbb58b');
        radGrad.addColorStop(1, '#6e5735');
        ctx.fillStyle = radGrad;
        ctx.beginPath();
        ctx.arc(cx, cy, 120, 0, Math.PI * 2);
        ctx.fill();

        // 红色危险压力区弧线
        ctx.strokeStyle = '#b92b27';
        ctx.lineWidth = 10;
        ctx.beginPath();
        ctx.arc(cx, cy, 94, -0.25 * Math.PI, 0.25 * Math.PI);
        ctx.stroke();

        // 刻度线
        ctx.strokeStyle = '#1e1914';
        for (let i = 0; i <= 24; i++) {
          const ang = (0.75 * Math.PI) + (i / 24) * (1.5 * Math.PI);
          const r1 = i % 4 === 0 ? 78 : 88;
          const r2 = 104;
          ctx.lineWidth = i % 4 === 0 ? 3.5 : 1.8;
          ctx.beginPath();
          ctx.moveTo(cx + Math.cos(ang) * r1, cy + Math.sin(ang) * r1);
          ctx.lineTo(cx + Math.cos(ang) * r2, cy + Math.sin(ang) * r2);
          ctx.stroke();
        }

        ctx.fillStyle = '#241b12';
        ctx.font = 'bold 18px monospace';
        ctx.textAlign = 'center';
        ctx.fillText('FOXFIRE', cx, cy + 42);
        ctx.font = 'bold 14px monospace';
        ctx.fillText('PSI', cx, cy + 62);

        return this.m_ConfigureTexture(canvas, true, 1);
      }

      /**
       * 生成地面蒸汽朋克星盘法阵贴图
       */
      createFloorAstrolabeTexture() {
        const size = 1024;
        const canvas = document.createElement('canvas');
        canvas.width = canvas.height = size;
        const ctx = canvas.getContext('2d');
        const cx = size / 2;
        const cy = size / 2;

        ctx.fillStyle = '#0f1218';
        ctx.fillRect(0, 0, size, size);

        // 同心齿轮刻度环
        ctx.strokeStyle = 'rgba(200, 150, 62, 0.32)';
        const radii = [140, 220, 310, 410, 460];
        radii.forEach((r, idx) => {
          ctx.lineWidth = idx % 2 === 0 ? 3 : 1.5;
          ctx.beginPath();
          ctx.arc(cx, cy, r, 0, Math.PI * 2);
          ctx.stroke();
        });

        // 九芒星狐尾方位线
        ctx.strokeStyle = 'rgba(0, 245, 212, 0.2)';
        ctx.lineWidth = 2;
        for (let i = 0; i < 18; i++) {
          const ang = (i / 18) * Math.PI * 2;
          ctx.beginPath();
          ctx.moveTo(cx + Math.cos(ang) * 140, cy + Math.sin(ang) * 140);
          ctx.lineTo(cx + Math.cos(ang) * 460, cy + Math.sin(ang) * 460);
          ctx.stroke();
        }

        // 外圈刻度齿
        ctx.strokeStyle = 'rgba(200, 150, 62, 0.45)';
        ctx.lineWidth = 3;
        for (let i = 0; i < 72; i++) {
          const ang = (i / 72) * Math.PI * 2;
          const rIn = i % 6 === 0 ? 412 : 436;
          ctx.beginPath();
          ctx.moveTo(cx + Math.cos(ang) * rIn, cy + Math.sin(ang) * rIn);
          ctx.lineTo(cx + Math.cos(ang) * 458, cy + Math.sin(ang) * 458);
          ctx.stroke();
        }

        return this.m_ConfigureTexture(canvas, true, 1);
      }
