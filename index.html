<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>AI 模型可视化生成测试汇总 · AI Visual Bench</title>
<style>
body{margin:0;font-family:system-ui,"PingFang SC","Microsoft YaHei",sans-serif;background:#0f1115;color:#e6e6e6}
header{padding:32px 24px 8px;max-width:1200px;margin:auto}h1{margin:0 0 8px}a{color:#7cc4ff}
section{max-width:1200px;margin:auto;padding:16px 24px}.desc{color:#aaa;line-height:1.6}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:16px}
.card{background:#1a1d24;border:1px solid #2a2f3a;border-radius:12px;overflow:hidden;display:flex;flex-direction:column}
.cover{background:#fff;aspect-ratio:16/10;display:flex;align-items:center;justify-content:center;overflow:hidden;cursor:pointer}
.cover img{width:100%;height:100%;object-fit:contain}.bee .cover{background:#000}.bee .cover img{object-fit:cover}
.body{padding:10px 12px;display:flex;gap:8px;align-items:center;flex-wrap:wrap}.name{font-weight:600;flex:1}
.badge{background:#2d6cdf;color:#fff;border-radius:999px;padding:2px 10px;font-size:12px}.badge.na{background:#555}
.links{padding:0 12px 12px;font-size:13px;display:flex;gap:12px}
#modal{position:fixed;inset:0;background:#000d;display:none;flex-direction:column;z-index:9}#modal.on{display:flex}
#modal .bar{padding:8px 12px;display:flex;gap:12px;align-items:center}#modal iframe{flex:1;border:0;background:#000}
button{background:#333;color:#fff;border:0;border-radius:6px;padding:6px 12px;cursor:pointer}
footer{max-width:1200px;margin:auto;padding:24px;color:#888;font-size:13px}
</style></head><body>
<header><h1>AI 模型可视化生成测试汇总</h1><div class="desc">AI Visual Bench — 收集不同 AI 模型在同一可视化生成任务上的作品，按测试分组展示。数据来自各测试目录下的 <code>models.json</code>。 · <a href="https://github.com/HephaestusGame/ai-visual-bench">GitHub</a></div></header>
<main id="app"></main>
<div id="modal"><div class="bar"><b id="mt"></b><a id="mo" target="_blank">新标签页打开 ↗</a><span style="flex:1"></span><button onclick="closeM()">关闭 ✕</button></div><iframe id="mf" allow="fullscreen"></iframe></div>
<footer>鹈鹕骑自行车作品 © The Pelicans Riding Bicycles Enthusiasts Club (PRBEC) and contributors，依 <a href="tests/pelican-bicycle/LICENSE.md">PRBEC Permissive Pelican License v1.0</a> 使用，源仓库：<a href="https://github.com/scosman/pelicans_riding_bicycles">scosman/pelicans_riding_bicycles</a>。本站代码 MIT。</footer>
<script>
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
function openM(t,u){mt.textContent=t;mo.href=u;mf.src=u;modal.classList.add('on')}
function closeM(){modal.classList.remove('on');mf.src='about:blank'}
document.addEventListener('keydown',e=>e.key==='Escape'&&closeM());
(async()=>{for(const t of ['steampunk-bee','pelican-bicycle']){const m=await (await fetch(`tests/${t}/models.json`)).json();
const isBee=t==='steampunk-bee';let h=`<section><h2>${esc(m.title)}</h2><p class="desc">${esc(m.description)}<br>来源：<a href="${m.source}" target="_blank">${esc(m.source)}</a>${m.license?'<br>许可：'+esc(m.license):''}</p><div class="grid">`;
for(const it of m.items){const na=/未标注/.test(it.duration);
const cover=isBee?`<div class="cover" onclick="openM('${esc(it.model)}','${it.file}')"><img loading="lazy" src="${it.thumbnail}" alt="${esc(it.model)}"></div>`:`<a class="cover" href="${it.file}" target="_blank"><img loading="lazy" src="${it.file}" alt="Plate ${it.plate}"></a>`;
h+=`<div class="card ${isBee?'bee':''}">${cover}<div class="body"><span class="name">${esc(isBee?it.model:'Plate '+it.plate+' · 模型：'+it.model)}</span><span class="badge ${na?'na':''}">⏱ ${esc(it.duration)}</span></div><div class="links">${isBee?`<a href="#" onclick="openM('${esc(it.model)}','${it.file}');return false">▶ 内嵌运行</a><a href="${it.file}" target="_blank">新页打开 ↗</a>`:`<span>署名：${esc(it.attribution)}</span><a href="${it.source}" target="_blank">源文件 ↗</a>`}</div></div>`}
app.insertAdjacentHTML('beforeend',h+'</div></section>')}})();
</script></body></html>
