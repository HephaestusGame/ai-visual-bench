<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>AI 模型可视化生成测试汇总 · AI Visual Bench</title>
<style>
body{margin:0;font-family:system-ui,"PingFang SC","Microsoft YaHei",sans-serif;background:#0f1115;color:#e6e6e6}
header{padding:32px 24px 8px;max-width:1200px;margin:auto}h1{margin:0 0 8px}a{color:#7cc4ff}
section{max-width:1200px;margin:auto;padding:16px 24px}.desc{color:#aaa;line-height:1.6}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:16px}
.card{color:inherit;text-decoration:none;cursor:pointer;transition:transform .18s,border-color .18s,box-shadow .18s;background:#1a1d24;border:1px solid #2a2f3a;border-radius:12px;overflow:hidden;display:flex;flex-direction:column}
.card:hover{transform:translateY(-4px);border-color:#7cc4ff;box-shadow:0 8px 24px #0008}
.cover{background:#000;aspect-ratio:16/10;overflow:hidden}
.cover img{display:block;width:100%;height:100%;object-fit:cover}
.body{padding:10px 12px;display:flex;gap:8px;align-items:center;flex-wrap:wrap}.name{font-weight:600;flex:1}
.badge{background:#2d6cdf;color:#fff;border-radius:999px;padding:2px 10px;font-size:12px}.badge.na{background:#555}
button{background:#333;color:#fff;border:0;border-radius:6px;padding:6px 12px;cursor:pointer}
details.prompt{background:#1a1d24;border:1px solid #2a2f3a;border-radius:10px;padding:10px 14px;margin:0 0 16px}details.prompt summary{cursor:pointer;font-weight:600;display:flex;gap:12px;align-items:center}details.prompt pre{white-space:pre-wrap;font-size:13px;line-height:1.55;color:#cfd6e4;margin:10px 0 0}
nav{max-width:1200px;margin:8px auto 0;padding:0 24px;display:flex;gap:10px;flex-wrap:wrap}nav a{background:#1a1d24;border:1px solid #2a2f3a;border-radius:999px;padding:4px 14px;text-decoration:none}nav a:hover{border-color:#7cc4ff}section{scroll-margin-top:12px}
footer{max-width:1200px;margin:auto;padding:24px;color:#888;font-size:13px}
</style></head><body>
<header><h1>AI 模型可视化生成测试汇总</h1><div class="desc">AI Visual Bench — 收集不同 AI 模型在同一可视化生成任务上的作品，按测试分组展示。数据来自各测试目录下的 <code>models.json</code>。 · <a href="https://github.com/HephaestusGame/ai-visual-bench">GitHub</a></div></header>
<nav id="nav"></nav>
<main id="app"></main>
<footer>蒸汽朋克机械蜜蜂测试灵感：<a href="https://x.com/NovaXCode/status/2110223641111888338">@NovaXCode</a>。本站代码 MIT。</footer>
<script>
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const getJSON=async u=>(await fetch(u,{cache:'no-cache'})).json();
function copyPrompt(btn,id){navigator.clipboard.writeText(document.getElementById(id).textContent).then(()=>{btn.textContent='已复制 ✓';setTimeout(()=>btn.textContent='一键复制',1500)})}
(async()=>{const idx=await getJSON('tests/index.json');
nav.innerHTML=idx.categories.map(c=>`<a href="#${c.id}">${esc(c.title)}</a>`).join('');
for(const c of idx.categories){const t=c.id,m=await getJSON(`tests/${t}/models.json`);
let h=`<section id="${t}"><h2>${esc(m.title)}</h2><p class="desc">${esc(m.description)}${m.source?`<br>来源：<a href="${m.source}" target="_blank" rel="noopener">${esc(m.source)}</a>`:''}</p>`;
if(m.prompt)h+=`<details class="prompt" open><summary>提示词 / Prompt <button onclick="event.preventDefault();copyPrompt(this,'pt-${t}')">一键复制</button></summary><pre id="pt-${t}">${esc(m.prompt)}</pre></details>`;
h+='<div class="grid">';
for(const it of m.items){const na=/未标注/.test(it.duration);
h+=`<a class="card" href="${it.file}" target="_blank" rel="noopener" title="在新标签页打开 ${esc(it.model)}"><div class="cover"><img loading="lazy" src="${it.thumbnail}" alt="${esc(it.model)}"></div><div class="body"><span class="name">${esc(it.model)}</span><span class="badge ${na?'na':''}">⏱ ${esc(it.duration)}</span></div></a>`}
app.insertAdjacentHTML('beforeend',h+'</div></section>')}})();
</script></body></html>
